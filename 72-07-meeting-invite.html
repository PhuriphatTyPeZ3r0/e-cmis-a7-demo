<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>นัดประชุม/จัดทำหนังสือเชิญประชุมบอร์ด | E-CMIS 7.2</title>
  <link rel="icon" type="image/png" href="pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="assets/ecmis-app.css" rel="stylesheet">
</head>

<body>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-envelope-open-text me-2"></i>นัดประชุม/จัดทำหนังสือเชิญประชุมบอร์ด</h1>
      </div>
      <div class="ms-auto text-end">
        <span class="flow-ref">ผัง 7.2: 7.2-07 → 7.2-08</span>
        <div class="mt-1" id="stBadge"></div>
      </div>
    </div>

    <div class="card card-ecmis mb-3">
      <div class="card-body pb-1" id="stepper"></div>
    </div>

    <div class="card card-ecmis mb-3">
      <div class="card-header"><i class="fa-solid fa-list-check"></i> เอกสารประกอบวาระ</div>
      <div class="card-body">
        <div class="integration-note mb-3">
          ต้องเตรียมเอกสารประกอบวาระให้ครบก่อนจึงจะส่งหนังสือเชิญประชุมและเปิดวาระได้
        </div>
        <div id="checklistBox"></div>
      </div>
    </div>

    <div class="card card-ecmis mb-3">
      <div class="card-header"><i class="fa-solid fa-users-rectangle"></i> รายชื่อกรรมการ ป.ป.ท. — สถานะการเชิญประชุม</div>
      <div class="card-body">
        <table class="table tbl-ecmis mb-0">
          <thead>
            <tr>
              <th>กรรมการ</th>
              <th style="width:220px">สถานะการเชิญประชุม</th>
            </tr>
          </thead>
          <tbody id="boardTb"></tbody>
        </table>
      </div>
    </div>

    <div id="actionBarSlot"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/ecmis-app.js"></script>
  <script>
    ECMIS.renderShell('72-07-meeting-invite.html');

    const params = new URLSearchParams(location.search);
    const kase = ECMIS.getCase(params.get('case') || '2015/2569');
    const role = ECMIS.currentRole();

    document.getElementById('stBadge').innerHTML = `<span class="chip me-1">เลขสำนวน ${kase.id}</span>` + ECMIS.statusBadge(kase.status) + ' ' + ECMIS.slaBadge(kase);
    document.getElementById('stepper').innerHTML = ECMIS.stepperHtml(kase.status, ECMIS.FLOW_STEPS_72, ECMIS.STATUS_STEP_72);

    /* ---------- checklist เอกสารประกอบวาระ ---------- */
    const CHECKLIST = ['รายงานวินิจฉัยชี้มูล', 'เอกสารประกอบ', 'ระเบียบวาระ'];
    document.getElementById('checklistBox').innerHTML = CHECKLIST.map((c, i) => `
  <div class="form-check mb-1">
    <input class="form-check-input checklist-item" type="checkbox" id="cl${i}">
    <label class="form-check-label" for="cl${i}">${c}</label>
  </div>`).join('');

    function checklistComplete() {
      return Array.from(document.querySelectorAll('.checklist-item')).every(el => el.checked);
    }

    /* ---------- คณะกรรมการ 7 ท่าน — ชุดเดียวกับ 7.2-08 เพราะเป็นบอร์ดเดียวกัน ---------- */
    const BOARD = [
      { n: 'นายวิชัย ยุติธรรม', r: 'ประธานกรรมการ ป.ป.ท.', chair: true },
      { n: 'นายสมบูรณ์ ธรรมรัฐ', r: 'กรรมการ ป.ป.ท.' },
      { n: 'นางอรุณี พิทักษ์ชน', r: 'กรรมการ ป.ป.ท.' },
      { n: 'นายเกรียงไกร สุจริต', r: 'กรรมการ ป.ป.ท.' },
      { n: 'นางสาวรัตนา ยึดมั่น', r: 'กรรมการ ป.ป.ท.' },
      { n: 'นายถาวร โปร่งใส', r: 'กรรมการ ป.ป.ท.' },
      { n: 'เลขาธิการคณะกรรมการ ป.ป.ท.', r: 'กรรมการ ป.ป.ท. โดยตำแหน่ง' }
    ];

    document.getElementById('boardTb').innerHTML = BOARD.map((b, i) => `
  <tr data-i="${i}">
    <td><strong>${b.n}</strong><br><small class="text-muted">${b.r}</small></td>
    <td>
      <select class="form-select form-select-sm invite-status">
        <option value="NOT_SENT" selected>ยังไม่ส่ง</option>
        <option value="SENT">ส่งแล้ว</option>
        <option value="ACK">รับทราบแล้ว</option>
      </select>
    </td>
  </tr>`).join('');

    /* ---------- actions ---------- */
    function buildButtons() {
      return [
        { act: 'open', label: 'ส่งหนังสือเชิญประชุมและเปิดวาระ', icon: 'fa-paper-plane', cls: 'btn-navy' }
      ];
    }
    document.getElementById('actionBarSlot').innerHTML = ECMIS.actionBar(kase, role.id, buildButtons());

    function syncOpenButtonState() {
      const btn = document.querySelector('.action-bar [data-act="open"]');
      if (btn) btn.disabled = !checklistComplete();
    }
    document.querySelectorAll('.checklist-item').forEach(el => el.addEventListener('change', syncOpenButtonState));
    syncOpenButtonState();

    document.querySelectorAll('.action-bar [data-act]').forEach(b =>
      b.addEventListener('click', () => handle(b.dataset.act)));

    function handle(act) {
      if (act !== 'open') return;
      if (!checklistComplete()) {
        ECMIS.toastWarn('กรุณาเตรียมเอกสารประกอบวาระให้ครบก่อนส่งหนังสือเชิญประชุม');
        return;
      }
      const inviteStatus = Array.from(document.querySelectorAll('#boardTb tr')).map((tr, i) => ({
        name: BOARD[i].n,
        status: tr.querySelector('.invite-status').value
      }));

      ECMIS.confirmAction({
        title: 'ส่งหนังสือเชิญประชุมและเปิดวาระ',
        html: `<p>สำนวน <strong>${kase.id}</strong> — เอกสารประกอบวาระครบถ้วนแล้ว</p>
          <div class="law-note">ระบบจะส่งหนังสือเชิญประชุมให้กรรมการ ป.ป.ท. ทั้ง ${BOARD.length} ท่าน และเปิดวาระเข้าสู่
          <strong>7.2-08 บันทึกมติที่ประชุม (วินิจฉัยชี้มูล)</strong></div>`,
        confirmText: 'ยืนยันส่งหนังสือเชิญประชุม'
      }).then(res => {
        if (!res.isConfirmed) return;
        kase.inviteChecklist72 = CHECKLIST.slice();
        kase.inviteStatus72 = inviteStatus;
        kase.inviteSentDate72 = new Date().toISOString().slice(0, 10);
        kase.status = 'IN_MEETING_72';
        ECMIS.saveCases();
        ECMIS.toastOk('ส่งหนังสือเชิญประชุมและเปิดวาระเรียบร้อย');
        setTimeout(() => location.href = '72-08-board-resolution.html?case=' + encodeURIComponent(kase.id), 1400);
      });
    }
  </script>
</body>

</html>
