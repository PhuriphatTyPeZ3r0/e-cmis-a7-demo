        <div class="document-workspace" id="docWorkspace">
            <div>

                <div class="ws-card mb-3">
                    <div class="card-header"><i class="fa-solid fa-shuffle"></i> การกระจายสำนวนเข้าคณะ (Auto Routing)</div>
                    <div class="card-body">
                        <div class="row g-2 mb-3" id="quotaGrid"></div>
                        <div class="row g-2 align-items-end">
                            <div class="col-md-6">
                                <label class="form-label">คณะที่ระบบจัดสรรให้</label>
                                <input class="form-control autofilled" id="assignedTeam" readonly>

                            <div class="col-md-6">

                        <div class="mt-2 d-none" id="manualReasonBox">

                        </div>
                    </div>
                </div>

                <div class="ws-card mb-3">
                    <div class="card-header"><i class="fa-solid fa-clipboard-check"></i> บันทึกมติและข้อสังเกตของคณะอนุกลั่นกรองฯ</div>
                    <div class="card-body">
                        <div class="row g-2 mb-3">

                                <input class="form-control" id="subMeetDate" value="2569-05-28" type="text">
                            </div>
                            <div class="col-md-3"><label class="form-label field-req"><i class="fa-solid fa-file-circle-check me-1 text-success"></i>๒. วันที่ออกมติอนุฯ</label>
                                <input class="form-control" id="subResDate" value="2569-05-28" type="text">
                            </div>
                            <div class="col-md-3"><label class="form-label">จำนวนอนุฯ ที่เข้าประชุม</label>
                                <input class="form-control" id="subQuorum" value="5" type="number" min="1">
                            </div>
                            <div class="col-md-6"><label class="form-label field-req"><i class="fa-solid fa-paper-plane me-1 text-warning"></i>๓. วันที่ส่งเข้าบอร์ด ป.ป.ท.</label>
                                <input class="form-control" id="subSendBoardDate" value="2569-05-30" type="text">
                            </div>
                            <div class="col-md-6"><label class="form-label field-req"><i class="fa-solid fa-calendar-check me-1 text-navy"></i>๔. กำหนดรอบบรรจุวาระบอร์ด</label>
                                <input class="form-control" id="subTargetAgendaDate" value="2569-06-02" type="text">
                            </div>
                        </div>

                        <div class="rule-panel mb-3" id="subQuorumBox"></div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">จำนวนอนุกรรมการทั้งคณะ (ตั้งค่าโดย Admin)</label>
                                <input class="form-control" id="subTotal" type="number" min="1" value="7">

                            <div class="col-md-6">

                        <label class="form-label field-req">มติของคณะอนุกลั่นกรองฯ</label>
                        <div class="list-group mb-3">
                            <label class="list-group-item d-flex gap-2 align-items-start">
                                <input class="form-check-input mt-1" type="radio" name="subRes" value="AGREE" checked>
                                <span><strong>เห็นพ้องกับความเห็นของผู้รับผิดชอบสำนวน</strong>
                                    <br><small class="text-muted">เสนอบอร์ดพิจารณาตามที่เสนอ</small></span>
                            </label>
                            <label class="list-group-item d-flex gap-2 align-items-start">
                                <input class="form-check-input mt-1" type="radio" name="subRes" value="DIFFER">
                                <span><strong>เห็นต่างจากความเห็นของผู้รับผิดชอบสำนวน</strong>
                                    <br><small class="text-muted">เสนอบอร์ดพร้อมความเห็นแย้งของคณะอนุฯ</small></span>
                            </label>
                            <label class="list-group-item d-flex gap-2 align-items-start">
                                <input class="form-check-input mt-1" type="radio" name="subRes" value="MORE">
                                <span><strong>ขอให้แสวงหาข้อเท็จจริงเพิ่มเติมก่อนเสนอบอร์ด</strong>
                                    <br><small
                                        class="text-muted">ส่งกลับเจ้าของสำนวนพร้อมประเด็นที่ต้องดำเนินการ</small></span>
                            </label>

                            </label>
                        </div>

                        <label class="form-label field-req">ความเห็น / ข้อสังเกตของคณะอนุกลั่นกรองฯ</label>
                        <textarea class="form-control" id="subOpinion" rows="4"
                            placeholder="ระบุความเห็นและข้อสังเกตประกอบการพิจารณาของบอร์ด"></textarea>
                        <div class="val-msg val-err" data-for="subOpinion">กรุณาระบุความเห็นของคณะอนุกลั่นกรองฯ</div>
                    </div>
                </div>
            </div>

            <aside class="ws-doc-pane" style="top:calc(var(--topbar-h) + 14px)">
                <button type="button" class="ws-doc-pane-rail" id="btnPaneExpand" title="ขยายแผงเอกสาร"><i class="fa-solid fa-angles-left"></i><span>เอกสาร</span></button>
                <div class="ws-doc-toolbar">
                    <span class="name"><i class="fa-solid fa-file-word"></i> มติการประชุม (ผ่านอนุกลั่นกรองคณะฯ)
                        <span class="badge-tpl">Mail-Merge</span></span>
                    <button class="btn btn-sm btn-light" onclick="window.print()"><i class="fa-solid fa-print"></i></button>
                    <button type="button" class="ws-doc-pane-toggle" id="btnPaneCollapse" title="ย่อแผงเอกสาร"><i class="fa-solid fa-angles-right"></i></button>
                </div>
                <div class="doc-edit-bar" id="docEditBar">

                    <button type="button" data-format="justifyCenter" title="กึ่งกลาง"><i class="fa-solid fa-align-center"></i></button>
                    <button type="button" data-format="justifyRight" title="ชิดขวา"><i class="fa-solid fa-align-right"></i></button>
                    <span class="doc-edit-bar-sep"></span>
                    <button type="button" data-format="undo" title="เลิกทำ"><i class="fa-solid fa-rotate-left"></i></button>
                    <button type="button" data-format="redo" title="ทำซ้ำ"><i class="fa-solid fa-rotate-right"></i></button>
                    <span class="doc-edit-bar-sep"></span>
                    <button type="button" class="btn btn-sm btn-gold" id="btnSaveDocEdit" style="width:auto;padding:0 .6rem">บันทึกการแก้ไข</button>
                </div>
                <div class="ws-paper-stage">
                    <div class="doc-paper doc-resolution a4-paper" id="docPaper"></div>
                </div>
                <button type="button" class="doc-edit-fab d-none" id="docEditFab" title="เปิด/ปิดโหมดแก้ไขเอกสาร">
                    <i class="fa-solid fa-pen-to-square me-1"></i><span>แก้ไขเอกสาร</span>
                </button>
            </aside>
        </div>

        <div id="actionBarSlot"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="assets/ecmis-app.js"></script>
    <script src="assets/ecmis-model.js"></script>
    <script>
        ECMIS.renderShell('subcommittee-screening.html');

        const params = new URLSearchParams(location.search);
        const role = ECMIS.currentRole();

        const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadCaseFromSupabase(caseId) {
            const { data, error } = await sb
                .from('tbl_res_request')
                .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
                .eq('tbl_cmp_case.tcc_no', caseId)
                .eq('is_deleted', false)
                .maybeSingle();
            if (error) throw error;
            return data ? ECMIS.supabaseRowToCase(data) : null;
        }

        /* บันทึกการเปลี่ยนแปลงกลับ tbl_res_request จริง แล้วอัปเดต kase ในหน่วยความจำ — รวมวันที่
           ประชุมอนุฯ/วันที่มีมติ/วันที่ส่งคณะกรรมการ (trr_subcmt_meeting_date/trr_subcmt_resolved_date/
           trr_subcmt_sent_board_date) ฟิลด์ที่ไม่มีคอลัมน์ใน Supabase (เช่น screeningOpinion72,
           moreInfoRequested72) ยังคง set บน kase ไว้ให้แสดงผลในหน้านี้ได้ตามเดิม เพียงแต่ไม่ถูกบันทึก
           ข้ามหน้า/ข้ามอุปกรณ์ ตามขอบเขตฟิลด์ที่ migrate ไว้ */
        async function persistCase(kase, patch) {
            const dbPatch = {};
            if ('status' in patch) {
                const code = ECMIS.STATUS_CODE[patch.status];
                if (code) dbPatch.trr_status = code;
            }
            if ('subCommittee' in patch)          dbPatch.trr_sub_committee = patch.subCommittee;
            if ('screeningMeetingDate' in patch)  dbPatch.trr_subcmt_meeting_date = patch.screeningMeetingDate;
            if ('screeningResolvedDate' in patch) dbPatch.trr_subcmt_resolved_date = patch.screeningResolvedDate;
            if ('sentToBoardDate' in patch)       dbPatch.trr_subcmt_sent_board_date = patch.sentToBoardDate;
            if (kase.trr_id && Object.keys(dbPatch).length) {
                try {
                    const { error } = await sb.from('tbl_res_request').update(dbPatch).eq('trr_id', kase.trr_id);
                    if (error) console.warn('Supabase update warning:', error);
                } catch (e) {
                    console.warn('Supabase update failed:', e);
                }
            }
            Object.assign(kase, patch);
            kase.chainOpinions = ECMIS.buildChainOpinions(kase);
            const memCase = ECMIS.CASES.find(x => x.id === kase.id);
            if (memCase) Object.assign(memCase, patch);
            ECMIS.saveCases();
        }

        let kase = null, docType, isRuling;

        (async function main() {
            const caseParam = params.get('case') || '1547/2568';
            try {
                kase = await loadCaseFromSupabase(caseParam);
            } catch (err) {
                console.warn('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ:', err);
            }
            if (!kase) {
                kase = ECMIS.getCase(caseParam) || ECMIS.CASES.find(x => x.id === caseParam) || ECMIS.CASES[0];
            }
            if (!kase) { ECMIS.toastWarn('ไม่พบสำนวนนี้ในระบบ'); return; }

            docType = ECMIS.DOC_TYPES[kase.docType];
            isRuling = docType.code === 'RULING';

            document.getElementById('stBadge').innerHTML = `<span class="chip me-1">เลขสำนวน ${kase.id}</span>` + ECMIS.statusBadge(kase.status) + ' ' + ECMIS.slaBadge(kase);
            document.getElementById('stepper').innerHTML = isRuling
                ? ECMIS.stepperHtml(kase.status, ECMIS.FLOW_STEPS_72, ECMIS.STATUS_STEP_72)
                : ECMIS.stepperHtml(kase.status);

            if (isRuling) {
                document.querySelector('.page-head h1').innerHTML =
                    '<i class="fa-solid fa-users-viewfinder me-2"></i>คณะอนุกลั่นกรองเรื่องไต่สวนข้อเท็จจริง พิจารณา';
                document.querySelector('.flow-ref').innerHTML = 'คณะอนุกลั่นกรองฯ พิจารณาและส่งต่อเพื่อเตรียมประชุม';
            }

            if (isRuling) { initScreening72(); } else { initScreening71(); }
        })();

        /* ---------- Document workspace: collapsible pane ---------- */
        const docWorkspace = document.getElementById('docWorkspace');
        const PANE_KEY = 'ecmis-subcommittee-screening-docpane-collapsed';
        function setPaneCollapsed(collapsed) {
            docWorkspace.classList.toggle('pane-collapsed', collapsed);
            localStorage.setItem(PANE_KEY, collapsed ? '1' : '0');
        }
        if (localStorage.getItem(PANE_KEY) === '1') setPaneCollapsed(true);
        document.getElementById('btnPaneCollapse').addEventListener('click', () => setPaneCollapsed(true));
        document.getElementById('btnPaneExpand').addEventListener('click', () => setPaneCollapsed(false));

        function initScreening71(){

        const QUOTA = [
            { n: 1, used: 40 }, { n: 2, used: 38 }, { n: 3, used: 22 }, { n: 4, used: 31 },
            { n: 5, used: 40 }, { n: 6, used: 19 }, { n: 7, used: 27 }, { n: 8, used: 35 }
        ];
        const assigned = kase.subCommittee || ('คณะที่ ' + QUOTA.filter(q => q.used < 40).sort((a, b) => a.used - b.used)[0].n);

        document.getElementById('quotaGrid').innerHTML = QUOTA.map(q => {
            const full = q.used >= 40;
            const isAssigned = assigned === ('คณะที่ ' + q.n);
            const pct = Math.round(q.used / 40 * 100);
            return `<div class="col-6 col-md-3">
    <div class="ws-card h-100 ${isAssigned ? 'border-2' : ''}"
         style="${isAssigned ? 'border-color:#D0A830' : ''}">
      <div class="card-body p-2 text-center">
        <div style="font-size:.78rem;font-weight:600;color:var(--ecmis-navy)">
          คณะที่ ${q.n} ${isAssigned ? '<i class="fa-solid fa-star" style="color:#D0A830"></i>' : ''}
        </div>
        <div style="font-size:1.05rem;font-weight:700;color:${full ? '#DB2626' : '#166434'}">${q.used}<span style="font-size:.7rem;color:#7C8CA3">/40</span></div>
        <div class="progress" style="height:5px">
          <div class="progress-bar ${full ? 'bg-danger' : 'bg-success'}" style="width:${pct}%"></div>
        </div>
        ${full ? '<div style="font-size:.66rem;color:#DB2626;margin-top:2px">เต็มโควตา</div>' : ''}
      </div>
    </div>
  </div>`;
        }).join('');

        document.getElementById('assignedTeam').value = assigned + ' (Round-Robin อัตโนมัติ)';
        document.getElementById('manualTeam').innerHTML =
            '<option value="">— ไม่เปลี่ยนแปลง —</option>' +
            QUOTA.map(q => `<option value="คณะที่ ${q.n}" ${q.used >= 40 ? 'disabled' : ''}>คณะที่ ${q.n}${q.used >= 40 ? ' (เต็มโควตา)' : ''}</option>`).join('');
        document.getElementById('manualTeam').disabled = role.id !== 'dir_case';
        document.getElementById('manualTeam').addEventListener('change', e => {
            document.getElementById('manualReasonBox').classList.toggle('d-none', !e.target.value);
            renderDoc();
        });

        document.getElementById('subTotal').value = ECMIS.CONFIG.subMemberCount;

        function renderSubQuorum() {
            const total = Math.max(1, +document.getElementById('subTotal').value || ECMIS.CONFIG.subMemberCount);
            const min = Math.ceil(total * ECMIS.CONFIG.subQuorumRatio);
            const att = +document.getElementById('subQuorum').value || 0;
            const ok = att >= min;
            document.getElementById('subMin').value = `${min} คน (กึ่งหนึ่งของ ${total})`;
            document.getElementById('subQuorumBox').innerHTML = `
    <div class="rule ${ok ? 'pass' : 'fail'}">
      <i class="fa-solid ${ok ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
      <span><strong>องค์ประชุมคณะอนุกลั่นกรองฯ:</strong> เข้าประชุม ${att} จาก ${total} คน
        — ต้องไม่น้อยกว่า ${min} คน (กึ่งหนึ่งโดยอนุโลมจาก ม.12)</span>
    </div>
    ${!ok ? `<div class="rule fail"><i class="fa-solid fa-ban"></i>
      <span><strong>ระบบเตือน (ไม่บล็อก)</strong> — เนื่องจากเกณฑ์นี้ยังไม่มีฐานกฎหมายโดยตรง
      ต่างจากบอร์ดใหญ่ที่ระบบบล็อกตาม ม.12</span></div>` : ''}`;
            return ok;
        }
        ['subTotal', 'subQuorum'].forEach(id =>
            document.getElementById(id).addEventListener('input', renderSubQuorum));

        function renderDoc() {
            const M = ECMIS.mergeField;
            const team = document.getElementById('manualTeam').value || assigned;
            const meetNo = document.getElementById('subMeetNo').value.trim();
            const meetDate = ECMIS.thaiDate(document.getElementById('subMeetDate').value.trim());
            const opinion = document.getElementById('subOpinion').value.trim();
            const res = document.querySelector('input[name="subRes"]:checked').value;
            const RES_TXT = {
                AGREE: 'เห็นพ้องกับความเห็นของผู้รับผิดชอบสำนวน และเห็นควรเสนอคณะกรรมการ ป.ป.ท. พิจารณาตามที่เสนอ',
                DIFFER: 'เห็นต่างจากความเห็นของผู้รับผิดชอบสำนวน และเห็นควรเสนอคณะกรรมการ ป.ป.ท. พิจารณาพร้อมความเห็นของคณะอนุกรรมการ',
                MORE: 'เห็นควรให้ผู้รับผิดชอบสำนวนแสวงหาข้อเท็จจริงเพิ่มเติมก่อนเสนอคณะกรรมการ ป.ป.ท.',
                NOT_ACCEPT: 'ไม่รับเรื่องไว้พิจารณา และให้แจ้งมติพร้อมความเห็นกลับไปยังผู้รับผิดชอบสำนวน'
            };

            document.getElementById('docPaper').innerHTML = `
    <div class="doc-secret">ลับ</div>
    <div class="doc-title">
      <div class="doc-title-l1">มติการประชุม</div>
      <div class="doc-title-l2">คณะอนุกรรมการกลั่นกรองเรื่องไต่สวนข้อเท็จจริง ${M(team)}</div>
    </div>
    <div class="doc-sub">ครั้งที่ ${M(meetNo)} วันที่ ${M(meetDate)}</div>

    <div class="doc-row"><span class="k">เรื่องที่</span> ${M(kase.id)}</div>
    <div class="doc-row"><span class="k">เรื่อง</span> ${M(kase.subject)}</div>
    <div class="doc-row"><span class="k">ผู้รับผิดชอบ</span> ${M(kase.owner)}</div>
    <div class="doc-row"><span class="k">สังกัด</span> ${M(kase.ownerOrg)}</div>

    <div class="doc-body-indent">
      <div class="doc-h">ผู้ถูกร้อง</div>
      ${kase.accused.map(a => `<div>${a.no}. ${M(a.name)} — ${M(a.pos)}</div>`).join('')}

      <div class="doc-h">ข้อกล่าวหา</div>
      <div class="doc-indent">${M(kase.allegation)}</div>

      <div class="doc-h">ความเห็นและข้อสังเกตของคณะอนุกรรมการ</div>
      <div class="doc-indent">${M(opinion, '……………………………………………………………………………………')}</div>
    </div>

    <div class="doc-h">มติคณะอนุกรรมการ</div>
    <div class="doc-indent">คณะอนุกรรมการกลั่นกรองเรื่องไต่สวนข้อเท็จจริง ${M(team)}
      พิจารณาแล้วมีมติ ${M(RES_TXT[res])}</div>

    <div class="doc-sign">
      ลงชื่อ <span class="doc-dots"></span><br>
      (${M('', 'ชื่อ-สกุล')})<br>
      อนุกรรมการและเลขานุการ<br>
      คณะอนุกรรมการกลั่นกรองเรื่องไต่สวนข้อเท็จจริง ${M(team)}
    </div>
    <div class="doc-secret-foot">ลับ</div>`;
        }

        ['subMeetNo', 'subMeetDate', 'subResDate', 'subSendBoardDate', 'subTargetAgendaDate', 'subOpinion'].forEach(id =>
            document.getElementById(id).addEventListener('input', renderDoc));
        document.querySelectorAll('input[name="subRes"]').forEach(r =>
            r.addEventListener('change', renderDoc));

        function buildButtons() {
            return [
                { act: 'save', label: 'บันทึกร่างมติ', icon: 'fa-floppy-disk', cls: 'btn-outline-secondary' },
                { act: 'submit', label: 'ส่งมติเสนอประธานกรรมการ ป.ป.ท.', icon: 'fa-paper-plane', cls: 'btn-navy' }
            ];
        }
        document.getElementById('actionBarSlot').innerHTML = ECMIS.actionBar(kase, role.id, buildButtons());
        document.querySelectorAll('.action-bar [data-act]').forEach(b =>
            b.addEventListener('click', () => handle(b.dataset.act)));

        async function handle(act) {
            if (act === 'save') { ECMIS.toastOk('บันทึกร่างมติคณะอนุฯ เรียบร้อย'); return; }
            if (act === 'submit') {
                const subMeetNo = document.getElementById('subMeetNo').value.trim();
                const subMeetDate = document.getElementById('subMeetDate').value.trim();
                const subResDate = document.getElementById('subResDate').value.trim();
                const subSendBoardDate = document.getElementById('subSendBoardDate').value.trim();
                const subTargetAgendaDate = document.getElementById('subTargetAgendaDate').value.trim();
                if (!subMeetNo || !subMeetDate) {
                    ECMIS.toastWarn('กรุณาระบุ ครั้งที่ประชุม และ วันที่ประชุมคณะอนุฯ');
                    return;
                }
                const manualTeam = document.getElementById('manualTeam').value;
                const manualReason = document.getElementById('manualReason').value.trim();
                if (manualTeam && !manualReason) {
                    ECMIS.toastWarn('กรุณาระบุเหตุผลการ Manual Assign');
                    return;
                }
                const op = document.getElementById('subOpinion');
                if (op.value.trim().length === 0) {
                    op.classList.add('is-invalid-ecmis');
                    document.querySelector('.val-msg[data-for="subOpinion"]').classList.add('show');
                    ECMIS.toastWarn('กรุณาระบุความเห็นของคณะอนุกลั่นกรองฯ');
                    return;
                } else {
                    op.classList.remove('is-invalid-ecmis');
                    document.querySelector('.val-msg[data-for="subOpinion"]').classList.remove('show');
                }
                const res = document.querySelector('input[name="subRes"]:checked').value;
                const next = (res === 'MORE' || res === 'NOT_ACCEPT')
                    ? { p: ECMIS.homeHref(role.id), t: 'ส่งกลับผู้รับผิดชอบสำนวน' }
                    : { p: 'agenda-set.html', t: 'ส่งฝ่ายเจ้าหน้าที่กิจการฯ เพื่อบรรจุระเบียบวาระ' };
                ECMIS.confirmAction({
                    title: 'ส่งมติคณะอนุกลั่นกรองฯ',
                    html: `<p>สำนวน <strong>${kase.id}</strong> — ${next.t}</p>`,
                    confirmText: 'ยืนยันส่งมติ'
                }).then(async r => {
                    if (r.isConfirmed) {
                        const today = new Date().toISOString().slice(0, 10);
                        const patch = Object.assign(
                            {
                                subCommittee: document.getElementById('manualTeam').value || assigned,
                                screeningMeetingDate: subMeetDate,
                                screeningResolvedDate: subResDate || today,
                                sentToBoardDate: subSendBoardDate || today,
                                targetAgendaDate: subTargetAgendaDate || '2569-06-02'
                            },
                            (res === 'AGREE' || res === 'DIFFER') ? { status: 'AGENDA_SET', sentToBoardDate: subSendBoardDate || today } : {}
                        );
                        try {
                            await persistCase(kase, patch);
                        } catch (err) {
                            console.error('บันทึกมติคณะอนุกลั่นกรองฯ ไม่สำเร็จ:', err);
                            ECMIS.toastWarn('บันทึกข้อมูลไม่สำเร็จ');
                            return;
                        }
                        ECMIS.toastOk('ส่งมติคณะอนุกลั่นกรองฯ เรียบร้อย');
                        setTimeout(() => location.href = next.p + '?case=' + encodeURIComponent(kase.id), 1400);
                    }
                });
            }
        }

        renderSubQuorum(); renderDoc();
        }

        function initScreening72(){
            const M = ECMIS.mergeField;

            const QUOTA = [
                { n: 1, used: 40 }, { n: 2, used: 38 }, { n: 3, used: 22 }, { n: 4, used: 31 },
                { n: 5, used: 40 }, { n: 6, used: 19 }, { n: 7, used: 27 }, { n: 8, used: 35 }
            ];
            const assigned = kase.subCommittee || ('คณะที่ ' + QUOTA.filter(q => q.used < 40).sort((a, b) => a.used - b.used)[0].n);

            document.getElementById('quotaGrid').innerHTML = QUOTA.map(q => {
                const full = q.used >= 40;
                const isAssigned = assigned === ('คณะที่ ' + q.n);
                const pct = Math.round(q.used / 40 * 100);
                return `<div class="col-6 col-md-3">
    <div class="ws-card h-100 ${isAssigned ? 'border-2' : ''}"
         style="${isAssigned ? 'border-color:#D0A830' : ''}">
      <div class="card-body p-2 text-center">
        <div style="font-size:.78rem;font-weight:600;color:var(--ecmis-navy)">
          คณะที่ ${q.n} ${isAssigned ? '<i class="fa-solid fa-star" style="color:#D0A830"></i>' : ''}
        </div>
        <div style="font-size:1.05rem;font-weight:700;color:${full ? '#DB2626' : '#166434'}">${q.used}<span style="font-size:.7rem;color:#7C8CA3">/40</span></div>
        <div class="progress" style="height:5px">
          <div class="progress-bar ${full ? 'bg-danger' : 'bg-success'}" style="width:${pct}%"></div>
        </div>
        ${full ? '<div style="font-size:.66rem;color:#DB2626;margin-top:2px">เต็มโควตา</div>' : ''}
      </div>
    </div>
  </div>`;
            }).join('');

            document.getElementById('assignedTeam').value = assigned + ' (Round-Robin อัตโนมัติ)';
            document.getElementById('manualTeam').innerHTML =
                '<option value="">— ไม่เปลี่ยนแปลง —</option>' +
                QUOTA.map(q => `<option value="คณะที่ ${q.n}" ${q.used >= 40 ? 'disabled' : ''}>คณะที่ ${q.n}${q.used >= 40 ? ' (เต็มโควตา)' : ''}</option>`).join('');
            document.getElementById('manualTeam').disabled = role.id !== 'dir_case';
            document.getElementById('manualTeam').addEventListener('change', e => {
                document.getElementById('manualReasonBox').classList.toggle('d-none', !e.target.value);
                renderDoc();
            });

            document.getElementById('subTotal').value = ECMIS.CONFIG.subMemberCount;
            function renderSubQuorum(){
                const total = Math.max(1, +document.getElementById('subTotal').value || ECMIS.CONFIG.subMemberCount);
                const min = Math.ceil(total * ECMIS.CONFIG.subQuorumRatio);
                const att = +document.getElementById('subQuorum').value || 0;
                const ok = att >= min;
                document.getElementById('subMin').value = `${min} คน (กึ่งหนึ่งของ ${total})`;
                document.getElementById('subQuorumBox').innerHTML = `
    <div class="rule ${ok ? 'pass' : 'fail'}">
      <i class="fa-solid ${ok ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
      <span><strong>องค์ประชุมคณะอนุกลั่นกรองฯ:</strong> เข้าประชุม ${att} จาก ${total} คน
        — ต้องไม่น้อยกว่า ${min} คน (กึ่งหนึ่งโดยอนุโลมจาก ม.12)</span>
    </div>
    ${!ok ? `<div class="rule fail"><i class="fa-solid fa-ban"></i>
      <span><strong>ระบบเตือน (ไม่บล็อก)</strong> — เนื่องจากเกณฑ์นี้ยังไม่มีฐานกฎหมายโดยตรง
      ต่างจากบอร์ดใหญ่ที่ระบบบล็อกตาม ม.12</span></div>` : ''}`;
            }
            ['subTotal', 'subQuorum'].forEach(id => document.getElementById(id).addEventListener('input', renderSubQuorum));

            const resBoxEl = document.querySelector('input[name="subRes"]').closest('.list-group');
            if (resBoxEl) resBoxEl.previousElementSibling.classList.add('d-none');
            if (resBoxEl) resBoxEl.classList.add('d-none');

            function renderDoc(){
                const team = document.getElementById('manualTeam').value || assigned;
                const meetNo = document.getElementById('subMeetNo').value.trim();
                const meetDate = ECMIS.thaiDate(document.getElementById('subMeetDate').value.trim());
                const opinion = document.getElementById('subOpinion').value.trim();

                document.getElementById('docPaper').innerHTML = `
    <div class="doc-secret">ลับ</div>
    <div class="doc-title">
      <div class="doc-title-l1">รายงานความเห็น</div>
      <div class="doc-title-l2">คณะอนุกลั่นกรองเรื่องไต่สวนข้อเท็จจริง ${M(team)}</div>
    </div>
    <div class="doc-sub">ครั้งที่ ${M(meetNo)} วันที่ ${M(meetDate)}</div>

    <div class="doc-row"><span class="k">เรื่องที่</span> ${M(kase.id)}</div>
    <div class="doc-row"><span class="k">เรื่อง</span> ${M(kase.subject)}</div>
    <div class="doc-row"><span class="k">ผู้รับผิดชอบสำนวน</span> ${M(kase.owner)}</div>
    <div class="doc-row"><span class="k">สังกัด</span> ${M(kase.ownerOrg)}</div>

    <div class="doc-body-indent">
      <div class="doc-h">ผู้ถูกกล่าวหา</div>
      ${kase.accused.map(a => `<div>${a.no}. ${M(a.name)} ${M(a.pos)} ${M(a.agency)}</div>`).join('')}

      <div class="doc-h">ข้อกล่าวหา</div>
      <div class="doc-indent">${M(kase.allegation)}</div>

      <div class="doc-h">ความเห็นของคณะอนุกลั่นกรองเรื่องไต่สวนข้อเท็จจริง</div>
      <div class="doc-indent">${M(opinion, '……………………………………………………………………………………')}</div>
    </div>

    <div class="doc-sign">
      ลงชื่อ <span class="doc-dots"></span><br>
      (${M('', 'ชื่อ-สกุล')})<br>
      อนุกรรมการและเลขานุการ<br>
      คณะอนุกลั่นกรองเรื่องไต่สวนข้อเท็จจริง ${M(team)}
    </div>
    <div class="doc-secret-foot">ลับ</div>`;
            }
            ['subMeetNo', 'subMeetDate', 'subOpinion'].forEach(id =>
                document.getElementById(id).addEventListener('input', renderDoc));

            function buildButtons(){
                return [
                    { act: 'more', label: 'ขอข้อมูลเพิ่มเติม', icon: 'fa-circle-question', cls: 'btn-outline-secondary' },
                    { act: 'done', label: 'เห็นควรบรรจุวาระ', icon: 'fa-check', cls: 'btn-navy' }
                ];
            }
            document.getElementById('actionBarSlot').innerHTML = ECMIS.actionBar(kase, role.id, buildButtons());
            document.querySelectorAll('.action-bar [data-act]').forEach(b =>
                b.addEventListener('click', () => handle(b.dataset.act)));

            function validateOpinion(){
                const op = document.getElementById('subOpinion');
                if (!op.value.trim()) {
                    op.classList.add('is-invalid-ecmis');
                    document.querySelector('.val-msg[data-for="subOpinion"]').classList.add('show');
                    ECMIS.toastWarn('กรุณาระบุความเห็นกลั่นกรองก่อนบันทึก');
                    return false;
                }
                op.classList.remove('is-invalid-ecmis');
                document.querySelector('.val-msg[data-for="subOpinion"]').classList.remove('show');
                return true;
            }

            async function handle(act){
                if (!validateOpinion()) return;
                const opinion = document.getElementById('subOpinion').value.trim();
                const meetNo = document.getElementById('subMeetNo').value.trim();
                const meetDate = document.getElementById('subMeetDate').value.trim();
                const team = document.getElementById('manualTeam').value || assigned;

                if (act === 'more') {
                    ECMIS.confirmAction({
                        title: 'ขอข้อมูลเพิ่มเติม',
                        html: `<p>สำนวน <strong>${kase.id}</strong> — คณะอนุกลั่นกรองฯ ขอข้อมูล/เอกสารเพิ่มเติมจากผู้รับผิดชอบสำนวน</p>`,
                        confirmText: 'ยืนยันขอข้อมูลเพิ่มเติม'
                    }).then(async res => {
                        if (!res.isConfirmed) return;
                        try {
                            await persistCase(kase, {
                                subCommittee: team,
                                screeningMeetingDate: meetDate
                            });
                        } catch (err) {
                            console.error('บันทึกคำขอข้อมูลเพิ่มเติมไม่สำเร็จ:', err);
                            ECMIS.toastWarn('บันทึกข้อมูลไม่สำเร็จ');
                            return;
                        }
                        Object.assign(kase, {
                            screeningOpinion72: opinion,
                            moreInfoRequested72: { date: new Date().toISOString().slice(0, 10), note: opinion }
                        });
                        ECMIS.toastOk('บันทึกคำขอข้อมูลเพิ่มเติม และแจ้งเตือนผู้รับผิดชอบสำนวนแล้ว');
                    });
                    return;
                }

                if (act === 'done') {
                    ECMIS.confirmAction({
                        title: 'เห็นควรบรรจุวาระ',
                        html: `<p>สำนวน <strong>${kase.id}</strong> — คณะอนุกลั่นกรองเรื่องไต่สวนข้อเท็จจริงเห็นควรเสนอบรรจุระเบียบวาระ</p>`,
                        confirmText: 'ยืนยันเห็นควรบรรจุวาระ'
                    }).then(async res => {
                        if (!res.isConfirmed) return;
                        const today = new Date().toISOString().slice(0, 10);
                        try {
                            await persistCase(kase, {
                                subCommittee: team,
                                screeningMeetingDate: meetDate,
                                screeningResolvedDate: today,
                                sentToBoardDate: today,
                                status: 'PENDING_INVITE_72'
                            });
                        } catch (err) {
                            console.error('บันทึกมติคณะอนุกลั่นกรองฯ ไม่สำเร็จ:', err);
                            ECMIS.toastWarn('บันทึกข้อมูลไม่สำเร็จ');
                            return;
                        }
                        Object.assign(kase, { screeningOpinion72: opinion, screeningMeetNo72: meetNo, screeningMeetDate72: meetDate });
                        ECMIS.toastOk('บันทึกความเห็นและส่งบรรจุวาระเรียบร้อย');
                        setTimeout(() => location.href = ECMIS.pageForCase72(kase) + '?case=' + encodeURIComponent(kase.id), 1400);
                    });
                }
            }

            ECMIS.initDocEditor({ stageId: 'docPaper', mayEdit: ECMIS.canAct(kase, role.id) });
            renderSubQuorum(); renderDoc();
        }
    </script>
</body>
