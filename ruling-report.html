    async function loadOffenseBasisData() {
      try {
        const [{ data: caseRow }, { data: basisRows }] = await Promise.all([
          sb.from('tbl_cmp_case').select('tcc_id, tbl_cmp_case_accused(*)').eq('tcc_no', kase.id).maybeSingle(),
          sb.from('tbl_res_offense_basis').select('*').eq('is_deleted', false).order('trob_sort_order')

          offenseBasisList = basisRows;
        }

        let accusedRows = ((caseRow && caseRow.tbl_cmp_case_accused) || [])
          .filter(a => !a.is_deleted).sort((a, b) => (a.tcca_no || 0) - (b.tcca_no || 0));

        if (!accusedRows.length && kase.accused && kase.accused.length) {
          accusedRows = kase.accused.map((a, idx) => ({
            tcca_id: 9000 + idx,
            tcca_name: a.name,
            tcca_position: a.pos,
            tcca_agency: a.agency || kase.agency || ''
          }));
        }

        if (!accusedRows.length) {
          accusedRows = [{ tcca_id: 9001, tcca_name: kase.accusedName || 'นายสมศักดิ์ ข้าราชการ', tcca_position: 'ผู้อำนวยการกอง', tcca_agency: kase.agency || 'กรมชลประทาน' }];
        }

        const tccaIds = accusedRows.map(a => a.tcca_id);
        const { data: selRows } = await sb.from('tbl_res_accused_offense')
          .select('tcca_id, trob_id').eq('is_deleted', false).in('tcca_id', tccaIds);

        accusedRealList = accusedRows.map((a, idx) => ({
          tcca_id: a.tcca_id,
          name: a.tcca_name,
          pos: a.tcca_position,
          agency: a.tcca_agency,
          roleType: (kase.accusedRoles72 && kase.accusedRoles72[a.tcca_name]) || (idx === 0 ? 'PRINCIPAL' : 'ACCESSORY'),
          selected: new Set((selRows || []).filter(s => s.tcca_id === a.tcca_id).map(s => s.trob_id))
        }));

        if (accusedRealList[0] && accusedRealList[0].selected.size === 0) {
          accusedRealList[0].selected.add(101); // 147
          if (accusedRealList[1]) accusedRealList[1].selected.add(111); // 157
        }
        return true;
      } catch (err) {
        console.warn('โหลดฐานความผิดแบบ live ไม่สำเร็จ ใช้ชุดข้อมูลเริ่มต้น:', err);
        offenseBasisList = COMPREHENSIVE_OFFENSE_BASIS;
        const mockAcc = (kase.accused && kase.accused.length) ? kase.accused : [
          { name: kase.accusedName || 'นายสมศักดิ์ ข้าราชการ', pos: 'ผู้อำนวยการกอง', agency: kase.agency || 'กรมชลประทาน' },
          { name: 'นายวิรัช ช่างเทคนิค', pos: 'นายช่างโยธาชำนาญงาน', agency: 'กรมชลประทาน' }
        ];
        accusedRealList = mockAcc.map((a, idx) => ({
          tcca_id: 9000 + idx,
          name: a.name,
          pos: a.pos,
          agency: a.agency,
          roleType: idx === 0 ? 'PRINCIPAL' : 'ACCESSORY',

        return true;
      }

    /* ฟังก์ชันคำนวณวันขาดอายุความ 1 จุดเวลา: (วันเกิดเหตุ + ปีอายุความ) + ๑ วัน */
    function formatSingleDateExpiry(dateStr, years) {
      if (!dateStr || !years) return '';
      const parts = String(dateStr).split('-');
      let y = parseInt(parts[0], 10);
      if (isNaN(y)) return '';
      if (y > 2400) y -= 543;
      const m = (parseInt(parts[1], 10) || 1) - 1;
      const day = parseInt(parts[2], 10) || 1;
      const d = new Date(y, m, day);
      if (isNaN(d.getTime())) return '';
      d.setFullYear(d.getFullYear() + parseInt(years, 10));
      d.setDate(d.getDate() + 1); // นับถัดไปอีก 1 วัน
      const thMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
      const expBE = d.getFullYear() + 543;
      return `${ECMIS.toThaiDigits(d.getDate())} ${thMonths[d.getMonth()]} ${ECMIS.toThaiDigits(expBE)}`;
    }

    function getExpiryRangeText(startDateStr, endDateStr, years) {
      if (!startDateStr) return '';
      const startExp = formatSingleDateExpiry(startDateStr, years);
      if (endDateStr) {
        const endExp = formatSingleDateExpiry(endDateStr, years);
        if (endExp && endExp !== startExp) {
          return `ขาดอายุความระหว่างวันที่ ${startExp} ถึงวันที่ ${endExp}`;
        }
      }
      return `ขาดอายุความวันที่ ${startExp}`;
    }

    function calculatePrescriptionForAccused(acc) {
      const incDateStart = document.getElementById('incidentDate').value || kase.incidentDate72 || '2007-07-01';
      const allOffenses = [...offenseBasisList, ...customOffenses];
      const selArts = allOffenses.filter(b => acc.selected.has(b.trob_id));
      if (!selArts.length) return [];
      return selArts.map(art => {
        const years = acc.roleType === 'ACCESSORY' ? (art.p_accessory || 10) : (art.p_principal || 15);
        const exp = getExpiryRangeText(incDateStart, '', years);
        return {
          article: art.trob_article_no,
          law: art.trob_law_name,
          years,
          expText: exp || `มีอายุความ ${ECMIS.toThaiDigits(years)} ปี`
        };
      });
    }

    function autoGeneratePrescriptionNote(options = {}) {
      const incDateStart = document.getElementById('incidentDate').value || kase.incidentDate72;
      
      if (!accusedRealList.length) return;

      const allOffenses = [...offenseBasisList, ...customOffenses];
      
      // รวม trob_id ที่ถูกเลือกทั้งหมดจากทุกผู้ถูกกล่าวหา
      const selectedTrobIds = new Set();
      accusedRealList.forEach(acc => {
        acc.selected.forEach(id => selectedTrobIds.add(id));
      });

      if (selectedTrobIds.size === 0) {
        document.getElementById('prescriptionNote').value = 'ยังไม่ได้เลือกฐานความผิดและมาตรา';
        persistForm();
        renderDoc();
        return;
      }

      // เรียงลำดับมาตราตาม trob_sort_order
      const activeOffenses = allOffenses.filter(b => selectedTrobIds.has(b.trob_id));
      activeOffenses.sort((a, b) => (a.trob_sort_order || 99) - (b.trob_sort_order || 99));

      const lines = activeOffenses.map(b => {
        const principals = accusedRealList.filter(a => a.selected.has(b.trob_id) && a.roleType === 'PRINCIPAL');
        const accessories = accusedRealList.filter(a => a.selected.has(b.trob_id) && a.roleType === 'ACCESSORY');

        const pYears = b.p_principal || 15;
        const aYears = b.p_accessory || 10;

        const pExpText = getExpiryRangeText(incDateStart, incDateEnd, pYears);
        const aExpText = getExpiryRangeText(incDateStart, incDateEnd, aYears);

        if (principals.length > 0 && accessories.length > 0) {
          // รูปแบบ: ตัวการ + ผู้สนับสนุน
          // ตัวอย่าง: ประมวลกฎหมายอาญา มาตรา ๑๔๙ ตัวการ อายุความ ๒๐ ปี ขาดอายุความวันที่ ๒๐ เมษายน ๒๕๗๗ ผู้สนับสนุน อายุความ ๒๐ ปี ขาดอายุความวันที่ ๒๐ เมษายน ๒๕๗๗
          return `${b.trob_law_name} ${b.trob_article_no} ตัวการ อายุความ ${ECMIS.toThaiDigits(pYears)} ปี ${pExpText} ผู้สนับสนุน อายุความ ${ECMIS.toThaiDigits(aYears)} ปี ${aExpText}`;
        } else if (principals.length > 0) {
          // รูปแบบ: ตัวการอย่างเดียว
          // ตัวอย่าง: ประมวลกฎหมายอาญา มาตรา ๑๔๗ อายุความ ๒๐ ปี ขาดอายุความระหว่างวันที่ ๑๐ มกราคม ๒๕๗๘ ถึงวันที่ ๑๘ พฤษภาคม ๒๕๘๑
          return `${b.trob_law_name} ${b.trob_article_no} อายุความ ${ECMIS.toThaiDigits(pYears)} ปี ${pExpText}`;
        } else {
          // รูปแบบ: ผู้สนับสนุนอย่างเดียว
          return `${b.trob_law_name} ${b.trob_article_no} ผู้สนับสนุน อายุความ ${ECMIS.toThaiDigits(aYears)} ปี ${aExpText}`;
        }
      });

      const fullText = lines.join('\n');
      document.getElementById('prescriptionNote').value = fullText;
      persistForm();
      renderDoc();
      if (!options.silent) {
        ECMIS.toastOk('คำนวณและสร้างข้อความอายุความเรียบร้อย');
      }
    }

            ${calcs.map(c => `<div class="ms-2">• <strong>${c.article}</strong> (อายุความ ${c.years} ปี): <span class="badge bg-danger-subtle text-danger border border-danger-subtle">${c.expText}</span></div>`).join('')}
          </div>` : ''}

          ${groups.map(g => `
            <div class="mt-2">
              <div style="font-size:.76rem;color:#475569;font-weight:700" class="mb-1">${g}</div>
              <div class="d-flex flex-wrap gap-1">
              ${filteredOffenses.filter(b => b.trob_group === g).map(b => {
                const active = acc.selected.has(b.trob_id);

                const title = `${b.trob_law_name} ${b.trob_article_no} — ${b.trob_article_label} (อายุความ ${years} ปี)`;
                return `<button type="button" class="btn btn-sm ${active ? 'btn-navy' : 'btn-outline-secondary'} py-0 px-2 offense-chip"
                  data-tcca="${acc.tcca_id}" data-trob="${b.trob_id}" title="${title.replace(/"/g, '&quot;')}"
                  style="font-size:.78rem">
                  ${active ? '<i class="fa-solid fa-check me-1"></i>' : ''}${b.trob_article_no}

      }).join('');

      body.querySelectorAll('.offense-chip').forEach(btn => {
        btn.addEventListener('click', () => toggleOffense(+btn.dataset.tcca, +btn.dataset.trob));
      });

      body.querySelectorAll('.role-radio').forEach(r => {
        r.addEventListener('change', (e) => {
          const tccaId = +e.target.dataset.tcca;
          const acc = accusedRealList.find(a => a.tcca_id === tccaId);
          if (acc) {
            acc.roleType = e.target.value;
            if (!kase.accusedRoles72) kase.accusedRoles72 = {};
            kase.accusedRoles72[acc.name] = acc.roleType;
            renderOffenseBasisBody();
            autoGeneratePrescriptionNote({ silent: true });
            renderDoc();
          }
        });
      });
    }

    document.getElementById('offenseSearch').addEventListener('input', renderOffenseBasisBody);

    async function toggleOffense(tcca_id, trob_id) {
      const acc = accusedRealList.find(a => a.tcca_id === tcca_id);
      if (!acc) return;
      const nowSelected = !acc.selected.has(trob_id);
      if (nowSelected) acc.selected.add(trob_id); else acc.selected.delete(trob_id);
      try {
        if (trob_id < 9000) {
          if (nowSelected) {
            await sb.from('tbl_res_accused_offense').upsert({ tcca_id, trob_id }, { onConflict: 'tcca_id,trob_id', ignoreDuplicates: true });
          } else {
            await sb.from('tbl_res_accused_offense').delete().eq('tcca_id', tcca_id).eq('trob_id', trob_id);
          }
        }
      } catch (err) {
        console.warn('บันทึกฐานความผิดลงฐานข้อมูลชั่วคราวไม่ได้:', err);
      }
      renderOffenseBasisBody();
      autoGeneratePrescriptionNote({ silent: true });
      renderDoc();
    }

        ...accusedRealList.map((a, idx) => ({ id: idx, label: `ฉบับที่ ${idx + 1}: ${a.name.split(' ')[0] || a.name}` }))
      ];
      container.innerHTML = tabs.map(t => `
        <button type="button" class="btn btn-sm ${activeSplitAccusedIndex === t.id ? 'btn-navy' : 'btn-outline-secondary'} py-0 px-2 split-tab-btn" data-idx="${t.id !== null ? t.id : 'all'}">
          ${t.label}
        </button>`).join('');

      container.querySelectorAll('.split-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.idx;
          activeSplitAccusedIndex = val === 'all' ? null : parseInt(val, 10);
          renderSplitReportTabs();
          renderDoc();
        });
      });
    }

    function selectedChargesText(forAccused = null) {
      const list = forAccused ? [forAccused] : accusedRealList;

      const allOffenses = [...offenseBasisList, ...customOffenses];
      return list.map(a => {
        const arts = allOffenses.filter(b => a.selected.has(b.trob_id)).map(b => b.trob_article_no);
        return arts.length ? `${a.name}: ${arts.join(', ')}` : '';
      }).filter(Boolean).join(' / ');
    }

    function syncFromBoardResolution(k, force = false) {
      const resCode = k.resolution72 || 'GUILTY_72';
      const crim = (k.guiltyCriminal72 !== undefined) ? !!k.guiltyCriminal72 : (resCode === 'GUILTY_72');
      const disc = (k.guiltyDiscipline72 !== undefined) ? !!k.guiltyDiscipline72 : (resCode === 'GUILTY_72');

      // 1. Smart Context-Aware Mapping for Decision Card
      let defaultLegalAnalysis = '';
      let defaultCrimFinding = '';
      let defaultDiscFinding = '';

      if (resCode === 'GUILTY_72') {
        defaultLegalAnalysis = 'พระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม มาตรา ๑๗ (๓)(๔) มาตรา ๓๘ และมาตรา ๔๔';
        defaultCrimFinding = crim ? 'มีมูลความผิดทางอาญาฐานเป็นเจ้าพนักงานปฏิบัติหรือละเว้นการปฏิบัติหน้าที่โดยมิชอบ หรือโดยทุจริต ตามประมวลกฎหมายอาญา มาตรา ๑๕๗' : 'ไม่มีมูลความผิดทางอาญา';
        defaultDiscFinding = disc ? 'มีมูลความผิดทางวินัยอย่างร้ายแรงฐานปฏิบัติหรือละเว้นการปฏิบัติหน้าที่ราชการโดยมิชอบเพื่อให้ตนเองหรือผู้อื่นได้ประโยชน์ที่มิควรได้ เป็นการทุจริตต่อหน้าที่ราชการ' : 'ไม่มีมูลความผิดทางวินัย';
      } else if (resCode === 'NO_MERIT_72') {
        defaultLegalAnalysis = 'พระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม มาตรา ๓๒ — ข้อกล่าวหาไม่มีมูล ข้อกล่าวหาเป็นอันตกไป';
        defaultCrimFinding = 'ข้อกล่าวหาไม่มีมูลความผิดทางอาญา';
        defaultDiscFinding = 'ข้อกล่าวหาไม่มีมูลความผิดทางวินัย';
      } else if (resCode === 'MORE_INVESTIGATE_72') {
        defaultLegalAnalysis = `พระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม มาตรา ๒๔ วรรคท้าย — มีมติให้ไต่สวนเพิ่มเติมในประเด็น: ${k.moreReason72 || 'ตามที่ระบุในบันทึกมติ'}`;
        defaultCrimFinding = 'ให้ไต่สวนเพิ่มเติม';
        defaultDiscFinding = 'ให้ไต่สวนเพิ่มเติม';
      } else if (resCode === 'FORWARD_NACC') {
        defaultLegalAnalysis = 'พระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม มาตรา ๑๙ (ข)(๑) — ส่งเรื่องให้คณะกรรมการ ป.ป.ช. เนื่องจากอยู่ในหน้าที่และอำนาจของ ป.ป.ช.';
        defaultCrimFinding = 'ส่งเรื่องให้สำนักงาน ป.ป.ช. ดำเนินการ';

      const firstAccused = (k.accused && k.accused[0]) ? k.accused[0] : null;
      setVal('accusedStatus', k.accusedStatus72 || (firstAccused ? `เป็นเจ้าหน้าที่ของรัฐ ตำแหน่ง ${firstAccused.pos || ''} สังกัด ${firstAccused.agency || ''}` : ''));

      setVal('factSummary', k.factSummary72 || k.allegation || '');

      setVal('prescriptionNote', k.prescriptionNote72 || (k.prescription ? `มีอายุความถึงวันที่ ${ECMIS.thaiDate(k.prescription)}` : ''));
      
      // Board Opinion & Finding Sync (ซิงค์ตรงจาก boardOpinion72)
      setVal('meetingOpinion', k.meetingOpinion72 || k.boardOpinion72 || '');
      setVal('legalAnalysis', k.legalAnalysis72 || defaultLegalAnalysis);
      setVal('criminalFinding', k.criminalFinding72 || defaultCrimFinding);
      setVal('disciplinaryFinding', k.disciplinaryFinding72 || defaultDiscFinding);

      setVal('discAgency', k.discAgency72 || (firstAccused ? firstAccused.agency : '') || k.ownerOrg || '');
      setVal('discAccused', k.discAccused72 || (firstAccused ? firstAccused.name : ''));

      setVal('discPenalty', k.discPenalty72 || 'ไล่ออก');

      if (toggleCrim) {
        if (force || toggleCrim.dataset.userTouched !== 'true') {
          toggleCrim.checked = (resCode === 'GUILTY_72') ? crim : false;
        }
      }
    }

    function nextStatusPatchByResolution() {
      const code = kase.resolution72 || 'GUILTY_72';
      if (code === 'MORE_INVESTIGATE_72') {
        const priorRounds = ECMIS.Model.RoundStore.list(kase.id).filter(rr => rr.phase === '7.2');
        ECMIS.Model.RoundStore.create({
          caseId: kase.id, phase: '7.2', roundNumber: priorRounds.length + 1,
          reasonText: kase.moreReason72 || '',
          scopeCode: kase.moreScope72 || '',
          triggeredBy: 'RULING_REPORT_72'
        });
        return { status: 'PENDING_SECTION_72', round72: (kase.round72 || 1) + 1 };
      } else if (code === 'NO_MERIT_72') {
        return { status: 'PENDING_AREA_NOTICE_72' };
      } else if (code === 'FORWARD_NACC') {
        return { status: 'DISPATCHING_NACC_72' };
      } else {
        return { status: 'PENDING_DISPATCH_GUILTY_72' };
      }
    }

      }
      if (mayEdit || maySign) {
        actions.push('<button class="btn btn-sm btn-outline-secondary" id="btnSaveDraft"><i class="fa-solid fa-floppy-disk me-1"></i>บันทึกฉบับร่าง</button>');
      }

          ${actions.join('') || '<div class="no-permission"><i class="fa-solid fa-lock me-1"></i>สถานะนี้ไม่มีการกระทำเพิ่มเติมสำหรับบทบาทนี้</div>'}
        </div>`;
      document.getElementById('actionBarSlot').innerHTML = bar;

      const btnSaveDraft = document.getElementById('btnSaveDraft');

        persistForm();
        ECMIS.toastOk('บันทึกฉบับร่างเรียบร้อยแล้ว');
      });

      const btnDraftDone = document.getElementById('btnDraftDone');

        persistForm();
        ECMIS.Model.CaseStore.update(kase.id, { status: 'PENDING_SIGN_RULING_72' });
        ECMIS.toastOk('ส่งรายงานเข้าสู่ขั้นตอนรอลงนามแล้ว');
        setTimeout(() => location.reload(), 500);
      });

      const btnSignRuling = document.getElementById('btnSignRuling');
      if (btnSignRuling) btnSignRuling.addEventListener('click', async () => {
        persistForm();
        const signed = await ECMIS.signDialog('รายงานวินิจฉัยชี้มูล', ECMIS.getRole('chairman').name);
        if (!signed.isConfirmed) return;

        ECMIS.Model.SignatureStore.create({
          caseId: kase.id, docType: 'รายงานวินิจฉัยชี้มูล',
          signerRole: 'chairman', signerName: ECMIS.getRole('chairman').name,
          method: signed.value.mode, signedAt: new Date().toISOString()
        });
        const patch = nextStatusPatchByResolution();
        patch.signedRulingAt = new Date().toISOString().slice(0, 10);
        ECMIS.Model.CaseStore.update(kase.id, patch);
        ECMIS.toastOk('ลงนามรายงานเรียบร้อยแล้ว');
        setTimeout(() => { location.href = 'case-register.html'; }, 550);
      });
    }

        const targetAccused = isSingleAccused ? accusedRealList[activeSplitAccusedIndex] : null;
        let filename = '';
        const caseSafeId = (kase.id || '2015-2569').replace(/[\/\\:]/g, '-');
        if (docTab === 'ruling') {
          filename = `ปปท_7-02_รายงานวินิจฉัยชี้มูล_เรื่องที่_${caseSafeId}${targetAccused ? `_${targetAccused.name}` : ''}.docx`;
        } else {
          const hasCriminal = document.getElementById('hasCriminalToggle').checked;
          filename = `ปปท_${hasCriminal ? '8-06' : '8-05'}_หนังสือลงโทษทางวินัย_เรื่องที่_${caseSafeId}.docx`;
        }
        ECMIS.exportDocToDocx(document.getElementById('docPaper'), filename);
        ECMIS.toastOk('ส่งออกไฟล์ Word (.docx) เรียบร้อย');
      });
    }

    renderDoc();
    renderActions();

    (async function initOffenseBasis() {
      const ok = await loadOffenseBasisData();
      if (ok) {
        renderOffenseBasisBody();
        renderSplitReportTabs();
        const pNote = document.getElementById('prescriptionNote');
        if (!pNote.value.trim() || pNote.value.includes('ผู้ถูกกล่าวหาที่')) {
          autoGeneratePrescriptionNote({ silent: true });
        }
        renderDoc();
      } else {
        document.getElementById('offenseBasisLoading').textContent = 'ไม่สามารถโหลดข้อมูลฐานความผิดได้';
      }
    })();
  </script>
</body>
