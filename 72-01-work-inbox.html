<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กล่องงานไต่สวนวินิจฉัยชี้มูล | E-CMIS 7.2</title>
<link rel="icon" type="image/png" href="pacc_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<link href="assets/ecmis-app.css" rel="stylesheet">
<style>
.btn-xs { font-size: 0.76rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
.kpi-card { transition: all 0.2s ease; }
.kpi-card:hover { transform: translateY(-2px); }
</style>
</head>
<body>

<main class="app-main">

  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-inbox me-2" style="color:#0F2A62"></i>กล่องงานไต่สวนวินิจฉัยชี้มูล</h1>
    </div>
    <div class="ms-auto text-end">
      <span class="flow-ref">ผัง 7.2: 7.2-01 กล่องงานรวมทุกขั้นตอน (กรองเฉพาะสำนวนกิจกรรมที่ 7.2)</span>
      <div class="mt-1 small text-muted" id="myRoleLabel"></div>
    </div>
  </div>

  <!-- KPI Summary Cards -->
  <div class="row g-3 mb-4" id="kpiRow"></div>

  <!-- Filter & Search Bar -->
  <div class="card card-ecmis mb-4">
    <div class="card-body p-3">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-magnifying-glass me-1 text-muted"></i>ค้นหางาน แฟ้ม หรือหน่วยงาน</label>
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="ค้นหาเลขสำนวน เรื่องกล่าวหา หรือหน่วยงาน">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-diagram-project me-1 text-primary"></i>สถานะ (กิจกรรมที่ 7.2)</label>
          <select id="statusFilter" class="form-select form-select-sm"></select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-route me-1 text-muted"></i>ขั้นตอน (ภาพรวม)</label>
          <select id="stageFilter" class="form-select form-select-sm"></select>
        </div>
        <div class="col-md-1 text-end">
          <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-3 w-100" id="btnClearFilter" title="ล้างตัวกรอง">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card card-ecmis mb-4">
    <div class="card-header d-flex align-items-center flex-wrap gap-2">
      <i class="fa-solid fa-list-check text-primary"></i>
      <span class="fw-bold">รายการสำนวนไต่สวนวินิจฉัยชี้มูล (กิจกรรมที่ 7.2)</span>
      <span class="badge bg-primary rounded-pill ms-1" id="totalCount">0</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover tbl-ecmis mb-0 align-middle">
          <colgroup>
            <col style="width:40px">
            <col style="width:125px">
            <col>
            <col style="width:230px">
            <col style="width:190px">
            <col style="width:115px">
            <col style="width:130px">
          </colgroup>
          <thead>
            <tr>
              <th class="text-center"><input type="checkbox" id="chkAll" class="form-check-input"></th>
              <th class="sortable-header" data-sort="id" style="cursor:pointer">เรื่องที่ <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
              <th>เรื่องกล่าวหา</th>
              <th>สถานะ</th>
              <th class="sortable-header" data-sort="stage" style="cursor:pointer">ขั้นตอน <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
              <th class="sortable-header" data-sort="slaDays" style="cursor:pointer">กำหนดเวลา <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
              <th class="text-end">ดำเนินการ</th>
            </tr>
          </thead>
          <tbody id="myQueue"></tbody>
        </table>
      </div>
      <div class="px-3 py-2 border-top d-flex align-items-center justify-content-between flex-wrap gap-2" id="queueFooter">
        <div id="bulkActionsBox" class="d-none align-items-center gap-2">
          <span class="small text-muted me-1" id="bulkSelectCount">เลือกแล้ว 0 รายการ</span>
          <button type="button" class="btn btn-xs btn-navy py-1 px-2" style="font-size:0.78rem" id="btnBulkApprove">
            <i class="fa-solid fa-check-double me-1"></i>เสนอผ่านรายการที่เลือก (Bulk Action)
          </button>
        </div>
        <nav aria-label="Queue navigation" class="ms-auto">
          <ul class="pagination pagination-sm m-0" id="queuePagination"></ul>
        </nav>
      </div>
    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/ecmis-app.js"></script>
<script>
ECMIS.renderShell('72-01-work-inbox.html');

const role = ECMIS.currentRole();

/* ---------- สำนวนกิจกรรมที่ 7.2 เท่านั้น ----------
   เกณฑ์: status ลงท้าย _72 (อยู่ใน STATUS_72) หรือมี field ใดๆ ลงท้าย 72
   ใช้กันไม่ให้ปนกับสำนวนกิจกรรมที่ 7.1 ที่ inboxFor() อาจคืนมาด้วย        */
const STATUS72_KEYS = new Set(Object.keys(ECMIS.STATUS).filter(k => k.endsWith('_72')));
function isCase72(c){
  if (STATUS72_KEYS.has(c.status)) return true;
  return Object.keys(c).some(k => k.endsWith('72') && c[k] !== undefined && c[k] !== null);
}

const all72 = ECMIS.CASES.filter(isCase72);
let mine = ECMIS.inboxFor(role.id).filter(isCase72);
const mineIds = new Set(mine.map(c => c.id));
function isMyPending(c){ return mineIds.has(c.id); }

document.getElementById('myRoleLabel').textContent = `บทบาท: ${role.title}`;

/* ---------- Bulk-action: จำกัดเฉพาะ 3 ชั้นของสายอนุมัติ (PROPOSE_72 ไม่มี guard พิเศษ)
   ชั้นอื่น (เลขาธิการฯ/บอร์ด/ผอ.กบค./ประธานฯ ฯลฯ) ต้องกรอกข้อมูลเฉพาะหน้าจอ
   จึงไม่เปิด Bulk Action ให้ เพื่อไม่ให้ข้ามการตรวจสอบที่ guard บังคับไว้     */
const CHAIN_PROPOSE_NEXT = {
  section_head: 'PENDING_DIRECTOR_72',
  director:     'PENDING_DEPUTY_72',
  deputy:       'PENDING_SECGEN_72'
};
const bulkEligible = CHAIN_PROPOSE_NEXT.hasOwnProperty(role.id);

function todayThaiIso(){
  const d = new Date();
  return `${d.getFullYear() + 543}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* ---------- นำทางเมื่อคลิกแถว/ปุ่มดำเนินการ ---------- */
const PAGE_FOR_72 = {
  PENDING_SECTION_72:'72-02-review-chain.html', PENDING_DIRECTOR_72:'72-02-review-chain.html',
  PENDING_DEPUTY_72:'72-02-review-chain.html', RETURNED_72:'72-02-review-chain.html',
  PENDING_SECGEN_72:'72-03-secgen-sign.html',
  IN_SUPPORT_SUB_72:'72-04-support-subcommittee.html',
  PENDING_URGENT_72:'72-05-urgent-agenda.html', PENDING_CHAIRMAN_URGENT_72:'72-05-urgent-agenda.html',
  IN_SCREENING_72:'72-06-screening.html',
  PENDING_INVITE_72:'72-07-meeting-invite.html',
  IN_MEETING_72:'72-08-board-resolution.html',
  RESOLVED_PENDING_72:'72-09-ruling-report.html', PENDING_SIGN_RULING_72:'72-09-ruling-report.html',
  PENDING_AREA_NOTICE_72:'72-10-area-notice.html',
  DISPATCHING_NACC_72:'72-11-dispatch.html', PENDING_DISPATCH_GUILTY_72:'72-11-dispatch.html',
  CLOSED_72:'72-12-case-tracking.html'
};

/* ---------- KPI Summary Cards ---------- */
function renderKPICards(){
  const currentSt = document.getElementById('statusFilter')?.value || 'ALL';
  const urgentCount = all72.filter(c => c.urgent72).length;
  const closedCount = all72.filter(c => c.status === 'CLOSED_72').length;

  const kpis = [
    { id:'ALL', n: all72.length, l:'สำนวนทั้งหมด (กจ. 7.2)', i:'fa-folder-open', c:'#0F2A62' },
    { id:'MINE', n: mine.length, l:'รอฉันดำเนินการ', i:'fa-hourglass-half', c:'#D0A830' },
    { id:'URGENT', n: urgentCount, l:'เร่งด่วน (ม.19/2)', i:'fa-bolt', c:'#DB2626' },
    { id:'CLOSED_72', n: closedCount, l:'ปิดสำนวนแล้ว', i:'fa-box-archive', c:'#16A34A' }
  ];

  document.getElementById('kpiRow').innerHTML = kpis.map(k => {
    const isActive = (currentSt === k.id) || (k.id === 'MINE' && currentSt === 'ALL' && false);
    return `
    <div class="col-12 col-sm-6 col-md-4 col-xl-3">
      <div class="card card-ecmis kpi-card h-100 ${isActive ? 'border-2 shadow-sm' : ''}"
           style="min-height:88px; cursor:pointer; ${isActive ? `border-color:${k.c} !important; background:${k.c}0D;` : ''}"
           onclick="filterByKPI('${k.id}')">
        <div class="card-body d-flex align-items-center gap-2 py-3 px-3">
          <div style="flex:0 0 38px;height:38px;border-radius:10px;background:${k.c}18;display:flex;align-items:center;justify-content:center">
            <i class="fa-solid ${k.i}" style="color:${k.c};font-size:1.05rem"></i>
          </div>
          <div style="min-width:0">
            <div style="font-size:1.5rem;font-weight:700;font-family:var(--serif);color:${k.c};line-height:1.1">${k.n}</div>
            <div class="text-muted text-truncate" style="font-size:.74rem;margin-top:2px" title="${k.l}">${k.l}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterByKPI(id){
  const sf = document.getElementById('statusFilter');
  if (id === 'MINE') {
    filtered = all72.filter(isMyPending);
    currentPage = 1; renderMyQueue(true); return;
  }
  if (id === 'URGENT') {
    filtered = all72.filter(c => c.urgent72);
    currentPage = 1; renderMyQueue(true); return;
  }
  if (id === 'CLOSED_72') { sf.value = 'CLOSED_72'; applyFilters(); return; }
  sf.value = 'ALL';
  applyFilters();
}

/* ---------- ตัวกรองสถานะ / ขั้นตอน — สร้างจาก ECMIS.STATUS / FLOW_STEPS_72 / STATUS_STEP_72 โดยตรง ---------- */
document.getElementById('statusFilter').innerHTML =
  `<option value="ALL">ทุกสถานะ (${STATUS72_KEYS.size})</option>` +
  ECMIS.FLOW_STEPS_72.map(step => {
    const opts = Array.from(STATUS72_KEYS)
      .filter(k => ECMIS.STATUS_STEP_72[k] === step.key)
      .map(k => `<option value="${k}">${ECMIS.STATUS[k].label}</option>`).join('');
    return opts ? `<optgroup label="${step.label} (${step.ref})">${opts}</optgroup>` : '';
  }).join('');

document.getElementById('stageFilter').innerHTML =
  `<option value="ALL">ทุกขั้นตอน</option>` +
  ECMIS.FLOW_STEPS_72.map(s => `<option value="${s.key}">${s.label}</option>`).join('');

function stageOf(c){ return ECMIS.STATUS_STEP_72[c.status] || ''; }
function stageLabelOf(c){
  const step = ECMIS.FLOW_STEPS_72.find(s => s.key === stageOf(c));
  return step ? step.label : '—';
}

/* ---------- Pagination & Sorting State ---------- */
let currentPage = 1;
const pageSize = 10;
let sortField = 'id';
let sortOrder = 'asc';
let filtered = [...all72];

function row(c){
  const target = `${PAGE_FOR_72[c.status] || '72-12-case-tracking.html'}?case=${encodeURIComponent(c.id)}`;
  const pending = isMyPending(c);

  return `<tr>
    <td class="text-center">
      ${pending && bulkEligible ? `<input type="checkbox" class="case-chk form-check-input" data-id="${c.id}">` : '<i class="fa-solid fa-lock text-muted" style="font-size:0.75rem" title="ไม่มีสิทธิ์สั่งการกลุ่ม"></i>'}
    </td>
    <td class="case-no">${c.id}${c.urgent72 ? ' <span class="st st-urgent ms-1">ด่วน</span>' : ''}</td>
    <td style="max-width:280px">
      <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
      <small class="text-muted d-block" style="font-size:0.75rem">${c.ownerOrg}</small>
    </td>
    <td>${ECMIS.statusBadge(c.status)}</td>
    <td><span class="chip" style="font-size:.74rem">${stageLabelOf(c)}</span></td>
    <td>${ECMIS.slaBadge(c)}</td>
    <td class="text-end">
      ${pending ? `
        <a href="${target}" class="btn btn-sm btn-navy px-3">
          <i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ
        </a>
      ` : `
        <a href="${target}" class="btn btn-sm btn-outline-secondary px-3">
          <i class="fa-regular fa-eye me-1"></i>ดูรายละเอียด
        </a>
      `}
    </td>
  </tr>`;
}

function renderMyQueue(loading = false){
  const tbody = document.getElementById('myQueue');

  if (loading) {
    let skeletons = '';
    for (let i = 0; i < Math.min(pageSize, filtered.length || 3); i++) {
      skeletons += `
        <tr class="skeleton-row">
          <td><div class="skeleton-box" style="width:20px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td><div class="skeleton-box" style="width:200px"></div></td>
          <td><div class="skeleton-box" style="width:110px"></div></td>
          <td><div class="skeleton-box" style="width:120px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td class="text-end"><div class="skeleton-box ms-auto" style="width:80px"></div></td>
        </tr>`;
    }
    tbody.innerHTML = skeletons;
    document.getElementById('bulkActionsBox').className = 'd-none';
    const chkAll = document.getElementById('chkAll');
    if (chkAll) chkAll.checked = false;
    setTimeout(() => renderMyQueue(false), 200);
    return;
  }

  const sorted = [...filtered].sort((a, b) => {
    const pa = isMyPending(a) ? 1 : 0, pb = isMyPending(b) ? 1 : 0;
    if (pa !== pb) return pb - pa;
    let va = a[sortField], vb = b[sortField];
    if (sortField === 'stage') { va = stageLabelOf(a); vb = stageLabelOf(b); }
    if (va < vb) return sortOrder === 'asc' ? -1 : 1;
    if (va > vb) return sortOrder === 'asc' ? 1 : -1;
    return 0;
  });

  const totalItems = sorted.length;
  const totalPages = Math.ceil(totalItems / pageSize) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * pageSize;
  const paginated = sorted.slice(startIdx, startIdx + pageSize);

  tbody.innerHTML = paginated.length
    ? paginated.map(c => row(c)).join('')
    : `<tr><td colspan="7" class="text-center text-muted py-4">
         <i class="fa-regular fa-face-smile fa-lg mb-2 d-block"></i>
         ไม่มีรายการสำนวนตามเงื่อนไขการค้นหา<br>
         <small>ลองเปลี่ยนข้อความค้นหาหรือตัวกรองสถานะ/ขั้นตอน</small></td></tr>`;

  document.getElementById('totalCount').textContent = sorted.length;

  const paginUl = document.getElementById('queuePagination');
  let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">«</a></li>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<li class="page-item ${currentPage === i ? 'active' : ''}">
      <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a></li>`;
  }
  html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">»</a></li>`;
  paginUl.innerHTML = html;

  initCheckboxHandlers();
}

function changePage(p){ currentPage = p; renderMyQueue(true); }

document.querySelectorAll('.sortable-header').forEach(header => {
  header.addEventListener('click', () => {
    const field = header.dataset.sort;
    sortOrder = (sortField === field) ? (sortOrder === 'asc' ? 'desc' : 'asc') : 'asc';
    sortField = field;
    document.querySelectorAll('.sortable-header i').forEach(icon => icon.className = 'fa-solid fa-sort text-muted');
    const activeIcon = header.querySelector('i');
    if (activeIcon) activeIcon.className = `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'}`;
    renderMyQueue(true);
  });
});

function initCheckboxHandlers(){
  const chkAll = document.getElementById('chkAll');
  const chks = document.querySelectorAll('.case-chk');
  if (!chkAll) return;
  chkAll.addEventListener('change', () => { chks.forEach(c => c.checked = chkAll.checked); updateBulkActionsState(); });
  chks.forEach(chk => chk.addEventListener('change', () => {
    chkAll.checked = Array.from(chks).every(c => c.checked);
    updateBulkActionsState();
  }));
}

function updateBulkActionsState(){
  const chks = document.querySelectorAll('.case-chk:checked');
  const box = document.getElementById('bulkActionsBox');
  if (chks.length > 0) {
    box.className = 'd-flex align-items-center gap-2';
    document.getElementById('bulkSelectCount').textContent = `เลือกแล้ว ${chks.length} รายการ`;
  } else {
    box.className = 'd-none';
  }
}

/* ---------- Bulk propose: ใช้ event PROPOSE_72 (ไม่มี guard พิเศษ) เท่านั้น
   บันทึกความเห็นเริ่มต้น "เห็นชอบ" ให้ทุกรายการที่เลือก แล้วเสนอขึ้นชั้นถัดไป
   — ต้องการระบุความเห็นเฉพาะสำนวน ให้เข้าไปที่ 7.2-02 แทน                  */
document.getElementById('btnBulkApprove')?.addEventListener('click', () => {
  const chks = document.querySelectorAll('.case-chk:checked');
  if (!chks.length) return;
  const nextStatus = CHAIN_PROPOSE_NEXT[role.id];

  ECMIS.confirmAction({
    title: `ยืนยันเสนอผ่านกลุ่มจำนวน ${chks.length} รายการ`,
    html: `<p>ระบบจะบันทึกความเห็นเริ่มต้น "เห็นชอบ" ให้ทุกรายการที่เลือก แล้วเสนอไปยังขั้นตอนถัดไปของสายอนุมัติ</p>
           <div class="law-note">หากต้องการระบุความเห็นเฉพาะสำนวนใดสำนวนหนึ่ง กรุณาใช้หน้าจอ 7.2-02 ทบทวน/เสนอความเห็นแทน</div>`,
    confirmText: 'ยืนยันเสนอผ่านกลุ่ม'
  }).then(res => {
    if (!res.isConfirmed) return;
    let count = 0;
    chks.forEach(chk => {
      const c = ECMIS.CASES.find(x => x.id === chk.dataset.id);
      if (c) {
        const expectedFrom = { section_head:'PENDING_SECTION_72', director:'PENDING_DIRECTOR_72', deputy:'PENDING_DEPUTY_72' }[role.id];
        if (c.status === expectedFrom) {
          c.chainOpinions = c.chainOpinions || [];
          c.chainOpinions.push({ roleId: role.id, type:'ACCEPT', date: todayThaiIso(), note:'เห็นชอบ (สั่งการกลุ่มจากกล่องงาน 7.2-01)' });
          c.status = nextStatus;
          count++;
        }
      }
    });
    ECMIS.saveCases();
    ECMIS.toastOk(`เสนอผ่านกลุ่มสำเร็จจำนวน ${count} รายการแล้ว`);
    setTimeout(() => location.reload(), 1200);
  });
});

/* ---------- Filtering ---------- */
function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const stage = document.getElementById('stageFilter').value;

  filtered = all72.filter(c => {
    const matchQ = !q ||
      c.id.toLowerCase().includes(q) ||
      (c.subject && c.subject.toLowerCase().includes(q)) ||
      (c.ownerOrg && c.ownerOrg.toLowerCase().includes(q));
    const matchSt = (st === 'ALL') || (c.status === st);
    const matchStage = (stage === 'ALL') || (stageOf(c) === stage);
    return matchQ && matchSt && matchStage;
  });

  currentPage = 1;
  renderKPICards();
  renderMyQueue(true);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('stageFilter').addEventListener('change', applyFilters);
document.getElementById('btnClearFilter').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = 'ALL';
  document.getElementById('stageFilter').value = 'ALL';
  applyFilters();
});

renderKPICards();
applyFilters();
</script>
</body>
