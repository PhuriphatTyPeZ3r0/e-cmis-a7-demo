  <script>
    ECMIS.renderShell('board-resolution.html');

    const params = new URLSearchParams(location.search);
    const role = ECMIS.currentRole();

    const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadCaseFromSupabase(caseId) {
      const { data, error } = await sb
        .from('tbl_res_request')
        .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
        .eq('tbl_cmp_case.tcc_no', caseId)
        .eq('is_deleted', false)
        .maybeSingle();
      if (error) throw error;
      return data ? ECMIS.supabaseRowToCase(data) : null;
    }

    /* บันทึกสถานะกลับ tbl_res_request จริง — ฟิลด์อื่นที่ไม่มีคอลัมน์ใน Supabase (resolution,
       resolvedAt, recordedDocHtml, resolutionStage, meetingNo/agendaNo, ownerClarification ฯลฯ)
       ยังคง set บน kase ไว้ให้แสดงผลในหน้านี้ได้ตามเดิม เพียงแต่ไม่ถูกบันทึกข้ามหน้า/ข้ามอุปกรณ์
       ตามขอบเขตฟิลด์ที่ migrate ไว้ เหมือนกับ approval-review.html */
    async function persistCase(kase, patch) {
      const dbPatch = {};
      if ('status' in patch) {
        const code = ECMIS.STATUS_CODE[patch.status];
        if (code) dbPatch.trr_status = code;
      }
      if (kase.trr_id && Object.keys(dbPatch).length) {
        try {
          const { error } = await sb.from('tbl_res_request').update(dbPatch).eq('trr_id', kase.trr_id);
          if (error) console.warn('Supabase update warning:', error);
        } catch (e) {
          console.warn('Supabase update failed:', e);
        }
      }
      Object.assign(kase, patch);
      const memCase = ECMIS.CASES.find(x => x.id === kase.id);
      if (memCase) Object.assign(memCase, patch);
      ECMIS.saveCases();
    }

    (async function main() {
    const caseParam = params.get('case') || '1547/2568';
    let kase = null;
    try {
      kase = await loadCaseFromSupabase(caseParam);
    } catch (err) {
      console.warn('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ:', err);
    }
    if (!kase) {
      kase = ECMIS.getCase(caseParam) || ECMIS.CASES.find(x => x.id === caseParam) || ECMIS.CASES[0];
    }
    if (!kase) { ECMIS.toastWarn('ไม่พบสำนวนนี้ในระบบ'); return; }

    function normalizeDateInputValue(value) {
      const v = String(value || '').trim();
      if (!v) return '';
      const iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
      if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
      const thai = /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/.exec(v);
      if (thai) return `${thai[3]}-${String(thai[2]).padStart(2, '0')}-${String(thai[1]).padStart(2, '0')}`;
      return v;
    }

    function setDateInputValue(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = normalizeDateInputValue(value);
    }

    document.getElementById('stBadge').innerHTML = `<span class="chip me-1">เลขสำนวน ${kase.id}</span>` + ECMIS.statusBadge(kase.status) + ' ' + ECMIS.slaBadge(kase);
    document.getElementById('stepper').innerHTML = ECMIS.stepperHtml(kase.status);
    if (kase.meetingNo) document.getElementById('meetNo').value = kase.meetingNo;
    if (kase.agendaNo) document.getElementById('agendaNo').value = kase.agendaNo;
    if (kase.meetingDate) setDateInputValue('meetDate', kase.meetingDate);

    /* สังกัดอาจมีมากกว่า 1 หน่วยงาน (สำนวนร่วมสอบข้ามเขต) — ใช้ search-select
       แบบเลือกหลายรายการเดียวกับผู้ชี้แจง ตั้งค่าเริ่มต้นจาก kase.ownerOrg เดิม */
    document.getElementById('ownerOrgField').value = kase.ownerOrg;
    ECMIS.initMultiSelectCombo(document.getElementById('ownerOrgField'), [
      'สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 1', 'สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 2', 'สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 3', 'สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 4',
      'สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 5', 'สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 6', 'สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 7', 'สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 8',
      'สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 9',
      'กองปราบปรามการทุจริตในภาครัฐ 1', 'กองปราบปรามการทุจริตในภาครัฐ 2',
      'กองปราบปรามการทุจริตในภาครัฐ 3', 'กองปราบปรามการทุจริตในภาครัฐ 4',
      'กองปราบปรามการทุจริตในภาครัฐ 5', 'กองอำนวยการต่อต้านการทุจริต'
    ], {
      selectAll: true,
      placeholder: '— เลือกสังกัด (เลือกได้มากกว่า 1) —',
      searchPlaceholder: 'ค้นหาหรือพิมพ์สังกัดเพิ่ม แล้วกด Enter...'
    });

    /* ผู้ชี้แจงต่อที่ประชุมมีได้มากกว่า 1 คน — ใช้ search-select แบบเลือกหลายรายการ
       เก็บค่าไว้ใน #presenter เดิม (comma-joined) ไม่ต้องแก้ renderDoc()/wiring ด้านล่าง */
    ECMIS.initMultiSelectCombo(document.getElementById('presenter'), [
      'ฝ่ายเลขานุการคณะอนุกลั่นกรองฯ (นิติกร กบค.)',
      `${kase.owner} (ผู้รับผิดชอบสำนวน)`,
      `${ECMIS.getRole('scr_sec').name} (อนุกรรมการและเลขานุการ คณะอนุกลั่นกรองฯ)`,
      `${ECMIS.getRole('scr_asst').name} (อนุกรรมการและผู้ช่วยเลขานุการ คณะอนุกลั่นกรองฯ)`,
      `${ECMIS.getRole('board_sec').name} (เจ้าหน้าที่กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ)`,
      `${ECMIS.getRole('dir_case').name} (ผู้อำนวยการกองบริหารคดี)`
    ]);

    /* ผู้ลงนามท้ายเอกสารเดิม hardcode ชื่อ ผอ.กบค. ไว้ตรงๆ — เปลี่ยนเป็นเลือกจากบทบาท
       ที่มีสิทธิ์แก้ไขมติได้จริง (ชีตแถว 15) ส่วนตำแหน่งแยกเป็นช่องข้อความอิสระ เพราะ
       ถ้อยคำตำแหน่งเปลี่ยนได้ตามสถานการณ์จริง (เช่น "รักษาการแทน") ไม่ผูกตายตัวกับชื่อ */
    const SIGNER_CANDIDATES = [
      { name: ECMIS.getRole('dir_case').name, title: 'ผู้อำนวยการกองบริหารคดี ปฏิบัติหน้าที่เลขานุการคณะกรรมการ ป.ป.ท.' },
      { name: ECMIS.getRole('board_sec').name, title: 'เจ้าหน้าที่กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ ปฏิบัติหน้าที่เลขานุการคณะกรรมการ ป.ป.ท.' },
      { name: ECMIS.getRole('secgen').name, title: 'เลขาธิการคณะกรรมการ ป.ป.ท.' }
    ];
    const signerNameEl = document.getElementById('signerName');
    SIGNER_CANDIDATES.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name; opt.textContent = c.name;
      signerNameEl.appendChild(opt);
    });
    signerNameEl.value = SIGNER_CANDIDATES[0].name;
    document.getElementById('signerTitle').value = SIGNER_CANDIDATES[0].title;
    signerNameEl.addEventListener('change', () => {
      const c = SIGNER_CANDIDATES.find(x => x.name === signerNameEl.value);
      if (c) document.getElementById('signerTitle').value = c.title;
    });
    ECMIS.initSmartCombobox(signerNameEl);

    /* ---------- Q: สิทธิ์แก้ไขมติ (ชีตแถว 15) ---------- */
    const mayEdit = ECMIS.canEditMaster(role.id) || ECMIS.can('record.minutes', role.id);
    const mayView = ECMIS.canViewCase(kase, role.id);

    /* คำชี้แจงจากเจ้าของสำนวน — กรอกได้เฉพาะ role owner (แยกจาก #presenterNote ที่เจ้าหน้าที่
       กบค. กรอกแทน), บทบาทอื่นเห็นเป็น read-only และซ่อนถ้ายังไม่มีข้อความ */
    const ownerClarificationEl = document.getElementById('ownerClarification');
    ownerClarificationEl.value = kase.ownerClarification || '';
    if (role.id !== 'owner') {
      ownerClarificationEl.readOnly = true;
      document.getElementById('ownerClarificationBox').classList.toggle('d-none', !kase.ownerClarification);
    }
    /* เดิมปุ่ม "บันทึกมติและล็อก PDF" ไม่เคยเปลี่ยน kase.status/บันทึกข้อมูลจริงเลย (แค่ toast
       แล้ว redirect) ทำให้กดบันทึกกี่ครั้งก็ไม่มีอะไรเปลี่ยนจริง และเอกสารฝั่งขวาก็ไม่มีทาง
       "ดูย้อนหลัง" มติที่บันทึกไปแล้วได้ (renderDoc() สร้างจากค่าฟอร์มปัจจุบันเสมอ ไม่ใช่ค่าที่
       บันทึกไว้จริง) — isLocked คือสำนวนที่บันทึกมติไปแล้วจริง (ผ่าน handle('lock') ด้านล่าง
       ซึ่งตอนนี้ persistCase() บันทึก kase.status ลง Supabase จริง แล้ว set kase.resolution/
       kase.recordedDocHtml ฯลฯ ที่ไม่มีคอลัมน์ใน Supabase ไว้บน kase ในหน่วยความจำแล้ว)
       renderDoc() จะโชว์ recordedDocHtml ที่บันทึกไว้ตรงๆ แทนการ generate ใหม่จากฟอร์ม
       (ค่าฟอร์มที่โหลดใหม่จะไม่ตรงกับตอนบันทึกจริงอีกต่อไป) และซ่อนปุ่มบันทึกไม่ให้กดซ้ำ */
    const isLocked = kase.status === 'RESOLVED' || kase.status === 'RESOLVED_PENDING';
    if (mayView && isLocked) {
      document.getElementById('editGate').innerHTML += `
    <div class="mb-3" style="background:#EAF7EE;border:1px solid #16A34A;border-radius:8px;padding:.75rem 1rem">
      <strong><i class="fa-solid fa-lock me-1" style="color:#16A34A"></i>มติสำนวนนี้ถูกบันทึกและล็อกแล้ว</strong><br>
      บันทึกเมื่อ ${kase.resolvedAt ? ECMIS.toThaiDigits(kase.resolvedAt) : '—'} — เอกสารด้านขวาเป็น
      <strong>preview ของมติที่บันทึกจริง</strong> ไม่ใช่ค่าที่สร้างจากฟอร์มปัจจุบัน
      <small class="d-block mt-1 text-muted">แก้ไขมติที่ล็อกแล้วต้องผ่านกระบวนการแก้ไขพิเศษ ไม่ใช่กดบันทึกซ้ำจากหน้านี้</small>
    </div>`;
    }

    /* ---------- สถานะการจัดทำมติ (6 ขั้นตอน) — เชื่อมกับหน้าติดตามสถานะอัตโนมัติผ่าน getAct7Status() ---------- */
    function renderResolutionStageBox() {
      const box = document.getElementById('resolutionStageBox');
      if (!isLocked) { box.innerHTML = ''; return; }
      if (!kase.resolutionStage) kase.resolutionStage = 1;
      const stage = kase.resolutionStage;

      const stepsHtml = ECMIS.RESOLUTION_STAGES.map(s => {
        const done = s.n < stage, active = s.n === stage;
        const cls = done ? 'text-success' : (active ? 'fw-bold text-navy' : 'text-muted');
        const icon = done ? 'fa-circle-check' : (active ? 'fa-circle-dot' : 'fa-circle');
        return `<div class="${cls}" style="font-size:.82rem"><i class="fa-solid ${icon} me-1" style="font-size:.7rem"></i>${s.n}. ${s.label}</div>`;
      }).join('');

      const controlsHtml = mayEdit ? `
        <div class="d-flex align-items-center gap-2 mt-2">
          <select class="form-select form-select-sm" id="resStageSelect" style="max-width:420px">
            ${ECMIS.RESOLUTION_STAGES.map(s => `<option value="${s.n}" ${s.n === stage ? 'selected' : ''}>${s.n}. ${s.label}</option>`).join('')}
          </select>
          <button type="button" class="ws-button primary" style="min-height:32px;padding:.4rem .8rem" id="btnSaveResStage"><i class="fa-solid fa-floppy-disk me-1"></i>บันทึกสถานะ</button>
        </div>` : '';

      box.innerHTML = `
    <div class="ws-card mb-3">
      <div class="card-header"><i class="fa-solid fa-list-check me-1"></i>สถานะการจัดทำมติ (6 ขั้นตอน)</div>
      <div class="card-body">
        <div class="mb-2">${stepsHtml}</div>
        ${controlsHtml}
      </div>
    </div>`;

      const btn = document.getElementById('btnSaveResStage');
      if (btn) {
        btn.addEventListener('click', () => {
          const val = parseInt(document.getElementById('resStageSelect').value, 10);
          Object.assign(kase, { resolutionStage: val });
          ECMIS.toastOk('บันทึกสถานะการจัดทำมติเรียบร้อย');
          renderResolutionStageBox();
        });
      }
    }
    renderResolutionStageBox();

    if (!mayView) {
      document.getElementById('editGate').innerHTML = `
    <div class="mb-3">
      <strong><i class="fa-solid fa-eye-slash me-1"></i>บทบาท "${role.title}" ไม่มีสิทธิ์เข้าถึงสำนวนนี้</strong><br>
      ชีตแถว 17 กำหนดให้ผู้รับผิดชอบสำนวนเห็นได้เฉพาะสำนวนของตนเอง
      และคณะอนุกรรมการเห็นได้เฉพาะสำนวนที่ได้รับมอบหมายให้คณะของตน
    </div>`;
      document.getElementById('content') && (document.getElementById('content').style.display = 'none');
    } else if (!mayEdit) {
      document.getElementById('editGate').innerHTML = `
    <div class="mb-3">
      <strong><i class="fa-solid fa-lock me-1"></i>โหมดอ่านอย่างเดียว — บทบาทนี้บันทึก/แก้ไขมติไม่ได้</strong><br>
      ชีตแถว 15 ระบุว่ามีเพียง <strong>เจ้าหน้าที่กลุ่มงานกิจการคณะกรรมการ 6 คน + ผอ.กบค. 1 คน (รวม 7 คน)</strong>
      ที่มีสิทธิ์แก้ไขมติ/คำสั่ง/รายงาน และกลุ่มงานคำวินิจฉัยและมติฯ เป็นผู้บันทึกมติเข้าระบบ<br>
      <small>ชีตแถว 17: ผู้รับผิดชอบสำนวนอ่านและดาวน์โหลดได้ แต่แก้ไขไม่ได้ทั้งส่วนมติและคำสั่ง/รายงาน</small>
    </div>`;
      /* ล็อกทุกช่องกรอกบนหน้านี้จริง — role ที่ไม่มีสิทธิ์ record.minutes/EDIT.MASTER (เช่นประธานฯ ที่
         แค่ผ่านหน้านี้ต่อจากการสั่งบรรจุวาระ) จะดูได้อย่างเดียว ตรงกับข้อความ "โหมดอ่านอย่างเดียว" ด้านบน */
      setTimeout(() => document.querySelectorAll('main input, main select, main textarea')
        .forEach(el => { if (!el.closest('.action-bar')) el.disabled = true; }), 0);
    }

    /* ---------- คณะกรรมการ 7 ท่าน ---------- */
    const BOARD = [
      { n: 'นายวิชัย ยุติธรรม', r: 'ประธานกรรมการ ป.ป.ท.', chair: true },
      { n: 'นายสมบูรณ์ ธรรมรัฐ', r: 'กรรมการ ป.ป.ท.' },
      { n: 'พันตำรวจโท วันนพ สมจินตนากุล', r: 'กรรมการ ป.ป.ท.' },
      { n: 'นายวิเชียร จันทรโณทัย', r: 'กรรมการ ป.ป.ท.' },
      { n: 'นายพรเทพ อัมพรกลิ่นแก้ว', r: 'กรรมการ ป.ป.ท.' },
      { n: 'นายกมล สกลเดชา', r: 'กรรมการ ป.ป.ท.' },
      { n: 'นายสุรพงษ์ อินทรถาวร', r: 'กรรมการ ป.ป.ท.' }
    ];
    const TOTAL = BOARD.length;

    document.getElementById('boardTb').innerHTML = BOARD.map((b, i) => `
  <tr data-i="${i}">
    <td><strong>${b.n}</strong><br><small class="text-muted">${b.r}</small></td>
    <td>
      <select class="form-select form-select-sm attend">
        <option value="present" selected>เข้าประชุม</option>
        <option value="recused">ถอนตัว</option>
      </select>
    </td>
    <td>
      <select class="form-select form-select-sm vote">
        <option value="for" selected>เห็นด้วย</option>
        <option value="against">ไม่เห็นด้วย</option>
        <option value="abstain">งดออกเสียง</option>
      </select>
    </td>
  </tr>`).join('');

    function tally() {
      let present = 0, recused = 0, forV = 0, againstV = 0, abstainV = 0;
      document.querySelectorAll('#boardTb tr').forEach(tr => {
        const a = tr.querySelector('.attend').value;
        const v = tr.querySelector('.vote');
        if (a === 'recused') {
          recused++;
          v.value = 'abstain';
          v.disabled = true;
          abstainV++;
        } else {
          v.disabled = false;
          present++;
          if (v.value === 'for') forV++;
          else if (v.value === 'against') againstV++;
          else if (v.value === 'abstain') abstainV++;
        }
      });
      return { present, recused, forV, againstV, abstainV };
    }

    function renderQuorum() {
      const t = tally();
      /* กติกาองค์ประชุมย้ายไปอยู่ในโมเดลกลางแล้ว (ม.10 + ม.12 + ม.15)
         เดิมหน้านี้คำนวณเอง และตกเงื่อนไข ม.10 (กรรมการเหลือไม่ต่ำกว่า 5 คน) ไป */
      const q = ECMIS.boardQuorum({
        inOffice: TOTAL, present: t.present,
        forV: t.forV, againstV: t.againstV, abstainV: t.abstainV
      });
      const { quorumMin, quorumOk, majorityMin, majorityOk, tie, boardValid } = q;

      document.getElementById('quorumBox').innerHTML = `
    ${!boardValid ? `<div class="rule fail"><i class="fa-solid fa-circle-xmark"></i>
      <span><strong>ม.10:</strong> กรรมการเท่าที่มีอยู่ ${TOTAL} คน — น้อยกว่าขั้นต่ำ
      ${ECMIS.BOARD_MIN_IN_OFFICE} คน คณะกรรมการยังทำหน้าที่ต่อไม่ได้</span></div>` : ''}
    <div class="rule ${quorumOk ? 'pass' : 'fail'}">
      <i class="fa-solid ${quorumOk ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
      <span><strong>องค์ประชุม (ม.12):</strong> เข้าประชุม ${t.present} จาก ${TOTAL} ท่าน
        — ต้องไม่น้อยกว่า ${quorumMin} ท่าน
        ${t.recused ? `<br><small>ถูกกันออกตาม ม.20 จำนวน ${t.recused} ท่าน (ยังเห็นข้อมูลได้ แต่ถูกกันสิทธิ์ลงมติในวาระนี้)</small>` : ''}</span>
    </div>
    <div class="rule ${majorityOk ? 'pass' : 'fail'}">
      <i class="fa-solid ${majorityOk ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
      <span><strong>เกณฑ์มติ (ม.15):</strong> เห็นด้วย ${t.forV} / ไม่เห็นด้วย ${t.againstV} / งดออกเสียง ${t.abstainV}
        — ต้องได้เสียงข้างมากของกรรมการทั้งหมดเท่าที่มีอยู่ คือไม่น้อยกว่า ${majorityMin} เสียง</span>
    </div>
    ${tie ? `<div class="rule fail"><i class="fa-solid fa-gavel"></i>
      <span>คะแนนเท่ากัน — ประธานในที่ประชุมออกเสียงเพิ่มอีกหนึ่งเสียงเป็นเสียงชี้ขาด (ม.15 วรรคสอง)</span></div>` : ''}
    ${!quorumOk ? `<div class="rule fail"><i class="fa-solid fa-ban"></i>
      <span><strong>ระบบบล็อกการบันทึกมติ</strong> — องค์ประชุมไม่ครบ มติอาจไม่ชอบด้วยกฎหมาย</span></div>` : ''}
    <div class="rule ${t.againstV > 0 ? 'fail' : 'pass'}">
      <i class="fa-solid ${t.againstV > 0 ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i>
      <span><strong>ม.16:</strong> ${t.againstV > 0
          ? 'มีความเห็นแย้ง — ระบบบังคับบันทึกความเห็นแย้งพร้อมเหตุผลลงรายงานการประชุม'
          : 'มติเป็นเอกฉันท์ ไม่มีความเห็นแย้งที่ต้องบันทึก'}</span>
    </div>`;
      return { ...t, ...q };
    }

    document.getElementById('boardTb').addEventListener('change', () => { renderQuorum(); renderDoc(); });

    function currentMode() { return 'AFTER'; }

    function applyMode() {
      const live = false;
      document.querySelectorAll('#boardTb .vote').forEach(v => v.classList.toggle('border-warning', live));
      renderQuorum(); renderDoc();
    }

    document.getElementById('resList').innerHTML = ECMIS.RESOLUTIONS.map((r, i) => `
  <label class="list-group-item d-flex gap-2 align-items-start">
    <input class="form-check-input mt-1" type="radio" name="res" value="${r.code}" ${i === 0 ? 'checked' : ''}>
    <span><strong>${r.label}</strong>
      <br><small class="text-muted">เอกสารที่ต้องออก: ${r.doc}${r.signer !== '—' ? ` · ผู้ลงนาม: ${r.signer}` : ''}</small></span>
  </label>`).join('');

    function selectedRes() {
      const code = document.querySelector('input[name="res"]:checked').value;
      return ECMIS.RESOLUTIONS.find(r => r.code === code);
    }

    /* ข้อความ "มติที่ประชุม" ตามประเภทมติที่เลือก — ใช้ร่วมกันทั้ง HTML preview (renderDoc)
       และตอนสร้างไฟล์ .docx จริง (generateDocx) เพื่อไม่ให้ข้อความเพี้ยนไปคนละทางกัน */
    function computeResolutionText() {
      const opinion = document.getElementById('boardOpinion').value.trim();
      const r = selectedRes();
      if (r.code === 'ACCEPT_S24P1') {
        return 'รับไว้ไต่สวน โดยให้ดำเนินการไต่สวนเป็นองค์คณะ ตามมาตรา ๒๔ วรรคหนึ่ง แห่งพระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม';
      } else if (r.code === 'ACCEPT_S24P3') {
        return 'รับไว้ไต่สวน โดยให้ดำเนินการไต่สวนเป็นคณะอนุกรรมการไต่สวน ตามมาตรา ๒๔ วรรคสาม แห่งพระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม';
      } else if (r.code === 'NOT_ACCEPTED') {
        const law = document.getElementById('rejectLaw').value;
        return `ไม่รับไว้ไต่สวน เนื่องจาก ${opinion || '……………………'} ตามพระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม มาตรา ${law || '…………'}`;
      } else if (r.code === 'DISMISS') {
        const law = document.getElementById('rejectLaw').value;
        return `ให้จำหน่ายเรื่องออกจากสารบบ เนื่องจาก ${opinion || '……………………'} ตามพระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม มาตรา ${law || '…………'}`;
      } else if (r.code === 'NO_GROUND') {
        return `ข้อกล่าวหาไม่มีมูล ให้ข้อกล่าวหานั้นเป็นอันตกไป ตามมาตรา ๓๒ แห่งพระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม และให้แจ้งผู้ถูกกล่าวหาทราบไม่ช้ากว่าสิบห้าวันนับแต่วันที่คณะกรรมการ ป.ป.ท. มีมติ`;
      } else if (r.code === 'MORE_INVESTIGATE') {
        const task = document.getElementById('moreTask').value.trim();
        return `ให้ผู้รับผิดชอบสำนวนไต่สวนเบื้องต้นเพิ่มเติม ดังนี้ ${task || '……………………………………'}`;
      } else {
        const fwd = ECMIS.forwardTarget(fwdSel.value);
        const fwdLabel = fwd?.code === 'OTHER'
          ? (document.getElementById('forwardToOther').value.trim() || 'อื่นๆ (ยังไม่ได้ระบุปลายทาง)')
          : fwd?.label;
        return `ส่งเรื่องให้ ${fwdLabel || '—'}`;

      (กรรมการที่ถูกกันออกจากการพิจารณาวาระนี้ตาม ม.๒๐ จำนวน ${t.recused} ท่าน)</div>`] : []),
        ...(s65 ? [s65] : []),
        `<div style="margin-top:6px">${lastNo}. รับรองมติการประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meetNo)}
      วันที่ ${M(meetDate)} วาระที่ ${M(agendaNo)}</div>`
      ];

      ECMIS.paginateResolutionDoc(document.getElementById('docPaper'),
        { introBlock, flowBlocks, signBlock, runningHeaderHtml });
    }

    document.getElementById('resList').addEventListener('change', () => { toggleBoxes(); renderOutcome(); renderDoc(); });
    ['meetNo', 'meetDate', 'agendaNo', 'boardOpinion', 'ownerOrgField', 'presenter', 'presenterNote', 'ownerClarification', 'signerName', 'signerTitle', 'rejectLaw', 'moreTask', 'moreOwner', 'moreDue', 'forwardTo', 'forwardToOther']
      .forEach(id => {
        const el = document.getElementById(id); if (el) {
          el.addEventListener('input', renderDoc); el.addEventListener('change', renderDoc);
        }
      });
    /* ---------- สร้างไฟล์ .docx จริงจาก template ต้นฉบับ (assets/templates/order-preliminary.docx)
       ด้วย docxtemplater — แทนที่ปุ่ม .docx เดิมซึ่งเป็นแค่ toast จำลอง ไม่ได้สร้างไฟล์จริง ---------- */
    async function generateDocx(templateUrl, tags, filename) {
      const resp = await fetch(templateUrl);
      if (!resp.ok) throw new Error('โหลด template ไม่สำเร็จ: ' + templateUrl);
      const buf = await resp.arrayBuffer();
      const zip = new PizZip(buf);
      const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
      doc.render(tags);
      const out = doc.getZip().generate({
        type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      });
      const url = URL.createObjectURL(out);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    function docxTags() {
      const P = (v, ph) => (v && String(v).trim()) ? String(v).trim() : (ph || '…………');
      const meetNo = document.getElementById('meetNo').value.trim();
      const meetDateValue = normalizeDateInputValue(document.getElementById('meetDate').value.trim());
      const meetDate = ECMIS.thaiDate(meetDateValue);
      const agendaNo = document.getElementById('agendaNo').value.trim();
      const ownerOrg = document.getElementById('ownerOrgField').value.trim() || kase.ownerOrg;
      const presenter = document.getElementById('presenter').value.trim();
      const presenterNote = document.getElementById('presenterNote').value.trim();
      const ownerClarification = document.getElementById('ownerClarification').value.trim();
      const opinion = document.getElementById('boardOpinion').value.trim();
      const ac = kase.accused || [];
      const legalBaseClause = kase.legalBase === 'ม.62'
        ? '(รับตามมาตรา 62 พระราชบัญญัติประกอบรัฐธรรมนูญว่าด้วยการป้องกันและปราบปรามการทุจริต พ.ศ. 2561)'
        : '(รับตามมาตรา 18/4 พระราชบัญญัติมาตรการของฝ่ายบริหารในการป้องกันและปราบปรามการทุจริต พ.ศ. ๒๕๕๑ และที่แก้ไขเพิ่มเติม)';
      const nacc65Clause = kase.legalBase === 'ม.62'
        ? '2. ให้ผู้รับผิดชอบสำนวนดำเนินการรายงานผลการดำเนินการตามพระราชบัญญัติประกอบรัฐธรรมนูญว่าด้วยการป้องกันและปราบปรามการทุจริต พ.ศ. 2561 มาตรา 65'
        : '';
      return {
        meetNo: P(meetNo), meetDate: P(meetDate), agendaNo: P(agendaNo),
        subject: P(kase.subject), ownerName: P(kase.owner), ownerOrg: P(ownerOrg),
        explainer: P(presenter), refDoc: P(kase.docRef !== '—' ? kase.docRef : ''),
        caseId: P(kase.id), legalBaseClause,
        complainant: P(kase.complainant),
        accused1: ac[0] ? P(`${ac[0].name} ${ac[0].pos}`) : '',
        accused2: ac[1] ? P(`${ac[1].name} ${ac[1].pos}`) : '',
        accused3: ac[2] ? P(`${ac[2].name} ${ac[2].pos}`) : '',
        allegation: P(kase.allegation), explainNote: P(presenterNote),
        ownerClarification: P(ownerClarification),
        boardOpinion: P(opinion), resolutionText: computeResolutionText(),
        nacc65Clause,
        ratifyMeetNo: P(meetNo), ratifyMeetDate: P(meetDate), ratifyAgendaNo: P(agendaNo),
        lastClauseNo: kase.legalBase === 'ม.62' ? '3' : '2'
      };
    }

    document.getElementById('btnDocx').addEventListener('click', async () => {
      try {
        await generateDocx('assets/templates/order-preliminary.docx', docxTags(),
          `มติที่ประชุม-${kase.id.replace('/', '_')}.docx`);
        ECMIS.toastOk('ดาวน์โหลด .docx เรียบร้อย — แก้ไขใน Word ได้ตามปกติ');
      } catch (e) {
        console.error(e);
        ECMIS.toastWarn('สร้างไฟล์ .docx ไม่สำเร็จ: ' + e.message);
      }
    });

    function buildButtons() {
      if (!mayEdit) return [];
      if (isLocked) return [];
      return [
        { act: 'save', label: 'บันทึกร่างมติ', icon: 'fa-floppy-disk', cls: 'btn-outline-secondary' },
        { act: 'lock', label: 'บันทึกมติและล็อก PDF', icon: 'fa-lock', cls: 'btn-gold' }
      ];
    }
    document.getElementById('actionBarSlot').innerHTML = ECMIS.actionBar(kase, role.id, buildButtons());
    document.querySelectorAll('.action-bar [data-act]').forEach(b =>
      b.addEventListener('click', () => handle(b.dataset.act)));

    function handle(act) {
      if (act === 'save') { ECMIS.toastOk('บันทึกร่างมติเรียบร้อย'); return; }

      if (act === 'lock') {
        const q = renderQuorum();
        const r = selectedRes();
        const meetNoVal = document.getElementById('meetNo').value.trim();
        const meetDateVal = normalizeDateInputValue(document.getElementById('meetDate').value.trim());
        const agendaNoVal = document.getElementById('agendaNo').value.trim();
        if (!meetNoVal || !meetDateVal || !agendaNoVal) {
          ECMIS.toastWarn('กรุณาระบุ ครั้งที่ประชุม, วันที่ประชุม และ วาระที่');
          return;
        }

        if (!q.quorumOk) {
          Swal.fire({
            icon: 'error', title: 'องค์ประชุมไม่ครบ — บันทึกมติไม่ได้',
            html: `<div class="text-start">ตาม <strong>ม.12</strong> การประชุมต้องมีกรรมการมาประชุม
              ไม่น้อยกว่ากึ่งหนึ่งของจำนวนกรรมการทั้งหมดเท่าที่มีอยู่<br><br>
              <span style="color:#DB2626">มติที่บันทึกในสภาพนี้อาจไม่ชอบด้วยกฎหมาย
              ระบบจึงบล็อกการบันทึกและแนะนำให้เลื่อนวาระไปครั้งถัดไป</span></div>`,
            confirmButtonColor: '#DB2626'
          });
          return;
        }
        if (!q.majorityOk) {
          ECMIS.toastWarn('คะแนนเห็นด้วยยังไม่ถึงเสียงข้างมากของกรรมการทั้งหมดเท่าที่มีอยู่ (ม.15)');
          return;
        }
        const op = document.getElementById('boardOpinion');
        if (op.value.trim().length === 0) {
          op.classList.add('is-invalid-ecmis');
          document.querySelector('.val-msg[data-for="boardOpinion"]').classList.add('show');
          ECMIS.toastWarn('กรุณาระบุความเห็นที่ประชุม');
          return;
        } else {
          op.classList.remove('is-invalid-ecmis');
          document.querySelector('.val-msg[data-for="boardOpinion"]').classList.remove('show');
        }

        if (LAWREF_CODES.includes(r.code) && !document.getElementById('rejectLaw').value) {
          ECMIS.toastWarn('กรุณาเลือกมาตราอ้างอิงตาม ม.25 / ม.26'); return;
        }
        if (r.code === 'MORE_INVESTIGATE') {
          const miss = ['moreTask', 'moreOwner', 'moreDue'].filter(id => !document.getElementById(id).value.trim());
          if (miss.length) {
            ECMIS.toastWarn('ม.24 ว.4 บังคับระบุ: สิ่งที่ต้องดำเนินการ + ผู้รับผิดชอบ + กำหนดส่งกลับ'); return;
          }
        }
        if (r.code === 'FORWARD' && fwdSel.value === 'OTHER') {
          const otherEl = document.getElementById('forwardToOther');
          if (!otherEl.value.trim()) {
            otherEl.classList.add('is-invalid-ecmis');
            document.querySelector('.val-msg[data-for="forwardToOther"]').classList.add('show');
            ECMIS.toastWarn('กรุณาระบุปลายทางที่ต้องการส่งเรื่องให้'); return;
          } else {
            otherEl.classList.remove('is-invalid-ecmis');
            document.querySelector('.val-msg[data-for="forwardToOther"]').classList.remove('show');
          }
        }

        ECMIS.confirmAction({
          title: 'บันทึกมติและล็อกไฟล์ PDF',
          html: `<div class="text-start">
        <p class="mb-2">สำนวน <strong>${kase.id}</strong> — มติ: <strong>${r.label}</strong></p>
        <div style="background:#fdf7e8;border-left:4px solid #D0A830;padding:.6rem .8rem;border-radius:0 6px 6px 0;font-size:.83rem">
          เมื่อบันทึกแล้วระบบจะ:<br>
          • ล็อกเอกสารมติเป็น PDF (แก้ไขได้เฉพาะ 6 เจ้าหน้าที่กลุ่มงานกิจการฯ + ผอ.กบค.)<br>
          • สร้าง <strong>${r.doc}</strong> จาก Template อัตโนมัติ<br>
          • ยิงมติกลับ <strong>กิจกรรมที่ 5</strong> และเริ่มนับกำหนดเวลาปลายทาง<br>
          • Auto-compile รายงานการประชุมรวมทุกเรื่องในวันประชุมเดียวกัน
        </div></div>`,
          confirmText: 'ยืนยันบันทึกมติ'
        }).then(async res => {
          if (!res.isConfirmed) return;

          if (r.code === 'MORE_INVESTIGATE') {
            const priorRounds = ECMIS.Model.RoundStore.list(kase.id).filter(rr => rr.phase === '7.1');
            ECMIS.Model.RoundStore.create({
              caseId: kase.id, phase: '7.1', roundNumber: priorRounds.length + 1,
              reasonText: document.getElementById('moreTask').value.trim(),
              owner: document.getElementById('moreOwner').value.trim(),
              dueDate: document.getElementById('moreDue').value.trim(),
              triggeredBy: 'BOARD_RESOLUTION'
            });
          }

          try {
            await persistCase(kase, { status: 'RESOLVED' });
          } catch (err) {
            console.error('บันทึกมติไม่สำเร็จ:', err);
            ECMIS.toastWarn('บันทึกลงฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
            return;
          }
          Object.assign(kase, {
            resolution: r.code,
            resolvedAt: new Date().toLocaleString('th-TH'),
            resolvedAtIso: new Date().toISOString(),
            recordedDocHtml: document.getElementById('docPaper').innerHTML,
            resolutionStage: 1,
            ownerClarification: document.getElementById('ownerClarification').value.trim()
          });
          ECMIS.toastOk('บันทึกมติและล็อก PDF เรียบร้อย');
          const next = (r.code === 'ACCEPT_S24P1' || r.code === 'ACCEPT_S24P3')
            ? 'order-m24.html?case=' + encodeURIComponent(kase.id) + '&res=' + r.code
            : ECMIS.homeHref(role.id);
          setTimeout(() => location.href = next, 1400);
        });
      }
    }

    /* ---------- Document workspace: collapsible pane (ws-doc-pane-toggle/-rail จาก a4-ecmis-workspace.css) ---------- */
    const docWorkspace = document.getElementById('docWorkspace');
    const PANE_KEY = 'ecmis-board-resolution-docpane-collapsed';
    function setPaneCollapsed(collapsed) {
      docWorkspace.classList.toggle('pane-collapsed', collapsed);
      localStorage.setItem(PANE_KEY, collapsed ? '1' : '0');
    }
    if (localStorage.getItem(PANE_KEY) === '1') setPaneCollapsed(true);
    document.getElementById('btnPaneCollapse').addEventListener('click', () => setPaneCollapsed(true));
    document.getElementById('btnPaneExpand').addEventListener('click', () => setPaneCollapsed(false));

    /* ---------- Document workspace: แก้ไขเอกสารที่ล็อกแล้วแบบ Word (rich-text) ----------
       เปิดใช้เฉพาะเอกสารที่บันทึก/ล็อกแล้ว (isLocked) และเฉพาะผู้มีสิทธิ์แก้ไขมติ (mayEdit)
       ตรงกับข้อความ "แก้ไขมติที่ล็อกแล้วต้องผ่านกระบวนการแก้ไขพิเศษ" ด้านบน */
    const docEditFab = document.getElementById('docEditFab');
    const docEditBar = document.getElementById('docEditBar');
    const docPaperWrap = document.getElementById('docPaper');
    /* ย้าย FAB ไปเป็นลูกตรงของ body — กัน ancestor ที่มี transform/position ทับ z-index ของ
       position:fixed จนโดนแถบ action-bar ด้านล่างบังปุ่ม (เจอจริงตอนทดสอบ) */
    document.body.appendChild(docEditFab);

    if (isLocked && mayEdit) {
      docEditFab.classList.remove('d-none');
    }

    function setDocEditMode(on) {
      docPaperWrap.querySelectorAll('.doc-paper').forEach(p => {
        if (on) p.setAttribute('contenteditable', 'true');
        else p.removeAttribute('contenteditable');
      });
      docEditFab.classList.toggle('active', on);
      docEditBar.classList.toggle('show', on);
    }

    docEditFab.addEventListener('click', () => {
      const on = !docEditFab.classList.contains('active');
      setDocEditMode(on);
    });

    docEditBar.addEventListener('click', e => {
      const btn = e.target.closest('[data-format]');
      if (btn) { document.execCommand(btn.dataset.format); docPaperWrap.querySelector('.doc-paper')?.focus(); }
    });
    docEditBar.addEventListener('change', e => {
      const el = e.target.closest('select[data-format]');
      if (el) { document.execCommand(el.dataset.format, false, el.value); docPaperWrap.querySelector('.doc-paper')?.focus(); }
    });

    document.getElementById('btnSaveDocEdit').addEventListener('click', () => {
      Object.assign(kase, { recordedDocHtml: docPaperWrap.innerHTML });
      setDocEditMode(false);
      ECMIS.toastOk('บันทึกการแก้ไขเอกสารเรียบร้อย');
    });

    applyMode(); toggleBoxes(); renderOutcome(); renderDoc();
    })();
  </script>
