<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานวินิจฉัยชี้มูล (72-09) | E-CMIS 7.2</title>
  <link rel="icon" type="image/png" href="pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="assets/ecmis-app.css" rel="stylesheet">
</head>

<body>
  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-file-signature me-2"></i>รายงานวินิจฉัยชี้มูล (72-09)</h1>
      </div>
      <div class="ms-auto text-end">
        <span class="flow-ref">ผัง 7.2: 7.2-09 จัดทำรายงาน / ลงนาม / ส่งดำเนินการ</span>
        <div class="mt-1" id="stBadge"></div>
      </div>
    </div>

    <div class="card card-ecmis mb-3">
      <div class="card-body pb-1" id="stepper"></div>
    </div>

    <div id="editGate"></div>

    <div class="row g-3">
      <div class="col-xl-6">

        <div class="card card-ecmis mb-3">
          <div class="card-header"><i class="fa-solid fa-circle-info"></i> สรุปมติที่ประชุมและเลขที่คำสั่ง</div>
          <div class="card-body">
            <div class="row g-2 mb-2">
              <div class="col-md-4"><label class="form-label field-req">ครั้งที่ประชุม</label><input class="form-control" id="meetNo"></div>
              <div class="col-md-4"><label class="form-label field-req">วาระที่</label><input class="form-control" id="agendaNo"></div>
              <div class="col-md-4"><label class="form-label field-req">เลขที่คำสั่ง / เลขหนังสือ</label><input class="form-control" id="orderNo" placeholder="เช่น ปปท วฉ 19/2569"></div>
            </div>
            <div class="rule-panel" id="resolutionInfo"></div>
          </div>
        </div>

        <div class="card card-ecmis mb-3">
          <div class="card-header"><i class="fa-solid fa-file-lines"></i> ข้อมูลรายงานวินิจฉัยชี้มูล</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label field-req">สรุปข้อเท็จจริงและพยานหลักฐานสำคัญ</label>
              <textarea class="form-control" id="factSummary" rows="3" placeholder="สรุปประเด็นพยานหลักฐานที่ทำให้เกิดมติ"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label field-req">ข้อกฎหมายที่ใช้วินิจฉัย</label>
              <textarea class="form-control" id="legalAnalysis" rows="3" placeholder="ระบุมาตรา/เหตุผลทางกฎหมาย"></textarea>
            </div>
            <div class="mb-0">
              <label class="form-label field-req">ข้อวินิจฉัยและคำสั่งของคณะกรรมการ ป.ป.ท.</label>
              <textarea class="form-control" id="rulingText" rows="4" placeholder="ข้อความคำสั่งตามมติ"></textarea>
            </div>
          </div>
        </div>

        <div class="card card-ecmis mb-3" id="disciplineCard">
          <div class="card-header"><i class="fa-solid fa-file-shield"></i> แบบฟอร์มหนังสือลงโทษทางวินัย (TOR 7.2.3.4)</div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-6"><label class="form-label field-req">หน่วยงานผู้บังคับบัญชา</label><input class="form-control" id="discAgency" placeholder="ระบุหน่วยงานผู้ลงโทษ"></div>
              <div class="col-md-6"><label class="form-label field-req">ผู้ถูกกล่าวหา</label><input class="form-control" id="discAccused"></div>
              <div class="col-md-6"><label class="form-label field-req">ประเภทโทษทางวินัย</label>
                <select class="form-select" id="discPenalty">
                  <option value="">— เลือกประเภทโทษ —</option>
                  <option value="ภาคทัณฑ์">ภาคทัณฑ์</option>
                  <option value="ตัดเงินเดือน">ตัดเงินเดือน</option>
                  <option value="ลดเงินเดือน">ลดเงินเดือน</option>
                  <option value="ปลดออก">ปลดออก</option>
                  <option value="ไล่ออก">ไล่ออก</option>
                </select>
              </div>
              <div class="col-md-6"><label class="form-label field-req">กำหนดแจ้งผลกลับ (วัน)</label><input class="form-control" id="discDueDate" placeholder="เช่น ภายใน 30 วัน"></div>
              <div class="col-12"><label class="form-label field-req">พฤติการณ์ความผิดทางวินัย</label><textarea class="form-control" id="discMisconduct" rows="3"></textarea></div>
              <div class="col-12"><label class="form-label field-req">ฐานกฎหมายอ้างอิง</label><input class="form-control" id="discLawRef" placeholder="เช่น ม.38 แห่ง พ.ร.บ.มาตรการฯ"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-xl-6">
        <div style="position:sticky;top:calc(var(--topbar-h) + 14px)">
          <ul class="nav nav-tabs" id="docTabs">
            <li class="nav-item"><button class="nav-link active" data-doc="ruling">รายงานวินิจฉัยชี้มูล</button></li>
            <li class="nav-item"><button class="nav-link" data-doc="discipline">หนังสือลงโทษทางวินัย</button></li>
          </ul>
          <div class="doc-pane" style="border-radius:0 0 8px 8px">
            <div class="doc-toolbar">
              <span class="name"><i class="fa-solid fa-file-word"></i> <span id="docName"></span>
                <span class="badge-tpl">Mail-Merge</span></span>
              <button class="btn btn-sm btn-light" onclick="window.print()"><i class="fa-solid fa-print"></i></button>
            </div>
            <div class="doc-paper" id="docPaper"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="actionBarSlot"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/ecmis-app.js"></script>
  <script>
    ECMIS.renderShell('72-09-ruling-report.html');

    const params = new URLSearchParams(location.search);
    const kase = ECMIS.getCase(params.get('case') || '2015/2569');
    const role = ECMIS.currentRole();
    let docTab = 'ruling';

    document.getElementById('stBadge').innerHTML = `<span class="chip me-1">เลขสำนวน ${kase.id}</span>` + ECMIS.statusBadge(kase.status) + ' ' + ECMIS.slaBadge(kase);
    document.getElementById('stepper').innerHTML = ECMIS.stepperHtml(kase.status, ECMIS.FLOW_STEPS_72, ECMIS.STATUS_STEP_72);

    const mayView = ECMIS.canViewCase(kase, role.id);
    const mayEdit = ECMIS.canEditMaster(role.id) || ECMIS.can('doc.generate', role.id) || ECMIS.can('record.minutes', role.id);
    const maySign = ECMIS.can('sign.ruling', role.id) || role.id === 'chairman';

    if (!mayView) {
      document.getElementById('editGate').innerHTML = '<div class="mb-3"><strong><i class="fa-solid fa-eye-slash me-1"></i>บทบาทนี้ไม่มีสิทธิ์เข้าถึงสำนวนนี้</strong></div>';
    } else if (!mayEdit && !maySign) {
      document.getElementById('editGate').innerHTML = '<div class="mb-3"><strong><i class="fa-solid fa-lock me-1"></i>โหมดอ่านอย่างเดียว</strong> — บทบาทนี้ยังไม่สามารถจัดทำหรือลงนามรายงานได้</div>';
    }

    const res = ECMIS.resolution72(kase.resolution72 || 'GUILTY_72');
    document.getElementById('resolutionInfo').innerHTML = `
      <div class="rule pass"><i class="fa-solid fa-circle-check"></i><span><strong>มติที่ประชุม:</strong> ${res.label}</span></div>
      <div class="rule"><i class="fa-solid fa-scale-balanced"></i><span><strong>ฐานกฎหมาย:</strong> ${res.legalBasis}</span></div>
      <div class="rule"><i class="fa-solid fa-calendar-days"></i><span><strong>รอบรายงาน:</strong> ครั้งที่ ${kase.round72 || 1}</span></div>`;

    document.getElementById('meetNo').value = kase.meetingNo || '';
    document.getElementById('agendaNo').value = kase.agendaNo || '';
    document.getElementById('orderNo').value = kase.orderNo || '';

    document.getElementById('factSummary').value = kase.factSummary72 || kase.allegation || '';
    document.getElementById('legalAnalysis').value = kase.legalAnalysis72 || (res.legalBasis || '');
    document.getElementById('rulingText').value = kase.rulingText72 || `คณะกรรมการ ป.ป.ท. มีมติให้ดำเนินการตามแนวมติประเภท "${res.label}"`;

    document.getElementById('discAgency').value = kase.discAgency72 || kase.ownerOrg || '';
    document.getElementById('discAccused').value = kase.discAccused72 || (kase.accused[0] ? kase.accused[0].name : '');
    document.getElementById('discPenalty').value = kase.discPenalty72 || '';
    document.getElementById('discDueDate').value = kase.discDueDate72 || 'ภายใน 30 วัน';
    document.getElementById('discMisconduct').value = kase.discMisconduct72 || kase.allegation || '';
    document.getElementById('discLawRef').value = kase.discLawRef72 || 'ม.38 แห่ง พ.ร.บ.มาตรการฯ';

    const disciplineVisible = (kase.resolution72 || '') === 'GUILTY_72';
    document.getElementById('disciplineCard').classList.toggle('d-none', !disciplineVisible);

    function persistForm() {
      kase.meetingNo = document.getElementById('meetNo').value.trim();
      kase.agendaNo = document.getElementById('agendaNo').value.trim();
      kase.orderNo = document.getElementById('orderNo').value.trim();
      kase.factSummary72 = document.getElementById('factSummary').value.trim();
      kase.legalAnalysis72 = document.getElementById('legalAnalysis').value.trim();
      kase.rulingText72 = document.getElementById('rulingText').value.trim();
      kase.discAgency72 = document.getElementById('discAgency').value.trim();
      kase.discAccused72 = document.getElementById('discAccused').value.trim();
      kase.discPenalty72 = document.getElementById('discPenalty').value;
      kase.discDueDate72 = document.getElementById('discDueDate').value.trim();
      kase.discMisconduct72 = document.getElementById('discMisconduct').value.trim();
      kase.discLawRef72 = document.getElementById('discLawRef').value.trim();
      ECMIS.saveCases();
    }

    function renderDoc() {
      const M = ECMIS.mergeField;
      const meetNo = document.getElementById('meetNo').value.trim();
      const agendaNo = document.getElementById('agendaNo').value.trim();
      const orderNo = document.getElementById('orderNo').value.trim();
      const factSummary = document.getElementById('factSummary').value.trim();
      const legalAnalysis = document.getElementById('legalAnalysis').value.trim();
      const rulingText = document.getElementById('rulingText').value.trim();
      const discAgency = document.getElementById('discAgency').value.trim();
      const discAccused = document.getElementById('discAccused').value.trim();
      const discPenalty = document.getElementById('discPenalty').value;
      const discDueDate = document.getElementById('discDueDate').value.trim();
      const discMisconduct = document.getElementById('discMisconduct').value.trim();
      const discLawRef = document.getElementById('discLawRef').value.trim();

      if (docTab === 'ruling') {
        document.getElementById('docName').textContent = 'รายงานการไต่สวนวินิจฉัยชี้มูล';
        document.getElementById('docPaper').innerHTML = `
          <div class="doc-title">รายงานการไต่สวนวินิจฉัยชี้มูล</div>
          <div class="doc-sub">เลขสำนวน ${M(kase.id)} · ครั้งที่ประชุม ${M(meetNo)} · วาระที่ ${M(agendaNo)}</div>
          <div class="doc-row"><span class="k">เลขที่คำสั่ง/หนังสือ:</span> ${M(orderNo, 'ปปท .../...')}</div>
          <div class="doc-h">ข้อเท็จจริงและพยานหลักฐานสำคัญ</div>
          <div class="doc-indent">${M(factSummary)}</div>
          <div class="doc-h">ข้อกฎหมายที่ใช้วินิจฉัย</div>
          <div class="doc-indent">${M(legalAnalysis)}</div>
          <div class="doc-h">ข้อวินิจฉัยและคำสั่ง</div>
          <div class="doc-indent">${M(rulingText)}</div>
          <div class="doc-sign" style="margin-top:32px">
            <span class="doc-dots"></span><br>(นายวิชัย ยุติธรรม)<br>ประธานกรรมการ ป.ป.ท.
          </div>`;
      } else {
        document.getElementById('docName').textContent = 'หนังสือลงโทษทางวินัย';
        document.getElementById('docPaper').innerHTML = `
          <div class="doc-title">หนังสือลงโทษทางวินัย</div>
          <div class="doc-row"><span class="k">เลขที่:</span> ${M(orderNo, 'ปปท .../...')}</div>
          <div class="doc-row"><span class="k">เรียน:</span> ${M(discAgency)}</div>
          <div class="doc-indent" style="margin-top:10px">
            ตามที่คณะกรรมการ ป.ป.ท. มีมติวินิจฉัยชี้มูลความผิดทางวินัยในสำนวนเลขที่ ${M(kase.id)}
            เกี่ยวกับ ${M(discAccused)} เนื่องจาก ${M(discMisconduct)}
          </div>
          <div class="doc-indent" style="margin-top:8px">
            จึงขอให้หน่วยงานของท่านพิจารณาดำเนินการลงโทษทางวินัยประเภท ${M(discPenalty, 'ระบุประเภทโทษ')}
            โดยอาศัยฐานกฎหมาย ${M(discLawRef)} และแจ้งผลการดำเนินการกลับมายังสำนักงาน ป.ป.ท. ${M(discDueDate)}
          </div>
          <div class="doc-sign" style="margin-top:32px">
            <span class="doc-dots"></span><br>(นายวิชัย ยุติธรรม)<br>ประธานกรรมการ ป.ป.ท.
          </div>`;
      }
    }

    document.querySelectorAll('#docTabs .nav-link').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#docTabs .nav-link').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        docTab = btn.dataset.doc;
        renderDoc();
      });
    });

    ['meetNo', 'agendaNo', 'orderNo', 'factSummary', 'legalAnalysis', 'rulingText', 'discAgency', 'discAccused', 'discPenalty', 'discDueDate', 'discMisconduct', 'discLawRef']
      .forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', () => { persistForm(); renderDoc(); });
        el.addEventListener('change', () => { persistForm(); renderDoc(); });
      });

    function setNextStatusByResolution() {
      const code = kase.resolution72 || 'GUILTY_72';
      if (code === 'MORE_INVESTIGATE_72') {
        kase.status = 'PENDING_SECTION_72';
        kase.round72 = (kase.round72 || 1) + 1;
      } else if (code === 'NO_MERIT_72') {
        kase.status = 'PENDING_AREA_NOTICE_72';
      } else if (code === 'FORWARD_NACC') {
        kase.status = 'DISPATCHING_NACC_72';
      } else {
        kase.status = 'PENDING_DISPATCH_GUILTY_72';
      }
    }

    function renderActions() {
      const actions = [];
      if (mayEdit && kase.status === 'RESOLVED_PENDING_72') {
        actions.push('<button class="btn btn-sm btn-navy" id="btnDraftDone"><i class="fa-solid fa-file-circle-check me-1"></i>จัดทำรายงานวินิจฉัยชี้มูลเสร็จ</button>');
      }
      if (maySign && kase.status === 'PENDING_SIGN_RULING_72') {
        actions.push('<button class="btn btn-sm btn-success" id="btnSignRuling"><i class="fa-solid fa-signature me-1"></i>ลงนามรายงานวินิจฉัยชี้มูล</button>');
      }
      if (mayEdit || maySign) {
        actions.push('<button class="btn btn-sm btn-outline-secondary" id="btnSaveDraft"><i class="fa-solid fa-floppy-disk me-1"></i>บันทึกฉบับร่าง</button>');
      }

      const bar = `
        <div class="action-bar" id="caseActionBar">
          <div class="role-hint"><i class="fa-regular fa-user me-1"></i>บทบาทปัจจุบัน: <strong>${role.title}</strong></div>
          ${actions.join('') || '<div class="no-permission"><i class="fa-solid fa-lock me-1"></i>สถานะนี้ไม่มีการกระทำเพิ่มเติมสำหรับบทบาทนี้</div>'}
        </div>`;
      document.getElementById('actionBarSlot').innerHTML = bar;

      const btnSaveDraft = document.getElementById('btnSaveDraft');
      if (btnSaveDraft) btnSaveDraft.addEventListener('click', () => {
        persistForm();
        ECMIS.toastOk('บันทึกฉบับร่างเรียบร้อยแล้ว');
      });

      const btnDraftDone = document.getElementById('btnDraftDone');
      if (btnDraftDone) btnDraftDone.addEventListener('click', () => {
        persistForm();
        kase.status = 'PENDING_SIGN_RULING_72';
        ECMIS.saveCases();
        ECMIS.toastOk('ส่งรายงานเข้าสู่ขั้นตอนรอลงนามแล้ว');
        setTimeout(() => location.reload(), 500);
      });

      const btnSignRuling = document.getElementById('btnSignRuling');
      if (btnSignRuling) btnSignRuling.addEventListener('click', async () => {
        persistForm();
        const signed = await ECMIS.signDialog('รายงานวินิจฉัยชี้มูล', ECMIS.getRole('chairman').name);
        if (!signed.isConfirmed) return;

        kase.signedRulingAt = new Date().toISOString().slice(0, 10);
        setNextStatusByResolution();
        ECMIS.saveCases();
        ECMIS.toastOk('ลงนามรายงานเรียบร้อยแล้ว');
        setTimeout(() => { location.href = '02-case-register.html'; }, 550);
      });
    }

    renderDoc();
    renderActions();
  </script>
</body>

</html>
