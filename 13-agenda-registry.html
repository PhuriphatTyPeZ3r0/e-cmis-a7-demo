<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทะเบียนวาระการประชุม | E-CMIS</title>
  <link rel="icon" type="image/png" href="pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="assets/ecmis-app.css" rel="stylesheet">
  <style>
    .meet-badge{display:inline-flex;align-items:center;padding:.2rem .55rem;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
    .meet-scheduled{color:#174e80;background:#e3edf9}
    .meet-active{color:#1e6141;background:#dff0e7}
    .meet-cancel{color:#8c261f;background:#f9e1df}
    .meet-confirmed{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .5rem;border-radius:999px;font-size:.68rem;font-weight:600;color:#1e6141;background:#dff0e7;margin-left:.4rem}
    .meet-row{cursor:pointer}
    #meetTb tr:hover{background:var(--table-row-hover)}
    .swal2-popup .form-label{font-size:.82rem;font-weight:600;margin-bottom:.25rem;display:block;text-align:left}
  </style>
</head>

<body>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-calendar-days me-2"></i>ทะเบียนวาระการประชุม</h1>
      </div>
      <span class="flow-ref ms-auto">สืบค้นและติดตามวาระการประชุมคณะกรรมการ ป.ป.ท. ทุกครั้ง</span>
    </div>

    <div id="editGate"></div>

    <div class="card card-ecmis">
      <div class="card-header">
        <i class="fa-solid fa-calendar-check"></i> ครั้งที่ประชุม
        <span class="badge bg-secondary rounded-pill ms-2" id="meetCnt">0</span>
        <button class="btn btn-sm btn-navy ms-auto" id="btnAddMeeting"><i class="fa-solid fa-plus me-1"></i>เพิ่มการประชุม</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover tbl-ecmis mb-0" id="meetingList">
            <thead>
              <tr>
                <th class="meet-sortable" data-sort-key="name" style="cursor:pointer;user-select:none">ครั้งที่ประชุม <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th class="meet-sortable" data-sort-key="date" style="cursor:pointer;user-select:none">วันที่ <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th class="meet-sortable text-center" data-sort-key="count" style="cursor:pointer;user-select:none">จำนวนวาระ <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th class="meet-sortable" data-sort-key="status" style="cursor:pointer;user-select:none">สถานะ <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th style="width:40px"></th>
              </tr>
            </thead>
            <tbody id="meetTb"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/ecmis-app.js"></script>
  <script src="assets/agenda-registry-data.js"></script>
  <script>
    ECMIS.renderShell('13-agenda-registry.html');
    const M = ECMIS.mergeField;
    const AR = AgendaRegistry;
    const role = ECMIS.currentRole();
    const mayEdit = ECMIS.can('create.agenda', role.id);

    if (!mayEdit) {
      document.getElementById('editGate').innerHTML = `
    <div class="alert alert-light border mb-3" style="font-size:.85rem">
      <strong><i class="fa-solid fa-lock me-1"></i>โหมดอ่านอย่างเดียว — บทบาทนี้เพิ่มการประชุมไม่ได้</strong><br>
      สิทธิ์ <strong>จัดทำระเบียบวาระการประชุม (create.agenda)</strong> จำกัดเฉพาะ
      <strong>${ECMIS.getRole('board_sec').title}</strong> — ยังคงดูทะเบียนได้ตามปกติ
    </div>`;
      document.getElementById('btnAddMeeting').disabled = true;
    }

    let meetSortKey = 'name';
    let meetSortDir = 'desc';
    function meetNameKey(m) {
      const parts = String(m.trc_name).split('/');
      return (parseInt(parts[1], 10) || 0) * 1000 + (parseInt(parts[0], 10) || 0);
    }
    const MEET_SORT_FNS = {
      name: meetNameKey,
      date: m => m.trc_date,
      count: m => AR.itemsOf(m.trc_id).length,
      status: m => parseInt(m.trc_status, 10) || 0
    };
    function updateMeetSortIcons() {
      document.querySelectorAll('.meet-sortable').forEach(th => {
        const icon = th.querySelector('.sort-icon');
        if (th.dataset.sortKey === meetSortKey) {
          icon.className = `fa-solid ms-1 sort-icon ${meetSortDir === 'desc' ? 'fa-sort-down' : 'fa-sort-up'}`;
        } else {
          icon.className = 'fa-solid fa-sort ms-1 sort-icon';
        }
      });
    }
    document.querySelectorAll('.meet-sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sortKey;
        if (meetSortKey === key) { meetSortDir = meetSortDir === 'desc' ? 'asc' : 'desc'; }
        else { meetSortKey = key; meetSortDir = 'desc'; }
        updateMeetSortIcons();
        renderMeetingList();
      });
    });
    updateMeetSortIcons();

    function renderMeetingList() {
      const tbody = document.getElementById('meetTb');
      document.getElementById('meetCnt').textContent = AR.MEETINGS.length;
      const keyFn = MEET_SORT_FNS[meetSortKey];
      const sorted = [...AR.MEETINGS].sort((a, b) => {
        const ka = keyFn(a), kb = keyFn(b);
        const cmp = ka < kb ? -1 : ka > kb ? 1 : 0;
        return meetSortDir === 'desc' ? -cmp : cmp;
      });
      tbody.innerHTML = sorted.map(m => {
        const count = AR.itemsOf(m.trc_id).length;
        return `
      <tr class="meet-row" data-id="${m.trc_id}">
        <td class="fw-semibold">${m.trc_name}</td>
        <td>${ECMIS.thaiDate(m.trc_date)}</td>
        <td class="text-center">${count}</td>
        <td><span class="meet-badge ${AR.STATUS_CLASS[m.trc_status] || 'meet-scheduled'}">${AR.STATUS_LABEL[m.trc_status] || 'กำหนดการแล้ว — รอประชุม'}</span>
          ${m.trc_confirmed ? '<span class="meet-confirmed"><i class="fa-solid fa-check"></i>จัดวาระแล้ว</span>' : ''}</td>
        <td class="text-end"><i class="fa-solid fa-chevron-right text-muted"></i></td>
      </tr>`;
      }).join('');
      tbody.querySelectorAll('.meet-row').forEach(tr =>
        tr.addEventListener('click', () => { location.href = `14-agenda-registry-detail.html?meet=${tr.dataset.id}`; }));
    }

    function nextMeetName() {
      const buddhistYear = new Date().getFullYear() + 543;
      const maxNo = AR.MEETINGS.reduce((max, m) => {
        const parts = String(m.trc_name).split('/');
        const no = parseInt(parts[0], 10) || 0;
        const yr = parseInt(parts[1], 10) || 0;
        return yr === buddhistYear && no > max ? no : max;
      }, 0);
      return `${maxNo + 1}/${buddhistYear}`;
    }

    document.getElementById('btnAddMeeting').addEventListener('click', () => {
      Swal.fire({
        title: 'เพิ่มการประชุมใหม่',
        html: `
          <div class="mb-2"><label class="form-label">ครั้งที่ประชุม *</label>
            <input type="text" id="swMeetName" class="form-control" value="${nextMeetName()}" placeholder="เช่น 56/2569"></div>
          <div class="mb-2"><label class="form-label">วันที่ประชุม *</label>
            <input type="date" id="swMeetDate" class="form-control"></div>
          <div><label class="form-label">สถานะ</label>
            <select id="swMeetStatus" class="form-select">
              <option value="0" selected>กำหนดการแล้ว — รอประชุม</option>
              <option value="1">ประชุมแล้ว</option>
              <option value="2">ยกเลิก/เลื่อน</option>
            </select></div>`,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#0F2A62',
        preConfirm: () => {
          const name = document.getElementById('swMeetName').value.trim();
          const dateInput = document.getElementById('swMeetDate').value;
          if (!name || !dateInput) { Swal.showValidationMessage('กรุณากรอกครั้งที่ประชุมและวันที่ประชุมให้ครบถ้วน'); return false; }
          if (AR.MEETINGS.some(m => m.trc_name === name)) { Swal.showValidationMessage('มีครั้งที่ประชุมนี้อยู่แล้วในทะเบียน'); return false; }
          /* <input type="date"> คืนค่าปี ค.ศ. จริงเสมอ แต่ trc_date ทั้งระบบเก็บเป็นปี พ.ศ. (fake-ISO)
             ต้อง +543 ก่อนบันทึก ไม่เช่นนั้น ECMIS.thaiDate() จะโชว์ปีเป็น ค.ศ. ปนกับรายการอื่นที่เป็น พ.ศ. */
          const [y, m, d] = dateInput.split('-');
          const date = `${parseInt(y, 10) + 543}-${m}-${d}`;
          return { name, date, status: document.getElementById('swMeetStatus').value };
        }
      }).then(res => {
        if (!res.isConfirmed) return;
        const trc_id = AR.nextTrcId();
        AR.MEETINGS.push({ trc_id, trc_name: res.value.name, trc_date: res.value.date, trc_status: res.value.status, trc_secrecy: 'SECRET', trc_confirmed: false });
        AR.save();
        ECMIS.toastOk(`เพิ่มการประชุมครั้งที่ ${res.value.name} เรียบร้อย — กำลังเปิดหน้ารายละเอียด`);
        setTimeout(() => { location.href = `14-agenda-registry-detail.html?meet=${trc_id}`; }, 700);
      });
    });

    renderMeetingList();
  </script>
</body>

</html>
