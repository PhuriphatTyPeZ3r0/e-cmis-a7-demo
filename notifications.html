<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบการแจ้งเตือน | E-CMIS</title>
  <link rel="icon" type="image/png" href="assets/pacc_logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/ecmis-app.css" rel="stylesheet">
  <style>
    .notification-row{border-left:4px solid transparent;transition:.15s;background:#fff}
    .notification-row.unread{border-left-color:#dc3545;background:#fffdf7}
    .notification-row:hover{background:#f8fafc}
    .notification-type{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;flex:none}
    .receipt-panel{background:#f8fafc;border:1px solid #dbe3ed;border-radius:10px}
    .receipt-row{display:flex;justify-content:space-between;gap:1rem;padding:.45rem 0;border-bottom:1px dashed #dbe3ed}
    .receipt-row:last-child{border-bottom:0}
  </style>
</head>
<body>
  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-bell me-2"></i>ระบบการแจ้งเตือน</h1>
        <p class="text-muted mb-0">ประวัติการส่ง การเปิดอ่าน และหลักฐาน Read Receipt แยกตามบัญชีผู้รับ</p>
      </div>
      <div class="ms-auto d-flex gap-2">
        <span class="badge bg-secondary-subtle text-secondary border align-self-center" id="notificationDataSource"><i class="fa-solid fa-database me-1"></i>กำลังเชื่อมต่อฐานข้อมูล</span>
        <button class="btn btn-sm btn-navy" data-filter="unread">ยังไม่ได้อ่าน <span class="badge bg-danger ms-1" id="unreadCount">0</span></button>
        <button class="btn btn-sm btn-outline-secondary" data-filter="all">ทั้งหมด</button>
      </div>
    </div>
    <div class="row g-3">
      <div class="col-xl-7">
        <div class="card card-ecmis"><div class="card-header fw-semibold">รายการแจ้งเตือน</div><div class="list-group list-group-flush" id="notificationList"></div></div>
      </div>
      <div class="col-xl-5">
        <div class="card card-ecmis"><div class="card-header fw-semibold">หลักฐานการแจ้งเตือนของสำนวน</div><div class="card-body" id="notificationEvidence"><div class="text-muted text-center py-5">เลือกรายการเพื่อดูรายละเอียด</div></div></div>
      </div>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/ecmis-app.js"></script>
  <script>
    ECMIS.renderShell('notifications.html');
    const user = ECMIS.currentRole();
    let filter = 'unread';
    let selectedId = new URLSearchParams(location.search).get('notification') || '';
    const typeMeta = {
      AGENDA_PLACED:['บรรจุวาระ','fa-calendar-check','bg-primary text-white'],
      AGENDA_REMINDER:['เตือนก่อนประชุม','fa-clock','bg-warning text-dark'],
      RESOLUTION_DISPATCHED:['ส่งมติ','fa-scale-balanced','bg-success text-white'],
      DISCIPLINE_SENT_ACTIVITY8:['หนังสือวินัย กจ.8','fa-file-shield','bg-info text-dark'],
      CASE_DEADLINE:['ใกล้ครบกำหนด','fa-triangle-exclamation','bg-danger text-white']
    };
    const fmt = value => value ? new Date(value).toLocaleString('th-TH') : 'ยังไม่ได้อ่าน';
    const esc = value => ECMIS.escapeHtml(String(value || ''));

    function evidence(item){
      if(!item){ document.getElementById('notificationEvidence').innerHTML='<div class="text-muted text-center py-5">เลือกรายการเพื่อดูรายละเอียด</div>'; return; }
      const events = ECMIS.NotificationStore.historyForCase(item.caseId);
      document.getElementById('notificationEvidence').innerHTML = `
        <h5 class="text-navy">สำนวน ${esc(item.caseId)}</h5>
        <p class="mb-3">${esc(item.body)}</p>
        ${events.map(event => `<div class="receipt-panel p-3 mb-2"><div class="fw-semibold mb-2">${esc(event.title)} <small class="text-muted">${fmt(event.deliveredAt)}</small></div>
          ${event.recipientIds.map(id => { const r=ECMIS.getRole(id); const receipt=event.receipts[id]; return `<div class="receipt-row"><span>${esc(r.title)}<br><small class="text-muted">${esc(r.name)}</small></span><span class="text-end ${receipt?'text-success':'text-danger'}">${receipt?'<i class="fa-solid fa-check-double me-1"></i>อ่านแล้ว':'ยังไม่ได้อ่าน'}<br><small>${receipt?fmt(receipt):''}</small></span></div>`; }).join('')}
        </div>`).join('')}`;
    }
    function render(){
      ECMIS.NotificationStore.ensureDueAgendaReminders();
      const all=ECMIS.NotificationStore.listFor(user.id);
      const items=filter==='unread'?all.filter(n=>!n.readAt):all;
      document.getElementById('unreadCount').textContent=all.filter(n=>!n.readAt).length;
      document.getElementById('notificationList').innerHTML=items.length?items.map(n=>{const m=typeMeta[n.type]||['แจ้งเตือน','fa-bell','bg-secondary text-white'];const sender=ECMIS.getRole(n.senderId);return `
        <button type="button" class="list-group-item list-group-item-action notification-row ${n.readAt?'':'unread'}" data-id="${n.id}">
          <div class="d-flex gap-3 align-items-start"><span class="notification-type ${m[2]}"><i class="fa-solid ${m[1]}"></i></span><div class="flex-grow-1"><div class="d-flex justify-content-between gap-2"><strong>${esc(n.title)}</strong><span class="badge ${n.readAt?'bg-success-subtle text-success':'bg-danger'}">${n.readAt?'อ่านแล้ว':'ยังไม่ได้อ่าน'}</span></div><div class="text-muted small">${esc(n.body)}</div><div class="small mt-1"><span class="badge bg-light text-dark border">${m[0]}</span> <span class="text-muted">สำนวน ${esc(n.caseId)} · ผู้ส่ง ${esc(sender.name)} · ส่ง ${fmt(n.deliveredAt)}${n.readAt?` · อ่าน ${fmt(n.readAt)}`:''}</span></div></div></div>
        </button>`}).join(''):'<div class="text-muted text-center py-5">ไม่มีรายการในหมวดนี้</div>';
      document.querySelectorAll('[data-id]').forEach(btn=>btn.addEventListener('click',()=>{ selectedId=btn.dataset.id; ECMIS.NotificationStore.markRead(selectedId,user.id); render(); }));
      const selected=ECMIS.NotificationStore.listFor(user.id).find(n=>n.id===selectedId);
      evidence(selected);
      const badge=document.getElementById('notifBadge'); if(badge){const count=ECMIS.NotificationStore.unreadCount(user.id);badge.textContent=count;badge.classList.toggle('d-none',count===0);badge.style.display=count===0?'none':'inline-flex';}
    }
    document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;render();}));
    render();
    ECMIS.NotificationStore.hydrate().then(connected => {
      const source=document.getElementById('notificationDataSource');
      source.className=`badge border align-self-center ${connected?'bg-success-subtle text-success':'bg-warning-subtle text-warning-emphasis'}`;
      source.innerHTML=connected?'<i class="fa-solid fa-database me-1"></i>ข้อมูลจากฐานข้อมูล':'<i class="fa-solid fa-hard-drive me-1"></i>โหมดสำรองในเครื่อง';
      ECMIS.NotificationStore.ensureDueAgendaReminders();
      render();
    });
    window.addEventListener('ecmis:notifications-updated', render);
  </script>
</body>
</html>
