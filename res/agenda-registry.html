<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทะเบียนวาระการประชุม | E-CMIS</title>
  <link rel="icon" type="image/png" href="../pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/ecmis-app.css" rel="stylesheet">
  <style>
    .meet-badge{display:inline-flex;align-items:center;padding:.2rem .55rem;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
    .meet-scheduled{color:#174e80;background:#e3edf9}
    .meet-active{color:#1e6141;background:#dff0e7}
    .meet-cancel{color:#8c261f;background:#f9e1df}
    .meet-confirmed{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .5rem;border-radius:999px;font-size:.68rem;font-weight:600;color:#1e6141;background:#dff0e7;margin-left:.4rem}
    .meet-row{cursor:pointer}
    #meetTb tr:hover{background:var(--table-row-hover)}
    .meet-row-actions{display:inline-flex;align-items:center;gap:.6rem}
    .btn-delete-meet{border:0;background:none;color:#a5322a;padding:0;cursor:pointer;line-height:1;font-size:.9rem}
    .btn-delete-meet:hover{color:#7a241f}
    .swal2-popup .form-label{font-size:.82rem;font-weight:600;margin-bottom:.25rem;display:block;text-align:left}
  </style>
</head>

<body>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-calendar-days me-2"></i>ทะเบียนวาระการประชุม</h1>
      </div>
      <span class="flow-ref ms-auto">สืบค้นและติดตามวาระการประชุมคณะกรรมการ ป.ป.ท. ทุกครั้ง</span>
    </div>

    <div id="editGate"></div>

    <div class="card card-ecmis mb-4">
      <div class="card-body p-3 pb-2">
        <label class="form-label fw-semibold text-dark small mb-2"><i class="fa-solid fa-layer-group me-1 text-muted"></i>คิวรอบรรจุวาระ — จัดหมวดตามลักษณะงาน</label>
        <div class="d-flex flex-wrap gap-2" id="categoryChips"></div>
        <div class="table-responsive mt-2 d-none" id="queueTableWrap">
          <table class="table table-hover tbl-ecmis mb-0" style="font-size:.85rem">
            <thead>
              <tr>
                <th>เรื่องที่</th>
                <th>เรื่องกล่าวหา</th>
                <th>สถานะ</th>
                <th class="text-end">ดำเนินการ</th>
              </tr>
            </thead>
            <tbody id="queueTb"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card card-ecmis">
      <div class="card-header">
        <i class="fa-solid fa-calendar-check"></i> ครั้งที่ประชุม
        <span class="badge bg-secondary rounded-pill ms-2" id="meetCnt">0</span>
        <button class="btn btn-sm btn-navy ms-auto" id="btnAddMeeting"><i class="fa-solid fa-plus me-1"></i>เพิ่มการประชุม</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover tbl-ecmis mb-0" id="meetingList">
            <thead>
              <tr>
                <th class="meet-sortable" data-sort-key="name" style="cursor:pointer;user-select:none">ครั้งที่ประชุม <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th class="meet-sortable" data-sort-key="date" style="cursor:pointer;user-select:none">วันที่ <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th class="meet-sortable text-center" data-sort-key="count" style="cursor:pointer;user-select:none">จำนวนวาระ <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th class="meet-sortable" data-sort-key="status" style="cursor:pointer;user-select:none">สถานะ <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th style="width:170px"></th>
              </tr>
            </thead>
            <tbody id="meetTb"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../assets/ecmis-app.js"></script>
  <script src="../assets/agenda-registry-data.js"></script>
  <script>
    ECMIS.renderShell('agenda-registry.html');
    const M = ECMIS.mergeField;
    const AR = AgendaRegistry;
    const role = ECMIS.currentRole();
    const mayEdit = ECMIS.can('create.agenda', role.id);

    if (!mayEdit) {
      document.getElementById('editGate').innerHTML = `
    <div class="alert alert-light border mb-3" style="font-size:.85rem">
      <strong><i class="fa-solid fa-lock me-1"></i>โหมดอ่านอย่างเดียว — บทบาทนี้เพิ่มการประชุมไม่ได้</strong><br>
      สิทธิ์ <strong>จัดทำระเบียบวาระการประชุม (create.agenda)</strong> จำกัดเฉพาะ
      <strong>${ECMIS.getRole('board_sec').title}</strong> — ยังคงดูทะเบียนได้ตามปกติ
    </div>`;
      document.getElementById('btnAddMeeting').disabled = true;
    }

    /* คิวรอบรรจุวาระ — เดิมอยู่ที่ 08-resolution-inbox.html แต่ concept นี้ (สำนวนที่รอถูกจัดวาระ
       ยังไม่ใช่รายการมติที่บันทึกแล้ว) เข้ากับหน้าทะเบียนวาระนี้มากกว่า จึงย้ายมาไว้ที่นี่ — สถานะที่ใช้
       จัดหมวดอ้างจาก STATUS map จริง (ecmis-app.js): AGENDA_SET/PENDING_INVITE_72 = รอดำเนินการที่
       10-agenda-set.html, DEFERRED = เคยตีกลับ/เลื่อนวาระ รอเลขวาระใหม่ */
    /* ใช้ AR.sb (client เดียวกับที่ agenda-registry-data.js สร้างไว้แล้ว) แทนการสร้าง client
       ใหม่ซ้ำ — กันคำเตือน "Multiple GoTrueClient instances" เมื่อหน้าเดียวกันมีหลาย client */
    const QUEUE_BUCKET = {
      pending:  ['AGENDA_SET', 'PENDING_INVITE_72'],
      rework:   ['MORE_INFO', 'DEFERRED'],
      returned: ['RETURNED', 'ROUND_REWORK']
    };
    let queueCases = [];
    let categoryFilterVal = 'ALL';

    async function loadQueueCasesFromSupabase() {
      try {
        const wantedCodes = [...QUEUE_BUCKET.pending, ...QUEUE_BUCKET.rework, ...QUEUE_BUCKET.returned]
          .map(k => ECMIS.STATUS_CODE[k]).filter(Boolean);
        const { data, error } = await AR.sb
          .from('tbl_res_request')
          .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
          .in('trr_status', wantedCodes)
          .eq('is_deleted', false);
        if (error) throw error;
        const mapped = (data || []).map(ECMIS.supabaseRowToCase).filter(Boolean)
          .filter(c => ECMIS.canViewCase(c, role.id))
          .filter(c => !AR.LINKED_TRR_IDS.has(c.trr_id));
        if (mapped.length) return mapped;
      } catch (err) {
        console.warn('โหลดคิวจาก Supabase ไม่สำเร็จ ใช้รายการสำนวนจำลอง:', err);
      }

      // Fallback จาก ECMIS.CASES ให้มีครบทุกหมวดพร้อม Demo
      return ECMIS.CASES.filter(c => {
        return ['AGENDA_SET', 'PENDING_INVITE_72', 'DEFERRED', 'RETURNED', 'SUBCOMMITTEE_DONE'].includes(c.status) || c.urgent || c.urgent72;
      }).map(c => Object.assign({}, c));
    }

    function getQueueCaseCategory(c) {
      if (c.urgent || c.urgent72) return 'URGENT';
      if (c.status === 'RETURNED' || c.status === 'ROUND_REWORK') return 'RETURN';
      if (QUEUE_BUCKET.rework.includes(c.status) || c.status === 'DEFERRED') return 'REWORK';
      return 'NEW';
    }

    function renderCategoryChips() {
      const counts = { URGENT: 0, REWORK: 0, RETURN: 0, NEW: 0 };
      queueCases.forEach(c => { const cat = getQueueCaseCategory(c); if (counts[cat] !== undefined) counts[cat]++; });
      const chips = [
        { id: 'ALL', l: 'ทั้งหมด', i: 'fa-list', c: '#0F2A62', n: queueCases.length },
        { id: 'NEW', l: 'เรื่องใหม่', i: 'fa-file-circle-plus', c: '#0F2A62', n: counts.NEW },
        { id: 'REWORK', l: 'เรื่องทำเพิ่ม', i: 'fa-rotate-left', c: '#D0A830', n: counts.REWORK },
        { id: 'RETURN', l: 'กลับมาอีก', i: 'fa-arrows-rotate', c: '#6b3fa0', n: counts.RETURN },
        { id: 'URGENT', l: 'เรื่องเร่งด่วน', i: 'fa-bolt', c: '#DB2626', n: counts.URGENT }
      ];
      document.getElementById('categoryChips').innerHTML = chips.map(k => {
        const active = categoryFilterVal === k.id;
        return `<button type="button" class="btn btn-sm ${active ? '' : 'btn-outline-secondary'}"
            style="${active ? `background:${k.c};border-color:${k.c};color:#fff` : ''}"
            onclick="setCategoryFilter('${k.id}')">
          <i class="fa-solid ${k.i} me-1"></i>${k.l}
          <span class="badge ${active ? 'bg-light text-dark' : 'bg-secondary'} ms-1">${k.n}</span>
        </button>`;
      }).join('');
    }

    function renderQueueTable() {
      const wrap = document.getElementById('queueTableWrap');
      const tbody = document.getElementById('queueTb');
      const filtered = categoryFilterVal === 'ALL'
        ? queueCases
        : queueCases.filter(c => getQueueCaseCategory(c) === categoryFilterVal);
      if (!filtered.length) { wrap.classList.add('d-none'); tbody.innerHTML = ''; return; }
      wrap.classList.remove('d-none');
      tbody.innerHTML = filtered.map(c => {
        const is72 = ECMIS.isCase72(c);
        const target = is72 ? ECMIS.pageForCase72(c) : 'agenda-set.html';
        const cat = getQueueCaseCategory(c);
        const catBadge = cat === 'URGENT' ? '<span class="badge bg-danger ms-1">เร่งด่วน</span>'
          : cat === 'REWORK' ? '<span class="badge bg-warning text-dark ms-1">ทำเพิ่ม</span>'
          : cat === 'RETURN' ? '<span class="badge bg-purple text-white ms-1" style="background:#6b3fa0">กลับมาอีก</span>'
          : '<span class="badge bg-primary ms-1">เรื่องใหม่</span>';

        return `<tr>
          <td class="case-no">${c.id} ${catBadge}</td>
          <td class="text-truncate" style="max-width:320px">${c.subject}</td>
          <td>${ECMIS.statusBadge(c.status)}</td>
          <td class="text-end">
            <a href="${target}?case=${encodeURIComponent(c.id)}" class="btn btn-sm btn-navy px-3">
              <i class="fa-solid fa-pen-to-square me-1"></i>บรรจุวาระ
            </a>
          </td>
        </tr>`;
      }).join('');
    }

    function setCategoryFilter(id) {
      categoryFilterVal = id;
      renderCategoryChips();
      renderQueueTable();
    }

    /* ต้องรอ AR.ready ก่อนเสมอ — AR.LINKED_TRR_IDS (ใช้กรองเรื่องที่บรรจุวาระไปแล้วจริงออกจากคิว)
       ถูก populate ระหว่าง AR.ready เท่านั้น ถ้าเรียกคิวก่อนจะกรองซ้ำไม่ได้ (เห็นเรื่องซ้ำในคิว) */
    AR.ready.then(loadQueueCasesFromSupabase).then(cases => {
      queueCases = cases;
      renderCategoryChips();
      renderQueueTable();
    }).catch(err => {
      console.error('โหลดคิวรอบรรจุวาระไม่สำเร็จ:', err);
      ECMIS.toastWarn('โหลดคิวรอบรรจุวาระไม่สำเร็จ');
    });

    let meetSortKey = 'name';
    let meetSortDir = 'desc';
    function meetNameKey(m) {
      const parts = String(m.trc_name).split('/');
      return (parseInt(parts[1], 10) || 0) * 1000 + (parseInt(parts[0], 10) || 0);
    }
    const MEET_SORT_FNS = {
      name: meetNameKey,
      date: m => m.trc_date,
      count: m => AR.itemsOf(m.trc_id).length,
      status: m => parseInt(m.trc_status, 10) || 0
    };
    function updateMeetSortIcons() {
      document.querySelectorAll('.meet-sortable').forEach(th => {
        const icon = th.querySelector('.sort-icon');
        if (th.dataset.sortKey === meetSortKey) {
          icon.className = `fa-solid ms-1 sort-icon ${meetSortDir === 'desc' ? 'fa-sort-down' : 'fa-sort-up'}`;
        } else {
          icon.className = 'fa-solid fa-sort ms-1 sort-icon';
        }
      });
    }
    document.querySelectorAll('.meet-sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sortKey;
        if (meetSortKey === key) { meetSortDir = meetSortDir === 'desc' ? 'asc' : 'desc'; }
        else { meetSortKey = key; meetSortDir = 'desc'; }
        updateMeetSortIcons();
        renderMeetingList();
      });
    });
    updateMeetSortIcons();

    function renderMeetingList() {
      const tbody = document.getElementById('meetTb');
      document.getElementById('meetCnt').textContent = AR.MEETINGS.length;
      const keyFn = MEET_SORT_FNS[meetSortKey];
      const sorted = [...AR.MEETINGS].sort((a, b) => {
        const ka = keyFn(a), kb = keyFn(b);
        const cmp = ka < kb ? -1 : ka > kb ? 1 : 0;
        return meetSortDir === 'desc' ? -cmp : cmp;
      });
      tbody.innerHTML = sorted.map(m => {
        const count = AR.itemsOf(m.trc_id).length;
        return `
      <tr class="meet-row" data-id="${m.trc_id}">
        <td class="fw-semibold">${m.trc_name}</td>
        <td>${ECMIS.thaiDate(m.trc_date)}</td>
        <td class="text-center">${count}</td>
        <td><span class="meet-badge ${AR.STATUS_CLASS[m.trc_status] || 'meet-scheduled'}">${AR.STATUS_LABEL[m.trc_status] || 'กำหนดการแล้ว — รอประชุม'}</span>
          ${m.trc_confirmed ? '<span class="meet-confirmed"><i class="fa-solid fa-check"></i>จัดวาระแล้ว</span>' : ''}</td>
        <td class="text-end">
          <span class="meet-row-actions">
            ${mayEdit ? `<button type="button" class="btn-delete-meet" data-id="${m.trc_id}" data-name="${m.trc_name}" title="ลบครั้งที่ประชุมนี้"><i class="fa-solid fa-trash-can"></i></button>` : ''}
            <button type="button" class="btn btn-sm btn-navy px-3 btn-open-meet" data-id="${m.trc_id}">
              <i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ
            </button>
          </span>
        </td>
      </tr>`;
      }).join('');
      tbody.querySelectorAll('.meet-row').forEach(tr =>
        tr.addEventListener('click', () => { location.href = `14-agenda-registry-detail.html?meet=${tr.dataset.id}`; }));
      tbody.querySelectorAll('.btn-open-meet').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        location.href = `14-agenda-registry-detail.html?meet=${btn.dataset.id}`;
      }));
      tbody.querySelectorAll('.btn-delete-meet').forEach(btn => btn.addEventListener('click', async e => {
        e.stopPropagation();
        const trcId = +btn.dataset.id;
        const name = btn.dataset.name;
        const confirmed = await ECMIS.confirmAction({
          title: `ลบครั้งที่ประชุม ${name}?`,
          html: 'ระบบจะซ่อนรายการนี้ออกจากทะเบียน (ข้อมูลยังอยู่ในฐานข้อมูล) เผื่อกรณีต้องการสร้างครั้งที่ประชุมใหม่แทน',
          confirmText: 'ลบ', danger: true
        });
        if (!confirmed.isConfirmed) return;
        try {
          await AR.deleteMeeting(trcId);
        } catch (err) {
          console.error('ลบครั้งที่ประชุมไม่สำเร็จ:', err);
          ECMIS.toastWarn('ลบไม่สำเร็จ ลองใหม่อีกครั้ง');
          return;
        }
        ECMIS.toastOk(`ลบครั้งที่ประชุม ${name} เรียบร้อย`);
        renderMeetingList();
      }));
    }

    function nextMeetName() {
      const buddhistYear = new Date().getFullYear() + 543;
      const maxNo = AR.MEETINGS.reduce((max, m) => {
        const parts = String(m.trc_name).split('/');
        const no = parseInt(parts[0], 10) || 0;
        const yr = parseInt(parts[1], 10) || 0;
        return yr === buddhistYear && no > max ? no : max;
      }, 0);
      return `${maxNo + 1}/${buddhistYear}`;
    }

    document.getElementById('btnAddMeeting').addEventListener('click', () => {
      Swal.fire({
        title: 'เพิ่มการประชุมใหม่',
        html: `
          <div class="mb-2"><label class="form-label">ครั้งที่ประชุม *</label>
            <input type="text" id="swMeetName" class="form-control" value="${nextMeetName()}" placeholder="เช่น 56/2569"></div>
          <div class="mb-2"><label class="form-label">วันที่ประชุม *</label>
            <input type="date" id="swMeetDate" class="form-control"></div>
          <div class="row g-2 mb-2">
            <div class="col-6"><label class="form-label">เวลาเริ่มประชุม</label>
              <input type="time" id="swMeetStartTime" class="form-control"></div>
            <div class="col-6"><label class="form-label">เวลาสิ้นสุดประชุม</label>
              <input type="time" id="swMeetEndTime" class="form-control"></div>
          </div>
          <div><label class="form-label">สถานะ</label>
            <select id="swMeetStatus" class="form-select">
              <option value="0" selected>กำหนดการแล้ว — รอประชุม</option>
              <option value="1">ประชุมแล้ว</option>
              <option value="2">ยกเลิก/เลื่อน</option>
            </select></div>`,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#0F2A62',
        preConfirm: () => {
          const name = document.getElementById('swMeetName').value.trim();
          const dateInput = document.getElementById('swMeetDate').value;
          if (!name || !dateInput) { Swal.showValidationMessage('กรุณากรอกครั้งที่ประชุมและวันที่ประชุมให้ครบถ้วน'); return false; }
          if (AR.MEETINGS.some(m => m.trc_name === name)) { Swal.showValidationMessage('มีครั้งที่ประชุมนี้อยู่แล้วในทะเบียน'); return false; }
          /* <input type="date"> คืนค่าปี ค.ศ. จริงเสมอ ซึ่งตรงกับคอลัมน์ trc_date (type DATE)
             ใน Supabase พอดี — ไม่ต้อง +543 อีกต่อไป (AgendaRegistry แปลงเป็น พ.ศ. ให้เองตอนอ่าน) */
          return {
            name, date: dateInput, status: document.getElementById('swMeetStatus').value,
            startTime: document.getElementById('swMeetStartTime').value,
            endTime: document.getElementById('swMeetEndTime').value
          };
        }
      }).then(async res => {
        if (!res.isConfirmed) return;
        let meeting;
        try {
          meeting = await AR.addMeeting({
            trc_name: res.value.name, trc_date: res.value.date, trc_status: res.value.status,
            trc_start_time: res.value.startTime, trc_end_time: res.value.endTime
          });
        } catch (err) {
          console.error('เพิ่มการประชุมไม่สำเร็จ:', err);
          ECMIS.toastWarn('บันทึกลงฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
          return;
        }
        ECMIS.toastOk(`เพิ่มการประชุมครั้งที่ ${res.value.name} เรียบร้อย — กำลังเปิดหน้ารายละเอียด`);
        setTimeout(() => { location.href = `14-agenda-registry-detail.html?meet=${meeting.trc_id}`; }, 700);
      });
    });

    AR.ready.then(renderMeetingList).catch(err => {
      console.error('โหลดทะเบียนวาระการประชุมไม่สำเร็จ:', err);
      ECMIS.toastWarn('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ');
    });
  </script>
</body>

</html>
