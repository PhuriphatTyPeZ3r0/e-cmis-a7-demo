<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการรอจัดทำมติ | E-CMIS</title>
<link rel="icon" type="image/png" href="../assets/pacc_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<link href="../assets/ecmis-app.css" rel="stylesheet">
<style>
.btn-xs { font-size: 0.76rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
.kpi-card { transition: all 0.2s ease; cursor: pointer; border-radius: 12px; }
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,42,98,0.1) !important; }
.kpi-card.active { border-width: 2px !important; }
.meet-type-inquiry { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; font-size: 0.75rem; }
.meet-type-ruling { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; font-size: 0.75rem; }
.meet-type-general { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; font-size: 0.75rem; }
</style>
</head>
<body>

<main class="app-main">

  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-scale-balanced me-2" style="color:#0F2A62"></i>รายการรอจัดทำมติคณะกรรมการ ป.ป.ท.</h1>
    </div>
    <span class="flow-ref ms-auto"><strong>กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ (กบค.)</strong></span>
  </div>

  <!-- KPI Cards (Pending Resolution Stages) -->
  <div class="row g-2 mb-4" id="kpiRow"></div>

  <!-- Filter & Search Panel -->
  <div class="card card-ecmis mb-4 shadow-sm border-0">
    <div class="card-body p-3">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label fw-semibold text-dark small mb-1">ค้นหาสำนวน แฟ้ม หรือผู้ถูกกล่าวหา</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="เลขสำนวน, ผู้กล่าวหา, ผู้ถูกกล่าวหา, ผู้รับผิดชอบ หรือหน่วยงาน">
          </div>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-pen-to-square me-1 text-muted"></i>สถานะมติ</label>
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="ALL">ทั้งหมด (ทุกสำนวนที่รอบันทึกมติ)</option>
            <option value="AGENDA_SET">1. รอบรรจุวาระ / นัดประชุม (Stage 1)</option>
            <option value="IN_MEETING">2. อยู่ระหว่างประชุมบอร์ด (Stage 1)</option>
            <option value="RESOLVED_PENDING">3. รอรับรอง / ล็อกมติ PDF (Stage 2)</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-filter me-1 text-muted"></i>ประเภทเรื่อง</label>
          <select id="typeFilter" class="form-select form-select-sm">
            <option value="ALL">ทั้งหมด (7.1, 7.2, 7.3)</option>
            <option value="7.1">ไต่สวนเบื้องต้น (7.1)</option>
            <option value="7.2">วินิจฉัยชี้มูล (7.2)</option>
            <option value="7.3">เรื่องทั่วไป (7.3)</option>
          </select>
        </div>
        <div class="col-md-2 text-end">
          <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-3 w-100" id="btnClearFilter">
            <i class="fa-solid fa-rotate-left me-1"></i>ล้างตัวกรอง
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Queue Table Panel -->
  <div class="row g-3 align-items-start">
    <div class="col-12">

      <div class="card card-ecmis mb-4 shadow-sm border-0">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2 py-2 px-3 bg-white border-bottom">
          <div class="d-flex align-items-center gap-2">
            <i class="fa-solid fa-list-check text-primary"></i>
            <span class="fw-bold" id="card1TitleText">รายการสำนวนที่รอบันทึกมติคณะกรรมการ ป.ป.ท.</span>
            <span class="badge bg-primary rounded-pill ms-1" id="totalCount">0</span>
          </div>
          <div class="small text-muted">
            <i class="fa-solid fa-circle-info me-1"></i>สำนวนที่มีมติแล้วเสร็จจะส่งต่อไปยังกลุ่มงานกิจการคณะกรรมการโดยอัตโนมัติ
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover tbl-ecmis mb-0 align-middle">
              <colgroup>
                <col style="width:40px">
                <col style="width:130px">
                <col style="width:135px">
                <col>
                <col style="width:190px">
                <col style="width:120px">
                <col style="width:160px">
              </colgroup>
              <thead>
                <tr>
                  <th class="text-center"><input type="checkbox" id="chkAll" class="form-check-input"></th>
                  <th class="sortable-header" data-sort="id" style="cursor:pointer">เรื่องที่ <i class="fa-solid fa-sort-down ms-1" style="font-size:0.75rem"></i></th>
                  <th>ประเภทเรื่อง</th>
                  <th>เรื่องที่กล่าวหา / ผู้รับผิดชอบ</th>
                  <th>สถานะมติ</th>
                  <th class="sortable-header" data-sort="slaDays" style="cursor:pointer">กำหนดเวลา <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
                  <th class="text-end">ดำเนินการ</th>
                </tr>
              </thead>
              <tbody id="myQueue"></tbody>
            </table>
          </div>

          <div class="px-3 py-2 border-top d-flex align-items-center justify-content-between flex-wrap gap-2 bg-light" id="queueFooter">
            <div id="bulkActionsBox" class="d-none align-items-center gap-2">
              <span class="small text-muted me-1" id="bulkSelectCount">เลือกแล้ว 0 รายการ</span>
              <button type="button" class="btn btn-xs btn-navy py-1 px-2" style="font-size:0.78rem" id="btnBulkApprove">
                <i class="fa-solid fa-check-double me-1"></i>บันทึกมติรายการที่เลือก (Bulk Action)
              </button>
            </div>
            <nav aria-label="Queue navigation" class="ms-auto">
              <ul class="pagination pagination-sm m-0" id="queuePagination"></ul>
            </nav>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/ecmis-app.js"></script>
<script>
ECMIS.renderShell('resolution-inbox.html');

const role = ECMIS.currentRole();

/* หน้านี้เฉพาะ board_sec เท่านั้น (เจ้าหน้าที่กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ) */
if (role.id !== 'board_sec') { location.href = ECMIS.homeHref(role.id); }

/* ---------- โหลดสำนวนจาก Supabase / Local Data ---------- */
const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
let sb = null;
try {
  if (window.supabase && typeof window.supabase.createClient === 'function') {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (e) {
  console.warn('Supabase init skipped, using local data store:', e);
}

async function loadCasesFromSupabase() {
  if (!sb) return null;
  try {
    const { data, error } = await sb
      .from('tbl_res_request')
      .select('*, tbl_cmp_case(*, tbl_cmp_case_accused(*))')
      .eq('is_deleted', false);
    if (error) throw error;
    return data.map(row => ECMIS.supabaseRowToCase(row)).filter(Boolean);
  } catch (err) {
    console.warn('Supabase fetch failed, falling back to local CASES:', err);
    return null;
  }
}

async function updateCaseStatus(kase, newStatus) {
  kase.status = newStatus;
  if (sb && kase.trr_id) {
    const code = ECMIS.STATUS_CODE[newStatus];
    if (code) {
      await sb.from('tbl_res_request').update({ trr_status: code }).eq('trr_id', kase.trr_id);
    }
  }
  ECMIS.saveCases();
}

/* แสดงเฉพาะสำนวนที่อยู่ในความรับผิดชอบของกลุ่มงานมติ (ยังไม่เสร็จสิ้น/ยังไม่ส่งต่อไปกลุ่มกิจการฯ) */
const OWN_SCOPE_STATUSES = ['AGENDA_SET', 'IN_MEETING', 'PENDING_INVITE_72', 'IN_MEETING_72', 'RESOLVED_PENDING'];

let CASES = [];
let all = [];
let allCasesCombined = [];
let quickFilter = 'ALL';

function isRowActionable(c) { 
  return OWN_SCOPE_STATUSES.includes(c.status);
}

function getStage(c) {
  if (c.resolutionStage && typeof c.resolutionStage === 'number') {
    return c.resolutionStage;
  }
  return ECMIS.computeResolutionStage(c);
}

/* ---------- KPI Cards ---------- */
function renderKPICards() {
  const currentSt = quickFilter;

  const countAgenda   = allCasesCombined.filter(c => c.status === 'AGENDA_SET' || c.status === 'PENDING_INVITE_72').length;
  const countMeeting  = allCasesCombined.filter(c => c.status === 'IN_MEETING' || c.status === 'IN_MEETING_72').length;
  const countPending  = allCasesCombined.filter(c => c.status === 'RESOLVED_PENDING' || c.status === 'RESOLVED_PENDING_72').length;

  const count71 = allCasesCombined.filter(c => !ECMIS.isCase72(c) && !ECMIS.isCase73(c)).length;
  const count72 = allCasesCombined.filter(c => ECMIS.isCase72(c)).length;
  const count73 = allCasesCombined.filter(c => ECMIS.isCase73(c)).length;

  const kpis = [
    { id:'ALL',              n: allCasesCombined.length, l:'ทั้งหมดที่รอบันทึกมติ', i:'fa-folder-open',      c:'#0F2A62' },
    { id:'AGENDA_SET',       n: countAgenda,            l:'1. รอบรรจุวาระ/นัดประชุม', i:'fa-calendar-check', c:'#0284C7' },
    { id:'IN_MEETING',       n: countMeeting,           l:'2. อยู่ระหว่างประชุมบอร์ด', i:'fa-gavel',          c:'#D0A830' },
    { id:'RESOLVED_PENDING', n: countPending,           l:'3. รอรับรอง/ล็อกมติ',     i:'fa-file-signature',  c:'#16A34A' }
  ];

  document.getElementById('kpiRow').innerHTML = kpis.map(k => {
    const isActive = (currentSt === k.id);
    return `
    <div class="col-6 col-md-3">
      <div class="card card-ecmis kpi-card h-100 ${isActive ? 'active border-2 shadow-sm' : 'border'}"
           style="min-height:82px; ${isActive ? `border-color:${k.c} !important; background:${k.c}0D;` : 'background:#fff;'}"
           onclick="filterByKPI('${k.id}')">
        <div class="card-body d-flex align-items-center gap-2 py-2 px-2">
          <div style="flex:0 0 34px;height:34px;border-radius:8px;background:${k.c}18;display:flex;align-items:center;justify-content:center">
            <i class="fa-solid ${k.i}" style="color:${k.c};font-size:0.95rem"></i>
          </div>
          <div style="min-width:0">
            <div style="font-size:1.35rem;font-weight:700;font-family:var(--serif);color:${k.c};line-height:1.1">${k.n}</div>
            <div class="text-muted text-truncate" style="font-size:.70rem;margin-top:2px" title="${k.l}">${k.l}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterByKPI(statusId) {
  quickFilter = statusId;
  const sf = document.getElementById('statusFilter');
  if (sf) sf.value = statusId;
  applyFilters();
}

let currentPage = 1;
const pageSize = 10;
let sortField = 'id';
let sortOrder = 'desc';

function caseIdSortValue(id) {
  const m = /^(\d+)\/(\d+)$/.exec(id || '');
  if (!m) return 0;
  return parseInt(m[2], 10) * 100000 + parseInt(m[1], 10);
}

function getActionBadge(c) {
  if (c.status === 'AGENDA_SET' || c.status === 'PENDING_INVITE_72') {
    return '<span class="st st-pending"><i class="fa-solid fa-calendar-check me-1"></i>รอบรรจุวาระ</span>';
  }
  if (c.status === 'IN_MEETING' || c.status === 'IN_MEETING_72') {
    return '<span class="st st-urgent" style="background:#FEF3C7;color:#B45309;border-color:#FDE68A"><i class="fa-solid fa-gavel me-1"></i>อยู่ระหว่างประชุม</span>';
  }
  if (c.status === 'RESOLVED_PENDING') {
    return '<span class="st st-review"><i class="fa-solid fa-file-signature me-1"></i>รอยืนยัน/ล็อก PDF</span>';
  }
  return ECMIS.statusBadge(c.status);
}

/* ป้ายประเภทเรื่อง (7.1, 7.2, 7.3) */
function typeBadge(c, is72){
  if (ECMIS.isCase73(c)) {
    return '<span class="meet-badge meet-type-general"><i class="fa-solid fa-scale-balanced me-1"></i>เรื่องทั่วไป (7.3)</span>';
  }
  if (is72) {
    return '<span class="meet-badge meet-type-ruling"><i class="fa-solid fa-gavel me-1"></i>วินิจฉัยชี้มูล (7.2)</span>';
  }
  return '<span class="meet-badge meet-type-inquiry"><i class="fa-solid fa-file-lines me-1"></i>ไต่สวนเบื้องต้น (7.1)</span>';
}

function row(c){
  const is72 = ECMIS.isCase72(c);
  
  // Intelligent Action Route determination
  const target = is72
    ? `resolution-72.html?case=${encodeURIComponent(c.id)}`
    : `resolution.html?case=${encodeURIComponent(c.id)}`;
  
  const isPendingAction = isRowActionable(c);
  const statusBadgeHtml = getActionBadge(c);

  return `<tr>
    <td class="text-center">
      ${isPendingAction ? `<input type="checkbox" class="case-chk form-check-input" data-id="${c.id}">` : '<i class="fa-solid fa-lock text-muted" style="font-size:0.75rem"></i>'}
    </td>
    <td class="case-no">${c.id}${(c.urgent || c.urgent72)?' <span class="st st-urgent ms-1">ด่วน</span>':''}</td>
    <td>${typeBadge(c, is72)}</td>
    <td style="max-width:320px">
      <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
      <small class="text-muted d-block" style="font-size:0.75rem">
        <i class="fa-regular fa-building me-1"></i>${c.ownerOrg} · <i class="fa-regular fa-user me-1"></i>${c.owner || 'เจ้าของสำนวน'}
      </small>
    </td>
    <td>${statusBadgeHtml}</td>
    <td>${ECMIS.slaBadge(c)}</td>
    <td class="text-end">
      <a href="${target}" class="btn btn-sm btn-navy px-3 py-1 shadow-sm" style="font-size:0.8rem; white-space:nowrap;">
        <i class="fa-solid fa-pen-to-square me-1"></i>บันทึกมติ
      </a>
    </td>
  </tr>`;
}

let filteredCombined = [...allCasesCombined];

function renderMyQueue(loading = false) {
  const tbodyPrimary = document.getElementById('myQueue');

  if (loading) {
    let skeletons = '';
    for(let i=0; i<Math.min(pageSize, filteredCombined.length || 3); i++) {
      skeletons += `
        <tr class="skeleton-row">
          <td><div class="skeleton-box" style="width:20px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td><div class="skeleton-box" style="width:100px"></div></td>
          <td><div class="skeleton-box" style="width:200px"></div></td>
          <td><div class="skeleton-box" style="width:110px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td class="text-end"><div class="skeleton-box ms-auto" style="width:80px"></div></td>
        </tr>`;
    }
    tbodyPrimary.innerHTML = skeletons;

    document.getElementById('bulkActionsBox').className = 'd-none';
    const chkAll = document.getElementById('chkAll');
    if (chkAll) chkAll.checked = false;

    setTimeout(() => {
      renderMyQueue(false);
    }, 200);
    return;
  }

  const sortedCases = [...filteredCombined].sort((a, b) => {
    let valA = a[sortField];
    let valB = b[sortField];
    if (sortField === 'id') {
      valA = caseIdSortValue(a.id);
      valB = caseIdSortValue(b.id);
    } else if (sortField === 'slaDays') {
      valA = a.slaDays;
      valB = b.slaDays;
    }
    if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
    if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
    return 0;
  });

  const totalItems = sortedCases.length;
  const totalPages = Math.ceil(totalItems / pageSize) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * pageSize;
  const paginatedCases = sortedCases.slice(startIdx, startIdx + pageSize);

  tbodyPrimary.innerHTML = paginatedCases.length
    ? paginatedCases.map(c => row(c)).join('')
    : `<tr><td colspan="7" class="text-center text-muted py-4">
         <i class="fa-solid fa-check-double fa-2x mb-2 d-block text-success"></i>
         ไม่มีรายการสำนวนที่รอบันทึกมติในขณะนี้<br>
         <small>สำนวนที่มีมติแล้วเสร็จทั้งหมดได้ถูกส่งต่อไปยังกลุ่มงานกิจการคณะกรรมการแล้ว</small></td></tr>`;

  const totalCountEl = document.getElementById('totalCount');
  if (totalCountEl) totalCountEl.textContent = sortedCases.length;

  const paginUl = document.getElementById('queuePagination');
  let paginHtml = `
    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">«</a>
    </li>`;
  for (let i = 1; i <= totalPages; i++) {
    paginHtml += `
      <li class="page-item ${currentPage === i ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
      </li>`;
  }
  paginHtml += `
    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">»</a>
    </li>`;
  paginUl.innerHTML = paginHtml;

  initCheckboxHandlers();
}

function changePage(p) {
  currentPage = p;
  renderMyQueue(true);
}

document.querySelectorAll('.sortable-header').forEach(header => {
  header.addEventListener('click', () => {
    const field = header.dataset.sort;
    if (sortField === field) {
      sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      sortField = field;
      sortOrder = 'asc';
    }

    document.querySelectorAll('.sortable-header i').forEach(icon => {
      icon.className = 'fa-solid fa-sort text-muted';
    });
    const activeIcon = header.querySelector('i');
    if (activeIcon) activeIcon.className = `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'}`;

    renderMyQueue(true);
  });
});

function initCheckboxHandlers() {
  const chkAll = document.getElementById('chkAll');
  const chks = document.querySelectorAll('.case-chk');

  if (!chkAll) return;
  chkAll.addEventListener('change', () => {
    chks.forEach(chk => chk.checked = chkAll.checked);
    updateBulkActionsState();
  });

  chks.forEach(chk => {
    chk.addEventListener('change', () => {
      chkAll.checked = Array.from(chks).every(c => c.checked);
      updateBulkActionsState();
    });
  });
}

function updateBulkActionsState() {
  const chks = document.querySelectorAll('.case-chk:checked');
  const bulkBox = document.getElementById('bulkActionsBox');
  const bulkCount = document.getElementById('bulkSelectCount');

  if (!bulkBox) return;
  if (chks.length > 0) {
    bulkBox.className = 'd-flex align-items-center gap-2';
    if (bulkCount) bulkCount.textContent = `เลือกแล้ว ${chks.length} รายการ`;
  } else {
    bulkBox.className = 'd-none';
  }
}

document.getElementById('btnBulkApprove')?.addEventListener('click', () => {
  const chks = document.querySelectorAll('.case-chk:checked');
  if (!chks.length) return;

  ECMIS.confirmAction({
    title: `ยืนยันบันทึกมติกลุ่มจำนวน ${chks.length} รายการ`,
    html: `<p>ระบบจะบันทึกมติเห็นชอบตามที่เสนอและส่งต่อไปยังกลุ่มงานกิจการคณะกรรมการเพื่อดำเนินการต่อไป</p>`,
    confirmText: 'ยืนยันบันทึกมติกลุ่ม'
  }).then(async res => {
    if (!res.isConfirmed) return;
    try {
      for (const chk of chks) {
        const id = chk.dataset.id;
        const c = CASES.find(x => x.id === id);
        if (c) {
          c.status = 'RESOLVED';
          c.resolution = 'ACCEPT_S24P1';
          c.resolutionStage = 3;
          c.resolvedAt = new Date().toLocaleString('th-TH');
          c.resolvedAtIso = new Date().toISOString();
        }
      }
      ECMIS.saveCases();
    } catch (err) {
      console.error('สั่งการกลุ่มไม่สำเร็จ:', err);
      ECMIS.toastWarn('บันทึกลงฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
      return;
    }
    ECMIS.toastOk(`บันทึกมติกลุ่มสำเร็จจำนวน ${chks.length} รายการ และส่งต่อกลุ่มกิจการฯ แล้ว`);
    setTimeout(() => location.reload(), 1200);
  });
});

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const typ = document.getElementById('typeFilter')?.value || 'ALL';

  filteredCombined = allCasesCombined.filter(c => {
    const is72 = ECMIS.isCase72(c);
    const is73 = ECMIS.isCase73(c);

    // Search query match
    const matchQ = !q ||
      c.id.toLowerCase().includes(q) ||
      (c.subject && c.subject.toLowerCase().includes(q)) ||
      (c.ownerOrg && c.ownerOrg.toLowerCase().includes(q)) ||
      (c.owner && c.owner.toLowerCase().includes(q)) ||
      (c.complainant && c.complainant.toLowerCase().includes(q)) ||
      (Array.isArray(c.accused) && c.accused.some(p =>
        (p.name && p.name.toLowerCase().includes(q)) ||
        (p.idcard && p.idcard.toLowerCase().includes(q))
      ));

    // Status filter match
    let matchSt = true;
    if (st !== 'ALL') {
      if (st === 'AGENDA_SET') matchSt = (c.status === 'AGENDA_SET' || c.status === 'PENDING_INVITE_72');
      else if (st === 'IN_MEETING') matchSt = (c.status === 'IN_MEETING' || c.status === 'IN_MEETING_72');
      else if (st === 'RESOLVED_PENDING') matchSt = (c.status === 'RESOLVED_PENDING');
      else matchSt = (c.status === st);
    }

    // Type filter match (7.1, 7.2, 7.3)
    let matchType = true;
    if (typ === '7.1') matchType = (!is72 && !is73);
    else if (typ === '7.2') matchType = is72;
    else if (typ === '7.3') matchType = is73;

    return matchQ && matchSt && matchType;
  });

  currentPage = 1;
  renderKPICards();
  renderMyQueue(true);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', (e) => {
  quickFilter = e.target.value;
  applyFilters();
});
document.getElementById('typeFilter')?.addEventListener('change', applyFilters);
document.getElementById('btnClearFilter').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = 'ALL';
  if (document.getElementById('typeFilter')) document.getElementById('typeFilter').value = 'ALL';
  quickFilter = 'ALL';
  applyFilters();
});

(async function main() {
  try {
    const live = await loadCasesFromSupabase();
    CASES = (live && live.length) ? live : ECMIS.CASES.slice();
  } catch (err) {
    console.error('โหลดข้อมูลไม่สำเร็จ:', err);
    CASES = ECMIS.CASES.slice();
  }
  
  // ซ่อนสำนวนที่บันทึกมติเสร็จแล้วและส่งต่อกลุ่มกิจการฯ ออกจากหน้ารายการของกลุ่มงานมติทั้งหมด
  all = CASES.filter(c => 
    OWN_SCOPE_STATUSES.includes(c.status) && 
    (!c.resolutionStage || c.resolutionStage < 3) &&
    ECMIS.canViewCase(c, role.id)
  );
  allCasesCombined = all;
  filteredCombined = [...allCasesCombined];

  renderKPICards();
  applyFilters();
})();

</script>
