<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คณะอนุกรรมการสนับสนุนเลขาธิการฯ กลั่นกรองสำนวนซับซ้อน | E-CMIS</title>
  <link rel="icon" type="image/png" href="../pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/ecmis-app.css" rel="stylesheet">
</head>

<body>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-user-tie me-2"></i>คณะอนุกรรมการสนับสนุนเลขาธิการฯ กลั่นกรองสำนวนซับซ้อน</h1>
      </div>
      <div class="ms-auto text-end">
        <span class="flow-ref">กลั่นกรองสำนวนซับซ้อนก่อนส่งต่อขั้นถัดไป</span>
        <div class="mt-1" id="stBadge"></div>
      </div>
    </div>

    <div class="card card-ecmis mb-3">
      <div class="card-body pb-1" id="stepper"></div>
    </div>

    <div class="card card-ecmis mb-3">
      <div class="card-header"><i class="fa-solid fa-people-group"></i> กลั่นกรองสำนวนซับซ้อนโดยคณะอนุกรรมการสนับสนุนเลขาธิการฯ</div>
      <div class="card-body">
        <label class="form-label field-req">คณะอนุกรรมการสนับสนุนเลขาธิการฯ ที่รับผิดชอบกลั่นกรอง</label>
        <div class="list-group mb-3" id="teamList"></div>

        <label class="form-label field-req">ความเห็นกลั่นกรอง</label>
        <textarea class="form-control" id="supportOpinion" rows="5"
          placeholder="คณะอนุกรรมการสนับสนุนเลขาธิการฯ พิจารณาสำนวนแล้วเห็นว่า..."></textarea>
        <div class="val-msg val-err" data-for="supportOpinion">กรุณาระบุความเห็นกลั่นกรองของคณะอนุกรรมการสนับสนุนเลขาธิการฯ</div>
      </div>
    </div>

    <div id="actionBarSlot"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../assets/ecmis-app.js"></script>
  <script>
    ECMIS.renderShell('support-subcommittee.html');

    const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadCaseFromSupabase(caseId) {
      const { data, error } = await sb
        .from('tbl_res_request')
        .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
        .eq('tbl_cmp_case.tcc_no', caseId)
        .eq('is_deleted', false)
        .maybeSingle();
      if (error) throw error;
      return data ? ECMIS.supabaseRowToCase(data) : null;
    }

    /* supportTeam72/supportOpinion72 ไม่มีคอลัมน์ใน Supabase จึงคง set บน kase ในหน่วยความจำไว้
       เหมือนเดิม เพียงแต่ไม่ถูกบันทึกข้ามหน้า/ข้ามอุปกรณ์ — ตามรูปแบบเดียวกับ persistCase ใน
       review.html / resolution.html */
    async function persistCase(kase, patch) {
      const dbPatch = {};
      if ('status' in patch) {
        const code = ECMIS.STATUS_CODE[patch.status];
        if (code) dbPatch.trr_status = code;
      }
      if (kase.trr_id && Object.keys(dbPatch).length) {
        try {
          const { error } = await sb.from('tbl_res_request').update(dbPatch).eq('trr_id', kase.trr_id);
          if (error) console.warn('Supabase update warning:', error);
        } catch (e) {
          console.warn('Supabase update failed:', e);
        }
      }
      Object.assign(kase, patch);
      const memCase = ECMIS.CASES.find(x => x.id === kase.id);
      if (memCase) Object.assign(memCase, patch);
      ECMIS.saveCases();
    }

    const params = new URLSearchParams(location.search);
    const role = ECMIS.currentRole();
    let kase = null;

    (async function main() {
      const caseParam = params.get('case') || '2015/2569';
      try {
        kase = await loadCaseFromSupabase(caseParam);
      } catch (err) {
        console.warn('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ:', err);
      }
      if (!kase) {
        kase = ECMIS.getCase(caseParam) || ECMIS.CASES.find(x => x.id === caseParam) || ECMIS.CASES[0];
      }
      if (!kase) { ECMIS.toastWarn('ไม่พบสำนวนนี้ในระบบ'); return; }

      renderPage();
    })();

    function renderPage() {
    document.getElementById('stBadge').innerHTML = `<span class="chip me-1">เลขสำนวน ${kase.id}</span>` + ECMIS.statusBadge(kase.status) + ' ' + ECMIS.slaBadge(kase);
    document.getElementById('stepper').innerHTML = ECMIS.stepperHtml(kase.status, ECMIS.FLOW_STEPS_72, ECMIS.STATUS_STEP_72);

    const chair = ECMIS.getRole('sup_chair');
    const sec = ECMIS.getRole('sup_sec');
    const asst = ECMIS.getRole('sup_asst');
    const memb = ECMIS.getRole('support_sub');
    const TEAMS = [
      { code: 'TEAM1', label: 'คณะที่ 1' },
      { code: 'TEAM2', label: 'คณะที่ 2' }
    ];
    const savedTeam = kase.supportTeam72 || 'TEAM1';

    document.getElementById('teamList').innerHTML = TEAMS.map(t => `
  <label class="list-group-item d-flex gap-2 align-items-start">
    <input class="form-check-input mt-1" type="radio" name="supportTeam" value="${t.code}" ${t.code === savedTeam ? 'checked' : ''}>
    <span><strong>${t.label}</strong>
      <br><small class="text-muted">ประธาน: ${chair.name} (${chair.title}) · เลขานุการ: ${sec.name} (${sec.title})
      · ผู้ช่วยเลขานุการ: ${asst.name} (${asst.title}) · อนุกรรมการ: ${memb.name} (${memb.title})</small></span>
  </label>`).join('');

    if (kase.supportOpinion72) document.getElementById('supportOpinion').value = kase.supportOpinion72;

    function buildButtons() {
      return [
        { act: 'save', label: 'บันทึกร่างความเห็น', icon: 'fa-floppy-disk', cls: 'btn-outline-secondary' },
        { act: 'submit', label: 'ส่งกลับเลขาธิการฯ', icon: 'fa-paper-plane', cls: 'btn-navy' }
      ];
    }
    document.getElementById('actionBarSlot').innerHTML = ECMIS.actionBar(kase, role.id, buildButtons());
    document.querySelectorAll('.action-bar [data-act]').forEach(b =>
      b.addEventListener('click', () => handle(b.dataset.act)));

    function selectedTeam() {
      const el = document.querySelector('input[name="supportTeam"]:checked');
      return el ? el.value : 'TEAM1';
    }

    async function handle(act) {
      const team = TEAMS.find(t => t.code === selectedTeam());
      const op = document.getElementById('supportOpinion');

      if (act === 'save') {
        kase.supportTeam72 = team.code;
        kase.supportOpinion72 = op.value.trim();
        ECMIS.toastOk('บันทึกร่างความเห็นเรียบร้อย');
        return;
      }

      if (act === 'submit') {
        if (!op.value.trim()) {
          op.classList.add('is-invalid-ecmis');
          document.querySelector('.val-msg[data-for="supportOpinion"]').classList.add('show');
          ECMIS.toastWarn('กรุณาระบุความเห็นกลั่นกรองก่อนส่งกลับเลขาธิการฯ');
          return;
        }
        op.classList.remove('is-invalid-ecmis');
        document.querySelector('.val-msg[data-for="supportOpinion"]').classList.remove('show');

        const isUrgent = !!kase.urgent72;
        const next = isUrgent
          ? { p: 'urgent-agenda.html', t: 'ส่งต่อคำร้องขอบรรจุวาระด่วน' }
          : { p: 'screening.html', t: 'ส่งต่อคณะอนุกลั่นกรองเรื่องไต่สวนข้อเท็จจริง' };

        ECMIS.confirmAction({
          title: 'ส่งความเห็นกลับเลขาธิการฯ',
          html: `<p>สำนวน <strong>${kase.id}</strong> — กลั่นกรองโดย <strong>${team.label}</strong></p>`,
          confirmText: 'ยืนยันส่งกลับ'
        }).then(async res => {
          if (!res.isConfirmed) return;
          try {
            await persistCase(kase, {
              supportTeam72: team.code,
              supportOpinion72: op.value.trim(),
              status: isUrgent ? 'PENDING_URGENT_72' : 'IN_SCREENING_72'
            });
          } catch (err) {
            console.error('ส่งความเห็นไม่สำเร็จ:', err);
            ECMIS.toastWarn('บันทึกลงฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
            return;
          }
          ECMIS.toastOk('ส่งความเห็นกลับเลขาธิการฯ เรียบร้อย');
          setTimeout(() => location.href = next.p + '?case=' + encodeURIComponent(kase.id), 1400);
        });
      }
    }
    }
  </script>
</body>

</html>
