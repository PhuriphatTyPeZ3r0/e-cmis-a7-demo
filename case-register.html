<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

<body>

  <main class="app-main">

        <!-- แถวที่ 2: หน่วยงาน & ผู้รับผิดชอบ & คณะไต่สวน (TOR 7.3: สำนัก/กอง, ผู้รับผิดชอบ, อนุไต่สวน, คณะพนักงานไต่สวน, เลขคำสั่ง) -->

              <option value="สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 3">ป.ป.ท. เขต 3</option>
              <option value="สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 4">ป.ป.ท. เขต 4</option>
              <option value="สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 5">ป.ป.ท. เขต 5</option>
              <option value="สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 6">ป.ป.ท. เขต 6</option>
              <option value="สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 7">ป.ป.ท. เขต 7</option>
              <option value="สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 8">ป.ป.ท. เขต 8</option>
              <option value="สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ เขต 9">ป.ป.ท. เขต 9</option>

    <div class="card card-ecmis">
      <div class="card-header">

        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover tbl-ecmis mb-0">
            <thead>
              <tr>
                <th class="sortable-header" data-sort="id" style="cursor:pointer">เลขสำนวน <i
                    class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/ecmis-app.js"></script>
  <script>
    ECMIS.renderShell('case-register.html');
    const role = ECMIS.currentRole();

    const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ทะเบียนสำนวนกลาง — เดิมผูกกับ ECMIS.CASES (mock array คงที่) ไม่ sync กับหน้าที่ migrate ไป
       Supabase แล้ว และไม่เคยกรองสิทธิ์การมองเห็นเลย (canViewCase ไม่เคยถูกเรียกในไฟล์นี้) ทำให้ทุก role
       เห็นทุกสำนวนรวมเลขบัตร ปชช./ข้อกล่าวหาของทุกคดี — แก้ทั้งสองจุดพร้อมกันเพราะเป็นไฟล์เดียวกัน */
    let ALL_CASES = [];
    async function loadAllCasesFromSupabase() {
      const { data, error } = await sb
        .from('tbl_res_request')
        .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
        .eq('is_deleted', false);
      if (error) throw error;
      return (data || []).map(ECMIS.supabaseRowToCase).filter(Boolean);
    }

    document.getElementById('qStatus').insertAdjacentHTML('beforeend',
      Object.keys(ECMIS.STATUS).map(k => `<option value="${k}">${ECMIS.STATUS[k].label}</option>`).join(''));

    let filter = 'all';

    function matches(c) {
      const q = document.getElementById('q').value.trim();
      const qa = document.getElementById('qAccused').value.trim();
      const qi = document.getElementById('qIdCard').value.trim();
      const qc = document.getElementById('qComplainant').value.trim();
      const qo = document.getElementById('qOwner').value.trim();
      const qoo = document.getElementById('qOwnerOrg').value;
      const qsub = document.getElementById('qSubComm').value.trim();
      const qinv = document.getElementById('qInvestTeam').value.trim();
      const qorder = document.getElementById('qOrderNo').value.trim();
      const qm = document.getElementById('qMeetingNo').value.trim();
      const qg = document.getElementById('qAgendaNo').value.trim();
      const qs = document.getElementById('qStatus').value;
      const qproc = document.getElementById('qProcType').value;
      const qb = document.getElementById('qBase').value;
      const qdf = document.getElementById('qDateFrom').value.trim();
      const qdt = document.getElementById('qDateTo').value.trim();
      const qPastAgenda = document.getElementById('qPastAgenda').checked;

      if (q && !(c.id.includes(q) || c.subject.includes(q) || (c.allegation && c.allegation.includes(q)))) return false;
      if (qa && !c.accused.some(a => a.name.includes(qa))) return false;
      if (qi && !c.accused.some(a => String(a.idcard || '').includes(qi))) return false;
      if (qc && !String(c.complainant || '').includes(qc)) return false;
      if (qo && !String(c.owner || '').includes(qo)) return false;
      if (qoo && !String(c.ownerOrg || '').includes(qoo)) return false;
      if (qsub && !String(c.subCommittee || '').includes(qsub)) return false;
      if (qinv && !String((c.order24Members || []).map(m => m.name).join(' ') + ' ' + (c.owner || '')).includes(qinv)) return false;
      if (qorder && !String(c.orderNo || (c.order24Done ? ('ปป. ๒๔/' + c.id) : '')).includes(qorder)) return false;
      if (qm && !String(c.meetingNo || '').includes(qm)) return false;
      if (qg && !String(c.agendaNo || '').includes(qg)) return false;
      if (qs && c.status !== qs) return false;
      if (qproc) {
        if (qproc === '7.1' && (ECMIS.isCase72(c) || ECMIS.isCase73(c))) return false;
        if (qproc === '7.2' && !ECMIS.isCase72(c)) return false;
        if (qproc === '7.3' && !ECMIS.isCase73(c)) return false;
      }
      if (qb && !String(c.legalBase || '').includes(qb)) return false;
      if (qPastAgenda && !(c.meetingNo && c.agendaNo)) return false;
      if (qdf && c.receivedDate && c.receivedDate < qdf) return false;
      if (qdt && c.receivedDate && c.receivedDate > qdt) return false;

      if (filter === 'late' && !(c.slaDays > ECMIS.effectiveSlaLimit(c))) return false;
      if (filter === 'urgent' && !(c.urgent || c.urgent72)) return false;
      if (filter === 'mine' && !ECMIS.canAct(c, role.id)) return false;
      if (filter === 'dup' && !c.dupWarning) return false;
      if (filter === '71' && (ECMIS.isCase72(c) || ECMIS.isCase73(c))) return false;
      if (filter === '72' && !ECMIS.isCase72(c)) return false;
      if (filter === '73' && !ECMIS.isCase73(c)) return false;
      return true;
    }

    let currentPage = 1;
    const pageSize = 5;
    let sortField = 'id';
    let sortOrder = 'asc';

    function render(loading = false) {
      const tbody = document.getElementById('tb');
      const cntBadge = document.getElementById('cnt');

      const filtered = ALL_CASES.filter(c => ECMIS.canViewCase(c, role.id)).filter(matches);
      cntBadge.textContent = filtered.length;

      if (loading) {
        let skeletons = '';
        for (let i = 0; i < Math.min(pageSize, filtered.length || 3); i++) {
          skeletons += `
        <tr class="skeleton-row">
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td><div class="skeleton-box" style="width:200px"></div></td>
          <td><div class="skeleton-box" style="width:100px"></div></td>
          <td><div class="skeleton-box" style="width:60px"></div></td>
          <td><div class="skeleton-box" style="width:90px"></div></td>
          <td><div class="skeleton-box" style="width:90px"></div></td>
          <td><div class="skeleton-box" style="width:70px"></div></td>
          <td><div class="skeleton-box" style="width:140px"></div></td>
          <td class="text-end"><div class="skeleton-box ms-auto" style="width:70px"></div></td>
        </tr>`;
        }
        tbody.innerHTML = skeletons;

        setTimeout(() => {
          render(false);
        }, 300);
        return;
      }

      // Apply Sorting
      const sorted = [...filtered].sort((a, b) => {
        let valA = a[sortField];
        let valB = b[sortField];

        if (sortField === 'slaDays') {
          valA = a.slaDays;
          valB = b.slaDays;
        }

        if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
        return 0;
      });

      const totalItems = sorted.length;
      const totalPages = Math.ceil(totalItems / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      const startIdx = (currentPage - 1) * pageSize;
      const paginated = sorted.slice(startIdx, startIdx + pageSize);

      tbody.innerHTML = paginated.length ? paginated.map(c => {
        const holder = ECMIS.STATUS[c.status] ? ECMIS.getRole(ECMIS.STATUS[c.status].owner) : null;
        const actionable = ECMIS.canAct(c, role.id);
        const is72 = ECMIS.isCase72(c);
        const is73 = ECMIS.isCase73(c);
        const target = ECMIS.pageForCaseByStatus(c);
        const procBadge = is73
          ? '<span class="badge bg-info-subtle text-info border border-info-subtle ms-1" style="font-size:0.68rem">เรื่องทั่วไป</span>'
          : (is72
            ? '<span class="badge bg-purple-subtle text-purple border border-purple-subtle ms-1" style="font-size:0.68rem">วินิจฉัยชี้มูล</span>'
            : '<span class="badge bg-primary-subtle text-primary border border-primary-subtle ms-1" style="font-size:0.68rem">ไต่สวนเบื้องต้น</span>');

        return `<tr>
      <td>
        <span class="case-no">${c.id}</span>
        ${procBadge}
        ${(c.urgent || c.urgent72) ? '<span class="st st-urgent ms-1">ด่วน</span>' : ''}
        ${c.dupWarning ? '<span class="st st-returned ms-1" title="ระบบตรวจพบสำนวนที่อาจซ้ำซ้อน"><i class="fa-solid fa-clone"></i> ซ้ำ?</span>' : ''}
        ${c.meetingNo ? `<a href="agenda-registry.html" class="chip ms-1" title="เคยบรรจุวาระ — ครั้งที่ ${c.meetingNo}${c.agendaNo ? ' วาระที่ ' + c.agendaNo : ''} — ดูทะเบียนวาระ">
          <i class="fa-solid fa-calendar-check"></i> ${c.meetingNo}
        </a>` : ''}
      </td>
      <td style="max-width:280px" class="editable-subject clickable-row" data-id="${c.id}" title="ดับเบิ้ลคลิกเพื่อแก้ไขด่วน">
        <div class="text-truncate fw-semibold text-primary" id="subject-text-${c.id}">${c.subject}</div>
        <small class="text-muted">ผู้รับผิดชอบ: <span id="owner-text-${c.id}">${c.owner}</span> · <span>${c.ownerOrg || 'ป.ป.ท.'}</span></small>
      </td>
      <td style="font-size:.8rem">
        ${c.accused.map(a => `<div>${a.name}${a.idcard ? ` <small class="text-muted">(${a.idcard})</small>` : ''}</div>`).join('') || '—'}
      </td>
      <td><span class="chip">${c.legalBase}</span></td>
      <td>${ECMIS.statusBadge(c.status)}</td>
      <td style="font-size:.8rem">${holder ? holder.title : '—'}</td>
      <td>${ECMIS.slaBadge(c)}</td>
      <td style="font-size:.78rem">
        ${is72
            ? `<div>รอบการไต่สวน: ครั้งที่ ${c.round72 || 1}</div>`
            : `<div>เริ่มไต่สวน: ${ECMIS.thaiDate(c.deadline60)}</div>
               <div class="text-muted">ครบ 2 ปี: ${ECMIS.thaiDate(c.deadline2y)}</div>`}
      </td>
      <td class="text-end">
        <a href="${target}?case=${encodeURIComponent(c.id)}"
           class="btn btn-sm ${actionable ? 'btn-navy' : 'btn-outline-secondary'}">
          <i class="fa-solid ${actionable ? 'fa-pen-to-square' : 'fa-eye'} me-1"></i>${actionable ? 'ดำเนินการ' : 'ดูรายละเอียด'}
        </a>
      </td>
    </tr>`;
      }).join('') : `<tr><td colspan="9" class="text-center text-muted py-5">
      <i class="fa-solid fa-folder-open fa-2x mb-2" style="color:var(--ecmis-muted)"></i><br>
      <strong>ไม่พบสำนวนที่ตรงกับเงื่อนไข</strong><br>
      <small>ลองเคลียร์คำค้นหาหรือเปลี่ยนฟิลเตอร์กรองอื่น</small>
    </td></tr>`;

      // Render Pagination controls
      const paginUl = document.getElementById('registerPagination');
      const indicator = document.getElementById('pageIndicator');
      indicator.textContent = `กำลังแสดงหน้า ${currentPage} จาก ${totalPages} (ทั้งหมด ${totalItems} รายการ)`;

      let paginHtml = `
    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">«</a>
    </li>`;
      for (let i = 1; i <= totalPages; i++) {
        paginHtml += `
      <li class="page-item ${currentPage === i ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
      </li>`;
      }
      paginHtml += `
    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">»</a>
    </li>`;
      paginUl.innerHTML = paginHtml;

      bindInlineEditing();
    }

    function changePage(p) {
      currentPage = p;
      render(true);
    }

    document.querySelectorAll('.sortable-header').forEach(header => {
      header.addEventListener('click', () => {
        const field = header.dataset.sort;
        if (sortField === field) {
          sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
        } else {
          sortField = field;
          sortOrder = 'asc';
        }

        document.querySelectorAll('.sortable-header i').forEach(icon => {
          icon.className = 'fa-solid fa-sort text-muted';
        });
        const activeIcon = header.querySelector('i');
        activeIcon.className = `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'}`;

        render(true);
      });
    });

    function bindInlineEditing() {
      document.querySelectorAll('.editable-subject').forEach(cell => {
        cell.addEventListener('dblclick', () => {
          const id = cell.dataset.id;
          if (cell.classList.contains('editing')) return;
          cell.classList.add('editing');

          const kase = ALL_CASES.find(c => c.id === id);
          if (!kase) return;

          const currentSubject = kase.subject;
          cell.innerHTML = `
        <div class="mb-1">
          <label class="form-label" style="font-size:0.7rem">แก้ไขเรื่องกล่าวหา:</label>
          <input type="text" class="form-control form-control-sm" id="edit-sub-input" value="${currentSubject}">
        </div>
        <div>
          <label class="form-label" style="font-size:0.7rem">แก้ไขเจ้าของสำนวน:</label>
          <input type="text" class="form-control form-control-sm" id="edit-own-input" value="${kase.owner}">
        </div>
        <div class="text-end mt-1">
          <button class="btn btn-xs btn-navy py-0 px-2" style="font-size:0.75rem" id="btn-save-inline">บันทึก</button>
          <button class="btn btn-xs btn-light py-0 px-2" style="font-size:0.75rem" id="btn-cancel-inline">ยกเลิก</button>
        </div>`;

          const subInput = cell.querySelector('#edit-sub-input');
          subInput.focus();

          cell.querySelector('#btn-save-inline').addEventListener('click', async (e) => {
            e.stopPropagation();
            const newSub = cell.querySelector('#edit-sub-input').value.trim();
            const newOwn = cell.querySelector('#edit-own-input').value.trim();
            if (newSub && newOwn) {
              try {
                const { error } = await sb
                  .from('tbl_cmp_case')
                  .update({ tcc_subject: newSub, tcc_owner: newOwn })
                  .eq('tcc_id', kase.tcc_id);
                if (error) throw error;
                kase.subject = newSub;
                kase.owner = newOwn;
                ECMIS.toastOk('แก้ไขข้อมูลสำนวนเรียบร้อยแล้ว');
              } catch (err) {
                console.error('บันทึกแก้ไขไม่สำเร็จ:', err);
                ECMIS.toastWarn('บันทึกข้อมูลไม่สำเร็จ');
              }
            }
            render(false);
          });

          cell.querySelector('#btn-cancel-inline').addEventListener('click', (e) => {
            e.stopPropagation();
            render(false);
          });

          cell.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
              render(false);
            }
          });
        });
      });
    }

    function collectExportRows() {
      const filtered = ALL_CASES.filter(c => ECMIS.canViewCase(c, role.id)).filter(matches);
      if (!filtered.length) return [];
      return filtered.map(c => {
        const accusedStr = c.accused.map(a => `${a.name} (${a.pos || '—'}) [${a.idcard || '—'}]`).join('; ');
        const statusText = ECMIS.STATUS[c.status]?.label || c.status;
        const procTypeLabel = ECMIS.isCase73(c) ? 'เรื่องทั่วไป / ทบทวนมติพนักงานอัยการ' : (ECMIS.isCase72(c) ? 'สำนวนไต่สวนข้อเท็จจริงเพื่อวินิจฉัยชี้มูล' : 'สำนวนไต่สวนเบื้องต้น');
        return {
          id: c.id,
          subject: c.subject,
          procType: procTypeLabel,
          owner: c.owner,
          ownerOrg: c.ownerOrg || 'ป.ป.ท.',
          complainant: c.complainant || '—',
          accused: accusedStr,
          idCards: c.accused.map(a => a.idcard).filter(Boolean).join('; ') || '—',
          subComm: c.subCommittee || '—',
          investTeam: (c.order24Members || []).map(m => m.name).join(', ') || c.owner || '—',
          orderNo: c.orderNo || (c.order24Done ? ('ปป. ๒๔/' + c.id) : '—'),
          meetingNo: c.meetingNo || '—',
          agendaNo: c.agendaNo || '—',
          base: c.legalBase,
          status: statusText,
          receivedDate: c.receivedDate ? ECMIS.thaiDate(c.receivedDate) : '—',
          sla: `${c.slaDays} วัน`
        };
      });
    }

    function ensureRowsForExport() {
      const rows = collectExportRows();
      if (!rows.length) {
        ECMIS.toastWarn('ไม่มีข้อมูลสืบค้นสำหรับส่งออก');
        return null;
      }
      return rows;
    }

    function downloadBlob(content, type, fileName) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', fileName);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function escapeHtml(v) {
      return String(v || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('btnExportCsv').addEventListener('click', () => {
      const rows = ensureRowsForExport();
      if (!rows) return;
      let csv = '\uFEFF';
      csv += 'เลขสำนวน,ประเภทสารบบ,เรื่องกล่าวหา,ผู้รับผิดชอบ,สำนัก/กอง/เขต,ผู้กล่าวหา,ผู้ถูกกล่าวหา,เลขบัตร ปชช.,คณะอนุกรรมการ,คณะพนักงานไต่สวน,เลขที่คำสั่ง,ครั้งที่ประชุม,วาระที่,ฐานรับเรื่อง,สถานะ,วันที่รับเรื่อง,กำหนดเวลา\n';
      rows.forEach(r => {
        const vals = [r.id, r.procType, r.subject, r.owner, r.ownerOrg, r.complainant, r.accused, r.idCards, r.subComm, r.investTeam, r.orderNo, r.meetingNo, r.agendaNo, r.base, r.status, r.receivedDate, r.sla]
          .map(v => `"${String(v).replace(/"/g, '""')}"`)
          .join(',');
        csv += `${vals}\n`;
      });
      downloadBlob(csv, 'text/csv;charset=utf-8;', `ecmis_cases_register_${Date.now()}.csv`);
      ECMIS.toastOk('ส่งออกไฟล์ข้อมูล CSV เรียบร้อยแล้ว');
    });

    document.getElementById('btnExportWord').addEventListener('click', () => {
      const rows = ensureRowsForExport();
      if (!rows) return;
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ทะเบียนสำนวน</title>
      <style>
        body{font-family:'TH Sarabun New',Tahoma,sans-serif;font-size:16px}
        h1{font-size:24px;margin-bottom:12px}
        table{border-collapse:collapse;width:100%}
        th,td{border:1px solid #999;padding:6px;vertical-align:top}
        th{background:#f3f4f6}
      </style></head><body>
      <h1>ทะเบียนสำนวน E-CMIS (ตามข้อกำหนด TOR ข้อ ๗.๓ และ ๗.๔)</h1>
      <table><thead><tr>
        <th>เลขสำนวน</th><th>ประเภทสารบบ</th><th>เรื่องกล่าวหา</th><th>ผู้รับผิดชอบ/สังกัด</th><th>ผู้กล่าวหา</th><th>ผู้ถูกกล่าวหา</th><th>เลขคำสั่ง</th><th>ครั้งที่/วาระ</th><th>สถานะ</th>
      </tr></thead><tbody>
      ${rows.map(r => `<tr><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.procType)}</td><td>${escapeHtml(r.subject)}</td><td>${escapeHtml(r.owner)} (${escapeHtml(r.ownerOrg)})</td><td>${escapeHtml(r.complainant)}</td><td>${escapeHtml(r.accused)}</td><td>${escapeHtml(r.orderNo)}</td><td>${escapeHtml(r.meetingNo)} / ${escapeHtml(r.agendaNo)}</td><td>${escapeHtml(r.status)}</td></tr>`).join('')}
      </tbody></table></body></html>`;
      downloadBlob(html, 'application/msword', `ecmis_cases_register_${Date.now()}.doc`);
      ECMIS.toastOk('ส่งออกไฟล์ Word เรียบร้อยแล้ว');
    });

    document.getElementById('btnExportPdf').addEventListener('click', () => {
      const rows = ensureRowsForExport();
      if (!rows) return;
      const printWin = window.open('', '_blank');
      if (!printWin) {
        ECMIS.toastWarn('เบราว์เซอร์บล็อกหน้าต่างสำหรับพิมพ์ PDF');
        return;
      }
      printWin.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ทะเบียนสำนวน PDF</title>
      <style>
        body{font-family:'TH Sarabun New',Tahoma,sans-serif;font-size:15px;padding:18px}
        h1{font-size:22px;margin-bottom:10px}
        table{border-collapse:collapse;width:100%}
        th,td{border:1px solid #999;padding:6px;vertical-align:top}
        th{background:#f3f4f6}
      </style></head><body>
      <h1>ทะเบียนสำนวน E-CMIS (ตามข้อกำหนด TOR ข้อ ๗.๓ และ ๗.๔)</h1>
      <table><thead><tr>
        <th>เลขสำนวน</th><th>ประเภทสารบบ</th><th>เรื่องกล่าวหา</th><th>ผู้รับผิดชอบ/สังกัด</th><th>ผู้กล่าวหา</th><th>ผู้ถูกกล่าวหา</th><th>เลขคำสั่ง</th><th>ครั้งที่/วาระ</th><th>สถานะ</th>
      </tr></thead><tbody>
      ${rows.map(r => `<tr><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.procType)}</td><td>${escapeHtml(r.subject)}</td><td>${escapeHtml(r.owner)} (${escapeHtml(r.ownerOrg)})</td><td>${escapeHtml(r.complainant)}</td><td>${escapeHtml(r.accused)}</td><td>${escapeHtml(r.orderNo)}</td><td>${escapeHtml(r.meetingNo)} / ${escapeHtml(r.agendaNo)}</td><td>${escapeHtml(r.status)}</td></tr>`).join('')}
      </tbody></table></body></html>`);
      printWin.document.close();
      printWin.focus();
      printWin.print();
      ECMIS.toastOk('เปิดหน้าพิมพ์ PDF แล้ว');
    });

    let searchDebounceTimer = null;
    function debouncedSearch() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => { currentPage = 1; render(false); }, 250);
    }
    document.getElementById('btnSearch').addEventListener('click', () => { currentPage = 1; render(true); });

    document.getElementById('btnReset').addEventListener('click', () => {
      ['q', 'qAccused', 'qIdCard', 'qComplainant', 'qOwner', 'qOwnerOrg', 'qSubComm', 'qInvestTeam', 'qOrderNo', 'qProcType', 'qBase', 'qStatus', 'qMeetingNo', 'qAgendaNo', 'qDateFrom', 'qDateTo'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('qPastAgenda').checked = false;
      filter = 'all';
      document.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
      document.querySelector('.filter-chip[data-f="all"]')?.classList.add('active');
      currentPage = 1;
      render(true);
    });

    ['q', 'qAccused', 'qIdCard', 'qComplainant', 'qOwner', 'qSubComm', 'qInvestTeam', 'qOrderNo', 'qMeetingNo', 'qAgendaNo', 'qDateFrom', 'qDateTo'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('keyup', e => { if (e.key === 'Enter') { currentPage = 1; render(true); } });
        el.addEventListener('input', debouncedSearch);
      }
    });

    ['qOwnerOrg', 'qProcType', 'qStatus', 'qBase', 'qPastAgenda'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', () => { currentPage = 1; render(true); });
    });

    document.querySelectorAll('.filter-chip').forEach(b => b.addEventListener('click', () => {
      filter = b.dataset.f;
      document.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentPage = 1;
      render(true);
    }));

    (async function main() {
      render(true);
      try {
        const live = await loadAllCasesFromSupabase();
        ALL_CASES = (live && live.length) ? live : ECMIS.CASES.slice();
      } catch (err) {
        console.error('โหลดทะเบียนสำนวนจากฐานข้อมูลไม่สำเร็จ:', err);
        ALL_CASES = ECMIS.CASES.slice();
      }
      render(false);
    })();
  </script>
</body>

</html>
