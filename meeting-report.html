<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดทำรายงานมติการประชุม | E-CMIS</title>
  <link rel="icon" type="image/png" href="pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="assets/ecmis-app.css" rel="stylesheet">
  <link href="assets/a4-ecmis-workspace.css" rel="stylesheet">
</head>

<body>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-file-contract me-2"></i>จัดทำรายงานมติการประชุม</h1>
      </div>
      <div class="ms-auto text-end">
        <span class="flow-ref">รวบรวมมติที่ประชุมทุกเรื่องในวันประชุมเดียวกันเป็นรายงานฉบับเดียว</span>
      </div>
    </div>

    <div class="document-workspace" id="docWorkspace">
      <div>

        <div class="ws-card mb-3">
          <div class="card-header"><i class="fa-solid fa-calendar-check"></i> เลือกการประชุม</div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-6"><label class="form-label field-req">ครั้งที่ประชุม</label>
                <select class="form-select" id="meetNoSelect"></select>
              </div>
              <div class="col-md-6"><label class="form-label field-req">วันที่ประชุม</label>
                <input class="form-control" id="meetDate" type="date">
              </div>
            </div>
          </div>
        </div>

        <div class="ws-card mb-3">
          <div class="card-header d-flex align-items-center gap-2">
            <i class="fa-solid fa-list-check"></i> มติที่ประชุม — ทุกเรื่องในการประชุมนี้
            <span class="badge bg-primary rounded-pill ms-1" id="itemCount">0</span>
          </div>
          <div class="card-body p-0">
            <table class="table tbl-ecmis mb-0">
              <thead>
                <tr>
                  <th style="width:80px">วาระที่</th>
                  <th>เลขสำนวน / เรื่อง</th>
                  <th style="width:220px">มติที่ประชุม</th>
                  <th style="width:220px">สถานะการจัดทำมติ</th>
                </tr>
              </thead>
              <tbody id="itemsTb"></tbody>
            </table>
            <div class="text-center text-muted p-4 d-none" id="emptyState">
              <i class="fa-solid fa-folder-open fa-2x mb-2 d-block"></i>
              ไม่มีสำนวนที่บอร์ดมีมติแล้วสำหรับการประชุมครั้งนี้
            </div>
          </div>
        </div>

      </div>

      <aside class="ws-doc-pane" id="docCol" style="top:calc(var(--topbar-h) + 14px)">
        <button type="button" class="ws-doc-pane-rail" id="btnPaneExpand" title="ขยายแผงเอกสาร"><i class="fa-solid fa-angles-left"></i><span>เอกสาร</span></button>
        <div class="ws-doc-toolbar">
          <span class="name"><i class="fa-solid fa-file-word"></i> รายงานการประชุมคณะกรรมการ ป.ป.ท.
            <span class="badge-tpl">Mail-Merge</span></span>
          <button type="button" class="btn-doc-edit ms-auto" id="btnDocEdit" title="เปิด/ปิดโหมดแก้ไขเอกสาร">
            <i class="fa-solid fa-pen-to-square me-1"></i><span>แก้ไขเอกสาร</span>
          </button>
          <button class="btn btn-sm btn-light" onclick="window.print()" title="พิมพ์เฉพาะเอกสาร Preview"><i class="fa-solid fa-print"></i></button>
          <button type="button" class="ws-doc-pane-toggle" id="btnPaneCollapse" title="ย่อแผงเอกสาร"><i class="fa-solid fa-angles-right"></i></button>
        </div>
        <div class="doc-edit-bar" id="docEditBar" aria-label="แถบจัดรูปแบบ">
          <button type="button" data-format="bold" title="ตัวหนา"><b>B</b></button>
          <button type="button" data-format="italic" title="ตัวเอียง"><i>I</i></button>
          <button type="button" data-format="underline" title="ขีดเส้นใต้"><u>U</u></button>
          <span class="doc-edit-bar-sep"></span>
          <button type="button" data-format="undo" title="เลิกทำ"><i class="fa-solid fa-rotate-left"></i></button>
          <button type="button" data-format="redo" title="ทำซ้ำ"><i class="fa-solid fa-rotate-right"></i></button>
          <span class="doc-edit-bar-sep"></span>
          <button type="button" class="btn btn-sm btn-gold" id="btnSaveDocEdit" style="width:auto;padding:0 .6rem">บันทึกการแก้ไข</button>
        </div>
        <div class="ws-paper-stage" id="docPaper"></div>
      </aside>
    </div>

    <div id="actionBarSlot"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/ecmis-app.js"></script>
  <script src="assets/ecmis-model.js"></script>
  <script>
    ECMIS.renderShell('meeting-report.html');
    const role = ECMIS.currentRole();
    const mayEdit = ECMIS.can('compile.minutes', role.id);

    /* ---------- รวบรวมสำนวนที่บอร์ดมีมติแล้ว (RESOLVED) ตามครั้งที่ประชุม ---------- */
    const params = new URLSearchParams(location.search);
    const resolvedCases = ECMIS.CASES.filter(c => c.status === 'RESOLVED' && c.meetingNo && !ECMIS.isCase72(c));
    const meetingNos = [...new Set(resolvedCases.map(c => c.meetingNo))].sort();
    let currentMeetNo = params.get('meet') || meetingNos[0] || '';

    const meetSelect = document.getElementById('meetNoSelect');
    meetSelect.innerHTML = meetingNos.length
      ? meetingNos.map(n => `<option value="${n}" ${n === currentMeetNo ? 'selected' : ''}>ครั้งที่ ${n}</option>`).join('')
      : `<option value="">— ไม่มีสำนวนที่บอร์ดมีมติแล้ว —</option>`;

    function itemsForMeeting(meetNo) {
      return resolvedCases
        .filter(c => c.meetingNo === meetNo)
        .sort((a, b) => (parseFloat(a.agendaNo) || 0) - (parseFloat(b.agendaNo) || 0));
    }

    let items = itemsForMeeting(currentMeetNo);
    if (items[0]) document.getElementById('meetDate').value = items[0].meetingDate || '';

    function stageLabel(c) {
      if (!c.resolutionStage) return 'อยู่ระหว่างการจัดทำมติ';
      return ECMIS.resolutionStageLabel(c.resolutionStage) || 'จัดทำรายงานประชุมแล้วเสร็จ';
    }

    function renderItems() {
      const tb = document.getElementById('itemsTb');
      document.getElementById('itemCount').textContent = items.length;
      document.getElementById('emptyState').classList.toggle('d-none', items.length > 0);
      tb.innerHTML = items.map(c => {
        const res = ECMIS.resolutionOf(c.resolution);
        const stage = c.resolutionStage || 1;
        return `
    <tr>
      <td>${c.agendaNo || '—'}</td>
      <td><div class="fw-medium text-truncate" style="max-width:280px" title="${c.subject}">${c.id} — ${c.subject}</div></td>
      <td><span class="st st-done" style="font-size:.7rem" title="${res ? res.label : ''}">${res ? res.group : '—'}</span></td>
      <td>
        <span class="badge rounded-pill ${stage >= 6 ? 'bg-success' : 'bg-warning text-dark'}" style="font-size:.68rem">
          ${stage}. ${stageLabel(c)}
        </span>
      </td>
    </tr>`;
      }).join('');
    }

    /* ---------- เอกสาร ----------
       โครงสร้างตามรายงานการประชุมคณะกรรมการ ป.ป.ท. ฉบับจริงที่ลูกค้าให้มา — เปิดประชุม/รับรอง
       รายงานครั้งก่อน (วาระ 1-4) แล้วจึงเข้าเรื่องพิจารณา (วาระ 5) ต่อด้วยเรื่องอื่น ๆ (วาระ 6)
       ไม่ใช่แค่หัวข้อเดียวพร้อมรายการมติแบบเดิม */
    const SEC = ECMIS.getRole('board_sec');
    function runningHeader(pageNo) {
      return `
    <div class="doc-run-title">รายงานการประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${ECMIS.mergeField(currentMeetNo)} (ต่อ)</div>
    <div class="doc-run-page">- ${ECMIS.toThaiDigits(pageNo)} -</div>`;
    }

    function renderDoc() {
      const M = ECMIS.mergeField;
      const meetNo = currentMeetNo;
      const meetDate = ECMIS.thaiDate(document.getElementById('meetDate').value.trim());
      const meetTimeText = 'เวลา ๐๙.๓๐ นาฬิกา';

      const introBlock = `
      <div class="doc-title">รายงานการประชุม<br>คณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ</div>
      <div class="doc-sub">ครั้งที่ ${M(meetNo)} วันที่ ${M(meetDate)}</div>

      <div class="doc-indent" style="margin-top:8px">เริ่มประชุม${meetTimeText}</div>
      <div class="doc-indent" style="margin-top:6px">
        ประธานกรรมการ ป.ป.ท. กล่าวเปิดประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meetNo)} โดยเป็นการประชุมและ
        ชี้แจงผ่านสื่ออิเล็กทรอนิกส์ ตามพระราชกำหนดว่าด้วยการประชุมผ่านสื่ออิเล็กทรอนิกส์ พ.ศ. ๒๕๖๓
        และตามระเบียบคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ ว่าด้วยการประชุมคณะกรรมการ ป.ป.ท.
      </div>
      <div class="doc-indent" style="margin-top:6px">
        ${M(SEC.name)} ผู้อำนวยการกองบริหารคดี ปฏิบัติหน้าที่เลขานุการคณะกรรมการ ป.ป.ท. กล่าวต่อที่ประชุมว่า
        เพื่อให้เป็นไปตามระเบียบคณะกรรมการ ป.ป.ท. ว่าด้วยการประชุมคณะกรรมการ ป.ป.ท. จึงขออนุญาตให้ผู้ที่เกี่ยวข้อง
        เข้าร่วมประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meetNo)}
      </div>

      <div class="doc-h" style="margin-top:10px">ระเบียบวาระที่ ๑&emsp;เรื่องที่ประธานแจ้งให้ที่ประชุมทราบ</div>
      <div class="doc-indent">-ไม่มี-</div>

      <div class="doc-h" style="margin-top:10px">ระเบียบวาระที่ ๒&emsp;เรื่องรับรองรายงานการประชุมคณะกรรมการ ป.ป.ท.</div>
      <div class="doc-indent">รับรองรายงานการประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ผ่านมา</div>
      <div class="doc-indent" style="margin-top:4px"><strong>มติที่ประชุม</strong>&emsp;รับรองรายงานการประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ผ่านมาตามที่ฝ่ายเลขานุการเสนอ</div>

      <div class="doc-h" style="margin-top:10px">ระเบียบวาระที่ ๓&emsp;เรื่องที่เสนอให้ที่ประชุมทราบ</div>
      <div class="doc-indent">-ไม่มี-</div>

      <div class="doc-h" style="margin-top:10px">ระเบียบวาระที่ ๔&emsp;เรื่องสืบเนื่องจากการประชุม</div>
      <div class="doc-indent">-ไม่มี-</div>

      <div class="doc-h" style="margin-top:10px">ระเบียบวาระที่ ๕&emsp;เรื่องเสนอให้ที่ประชุมพิจารณา</div>`;

      const flowBlocks = items.length ? items.map(c => {
        const res = ECMIS.resolutionOf(c.resolution);
        const complainant = c.complainant ? `<div class="doc-indent" style="margin-top:2px">ผู้กล่าวหา&emsp;${M(c.complainant)}</div>` : '';
        const accusedList = (c.accused || []).length
          ? `<div class="doc-indent" style="margin-top:2px">ผู้ถูกร้อง&emsp;${(c.accused || []).map(a => `${M(a.name)} ${M(a.pos)}`).join(', ')}</div>`
          : '';
        const allegation = c.allegation ? `<div class="doc-indent" style="margin-top:2px">ข้อกล่าวหา&emsp;${M(c.allegation)}</div>` : '';
        return `
        <div style="margin-top:10px">
          <div class="doc-row"><span class="k">วาระที่ ${M(c.agendaNo)}</span> เรื่องที่ ${M(c.id)} กรณี ${M(c.subject)}</div>
          ${complainant}${accusedList}${allegation}
          <div class="doc-indent" style="margin-top:4px">
            <strong>มติที่ประชุม</strong>&emsp;ที่ประชุมพิจารณาแล้วมีมติ${M(res ? res.label : c.resolution)}
          </div>
        </div>`;
      }) : [`<div class="text-muted" style="margin-top:8px">— ไม่มีมติในการประชุมครั้งนี้ —</div>`];

      const signBlock = `
      <div class="doc-h" style="margin-top:16px">ระเบียบวาระที่ ๖&emsp;เรื่องอื่น ๆ</div>
      <div class="doc-indent">พิจารณากำหนดวัน เวลา ในการประชุมครั้งต่อไป</div>
      <div class="doc-indent" style="margin-top:6px">ปิดประชุมเวลา ๑๖.๓๐ นาฬิกา</div>

      <div class="doc-sign" style="margin-top:28px">
        <span class="doc-dots"></span><br>(${M(SEC.name)})<br>
        ${M(SEC.title)}<br>ผู้จัดทำรายงานการประชุม
      </div>`;

      ECMIS.paginateDoc(document.getElementById('docPaper'), { introBlock, flowBlocks, signBlock, runningHeaderHtml: runningHeader });
    }

    document.getElementById('meetDate').addEventListener('input', renderDoc);
    meetSelect.addEventListener('change', () => {
      currentMeetNo = meetSelect.value;
      items = itemsForMeeting(currentMeetNo);
      if (items[0]) document.getElementById('meetDate').value = items[0].meetingDate || '';
      renderItems(); renderDoc(); renderActions();
    });

    /* ---------- Document workspace: collapsible pane ---------- */
    const docWorkspace = document.getElementById('docWorkspace');
    const PANE_KEY = 'ecmis-meeting-report-docpane-collapsed';
    function setPaneCollapsed(collapsed) {
      docWorkspace.classList.toggle('pane-collapsed', collapsed);
      localStorage.setItem(PANE_KEY, collapsed ? '1' : '0');
    }
    if (localStorage.getItem(PANE_KEY) === '1') setPaneCollapsed(true);
    document.getElementById('btnPaneCollapse').addEventListener('click', () => setPaneCollapsed(true));
    document.getElementById('btnPaneExpand').addEventListener('click', () => setPaneCollapsed(false));

    ECMIS.initDocEditor({ stageId: 'docPaper', mayEdit: mayEdit });

    /* ---------- action bar ---------- */
    function renderActions() {
      const slot = document.getElementById('actionBarSlot');
      if (!mayEdit) { slot.innerHTML = ''; return; }
      const allDone = items.length > 0 && items.every(c => (c.resolutionStage || 1) >= 6);
      slot.innerHTML = `
    <button type="button" class="btn btn-outline-secondary btn-sm" data-act="save">
      <i class="fa-solid fa-floppy-disk me-1"></i>บันทึกร่างรายงาน</button>
    <button type="button" class="btn btn-navy btn-sm" data-act="confirm" ${items.length ? '' : 'disabled'}>
      <i class="fa-solid fa-check-double me-1"></i>${allDone ? 'รายงานการประชุมเสร็จสมบูรณ์แล้ว' : 'ยืนยันรายงานการประชุมเสร็จสมบูรณ์ — ทุกเรื่อง'}</button>`;
      document.querySelectorAll('#actionBarSlot [data-act]').forEach(b =>
        b.addEventListener('click', () => handle(b.dataset.act)));
    }

    function handle(act) {
      if (act === 'save') {
        ECMIS.saveCases();
        ECMIS.toastOk('บันทึกร่างรายงานการประชุมเรียบร้อย');
        return;
      }
      if (act === 'confirm') {
        if (!items.length) return;
        ECMIS.confirmAction({
          title: 'ยืนยันรายงานการประชุมเสร็จสมบูรณ์',
          html: `<p>รายงานการประชุมครั้งที่ <strong>${currentMeetNo}</strong> รวม <strong>${items.length}</strong> เรื่อง
            จะถูกทำเครื่องหมายว่า "จัดทำรายงานประชุมแล้วเสร็จ" (ขั้นตอนที่ 6) ทุกเรื่อง</p>`,
          confirmText: 'ยืนยันรายงานเสร็จสมบูรณ์'
        }).then(res => {
          if (!res.isConfirmed) return;
          items.forEach(c => ECMIS.Model.CaseStore.update(c.id, { resolutionStage: 6, meetingReportDone: true }));
          ECMIS.toastOk('บันทึกรายงานการประชุมเสร็จสมบูรณ์เรียบร้อย');
          renderItems(); renderActions();
        });
      }
    }

    ECMIS.initDocEditor({ stageId: 'docPaper', mayEdit: mayEdit });
    renderItems(); renderDoc(); renderActions();
  </script>
</body>

</html>
