<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการพิจารณา/ลงนาม | E-CMIS 7.1 ไต่สวนเบื้องต้น</title>
<link rel="icon" type="image/png" href="pacc_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<link href="assets/ecmis-app.css" rel="stylesheet">
</head>
<body>

<main class="app-main">

  <!-- Header -->
  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-file-signature me-2" style="color:#0F2A62"></i>รายการพิจารณา/ลงนาม</h1>
    </div>
    <span class="flow-ref ms-auto">ผัง: TO-BE ไต่สวนเบื้องต้น — ทุก Lane</span>
  </div>

  <div id="scopeBanner"></div>

  <!-- KPI Summary Cards (4 Cards - Interactive) -->
  <div class="row g-3 mb-4" id="kpiRow"></div>

  <!-- Filter & Search Bar -->
  <div class="card card-ecmis mb-4">
    <div class="card-body p-3">
      <div class="row g-3 align-items-end">
        <div class="col-md-5">
          <label class="form-label fw-semibold text-dark small mb-1">ค้นหางาน แฟ้ม หรือผู้ต้องหา</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control form-control-sm border-start-0" placeholder="ค้นหาเลขสำนวน เรื่องกล่าวหา หรือหน่วยงาน">
          </div>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold text-dark small mb-1">สถานะ</label>
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="ALL">ทั้งหมด</option>
            <option value="PENDING">รอพิจารณาลงนาม</option>
            <option value="SIGNED">ลงนามแล้ว</option>
            <option value="REJECTED">ไม่ลงนาม</option>
          </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button type="button" class="btn btn-sm btn-navy flex-fill py-1" id="btnApplyFilter">
            <i class="fa-solid fa-filter me-1"></i>ใช้ตัวกรอง
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-3" id="btnClearFilter">
            ล้าง
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3 align-items-start">
    <div class="col-12">

      <!-- Single Merged Table: รายการสำนวนพิจารณา/ลงนาม -->
      <div class="card card-ecmis mb-4">
        <div class="card-header d-flex align-items-center flex-wrap gap-2">
          <i class="fa-solid fa-list-check text-primary"></i>
          <span class="fw-bold">รายการสำนวนพิจารณา/ลงนาม</span>
          <span class="badge bg-primary rounded-pill ms-1" id="totalCount">0</span>
          <span class="ms-auto small text-muted" id="myRoleLabel"></span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover tbl-ecmis mb-0 align-middle">
              <colgroup>
                <col style="width:40px">
                <col style="width:130px">
                <col>
                <col style="width:200px">
                <col style="width:120px">
                <col style="width:140px">
              </colgroup>
              <thead>
                <tr>
                  <th class="text-center"><input type="checkbox" id="chkAll" class="form-check-input"></th>
                  <th class="sortable-header" data-sort="id" style="cursor:pointer">เลขสำนวน <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
                  <th>เรื่องกล่าวหา</th>
                  <th>สถานะ</th>
                  <th class="sortable-header" data-sort="slaDays" style="cursor:pointer">กำหนดเวลา <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
                  <th class="text-end">ดำเนินการ</th>
                </tr>
              </thead>
              <tbody id="myQueue"></tbody>
            </table>
          </div>
          <!-- Bulk actions & Pagination footer -->
          <div class="px-3 py-2 border-top d-flex align-items-center justify-content-between flex-wrap gap-2" id="queueFooter">
            <div id="bulkActionsBox" class="d-none align-items-center gap-2">
              <span class="small text-muted me-1" id="bulkSelectCount">เลือกแล้ว 0 รายการ</span>
              <button type="button" class="btn btn-xs btn-navy py-1 px-2" style="font-size:0.78rem" id="btnBulkApprove">
                <i class="fa-solid fa-check-double me-1"></i>อนุมัติรายการที่เลือก (Bulk Action)
              </button>
            </div>
            <nav aria-label="Queue navigation" class="ms-auto">
              <ul class="pagination pagination-sm m-0" id="queuePagination"></ul>
            </nav>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/ecmis-app.js"></script>
<script>
ECMIS.renderShell('01-work-inbox.html');

const role  = ECMIS.currentRole();
const all   = ECMIS.CASES;
/* คิวงานจริงของ กจ.7 = ต้องเป็นสำนวนที่เข้าขอบเขตแล้วเท่านั้น */
let mine    = ECMIS.inboxFor(role.id).filter(c => !ECMIS.isUpstreamCase(c));
let upstreamMine = ECMIS.inboxFor(role.id).filter(c => ECMIS.isUpstreamCase(c));

document.getElementById('myRoleLabel').textContent = `บทบาท: ${role.title}`;

if(ECMIS.isUpstreamRole(role.id)){
  document.getElementById('scopeBanner').innerHTML = `
    <div class="warn-note mb-3">
      <strong><i class="fa-solid fa-circle-info me-1"></i>บทบาทนี้อยู่นอกขอบเขตกิจกรรมที่ 7</strong><br>
      <strong>${role.title}</strong> เป็นส่วนหนึ่งของ<strong>การเสนอตามลำดับชั้นภายในกอง / สำนักงาน ป.ป.ท. เขต</strong>
      ซึ่งเป็นกระบวนงานของ <strong>กิจกรรมที่ 5 (ไต่สวนข้อเท็จจริง)</strong> ไม่ใช่กิจกรรมที่ 7
      <br><small>กิจกรรมที่ 7 เริ่มนับเมื่อรายงาน 213 มาถึง <strong>เลขาธิการคณะกรรมการ ป.ป.ท.</strong>
      — บทบาทนี้จึงมีเพียงสิทธิ์ <strong>ติดตามสถานะ</strong> สำนวนของตนเองในโมดูลนี้</small>
    </div>`;
}

/* ---------- KPI & Filter Linking ---------- */
function renderKPICards() {
  const currentSt = document.getElementById('statusFilter')?.value || 'ALL';
  const pendingCount = allCasesCombined.filter(c => c.status === 'PENDING_SECGEN' && !c.signedBySecgen).length;
  const signedCount = allCasesCombined.filter(c => c.signedBySecgen || c.status === 'RESOLVED' || c.status === 'CLOSED').length;
  const notSignedCount = allCasesCombined.filter(c => c.status === 'RETURNED' || c.m28 === 'REJECT' || c.m28 === 'DISMISS').length;

  const kpis = [
    { id:'ALL', n: allCasesCombined.length, l:'รายการทั้งหมด', i:'fa-folder-open', c:'#0F2A62' },
    { id:'PENDING', n: pendingCount, l:'รอพิจารณาลงนาม', i:'fa-hourglass-half', c:'#D0A830' },
    { id:'SIGNED', n: signedCount, l:'ลงนามแล้ว', i:'fa-circle-check', c:'#16A34A' },
    { id:'REJECTED', n: notSignedCount, l:'ไม่ลงนาม', i:'fa-circle-xmark', c:'#DB2626' }
  ];

  document.getElementById('kpiRow').innerHTML = kpis.map(k => {
    const isActive = currentSt === k.id;
    return `
    <div class="col-6 col-xl-3">
      <div class="card card-ecmis kpi-card h-100 ${isActive ? 'border-2 shadow-sm' : ''}"
           style="min-height:88px; cursor:pointer; ${isActive ? `border-color:${k.c} !important; background:${k.c}0D;` : ''}"
           onclick="filterByKPI('${k.id}')">
        <div class="card-body d-flex align-items-center gap-3 py-3">
          <div style="flex:0 0 42px;height:42px;border-radius:10px;background:${k.c}18;display:flex;align-items:center;justify-content:center">
            <i class="fa-solid ${k.i}" style="color:${k.c};font-size:1.15rem"></i>
          </div>
          <div style="min-width:0">
            <div style="font-size:1.65rem;font-weight:700;font-family:var(--serif);color:${k.c};line-height:1.1">${k.n}</div>
            <div class="text-muted text-truncate" style="font-size:.78rem;margin-top:2px">${k.l}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterByKPI(statusId) {
  const sf = document.getElementById('statusFilter');
  if (sf) sf.value = statusId;
  applyFilters();
}

/* ---------- ปลายทางของแต่ละบทบาท ---------- */
const PAGE_FOR = {
  owner:'03-report-213.html', section_head:'03-report-213.html',
  director:'03-report-213.html', deputy:'03-report-213.html',
  secgen:'04-approval-review.html', support_sub:'04-approval-review.html',
  chair_office:'06-chairman-agenda.html',
  chairman:'06-chairman-agenda.html', subcommittee:'07-subcommittee-screening.html',
  board_sec:'08-board-resolution.html', board:'08-board-resolution.html'
};

// --- Single Merged Dataset ---
const watchBase = upstreamMine.concat(
  all.filter(c => !ECMIS.canAct(c, role.id) && !ECMIS.isUpstreamCase(c) &&
    ['owner','board_sec','dir_case','secgen'].includes(role.id)));

// Deduplicate cases
const allCasesCombinedMap = new Map();
mine.forEach(c => allCasesCombinedMap.set(c.id, { caseData: c, isActionable: true }));
watchBase.forEach(c => {
  if (!allCasesCombinedMap.has(c.id)) {
    allCasesCombinedMap.set(c.id, { caseData: c, isActionable: false });
  }
});

const allCasesCombined = Array.from(allCasesCombinedMap.values()).map(item => {
  const c = item.caseData;
  // Check if case is currently pending for action
  const isPendingAction = (c.status === 'PENDING_SECGEN' && !c.signedBySecgen);
  return { ...c, isActionable: item.isActionable || isPendingAction };
});

// --- Pagination & Sorting State ---
let currentPage = 1;
const pageSize = 10;
let sortField = 'id';
let sortOrder = 'asc';

function row(c){
  const target = `${PAGE_FOR[role.id] || '02-case-register.html'}?case=${encodeURIComponent(c.id)}`;
  const isPendingAction = (c.status === 'PENDING_SECGEN' && !c.signedBySecgen);
  
  let statusBadgeHtml = '';
  if (c.signedBySecgen) {
    const signDate = c.secgenSignedAt || '04 ส.ค. 2569';
    statusBadgeHtml = `<span class="st st-done"><i class="fa-solid fa-check me-1"></i>ลงนามแล้ว</span>
      <small class="text-muted d-block mt-1" style="font-size:0.73rem;">ลงนามเมื่อ ${signDate}</small>`;
  } else if (isPendingAction) {
    statusBadgeHtml = `<span class="st st-pending"><i class="fa-solid fa-circle text-warning me-1" style="font-size:0.5rem"></i>รอพิจารณาลงนาม</span>`;
  } else {
    statusBadgeHtml = ECMIS.statusBadge(c.status);
  }

  return `<tr>
    <td class="text-center">
      ${isPendingAction ? `<input type="checkbox" class="case-chk form-check-input" data-id="${c.id}">` : '<i class="fa-solid fa-lock text-muted" style="font-size:0.75rem"></i>'}
    </td>
    <td class="case-no">${c.id}${c.urgent?' <span class="st st-urgent ms-1">ด่วน</span>':''}</td>
    <td style="max-width:340px">
      <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
      <small class="text-muted d-block" style="font-size:0.75rem">${c.ownerOrg}</small>
    </td>
    <td>${statusBadgeHtml}</td>
    <td>${ECMIS.slaBadge(c)}</td>
    <td class="text-end">
      ${isPendingAction ? `
        <a href="${target}" class="btn btn-sm btn-navy px-3">
          <i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ
        </a>
      ` : `
        <a href="${target}" class="btn btn-sm btn-outline-secondary px-3">
          <i class="fa-regular fa-eye me-1"></i>ดูรายละเอียด
        </a>
      `}
    </td>
  </tr>`;
}

let filteredCombined = [...allCasesCombined];

function renderMyQueue(loading = false) {
  const tbody = document.getElementById('myQueue');
  
  if (loading) {
    let skeletons = '';
    for(let i=0; i<Math.min(pageSize, filteredCombined.length || 3); i++) {
      skeletons += `
        <tr class="skeleton-row">
          <td><div class="skeleton-box" style="width:20px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td><div class="skeleton-box" style="width:220px"></div></td>
          <td><div class="skeleton-box" style="width:120px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td class="text-end"><div class="skeleton-box ms-auto" style="width:80px"></div></td>
        </tr>`;
    }
    tbody.innerHTML = skeletons;
    
    document.getElementById('bulkActionsBox').className = 'd-none';
    const chkAll = document.getElementById('chkAll');
    if (chkAll) chkAll.checked = false;
    
    setTimeout(() => {
      renderMyQueue(false);
    }, 250);
    return;
  }

  const sorted = [...filteredCombined].sort((a, b) => {
    // Primary sort: Priority to pending actions (รอพิจารณาลงนาม)
    const isPendingA = (a.status === 'PENDING_SECGEN' && !a.signedBySecgen) ? 1 : 0;
    const isPendingB = (b.status === 'PENDING_SECGEN' && !b.signedBySecgen) ? 1 : 0;

    if (isPendingA !== isPendingB) {
      return isPendingB - isPendingA; // Pending actions come first
    }

    // Secondary sort: Selected sort field
    let valA = a[sortField];
    let valB = b[sortField];
    if (sortField === 'slaDays') {
      valA = a.slaDays;
      valB = b.slaDays;
    }
    if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
    if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
    return 0;
  });

  const totalItems = sorted.length;
  const totalPages = Math.ceil(totalItems / pageSize) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * pageSize;
  const paginated = sorted.slice(startIdx, startIdx + pageSize);

  tbody.innerHTML = paginated.length
    ? paginated.map(c => row(c)).join('')
    : `<tr><td colspan="6" class="text-center text-muted py-4">
         <i class="fa-regular fa-face-smile fa-lg mb-2 d-block"></i>
         ไม่มีรายการสำนวนในเงื่อนไขการค้นหา<br>
         <small>ลองเปลี่ยนข้อความค้นหาหรือตัวกรองสถานะ</small></td></tr>`;

  const totalCountEl = document.getElementById('totalCount');
  if (totalCountEl) totalCountEl.textContent = filteredCombined.length;

  const paginUl = document.getElementById('queuePagination');
  let paginHtml = `
    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">«</a>
    </li>`;
  for (let i = 1; i <= totalPages; i++) {
    paginHtml += `
      <li class="page-item ${currentPage === i ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
      </li>`;
  }
  paginHtml += `
    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">»</a>
    </li>`;
  paginUl.innerHTML = paginHtml;

  initCheckboxHandlers();
}

function changePage(p) {
  currentPage = p;
  renderMyQueue(true);
}

document.querySelectorAll('.sortable-header').forEach(header => {
  header.addEventListener('click', () => {
    const field = header.dataset.sort;
    if (sortField === field) {
      sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      sortField = field;
      sortOrder = 'asc';
    }
    
    document.querySelectorAll('.sortable-header i').forEach(icon => {
      icon.className = 'fa-solid fa-sort text-muted';
    });
    const activeIcon = header.querySelector('i');
    if (activeIcon) activeIcon.className = `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'}`;
    
    renderMyQueue(true);
  });
});

function initCheckboxHandlers() {
  const chkAll = document.getElementById('chkAll');
  const chks = document.querySelectorAll('.case-chk');

  if (!chkAll) return;
  chkAll.addEventListener('change', () => {
    chks.forEach(chk => chk.checked = chkAll.checked);
    updateBulkActionsState();
  });

  chks.forEach(chk => {
    chk.addEventListener('change', () => {
      chkAll.checked = Array.from(chks).every(c => c.checked);
      updateBulkActionsState();
    });
  });
}

function updateBulkActionsState() {
  const chks = document.querySelectorAll('.case-chk:checked');
  const bulkBox = document.getElementById('bulkActionsBox');
  const bulkCount = document.getElementById('bulkSelectCount');

  if (!bulkBox) return;
  if (chks.length > 0) {
    bulkBox.className = 'd-flex align-items-center gap-2';
    if (bulkCount) bulkCount.textContent = `เลือกแล้ว ${chks.length} รายการ`;
  } else {
    bulkBox.className = 'd-none';
  }
}

document.getElementById('btnBulkApprove')?.addEventListener('click', () => {
  const chks = document.querySelectorAll('.case-chk:checked');
  if (!chks.length) return;

  ECMIS.confirmAction({
    title: `ยืนยันดำเนินการกลุ่มจำนวน ${chks.length} รายการ`,
    html: `<p>ระบบจะอนุมัติและเสนอสำนวนที่เลือกทั้งหมดตามบทบาทปัจจุบันของคุณ</p>
           <div class="law-note">นี่เป็นการสั่งการแบบกลุ่ม (Bulk Action) ซึ่งจะบันทึกสถานะใหม่ลงในประวัติและ Audit Trail</div>`,
    confirmText: 'ยืนยันสั่งการกลุ่ม'
  }).then(res => {
    if (res.isConfirmed) {
      chks.forEach(chk => {
        const id = chk.dataset.id;
        const c = ECMIS.CASES.find(x => x.id === id);
        if (c) {
          const transitionMap = {
            'PENDING_SECGEN': c.urgent ? 'PENDING_CHAIRMAN' : 'IN_SCREENING',
            'PENDING_CHAIR_OF': 'PENDING_CHAIRMAN',
            'PENDING_CHAIRMAN': 'IN_SCREENING',
            'IN_SCREENING': 'AGENDA_SET',
            'AGENDA_SET': 'IN_MEETING',
            'IN_MEETING': 'RESOLVED_PENDING',
            'RESOLVED_PENDING': 'RESOLVED',
            'RESOLVED': 'DISPATCHING',
            'DISPATCHING': 'CLOSED'
          };
          if (transitionMap[c.status]) {
            c.status = transitionMap[c.status];
          }
        }
      });
      ECMIS.saveCases();
      ECMIS.toastOk(`สั่งการกลุ่มสำเร็จจำนวน ${chks.length} รายการแล้ว`);
      setTimeout(() => location.reload(), 1200);
    }
  });
});

/* ---------- Client-side Dynamic Status & Filter Logic ---------- */
function populateStatusFilter() {
  const select = document.getElementById('statusFilter');
  if (!select) return;

  const currentVal = select.value || 'ALL';
  const statusMap = new Map();
  statusMap.set('ALL', { label: 'ทั้งหมด (ทุกสถานะ)', count: allCasesCombined.length });

  allCasesCombined.forEach(c => {
    let key, label;
    if (c.signedBySecgen) {
      key = 'SIGNED';
      label = 'ลงนามแล้ว';
    } else if (c.status === 'PENDING_SECGEN') {
      key = 'PENDING_SECGEN';
      label = 'รอพิจารณาลงนาม';
    } else {
      key = c.status;
      label = ECMIS.STATUS[c.status]?.label || c.status;
    }

    if (!statusMap.has(key)) {
      statusMap.set(key, { label, count: 0 });
    }
    statusMap.get(key).count++;
  });

  let optionsHtml = '';
  statusMap.forEach((val, key) => {
    const isSelected = currentVal === key ? 'selected' : '';
    optionsHtml += `<option value="${key}" ${isSelected}>${val.label} (${val.count})</option>`;
  });

  select.innerHTML = optionsHtml;
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const st = document.getElementById('statusFilter').value;

  filteredCombined = allCasesCombined.filter(c => {
    const matchQ = !q || c.id.toLowerCase().includes(q) || (c.subject && c.subject.toLowerCase().includes(q)) || (c.ownerOrg && c.ownerOrg.toLowerCase().includes(q));
    let matchSt = true;
    if (st !== 'ALL') {
      if (st === 'PENDING_SECGEN' || st === 'PENDING') {
        matchSt = c.status === 'PENDING_SECGEN' && !c.signedBySecgen;
      } else if (st === 'SIGNED') {
        matchSt = !!c.signedBySecgen || c.status === 'RESOLVED' || c.status === 'CLOSED';
      } else if (st === 'REJECTED') {
        matchSt = c.status === 'RETURNED' || c.m28 === 'REJECT' || c.m28 === 'DISMISS';
      } else {
        matchSt = c.status === st;
      }
    }
    return matchQ && matchSt;
  });

  currentPage = 1;
  renderKPICards();
  renderMyQueue(true);
}

document.getElementById('btnApplyFilter').addEventListener('click', applyFilters);
document.getElementById('searchInput').addEventListener('keyup', (e) => {
  if (e.key === 'Enter') applyFilters();
});
document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('btnClearFilter').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = 'ALL';
  applyFilters();
});

// Initial load
populateStatusFilter();
applyFilters();

</script>
