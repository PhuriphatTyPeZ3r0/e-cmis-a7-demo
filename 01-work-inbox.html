<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการพิจารณา/ลงนาม | E-CMIS 7.1 ไต่สวนเบื้องต้น</title>
<link rel="icon" type="image/png" href="pacc_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<link href="assets/ecmis-app.css" rel="stylesheet">
<style>
.btn-xs { font-size: 0.76rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
.bg-purple { background-color: #7E22CE !important; }
.border-purple { border-color: #A855F7 !important; }
.kpi-card { transition: all 0.2s ease; }
.kpi-card:hover { transform: translateY(-2px); shadow: 0 4px 12px rgba(0,0,0,0.08); }
</style>
</head>
<body>

<main class="app-main">

  <!-- Header -->
  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-file-signature me-2" id="pageTitleIcon" style="color:#0F2A62"></i><span id="pageTitleText">รายการพิจารณา/ลงนาม</span></h1>
    </div>
    <span class="flow-ref ms-auto" id="flowRefText">ผัง: TO-BE ไต่สวนเบื้องต้น — ทุก Lane</span>
  </div>

  <div id="scopeBanner"></div>

  <!-- KPI Summary Cards (4 Cards - Interactive Filter) -->
  <div class="row g-3 mb-4" id="kpiRow"></div>

  <!-- Filter & Search Bar -->
  <div class="card card-ecmis mb-4">
    <div class="card-body p-3">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-magnifying-glass me-1 text-muted"></i>ค้นหางาน แฟ้ม หรือผู้ต้องหา</label>
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="ค้นหาเลขสำนวน เรื่องกล่าวหา หรือหน่วยงาน">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-pen-to-square me-1 text-muted"></i>สถานะเสนอ/ลงนาม</label>
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="ALL">ทั้งหมด (ทุกการเสนอ)</option>
            <option value="PENDING">รอเลขาพิจารณาลงนาม</option>
            <option value="SIGNED">ลงนามแล้ว</option>
            <option value="RETURNED">ไม่ลงนาม / ตีกลับ</option>
            <option value="SCREENING">ส่งให้อนุกลั่นกรองพิจารณา</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-diagram-project me-1 text-primary"></i>สถานะติดตาม</label>
          <select id="act7Filter" class="form-select form-select-sm">
            <option value="ALL">ทุกขั้นตอนติดตาม (14 สถานะ)</option>
            <optgroup label="Section 1: ขั้นตอนเสนอกลั่นกรองและบรรจุวาระ">
              <option value="SEC1">-- รวม Section 1 ทั้งหมด --</option>
              <option value="รอเลขาธิการ ป.ป.ท. ลงความเห็น">รอเลขาธิการ ป.ป.ท. ลงความเห็น</option>
              <option value="อยู่ระหว่างกลั่นกรองโดยอนุกรรมการฯ">อยู่ระหว่างกลั่นกรองโดยอนุกรรมการฯ</option>
              <option value="รอประธานอนุมัติบรรจุวาระ">รอประธานอนุมัติบรรจุวาระ</option>
              <option value="บรรจุระเบียบวาระการประชุมแล้ว">บรรจุระเบียบวาระการประชุมแล้ว</option>
            </optgroup>
            <optgroup label="Section 2: ขั้นตอนการพิจารณาของคณะกรรมการ ป.ป.ท.">
              <option value="SEC2">-- รวม Section 2 ทั้งหมด --</option>
              <option value="อยู่ระหว่างพิจารณาโดยคณะกรรมการ ป.ป.ท.">อยู่ระหว่างพิจารณาโดยคณะกรรมการ ป.ป.ท.</option>
              <option value="บอร์ดมีมติแล้ว - รอจัดทำรายงานการประชุม">บอร์ดมีมติแล้ว - รอจัดทำรายงานการประชุม</option>
            </optgroup>
            <optgroup label="Section 3: ขั้นตอนหลังบอร์ดมีมติ / คำสั่ง / การดำเนินการ">
              <option value="SEC3">-- รวม Section 3 ทั้งหมด --</option>
              <option value="บอร์ดมีมติรับไต่สวน - รอจัดทำคำสั่ง ม.24">บอร์ดมีมติรับไต่สวน - รอจัดทำคำสั่ง ม.24</option>
              <option value="อยู่ระหว่างเสนอลงนามคำสั่ง ม.24 วรรคแรก">อยู่ระหว่างเสนอลงนามคำสั่ง ม.24 วรรคแรก</option>
              <option value="อยู่ระหว่างเสนอลงนามคำสั่ง ม.24 วรรคสาม">อยู่ระหว่างเสนอลงนามคำสั่ง ม.24 วรรคสาม</option>
              <option value="บอร์ดมีมติไม่รับไต่สวน - รอดำเนินการปิดสำนวน">บอร์ดมีมติไม่รับไต่สวน - รอดำเนินการปิดสำนวน</option>
              <option value="บอร์ดมีมติส่ง ป.ป.ช.">บอร์ดมีมติส่ง ป.ป.ช.</option>
              <option value="บอร์ดมีมติส่งไต่สวนพยานเพิ่มเติม">บอร์ดมีมติส่งไต่สวนพยานเพิ่มเติม</option>
              <option value="บอร์ดมีมติอื่นๆ - ส่งแจ้งประสานงานหน่วยงาน">บอร์ดมีมติอื่นๆ - ส่งแจ้งประสานงานหน่วยงาน</option>
            </optgroup>
            <optgroup label="Section 4: ขั้นตอนส่งออกและเสร็จสิ้น">
              <option value="SEC4">-- รวม Section 4 ทั้งหมด --</option>
              <option value="ส่งออกผลมติและคำสั่งเรียบร้อย">ส่งออกผลมติและคำสั่งเรียบร้อย</option>
            </optgroup>
          </select>
        </div>
        <div class="col-md-2 text-end">
          <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-3 w-100" id="btnClearFilter">
            <i class="fa-solid fa-rotate-left me-1"></i>ล้างตัวกรอง
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3 align-items-start">
    <div class="col-12">

      <!-- Single Table: รายการสำนวนพิจารณา/ลงนาม และติดตามผล Activity 7 -->
      <div class="card card-ecmis mb-4">
        <div class="card-header d-flex align-items-center flex-wrap gap-2">
          <i class="fa-solid fa-list-check text-primary"></i>
          <span class="fw-bold" id="card1TitleText">รายการสำนวนพิจารณา/ลงนาม และติดตามผลกิจกรรมที่ 7</span>
          <span class="badge bg-primary rounded-pill ms-1" id="totalCount">0</span>
          <span class="ms-auto small text-muted" id="myRoleLabel"></span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover tbl-ecmis mb-0 align-middle">
              <colgroup>
                <col style="width:40px">
                <col style="width:125px">
                <col>
                <col style="width:160px">
                <col style="width:250px">
                <col style="width:115px">
                <col style="width:130px">
              </colgroup>
              <thead>
                <tr>
                  <th class="text-center"><input type="checkbox" id="chkAll" class="form-check-input"></th>
                  <th class="sortable-header" data-sort="id" style="cursor:pointer">เรื่องที่ <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
                  <th>เรื่องกล่าวหา</th>
                  <th>สถานะเสนอ/ลงนาม</th>
                  <th class="sortable-header" data-sort="act7Status" style="cursor:pointer">สถานะติดตาม <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
                  <th class="sortable-header" data-sort="slaDays" style="cursor:pointer">กำหนดเวลา <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
                  <th class="text-end">ดำเนินการ</th>
                </tr>
              </thead>
              <tbody id="myQueue"></tbody>
            </table>
          </div>
          <!-- Bulk actions & Pagination footer -->
          <div class="px-3 py-2 border-top d-flex align-items-center justify-content-between flex-wrap gap-2" id="queueFooter">
            <div id="bulkActionsBox" class="d-none align-items-center gap-2">
              <span class="small text-muted me-1" id="bulkSelectCount">เลือกแล้ว 0 รายการ</span>
              <button type="button" class="btn btn-xs btn-navy py-1 px-2" style="font-size:0.78rem" id="btnBulkApprove">
                <i class="fa-solid fa-check-double me-1"></i><span id="bulkBtnText">อนุมัติรายการที่เลือก (Bulk Action)</span>
              </button>
            </div>
            <nav aria-label="Queue navigation" class="ms-auto">
              <ul class="pagination pagination-sm m-0" id="queuePagination"></ul>
            </nav>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/ecmis-app.js"></script>
<script>
ECMIS.renderShell('01-work-inbox.html');

const role  = ECMIS.currentRole();
const all   = ECMIS.CASES;
/* คิวงานจริงของ กจ.7 = ต้องเป็นสำนวนที่เข้าขอบเขตแล้วเท่านั้น */
let mine    = ECMIS.inboxFor(role.id).filter(c => !ECMIS.isUpstreamCase(c));

const mineIds = new Set(mine.map(c => c.id));
function isMyPending(c){ return mineIds.has(c.id); }

const DEFAULT_COPY = {
  pageTitle:  'รายการพิจารณา/ลงนาม',
  pageIcon:   'fa-file-signature',
  flowRef:    'ผัง: TO-BE ไต่สวนเบื้องต้น — ทุก Lane',
  card1Title: 'รายการสำนวนพิจารณา/ลงนาม และติดตามผลกิจกรรมที่ 7',
  kpiPending: 'รอเลขาพิจารณาลงนาม', kpiDone: 'ลงนามแล้ว', kpiReturned: 'ไม่ลงนาม / ตีกลับ',
  stPending:  'รอเลขาพิจารณาลงนาม', stDone:  'ลงนามแล้ว', stReturned:  'ไม่ลงนาม / ตีกลับ',
  bulkBtn:    'อนุมัติรายการที่เลือก (Bulk Action)',
  bulkTitle:  n => `ยืนยันดำเนินการกลุ่มจำนวน ${n} รายการ`,
  bulkBody:   'ระบบจะอนุมัติและเสนอสำนวนที่เลือกทั้งหมดตามบทบาทปัจจุบันของคุณ'
};
const ROLE_COPY = {
  board_sec: {
    pageTitle:  'รายการรอบันทึกมติ/จัดทำเอกสาร',
    pageIcon:   'fa-scale-balanced',
    flowRef:    'ผัง: TO-BE P2 Core Workflow — T13 → T14 (กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ)',
    card1Title: 'รายการสำนวนที่ต้องบันทึกมติ/จัดทำเอกสาร และติดตามผลกิจกรรมที่ 7',
    kpiPending: 'รอบันทึกมติ', kpiDone: 'บันทึกมติแล้ว', kpiReturned: 'ยังไม่บันทึก',
    stPending:  'รอบันทึกมติ', stDone:  'บันทึกมติแล้ว', stReturned:  'ยังไม่บันทึก / ส่งคืน',
    bulkBtn:    'บันทึกมติรายการที่เลือก (Bulk Action)',
    bulkTitle:  n => `ยืนยันบันทึกมติกลุ่มจำนวน ${n} รายการ`,
    bulkBody:   'ระบบจะบันทึกมติและดำเนินการสำนวนที่เลือกทั้งหมดตามขั้นตอนของกลุ่มงานคำวินิจฉัยและมติคณะกรรมการ'
  }
};
const copy = Object.assign({}, DEFAULT_COPY, ROLE_COPY[role.id] || {});

document.title = `${copy.pageTitle} | E-CMIS 7.1 ไต่สวนเบื้องต้น`;
document.getElementById('pageTitleText').textContent = copy.pageTitle;
document.getElementById('pageTitleIcon').className = `fa-solid ${copy.pageIcon} me-2`;
document.getElementById('flowRefText').textContent = copy.flowRef;
document.getElementById('card1TitleText').textContent = copy.card1Title;
document.getElementById('bulkBtnText').textContent = copy.bulkBtn;

document.getElementById('myRoleLabel').textContent = `บทบาท: ${role.title}`;

if(ECMIS.isUpstreamRole(role.id)){
  document.getElementById('scopeBanner').innerHTML = `
    <div class="warn-note mb-3">
      <strong><i class="fa-solid fa-circle-info me-1"></i>บทบาทนี้อยู่นอกขอบเขตกิจกรรมที่ 7</strong><br>
      <strong>${role.title}</strong> เป็นส่วนหนึ่งของ<strong>การเสนอตามลำดับชั้นภายในกอง / สำนักงาน ป.ป.ท. เขต</strong>
      ซึ่งเป็นกระบวนงานของ <strong>กิจกรรมที่ 5 (ไต่สวนข้อเท็จจริง)</strong> ไม่ใช่กิจกรรมที่ 7
      <br><small>กิจกรรมที่ 7 เริ่มนับเมื่อรายงาน 213 มาถึง <strong>เลขาธิการคณะกรรมการ ป.ป.ท.</strong>
      — บทบาทนี้จึงมีเพียงสิทธิ์ <strong>ติดตามสถานะ</strong> สำนวนของตนเองในโมดูลนี้</small>
    </div>`;
}

/* ---------- Single Unified Dataset ---------- */
const allCasesCombinedMap = new Map();
mine.forEach(c => allCasesCombinedMap.set(c.id, { caseData: c, isActionable: true }));
all.forEach(c => {
  if (!allCasesCombinedMap.has(c.id)) {
    allCasesCombinedMap.set(c.id, { caseData: c, isActionable: false });
  }
});

const allCasesCombined = Array.from(allCasesCombinedMap.values()).map(item => {
  const c = item.caseData;
  return { ...c, isActionable: item.isActionable || isMyPending(c) };
});

/* ---------- KPI Summary Cards (5 Cards) ---------- */
function renderKPICards() {
  const currentSt = document.getElementById('statusFilter')?.value || 'ALL';

  const pendingCount = allCasesCombined.filter(c => (isMyPending(c) || c.status === 'PENDING_SECGEN' || c.status === 'IN_SUPPORT_SUB' || c.status === 'PENDING_URGENT' || c.status === 'DRAFT') && c.status !== 'IN_SCREENING').length;
  const signedCount = allCasesCombined.filter(c => c.signedBySecgen || c.status === 'AGENDA_SET' || c.status === 'IN_MEETING' || c.status === 'RESOLVED_PENDING' || c.status === 'RESOLVED' || c.status === 'DISPATCHING' || c.status === 'CLOSED' || c.status === 'PENDING_CHAIR_OF' || c.status === 'PENDING_CHAIRMAN').length;
  const returnedCount = allCasesCombined.filter(c => c.status === 'RETURNED' || c.m28 === 'REJECT' || c.m28 === 'DISMISS').length;
  const screeningCount = allCasesCombined.filter(c => c.status === 'IN_SCREENING').length;

  const kpis = [
    { id:'ALL', n: allCasesCombined.length, l:'รายการทั้งหมด', i:'fa-folder-open', c:'#0F2A62' },
    { id:'PENDING', n: pendingCount, l:copy.kpiPending || 'รอเลขาพิจารณาลงนาม', i:'fa-hourglass-half', c:'#D0A830' },
    { id:'SIGNED', n: signedCount, l:copy.kpiDone || 'ลงนามแล้ว', i:'fa-circle-check', c:'#16A34A' },
    { id:'RETURNED', n: returnedCount, l:copy.kpiReturned || 'ไม่ลงนาม / ตีกลับ', i:'fa-circle-xmark', c:'#DB2626' },
    { id:'SCREENING', n: screeningCount, l:'ส่งให้อนุกลั่นกรองพิจารณา', i:'fa-users-gear', c:'#0284C7' }
  ];

  document.getElementById('kpiRow').innerHTML = kpis.map(k => {
    const isActive = (currentSt === k.id);
    return `
    <div class="col-12 col-sm-6 col-md-4 col-xl">
      <div class="card card-ecmis kpi-card h-100 ${isActive ? 'border-2 shadow-sm' : ''}"
           style="min-height:88px; cursor:pointer; ${isActive ? `border-color:${k.c} !important; background:${k.c}0D;` : ''}"
           onclick="filterByKPI('${k.id}')">
        <div class="card-body d-flex align-items-center gap-2 py-3 px-3">
          <div style="flex:0 0 38px;height:38px;border-radius:10px;background:${k.c}18;display:flex;align-items:center;justify-content:center">
            <i class="fa-solid ${k.i}" style="color:${k.c};font-size:1.05rem"></i>
          </div>
          <div style="min-width:0">
            <div style="font-size:1.5rem;font-weight:700;font-family:var(--serif);color:${k.c};line-height:1.1">${k.n}</div>
            <div class="text-muted text-truncate" style="font-size:.74rem;margin-top:2px" title="${k.l}">${k.l}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterByKPI(statusId) {
  const sf = document.getElementById('statusFilter');
  if (sf) {
    sf.value = statusId;
  }
  applyFilters();
}

/* ---------- Target page for roles ---------- */
const PAGE_FOR = {
  owner:'03-report-213.html', section_head:'03-report-213.html',
  director:'03-report-213.html', deputy:'03-report-213.html',
  secgen:'04-approval-review.html', support_sub:'04-approval-review.html',
  chair_office:'06-chairman-agenda.html',
  chairman:'06-chairman-agenda.html', subcommittee:'07-subcommittee-screening.html',
  board_sec:'08-board-resolution.html', board:'08-board-resolution.html'
};

// --- Pagination & Sorting State ---
let currentPage = 1;
const pageSize = 10;
let sortField = 'id';
let sortOrder = 'asc';

/* ฟังก์ชันกำหนด Badge สถานะการเสนอ/ลงนาม ของเลขาธิการฯ ให้มีเฉพาะ 4 สถานะหลักตามกำหนด */
function getSecgenActionBadge(c) {
  const isPendingAction = isMyPending(c);

  if (c.status === 'IN_SCREENING') {
    return `<span class="st st-review"><i class="fa-solid fa-users-gear me-1"></i>ส่งให้อนุกลั่นกรองพิจารณา</span>`;
  }
  if (c.status === 'RETURNED' || c.m28 === 'REJECT' || c.m28 === 'DISMISS') {
    return `<span class="st st-returned"><i class="fa-solid fa-xmark me-1"></i>ไม่ลงนาม / ตีกลับ</span>`;
  }
  if (isPendingAction || c.status === 'PENDING_SECGEN' || c.status === 'IN_SUPPORT_SUB' || c.status === 'PENDING_URGENT' || c.status === 'DRAFT') {
    return `<span class="st st-pending"><i class="fa-solid fa-circle text-warning me-1" style="font-size:0.5rem"></i>รอเลขาพิจารณาลงนาม</span>`;
  }
  if (c.signedBySecgen || c.status === 'AGENDA_SET' || c.status === 'IN_MEETING' || c.status === 'RESOLVED_PENDING' || c.status === 'RESOLVED' || c.status === 'DISPATCHING' || c.status === 'CLOSED' || c.status === 'PENDING_CHAIR_OF' || c.status === 'PENDING_CHAIRMAN') {
    return `<span class="st st-done"><i class="fa-solid fa-check me-1"></i>ลงนามแล้ว</span>`;
  }
  return `<span class="st st-pending"><i class="fa-solid fa-circle text-warning me-1" style="font-size:0.5rem"></i>รอเลขาพิจารณาลงนาม</span>`;
}

function row(c){
  /* สำนวนกิจกรรมที่ 7.2 (docType RULING) ต้องหาปลายทางจาก "สถานะของสำนวน"
     ไม่ใช่จากบทบาทผู้ดูอย่างเดียว เพราะบทบาทเดียวกัน (เช่น section_head)
     ไปคนละหน้าตามชนิดสำนวนที่ค้างอยู่ — ต่างจาก 7.1 ที่แต่ละบทบาทมีปลายทาง
     ตายตัวหน้าเดียวเสมอ ดู ECMIS.PAGE_FOR_72 ในไฟล์ ecmis-app.js            */
  const is72 = ECMIS.isCase72(c);
  const page = is72 ? ECMIS.pageForCase72(c) : (PAGE_FOR[role.id] || '02-case-register.html');
  const target = `${page}?case=${encodeURIComponent(c.id)}`;
  const isPendingAction = isMyPending(c);

  const statusBadgeHtml = is72 ? ECMIS.statusBadge(c.status) : getSecgenActionBadge(c);
  const act7BadgeHtml = is72
    ? ECMIS.act7Badge(ECMIS.getAct7Status72(c), ECMIS.ACT7_STATUSES_72)
    : ECMIS.act7Badge(ECMIS.getAct7Status(c));

  return `<tr>
    <td class="text-center">
      ${isPendingAction ? `<input type="checkbox" class="case-chk form-check-input" data-id="${c.id}">` : '<i class="fa-solid fa-lock text-muted" style="font-size:0.75rem" title="ไม่มีสิทธิ์สั่งการกลุ่ม"></i>'}
    </td>
    <td class="case-no">${c.id}${(c.urgent || c.urgent72)?' <span class="st st-urgent ms-1">ด่วน</span>':''}</td>
    <td style="max-width:300px">
      <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
      <small class="text-muted d-block" style="font-size:0.75rem">${c.ownerOrg}</small>
    </td>
    <td>${statusBadgeHtml}</td>
    <td>${act7BadgeHtml}</td>
    <td>${ECMIS.slaBadge(c)}</td>
    <td class="text-end">
      ${isPendingAction ? `
        <a href="${target}" class="btn btn-sm btn-navy px-3">
          <i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ
        </a>
      ` : `
        <a href="${target}" class="btn btn-sm btn-outline-secondary px-3">
          <i class="fa-regular fa-eye me-1"></i>ดูรายละเอียด
        </a>
      `}
    </td>
  </tr>`;
}

let filteredCombined = [...allCasesCombined];

function renderMyQueue(loading = false) {
  const tbodyPrimary = document.getElementById('myQueue');

  if (loading) {
    let skeletons = '';
    for(let i=0; i<Math.min(pageSize, filteredCombined.length || 3); i++) {
      skeletons += `
        <tr class="skeleton-row">
          <td><div class="skeleton-box" style="width:20px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td><div class="skeleton-box" style="width:200px"></div></td>
          <td><div class="skeleton-box" style="width:110px"></div></td>
          <td><div class="skeleton-box" style="width:180px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td class="text-end"><div class="skeleton-box ms-auto" style="width:80px"></div></td>
        </tr>`;
    }
    tbodyPrimary.innerHTML = skeletons;

    document.getElementById('bulkActionsBox').className = 'd-none';
    const chkAll = document.getElementById('chkAll');
    if (chkAll) chkAll.checked = false;

    setTimeout(() => {
      renderMyQueue(false);
    }, 250);
    return;
  }

  // Sort Table (Pending items first, then by field)
  const sortedCases = [...filteredCombined].sort((a, b) => {
    const isPendingA = isMyPending(a) ? 1 : 0;
    const isPendingB = isMyPending(b) ? 1 : 0;

    if (isPendingA !== isPendingB) {
      return isPendingB - isPendingA; // Actionable pending items first
    }

    let valA = a[sortField];
    let valB = b[sortField];
    if (sortField === 'slaDays') {
      valA = a.slaDays;
      valB = b.slaDays;
    } else if (sortField === 'act7Status') {
      valA = ECMIS.getAct7Status(a);
      valB = ECMIS.getAct7Status(b);
    }
    if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
    if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
    return 0;
  });

  // Pagination
  const totalItems = sortedCases.length;
  const totalPages = Math.ceil(totalItems / pageSize) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * pageSize;
  const paginatedCases = sortedCases.slice(startIdx, startIdx + pageSize);

  tbodyPrimary.innerHTML = paginatedCases.length
    ? paginatedCases.map(c => row(c)).join('')
    : `<tr><td colspan="7" class="text-center text-muted py-4">
         <i class="fa-regular fa-face-smile fa-lg mb-2 d-block"></i>
         ไม่มีรายการสำนวนตามเงื่อนไขการค้นหา<br>
         <small>ลองเปลี่ยนข้อความค้นหาหรือตัวกรองสถานะติดตาม</small></td></tr>`;

  const totalCountEl = document.getElementById('totalCount');
  if (totalCountEl) totalCountEl.textContent = sortedCases.length;

  const paginUl = document.getElementById('queuePagination');
  let paginHtml = `
    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">«</a>
    </li>`;
  for (let i = 1; i <= totalPages; i++) {
    paginHtml += `
      <li class="page-item ${currentPage === i ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
      </li>`;
  }
  paginHtml += `
    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">»</a>
    </li>`;
  paginUl.innerHTML = paginHtml;

  initCheckboxHandlers();
}

function changePage(p) {
  currentPage = p;
  renderMyQueue(true);
}

document.querySelectorAll('.sortable-header').forEach(header => {
  header.addEventListener('click', () => {
    const field = header.dataset.sort;
    if (sortField === field) {
      sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      sortField = field;
      sortOrder = 'asc';
    }

    document.querySelectorAll('.sortable-header i').forEach(icon => {
      icon.className = 'fa-solid fa-sort text-muted';
    });
    const activeIcon = header.querySelector('i');
    if (activeIcon) activeIcon.className = `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'}`;

    renderMyQueue(true);
  });
});

function initCheckboxHandlers() {
  const chkAll = document.getElementById('chkAll');
  const chks = document.querySelectorAll('.case-chk');

  if (!chkAll) return;
  chkAll.addEventListener('change', () => {
    chks.forEach(chk => chk.checked = chkAll.checked);
    updateBulkActionsState();
  });

  chks.forEach(chk => {
    chk.addEventListener('change', () => {
      chkAll.checked = Array.from(chks).every(c => c.checked);
      updateBulkActionsState();
    });
  });
}

function updateBulkActionsState() {
  const chks = document.querySelectorAll('.case-chk:checked');
  const bulkBox = document.getElementById('bulkActionsBox');
  const bulkCount = document.getElementById('bulkSelectCount');

  if (!bulkBox) return;
  if (chks.length > 0) {
    bulkBox.className = 'd-flex align-items-center gap-2';
    if (bulkCount) bulkCount.textContent = `เลือกแล้ว ${chks.length} รายการ`;
  } else {
    bulkBox.className = 'd-none';
  }
}

document.getElementById('btnBulkApprove')?.addEventListener('click', () => {
  const chks = document.querySelectorAll('.case-chk:checked');
  if (!chks.length) return;

  ECMIS.confirmAction({
    title: copy.bulkTitle(chks.length),
    html: `<p>${copy.bulkBody}</p>
           <div class="law-note">นี่เป็นการสั่งการแบบกลุ่ม (Bulk Action) ซึ่งจะบันทึกสถานะใหม่ลงในประวัติและ Audit Trail</div>`,
    confirmText: 'ยืนยันสั่งการกลุ่ม'
  }).then(res => {
    if (res.isConfirmed) {
      chks.forEach(chk => {
        const id = chk.dataset.id;
        const c = ECMIS.CASES.find(x => x.id === id);
        if (c) {
          const transitionMap = {
            'PENDING_SECGEN': c.urgent ? 'PENDING_CHAIRMAN' : 'IN_SCREENING',
            'PENDING_CHAIR_OF': 'PENDING_CHAIRMAN',
            'PENDING_CHAIRMAN': 'IN_SCREENING',
            'IN_SCREENING': 'AGENDA_SET',
            'AGENDA_SET': 'IN_MEETING',
            'IN_MEETING': 'RESOLVED_PENDING',
            'RESOLVED_PENDING': 'RESOLVED',
            'RESOLVED': 'DISPATCHING',
            'DISPATCHING': 'CLOSED'
          };
          if (transitionMap[c.status]) {
            c.status = transitionMap[c.status];
          }
        }
      });
      ECMIS.saveCases();
      ECMIS.toastOk(`สั่งการกลุ่มสำเร็จจำนวน ${chks.length} รายการแล้ว`);
      setTimeout(() => location.reload(), 1200);
    }
  });
});

/* ---------- Filtering Logic ---------- */
function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const act7 = document.getElementById('act7Filter').value;

  filteredCombined = allCasesCombined.filter(c => {
    const act7St = ECMIS.getAct7Status(c);
    const act7Item = ECMIS.ACT7_STATUSES.find(s => s.name === act7St);
    const act7Sec = act7Item ? act7Item.section : 1;

    // Search Query
    const matchQ = !q ||
      c.id.toLowerCase().includes(q) ||
      (c.subject && c.subject.toLowerCase().includes(q)) ||
      (c.ownerOrg && c.ownerOrg.toLowerCase().includes(q)) ||
      act7St.toLowerCase().includes(q);

    // Sign / Action Status Filter
    let matchSt = true;
    if (st !== 'ALL') {
      if (st === 'MINE_PENDING' || st === 'PENDING') {
        /* ต้องเข้าเงื่อนไขเดียวกับ pendingCount ใน renderKPICards() เป๊ะ ไม่งั้นจำนวนบนการ์ด
           KPI จะไม่ตรงกับจำนวนแถวจริงในตารางเมื่อกดกรอง (เคสที่ isMyPending แต่สถานะเป็น
           IN_SCREENING ต้องไม่นับเป็น PENDING เพราะย้ายไปอยู่การ์ด SCREENING แล้ว) */
        matchSt = (isMyPending(c) || c.status === 'PENDING_SECGEN' || c.status === 'IN_SUPPORT_SUB' || c.status === 'PENDING_URGENT' || c.status === 'DRAFT') && c.status !== 'IN_SCREENING';
      } else if (st === 'SIGNED') {
        matchSt = !!c.signedBySecgen || c.status === 'AGENDA_SET' || c.status === 'IN_MEETING' || c.status === 'RESOLVED_PENDING' || c.status === 'RESOLVED' || c.status === 'DISPATCHING' || c.status === 'CLOSED' || c.status === 'PENDING_CHAIR_OF' || c.status === 'PENDING_CHAIRMAN';
      } else if (st === 'RETURNED' || st === 'REJECTED') {
        matchSt = (c.status === 'RETURNED' || c.m28 === 'REJECT' || c.m28 === 'DISMISS');
      } else if (st === 'SCREENING') {
        matchSt = (c.status === 'IN_SCREENING');
      } else {
        matchSt = (c.status === st);
      }
    }

    // Activity 7 Tracking Status Filter
    let matchAct7 = true;
    if (act7 !== 'ALL') {
      if (act7 === 'SEC1') matchAct7 = (act7Sec === 1);
      else if (act7 === 'SEC2') matchAct7 = (act7Sec === 2);
      else if (act7 === 'SEC3') matchAct7 = (act7Sec === 3);
      else if (act7 === 'SEC4') matchAct7 = (act7Sec === 4);
      else matchAct7 = (act7St === act7);
    }

    return matchQ && matchSt && matchAct7;
  });

  currentPage = 1;
  renderKPICards();
  renderMyQueue(true);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('act7Filter').addEventListener('change', applyFilters);
document.getElementById('btnClearFilter').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = 'ALL';
  document.getElementById('act7Filter').value = 'ALL';
  applyFilters();
});

// Initial load
renderKPICards();
applyFilters();

</script>
</body>
