<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการพิจารณา/ลงนาม | E-CMIS</title>
<link rel="icon" type="image/png" href="pacc_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<link href="assets/ecmis-app.css" rel="stylesheet">
<link href="assets/a4-ecmis-workspace.css" rel="stylesheet">
<style>
.btn-xs { font-size: 0.76rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
.bg-purple { background-color: #7E22CE !important; }
.border-purple { border-color: #A855F7 !important; }
.kpi-card { transition: all 0.2s ease; }
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,42,98,0.12); }

.order-radio-card {
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    padding: 0.85rem 1rem;
    transition: all 0.2s ease;
    cursor: pointer;
    background: #fff;
}
.order-radio-card:hover {
    border-color: #CBD5E1;
    background: #F8FAFC;
}
.order-radio-card input:checked + div {
    font-weight: 600;
}
.order-radio-card.selected {
    border-color: #0F2A62;
    background: #EFF6FF;
}
.doc-preview-box {
    background: #F1F5F9;
    border: 1px solid #CBD5E1;
    border-radius: 10px;
    padding: 1.25rem;
    min-height: 280px;
    font-family: 'Sarabun', sans-serif;
}
.btn-gold {
    background-color: #D0A830;
    color: #0F2A62;
    font-weight: 600;
    border: none;
}
.btn-gold:hover {
    background-color: #B89224;
    color: #0F2A62;
}
</style>
</head>
<body>

<main class="app-main">

  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-file-signature me-2" id="pageTitleIcon" style="color:#0F2A62"></i><span id="pageTitleText">รายการพิจารณา/ลงนาม</span></h1>
    </div>
    <span class="flow-ref ms-auto" id="flowRefText">กระบวนงานไต่สวนเบื้องต้น</span>
  </div>

  <div id="scopeBanner"></div>

  <!-- KPI Cards Row (Linked to Data & Filtering) -->
  <div class="row g-3 mb-4" id="kpiRow"></div>

  <!-- Filter Bar -->
  <div class="card card-ecmis mb-4">
    <div class="card-body p-3">
      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-magnifying-glass me-1 text-muted"></i>ค้นหางาน แฟ้ม หรือผู้ต้องหา</label>
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="เลขสำนวน, ผู้กล่าวหา, ผู้ถูกกล่าวหา, เลขบัตร ปชช., ผู้รับผิดชอบ หรือหน่วยงาน">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-pen-to-square me-1 text-muted"></i><span id="colStatusFilterLabel">สถานะเสนอ/ลงนาม</span></label>
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="ALL" id="stOptAll">ทั้งหมด</option>
            <option value="PENDING" id="stOptPending">รอเลขาพิจารณาลงนาม</option>
            <option value="SIGNED" id="stOptSigned">ลงนามแล้ว</option>
            <option value="RETURNED" id="stOptReturned">ไม่ลงนาม / ตีกลับ</option>
            <option value="SCREENING">ส่งให้อนุกลั่นกรองพิจารณา</option>
          </select>
        </div>
        <div class="col-md-2 text-end">
          <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-3 w-100" id="btnClearFilter">
            <i class="fa-solid fa-rotate-left me-1"></i>ล้างตัวกรอง
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Table Queue List -->
  <div class="row g-3 align-items-start">
    <div class="col-12">

      <div class="card card-ecmis mb-4">
        <div class="card-header d-flex align-items-center flex-wrap gap-2">
          <i class="fa-solid fa-list-check text-primary"></i>
          <span class="fw-bold" id="card1TitleText">รายการสำนวนพิจารณา/ลงนาม และติดตามผลกิจกรรมที่ 7</span>
          <span class="badge bg-primary rounded-pill ms-1" id="totalCount">0</span>
          <span class="ms-auto small text-muted" id="myRoleLabel"></span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover tbl-ecmis mb-0 align-middle">
              <colgroup>
                <col style="width:40px">
                <col style="width:140px">
                <col>
                <col style="width:200px">
                <col style="width:130px">
                <col style="width:160px">
              </colgroup>
              <thead>
                <tr>
                  <th class="text-center"><input type="checkbox" id="chkAll" class="form-check-input"></th>
                  <th class="sortable-header" data-sort="id" style="cursor:pointer">เรื่องที่ <i class="fa-solid fa-sort-down ms-1" style="font-size:0.75rem"></i></th>
                  <th>เรื่องกล่าวหา</th>
                  <th id="colStatusHeader">สถานะเสนอ/ลงนาม</th>
                  <th class="sortable-header" data-sort="slaDays" style="cursor:pointer">กำหนดเวลา <i class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
                  <th class="text-end">ดำเนินการ</th>
                </tr>
              </thead>
              <tbody id="myQueue"></tbody>
            </table>
          </div>

          <div class="px-3 py-2 border-top d-flex align-items-center justify-content-between flex-wrap gap-2" id="queueFooter">
            <div id="bulkActionsBox" class="d-none align-items-center gap-2">
              <span class="small text-muted me-1" id="bulkSelectCount">เลือกแล้ว 0 รายการ</span>
              <button type="button" class="btn btn-xs btn-navy py-1 px-2" style="font-size:0.78rem" id="btnBulkApprove">
                <i class="fa-solid fa-check-double me-1"></i><span id="bulkBtnText">อนุมัติรายการที่เลือก (Bulk Action)</span>
              </button>
            </div>
            <nav aria-label="Queue navigation" class="ms-auto">
              <ul class="pagination pagination-sm m-0" id="queuePagination"></ul>
            </nav>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/ecmis-app.js"></script>
<script src="assets/ecmis-model.js"></script>
<script>
ECMIS.renderShell('01-work-inbox.html');

const role  = ECMIS.currentRole();

/* board_sec (เจ้าหน้าที่กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ) มีหน้า work-inbox ของตัวเองแยกต่างหาก (08-resolution-inbox.html) */
if (role.id === 'board_sec') { location.href = ECMIS.homeHref(role.id); }

function isChairActionable(c) {
  return c.status === 'PENDING_CHAIRMAN' ||
         c.status === 'PENDING_CHAIR_OF' ||
         c.status === 'PENDING_CHAIRMAN_URGENT_72' ||
         c.status === 'PENDING_SIGN_RULING_72' ||
         (c.status === 'PENDING_URGENT' && c.urgent);
}

const AFFAIRS_STATUSES = ['DEFERRED', 'RESOLVED_PENDING_72', 'PENDING_DISPATCH_GUILTY_72'];

const all   = role.id === 'affairs'
  ? ECMIS.CASES.filter(c => AFFAIRS_STATUSES.includes(c.status) && ECMIS.canViewCase(c, role.id))
  : ECMIS.CASES.filter(c => ECMIS.canViewCase(c, role.id));
let mine    = role.id === 'chairman'
  ? ECMIS.CASES.filter(c => isChairActionable(c))
  : ECMIS.inboxFor(role.id).filter(c => !ECMIS.isUpstreamCase(c) && ECMIS.canViewCase(c, role.id));

function getSecgenStatusCategory(c) {
  if (c.status === 'IN_SCREENING') {
    return 'SCREENING';
  }
  if (c.status === 'RETURNED' || (c.m28 && (c.m28.orderType === 'REJECT' || c.m28 === 'REJECT' || c.m28 === 'DISMISS'))) {
    return 'RETURNED';
  }
  if (c.signedBySecgen || ['AGENDA_SET', 'IN_MEETING', 'RESOLVED_PENDING', 'RESOLVED', 'DISPATCHING', 'CLOSED', 'PENDING_DISPATCH_GUILTY_72'].includes(c.status)) {
    return 'SIGNED';
  }
  return 'PENDING';
}

const mineIds = new Set(mine.map(c => c.id));
function isMyPending(c){
  if (role.id === 'chairman') return isChairActionable(c);
  if (role.id === 'secgen' || role.id === 'support_sub') {
    return getSecgenStatusCategory(c) === 'PENDING';
  }
  return mineIds.has(c.id);
}

const DEFAULT_COPY = {
  pageTitle:  'รายการพิจารณา/ลงนาม',
  pageIcon:   'fa-file-signature',
  flowRef:    'กระบวนงานไต่สวนเบื้องต้น',
  card1Title: 'รายการสำนวนพิจารณา/ลงนาม กิจกรรมที่ 7',
  colStatusHeader: 'สถานะเสนอ/ลงนาม',
  kpiPending: 'รอเลขาพิจารณาลงนาม', kpiDone: 'ลงนามแล้ว', kpiReturned: 'ไม่ลงนาม / ตีกลับ',
  stPending:  'รอเลขาพิจารณาลงนาม', stDone:  'ลงนามแล้ว', stReturned:  'ไม่ลงนาม / ตีกลับ',
  bulkBtn:    'อนุมัติรายการที่เลือก (Bulk Action)',
  bulkTitle:  n => `ยืนยันดำเนินการกลุ่มจำนวน ${n} รายการ`,
  bulkBody:   'ระบบจะอนุมัติและเสนอสำนวนที่เลือกทั้งหมดตามบทบาทปัจจุบันของคุณ'
};

const UPSTREAM_COPY = {
  pageTitle:  'รายการติดตามสถานะสำนวน',
  pageIcon:   'fa-magnifying-glass-chart',
  flowRef:    'ติดตามสถานะสำนวนของหน่วยงานตนเอง — บทบาทนี้อยู่นอกขอบเขตกิจกรรมที่ 7 (ดูกิจกรรมที่ 5)',
  card1Title: 'รายการสำนวนของหน่วยงาน และสถานะการพิจารณาในกิจกรรมที่ 7',
  colStatusHeader: 'สถานะการพิจารณา',
  kpiPending: 'อยู่ระหว่างพิจารณา', kpiDone: 'ลงนามแล้ว', kpiReturned: 'ตีกลับ / ส่งคืน',
  stPending:  'อยู่ระหว่างพิจารณา', stDone:  'ลงนามแล้ว', stReturned:  'ตีกลับ / ส่งคืน',
  bulkBtn:    'ดำเนินการรายการที่เลือก',
  bulkTitle:  n => `ยืนยันดำเนินการกลุ่มจำนวน ${n} รายการ`,
  bulkBody:   'ระบบจะดำเนินการสำนวนที่เลือกทั้งหมดตามสิทธิ์ของบทบาทปัจจุบันของคุณ'
};

const CHAIRMAN_COPY = {
  pageTitle:  'รายการพิจารณาสั่งการและบรรจุวาระ (ประธานกรรมการ ป.ป.ท.)',
  pageIcon:   'fa-gavel',
  flowRef:    'ประธานกรรมการ ป.ป.ท. สั่งการบรรจุวาระและลงนามดิจิทัล (G4 / S7)',
  card1Title: 'รายการสำนวนในคิวพิจารณาและสั่งการของประธานกรรมการ ป.ป.ท.',
  colStatusHeader: 'สถานะสั่งการ/บรรจุวาระ',
  kpiPending: 'รอสั่งการวาระปกติ', kpiDone: 'สั่งการ/บรรจุวาระแล้ว', kpiReturned: 'ตีกลับให้แก้ไข',
  stPending:  'รอประธานสั่งการ', stDone:  'บรรจุวาระแล้ว', stReturned:  'ตีกลับให้แก้ไข',
  bulkBtn:    'สั่งการรายการที่เลือก (Bulk Action)',
  bulkTitle:  n => `ยืนยันสั่งการกลุ่มจำนวน ${n} รายการ`,
  bulkBody:   'ระบบจะสั่งการและบรรจุวาระสำนวนที่เลือกทั้งหมดตามคำสั่งของประธานฯ'
};

const AFFAIRS_COPY = {
  pageTitle:  'รายการเรื่องที่ต้องจัดทำ',
  pageIcon:   'fa-file-pen',
  flowRef:    'งานกิจการคณะกรรมการ — จัดทำคำสั่ง ม.24 / ร่างรายงานวินิจฉัยชี้มูล / บรรจุวาระใหม่',
  card1Title: 'รายการสำนวนที่ต้องจัดทำ กิจกรรมที่ 7',
  colStatusHeader: 'สถานะจัดทำ',
  kpiPending: 'รอจัดทำ', kpiDone: 'จัดทำแล้ว', kpiReturned: 'เลื่อน/ถอนวาระ',
  stPending:  'รอจัดทำ', stDone:  'จัดทำแล้ว', stReturned:  'เลื่อน/ถอนวาระ',
  bulkBtn:    'ดำเนินการรายการที่เลือก',
  bulkTitle:  n => `ยืนยันดำเนินการกลุ่มจำนวน ${n} รายการ`,
  bulkBody:   'ระบบจะดำเนินการสำนวนที่เลือกทั้งหมดตามสิทธิ์ของบทบาทปัจจุบันของคุณ'
};

const ROLE_COPY = {
  owner: UPSTREAM_COPY, section_head: UPSTREAM_COPY, director: UPSTREAM_COPY,
  deputy_sg: UPSTREAM_COPY, deputy: UPSTREAM_COPY,
  chairman: CHAIRMAN_COPY,
  affairs: AFFAIRS_COPY
};
const copy = Object.assign({}, DEFAULT_COPY, ROLE_COPY[role.id] || {});

document.title = `${copy.pageTitle} | E-CMIS`;
document.getElementById('pageTitleText').textContent = copy.pageTitle;
document.getElementById('pageTitleIcon').className = `fa-solid ${copy.pageIcon} me-2`;
document.getElementById('flowRefText').textContent = copy.flowRef;
document.getElementById('card1TitleText').textContent = copy.card1Title;
document.getElementById('colStatusFilterLabel').textContent = copy.colStatusHeader;
document.getElementById('colStatusHeader').textContent = copy.colStatusHeader;

document.getElementById('stOptPending').textContent = copy.stPending;
document.getElementById('stOptSigned').textContent = copy.stDone;
document.getElementById('stOptReturned').textContent = copy.stReturned;
document.getElementById('bulkBtnText').textContent = copy.bulkBtn;

document.getElementById('myRoleLabel').textContent = `บทบาท: ${role.title}`;

if(ECMIS.isUpstreamRole(role.id)){
  document.getElementById('scopeBanner').innerHTML = `
    <div class="mb-3">
      <strong><i class="fa-solid fa-circle-info me-1"></i>บทบาทนี้อยู่นอกขอบเขตกิจกรรมที่ 7</strong><br>
      <strong>${role.title}</strong> เป็นส่วนหนึ่งของ<strong>การเสนอตามลำดับชั้นภายในกอง / สำนักงาน ป.ป.ท. เขต</strong>
      ซึ่งเป็นกระบวนงานของ <strong>กิจกรรมที่ 5 (ไต่สวนข้อเท็จจริง)</strong> ไม่ใช่กิจกรรมที่ 7
      <br><small>กิจกรรมที่ 7 เริ่มนับเมื่อรายงาน 213 มาถึง <strong>เลขาธิการคณะกรรมการ ป.ป.ท.</strong>
      — บทบาทนี้จึงมีเพียงสิทธิ์ <strong>ติดตามสถานะ</strong> สำนวนของตนเองในโมดูลนี้</small>
    </div>`;
} else if (role.id === 'chairman') {
  document.getElementById('scopeBanner').innerHTML = `
    <div class="alert border-0 shadow-sm d-flex align-items-center justify-content-between mb-3 py-2 px-3" style="background: linear-gradient(135deg, #0F2A62 0%, #1E3A8A 100%); color: #fff; border-radius: 10px;">
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-warning text-dark"><i class="fa-solid fa-crown me-1"></i>ประธานกรรมการ ป.ป.ท.</span>
        <span class="small text-white-50">นายอำนาจ พวงชมภู (สิทธิ์สั่งการส่งอนุกลั่นกรองฯ / สั่งบรรจุวาระด่วน Bypass / ลงนามรายงานชี้มูล)</span>
      </div>
    </div>`;

  // Customize dropdown filter for Chairman
  const sf = document.getElementById('statusFilter');
  if (sf) {
    sf.innerHTML = `
      <option value="ALL">ทั้งหมด</option>
      <option value="PENDING_NORMAL">รอสั่งการวาระปกติ</option>
      <option value="PENDING_URGENT">วาระด่วน (Bypass)</option>
      <option value="PENDING_RULING">รอลงนามรายงานชี้มูล</option>
      <option value="DONE">สั่งการแล้ว</option>
    `;
  }
} else if (role.id === 'affairs') {
  const sf = document.getElementById('statusFilter');
  if (sf) {
    sf.innerHTML = `
      <option value="ALL">ทั้งหมด</option>
      <option value="DEFERRED">เลื่อน/ถอนวาระ — รอเลขวาระใหม่</option>
      <option value="RESOLVED_PENDING_72">รอจัดทำรายงานวินิจฉัยชี้มูล</option>
      <option value="PENDING_DISPATCH_GUILTY_72">ชี้มูลความผิดแล้ว รอส่งดำเนินคดี</option>
    `;
  }
}

const allCasesCombinedMap = new Map();
mine.forEach(c => allCasesCombinedMap.set(c.id, { caseData: c, isActionable: true }));
all.forEach(c => {
  if (!allCasesCombinedMap.has(c.id)) {
    allCasesCombinedMap.set(c.id, { caseData: c, isActionable: false });
  }
});

const allCasesCombined = Array.from(allCasesCombinedMap.values()).map(item => {
  const c = item.caseData;
  return { ...c, isActionable: item.isActionable || isMyPending(c) };
});

function renderKPICards() {
  const currentSt = document.getElementById('statusFilter')?.value || 'ALL';

  if (role.id === 'chairman') {
    const pendingNormalCount = allCasesCombined.filter(c => c.status === 'PENDING_CHAIRMAN' || c.status === 'PENDING_CHAIR_OF').length;
    const pendingUrgentCount = allCasesCombined.filter(c => c.status === 'PENDING_CHAIRMAN_URGENT_72' || (c.status === 'PENDING_URGENT' && c.urgent)).length;
    const pendingRulingCount = allCasesCombined.filter(c => c.status === 'PENDING_SIGN_RULING_72').length;
    const doneCount = allCasesCombined.filter(c => ['AGENDA_SET', 'IN_SCREENING', 'RESOLVED', 'CLOSED'].includes(c.status) || c.signedByChair).length;

    const kpis = [
      { id:'ALL', n: allCasesCombined.length, l:'รายการทั้งหมด', i:'fa-folder-open', c:'#0F2A62' },
      { id:'PENDING_NORMAL', n: pendingNormalCount, l:'รอสั่งการวาระปกติ', i:'fa-hourglass-half', c:'#D0A830' },
      { id:'PENDING_URGENT', n: pendingUrgentCount, l:'วาระด่วน (Bypass)', i:'fa-bolt', c:'#DB2626' },
      { id:'PENDING_RULING', n: pendingRulingCount, l:'รอลงนามชี้มูล', i:'fa-file-signature', c:'#0284C7' },
      { id:'DONE', n: doneCount, l:'สั่งการแล้ว', i:'fa-circle-check', c:'#16A34A' }
    ];

    document.getElementById('kpiRow').innerHTML = kpis.map(k => {
      const isActive = (currentSt === k.id);
      return `
      <div class="col-12 col-sm-6 col-md-4 col-xl">
        <div class="card card-ecmis kpi-card h-100 ${isActive ? 'border-2 shadow-sm' : ''}"
             style="min-height:88px; cursor:pointer; ${isActive ? `border-color:${k.c} !important; background:${k.c}0D;` : ''}"
             onclick="filterByKPI('${k.id}')">
          <div class="card-body d-flex align-items-center gap-2 py-3 px-3">
            <div style="flex:0 0 38px;height:38px;border-radius:10px;background:${k.c}18;display:flex;align-items:center;justify-content:center">
              <i class="fa-solid ${k.i}" style="color:${k.c};font-size:1.05rem"></i>
            </div>
            <div style="min-width:0">
              <div style="font-size:1.5rem;font-weight:700;font-family:var(--serif);color:${k.c};line-height:1.1">${k.n}</div>
              <div class="text-muted text-truncate" style="font-size:.74rem;margin-top:2px" title="${k.l}">${k.l}</div>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
    return;
  }

  if (role.id === 'affairs') {
    const deferredCount   = allCasesCombined.filter(c => c.status === 'DEFERRED').length;
    const rulingCount     = allCasesCombined.filter(c => c.status === 'RESOLVED_PENDING_72').length;
    const dispatchCount   = allCasesCombined.filter(c => c.status === 'PENDING_DISPATCH_GUILTY_72').length;

    const kpis = [
      { id:'ALL', n: allCasesCombined.length, l:'รายการทั้งหมด', i:'fa-folder-open', c:'#0F2A62' },
      { id:'DEFERRED', n: deferredCount, l:'เลื่อน/ถอนวาระ — รอเลขวาระใหม่', i:'fa-calendar-plus', c:'#DB2626' },
      { id:'RESOLVED_PENDING_72', n: rulingCount, l:'รอจัดทำรายงานวินิจฉัยชี้มูล', i:'fa-file-pen', c:'#D0A830' },
      { id:'PENDING_DISPATCH_GUILTY_72', n: dispatchCount, l:'ชี้มูลความผิดแล้ว รอส่งดำเนินคดี', i:'fa-paper-plane', c:'#0284C7' }
    ];

    document.getElementById('kpiRow').innerHTML = kpis.map(k => {
      const isActive = (currentSt === k.id);
      return `
      <div class="col-12 col-sm-6 col-md-4 col-xl">
        <div class="card card-ecmis kpi-card h-100 ${isActive ? 'border-2 shadow-sm' : ''}"
             style="min-height:88px; cursor:pointer; ${isActive ? `border-color:${k.c} !important; background:${k.c}0D;` : ''}"
             onclick="filterByKPI('${k.id}')">
          <div class="card-body d-flex align-items-center gap-2 py-3 px-3">
            <div style="flex:0 0 38px;height:38px;border-radius:10px;background:${k.c}18;display:flex;align-items:center;justify-content:center">
              <i class="fa-solid ${k.i}" style="color:${k.c};font-size:1.05rem"></i>
            </div>
            <div style="min-width:0">
              <div style="font-size:1.5rem;font-weight:700;font-family:var(--serif);color:${k.c};line-height:1.1">${k.n}</div>
              <div class="text-muted text-truncate" style="font-size:.74rem;margin-top:2px" title="${k.l}">${k.l}</div>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
    return;
  }

  // SecGen / General Roles: Linked KPI Cards to 4 Mutually Exclusive Status Categories + ALL (Sum of 4 = ALL)
  const pendingCount   = allCasesCombined.filter(c => getSecgenStatusCategory(c) === 'PENDING').length;
  const signedCount    = allCasesCombined.filter(c => getSecgenStatusCategory(c) === 'SIGNED').length;
  const returnedCount  = allCasesCombined.filter(c => getSecgenStatusCategory(c) === 'RETURNED').length;
  const screeningCount = allCasesCombined.filter(c => getSecgenStatusCategory(c) === 'SCREENING').length;

  const kpis = [
    { id:'ALL', n: allCasesCombined.length, l:'รายการทั้งหมด', i:'fa-folder-open', c:'#0F2A62' },
    { id:'PENDING', n: pendingCount, l:'รอเลขาพิจารณาลงนาม', i:'fa-hourglass-half', c:'#D0A830' },
    { id:'SIGNED', n: signedCount, l:'ลงนามแล้ว', i:'fa-circle-check', c:'#16A34A' },
    { id:'RETURNED', n: returnedCount, l:'ไม่ลงนาม / ตีกลับ', i:'fa-circle-xmark', c:'#DB2626' },
    { id:'SCREENING', n: screeningCount, l:'ส่งให้อนุกลั่นกรองพิจารณา', i:'fa-users-gear', c:'#0284C7' }
  ];

  document.getElementById('kpiRow').innerHTML = kpis.map(k => {
    const isActive = (currentSt === k.id);
    return `
    <div class="col-12 col-sm-6 col-md-4 col-xl">
      <div class="card card-ecmis kpi-card h-100 ${isActive ? 'border-2 shadow-sm' : ''}"
           style="min-height:88px; cursor:pointer; ${isActive ? `border-color:${k.c} !important; background:${k.c}0D;` : ''}"
           onclick="filterByKPI('${k.id}')">
        <div class="card-body d-flex align-items-center gap-2 py-3 px-3">
          <div style="flex:0 0 38px;height:38px;border-radius:10px;background:${k.c}18;display:flex;align-items:center;justify-content:center">
            <i class="fa-solid ${k.i}" style="color:${k.c};font-size:1.05rem"></i>
          </div>
          <div style="min-width:0">
            <div style="font-size:1.5rem;font-weight:700;font-family:var(--serif);color:${k.c};line-height:1.1">${k.n}</div>
            <div class="text-muted text-truncate" style="font-size:.74rem;margin-top:2px" title="${k.l}">${k.l}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterByKPI(statusId) {
  const sf = document.getElementById('statusFilter');
  if (sf) {
    sf.value = statusId;
  }
  applyFilters();
}

const PAGE_FOR = {
  owner:'03-report-213.html', section_head:'03-report-213.html',
  director:'03-report-213.html', deputy:'03-report-213.html',
  secgen:'04-approval-review.html', support_sub:'04-approval-review.html',
  chair_office:'06-chairman-agenda.html',
  chairman:'06-chairman-agenda.html', subcommittee:'07-subcommittee-screening.html',
  board:'08-board-resolution.html'
};

let currentPage = 1;
const pageSize = 10;
let sortField = 'id';
let sortOrder = 'desc';

function caseIdSortValue(id) {
  const m = /^(\d+)\/(\d+)$/.exec(id || '');
  if (!m) return 0;
  return parseInt(m[2], 10) * 100000 + parseInt(m[1], 10);
}

function getSecgenActionBadge(c) {
  const cat = getSecgenStatusCategory(c);
  if (cat === 'SCREENING') {
    return `<span class="st st-review"><i class="fa-solid fa-users-gear me-1"></i>ส่งให้อนุกลั่นกรองพิจารณา</span>`;
  }
  if (cat === 'RETURNED') {
    return `<span class="st st-returned"><i class="fa-solid fa-xmark me-1"></i>ไม่ลงนาม / ตีกลับ</span>`;
  }
  if (cat === 'SIGNED') {
    return `<span class="st st-done"><i class="fa-solid fa-check me-1"></i>ลงนามแล้ว</span>`;
  }
  return `<span class="st st-pending"><i class="fa-solid fa-circle text-warning me-1" style="font-size:0.5rem"></i>รอเลขาพิจารณาลงนาม</span>`;
}

function getActionBadge(c) {
  if (role.id === 'affairs') return ECMIS.statusBadge(c.status);
  return getSecgenActionBadge(c);
}

function row(c){
  const is72 = ECMIS.isCase72(c);
  const page = is72 ? ECMIS.pageForCase72(c) : (PAGE_FOR[role.id] || '02-case-register.html');
  const target = `${page}?case=${encodeURIComponent(c.id)}`;

  if (role.id === 'chairman') {
    const isActionable = (c.status === 'PENDING_CHAIRMAN' || c.status === 'PENDING_CHAIRMAN_URGENT_72' || c.status === 'PENDING_SIGN_RULING_72' || c.status === 'PENDING_CHAIR_OF' || isMyPending(c));
    
    let catBadge = '';
    if (c.status === 'PENDING_CHAIRMAN_URGENT_72' || (c.status === 'PENDING_URGENT' && c.urgent)) catBadge = `<span class="st st-urgent"><i class="fa-solid fa-bolt me-1"></i>วาระด่วน (Bypass)</span>`;
    else if (c.status === 'PENDING_SIGN_RULING_72') catBadge = `<span class="st st-review"><i class="fa-solid fa-file-signature me-1"></i>รอลงนามชี้มูล</span>`;
    else if (c.status === 'PENDING_CHAIRMAN' || c.status === 'PENDING_CHAIR_OF') catBadge = `<span class="st st-pending"><i class="fa-solid fa-hourglass-half me-1"></i>รอประธานสั่งการ</span>`;
    else catBadge = ECMIS.statusBadge(c.status);

    return `<tr>
      <td class="text-center">
        ${isActionable ? `<input type="checkbox" class="case-chk form-check-input" data-id="${c.id}">` : '<i class="fa-solid fa-lock text-muted" style="font-size:0.75rem"></i>'}
      </td>
      <td class="case-no">${c.id}${(c.urgent || c.urgent72)?' <span class="st st-urgent ms-1">ด่วน</span>':''}</td>
      <td style="max-width:300px">
        <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
        <small class="text-muted d-block" style="font-size:0.75rem">${c.ownerOrg}</small>
      </td>
      <td>${catBadge}</td>
      <td>${ECMIS.slaBadge(c)}</td>
      <td class="text-end">
        ${isActionable ? `
          <a href="06-chairman-agenda.html?case=${encodeURIComponent(c.id)}" class="btn btn-sm btn-gold px-3 shadow-sm" style="background:#D0A830; border-color:#B89224; color:#0F2A62; font-weight:600">
            <i class="fa-solid fa-signature me-1"></i>พิจารณาสั่งการ
          </a>
        ` : `
          <a href="${target}" class="btn btn-sm btn-outline-secondary px-3">
            <i class="fa-regular fa-eye me-1"></i>ดูรายละเอียด
          </a>
        `}
      </td>
    </tr>`;
  }

  const isPendingAction = isMyPending(c);
  const statusBadgeHtml = getActionBadge(c);
  /* งานของ affairs (บรรจุวาระใหม่ / ร่างรายงานวินิจฉัยชี้มูล / ส่งดำเนินคดี) เป็นงานจัดทำที่ต้องพิจารณา
     ทีละเรื่อง ไม่ใช่การอนุมัติแบบ bulk — ไม่แสดง checkbox เพื่อไม่ให้เข้าใจผิดว่าสั่งการกลุ่มได้ */
  const showCheckbox = isPendingAction && role.id !== 'affairs';

  return `<tr>
    <td class="text-center">
      ${showCheckbox ? `<input type="checkbox" class="case-chk form-check-input" data-id="${c.id}">` : '<i class="fa-solid fa-lock text-muted" style="font-size:0.75rem" title="ไม่มีสิทธิ์สั่งการกลุ่ม"></i>'}
    </td>
    <td class="case-no">${c.id}${(c.urgent || c.urgent72)?' <span class="st st-urgent ms-1">ด่วน</span>':''}</td>
    <td style="max-width:300px">
      <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
      <small class="text-muted d-block" style="font-size:0.75rem">${c.ownerOrg}</small>
    </td>
    <td>${statusBadgeHtml}</td>
    <td>${ECMIS.slaBadge(c)}</td>
    <td class="text-end">
      ${isPendingAction ? `
        <a href="${target}" class="btn btn-sm btn-navy px-3">
          <i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ
        </a>
      ` : `
        <a href="${target}" class="btn btn-sm btn-outline-secondary px-3">
          <i class="fa-regular fa-eye me-1"></i>ดูรายละเอียด
        </a>
      `}
    </td>
  </tr>`;
}

let filteredCombined = [...allCasesCombined];

function renderMyQueue(loading = false) {
  const tbodyPrimary = document.getElementById('myQueue');

  if (loading) {
    let skeletons = '';
    for(let i=0; i<Math.min(pageSize, filteredCombined.length || 3); i++) {
      skeletons += `
        <tr class="skeleton-row">
          <td><div class="skeleton-box" style="width:20px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td><div class="skeleton-box" style="width:200px"></div></td>
          <td><div class="skeleton-box" style="width:110px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td class="text-end"><div class="skeleton-box ms-auto" style="width:80px"></div></td>
        </tr>`;
    }
    tbodyPrimary.innerHTML = skeletons;

    document.getElementById('bulkActionsBox').className = 'd-none';
    const chkAll = document.getElementById('chkAll');
    if (chkAll) chkAll.checked = false;

    setTimeout(() => {
      renderMyQueue(false);
    }, 250);
    return;
  }

  const sortedCases = [...filteredCombined].sort((a, b) => {
    const isPendingA = isMyPending(a) ? 1 : 0;
    const isPendingB = isMyPending(b) ? 1 : 0;

    if (isPendingA !== isPendingB) {
      return isPendingB - isPendingA;
    }

    let valA = a[sortField];
    let valB = b[sortField];
    if (sortField === 'id') {
      valA = caseIdSortValue(a.id);
      valB = caseIdSortValue(b.id);
    } else if (sortField === 'slaDays') {
      valA = a.slaDays;
      valB = b.slaDays;
    }
    if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
    if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
    return 0;
  });

  const totalItems = sortedCases.length;
  const totalPages = Math.ceil(totalItems / pageSize) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * pageSize;
  const paginatedCases = sortedCases.slice(startIdx, startIdx + pageSize);

  tbodyPrimary.innerHTML = paginatedCases.length
    ? paginatedCases.map(c => row(c)).join('')
    : `<tr><td colspan="6" class="text-center text-muted py-4">
         <i class="fa-regular fa-face-smile fa-lg mb-2 d-block"></i>
         ไม่มีรายการสำนวนตามเงื่อนไขการค้นหา<br>
         <small>ลองเปลี่ยนข้อความค้นหาหรือตัวกรองสถานะ</small></td></tr>`;

  const totalCountEl = document.getElementById('totalCount');
  if (totalCountEl) totalCountEl.textContent = sortedCases.length;

  const paginUl = document.getElementById('queuePagination');
  let paginHtml = `
    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">«</a>
    </li>`;
  for (let i = 1; i <= totalPages; i++) {
    paginHtml += `
      <li class="page-item ${currentPage === i ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
      </li>`;
  }
  paginHtml += `
    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">»</a>
    </li>`;
  paginUl.innerHTML = paginHtml;

  initCheckboxHandlers();
}

function changePage(p) {
  currentPage = p;
  renderMyQueue(true);
}

document.querySelectorAll('.sortable-header').forEach(header => {
  header.addEventListener('click', () => {
    const field = header.dataset.sort;
    if (sortField === field) {
      sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      sortField = field;
      sortOrder = 'asc';
    }

    document.querySelectorAll('.sortable-header i').forEach(icon => {
      icon.className = 'fa-solid fa-sort text-muted';
    });
    const activeIcon = header.querySelector('i');
    if (activeIcon) activeIcon.className = `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'}`;

    renderMyQueue(true);
  });
});

function initCheckboxHandlers() {
  const chkAll = document.getElementById('chkAll');
  const chks = document.querySelectorAll('.case-chk');

  if (!chkAll) return;
  chkAll.addEventListener('change', () => {
    chks.forEach(chk => chk.checked = chkAll.checked);
    updateBulkActionsState();
  });

  chks.forEach(chk => {
    chk.addEventListener('change', () => {
      chkAll.checked = Array.from(chks).every(c => c.checked);
      updateBulkActionsState();
    });
  });
}

function updateBulkActionsState() {
  const chks = document.querySelectorAll('.case-chk:checked');
  const bulkBox = document.getElementById('bulkActionsBox');
  const bulkCount = document.getElementById('bulkSelectCount');

  if (!bulkBox) return;
  if (chks.length > 0) {
    bulkBox.className = 'd-flex align-items-center gap-2';
    if (bulkCount) bulkCount.textContent = `เลือกแล้ว ${chks.length} รายการ`;
  } else {
    bulkBox.className = 'd-none';
  }
}

document.getElementById('btnBulkApprove')?.addEventListener('click', () => {
  const chks = document.querySelectorAll('.case-chk:checked');
  if (!chks.length) return;

  ECMIS.confirmAction({
    title: copy.bulkTitle(chks.length),
    html: `<p>${copy.bulkBody}</p>`,
    confirmText: 'ยืนยันสั่งการกลุ่ม'
  }).then(res => {
    if (res.isConfirmed) {
      chks.forEach(chk => {
        const id = chk.dataset.id;
        const c = ECMIS.CASES.find(x => x.id === id);
        if (c) {
          const transitionMap = {
            'PENDING_SECGEN': c.urgent ? 'PENDING_CHAIRMAN' : 'IN_SCREENING',
            'PENDING_CHAIR_OF': 'PENDING_CHAIRMAN',
            'PENDING_CHAIRMAN': 'IN_SCREENING',
            'IN_SCREENING': 'AGENDA_SET',
            'AGENDA_SET': 'IN_MEETING',
            'IN_MEETING': 'RESOLVED_PENDING',
            'RESOLVED_PENDING': 'RESOLVED',
            'RESOLVED': 'DISPATCHING',
            'DISPATCHING': 'CLOSED'
          };
          if (transitionMap[c.status]) {
            c.status = transitionMap[c.status];
          }
        }
      });
      ECMIS.saveCases();
      ECMIS.toastOk(`สั่งการกลุ่มสำเร็จจำนวน ${chks.length} รายการแล้ว`);
      setTimeout(() => location.reload(), 1200);
    }
  });
});

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const st = document.getElementById('statusFilter').value;

  filteredCombined = allCasesCombined.filter(c => {
    const matchQ = !q ||
      c.id.toLowerCase().includes(q) ||
      (c.subject && c.subject.toLowerCase().includes(q)) ||
      (c.ownerOrg && c.ownerOrg.toLowerCase().includes(q)) ||
      (c.owner && c.owner.toLowerCase().includes(q)) ||
      (c.complainant && c.complainant.toLowerCase().includes(q)) ||
      (Array.isArray(c.accused) && c.accused.some(p =>
        (p.name && p.name.toLowerCase().includes(q)) ||
        (p.idcard && p.idcard.toLowerCase().includes(q))
      ));

    let matchSt = true;
    if (role.id === 'chairman') {
      if (st !== 'ALL') {
        if (st === 'PENDING_NORMAL') matchSt = (c.status === 'PENDING_CHAIRMAN' || c.status === 'PENDING_CHAIR_OF');
        else if (st === 'PENDING_URGENT') matchSt = (c.status === 'PENDING_CHAIRMAN_URGENT_72' || (c.status === 'PENDING_URGENT' && c.urgent));
        else if (st === 'PENDING_RULING') matchSt = (c.status === 'PENDING_SIGN_RULING_72');
        else if (st === 'DONE') matchSt = (['AGENDA_SET', 'IN_SCREENING', 'RESOLVED', 'CLOSED'].includes(c.status) || c.signedByChair);
      }
    } else if (role.id === 'affairs') {
      if (st !== 'ALL') matchSt = (c.status === st);
    } else if (st !== 'ALL') {
      if (st === 'MINE_PENDING') {
        matchSt = (getSecgenStatusCategory(c) === 'PENDING');
      } else {
        matchSt = (getSecgenStatusCategory(c) === st);
      }
    }

    return matchQ && matchSt;
  });

  currentPage = 1;
  renderKPICards();
  renderMyQueue(true);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('btnClearFilter').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = 'ALL';
  applyFilters();
});

renderKPICards();
applyFilters();

</script>
</body>
</html>
