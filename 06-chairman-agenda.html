<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประธานฯ สั่งการ / บรรจุวาระ | E-CMIS</title>
    <link rel="icon" type="image/png" href="pacc_logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="assets/ecmis-app.css" rel="stylesheet">
    <link href="assets/a4-ecmis-workspace.css" rel="stylesheet">
</head>

<body>

    <main class="app-main">
        <div class="page-head">
            <div>
                <h1><i class="fa-solid fa-gavel me-2"></i>ประธานกรรมการ ป.ป.ท. สั่งการและบรรจุวาระ</h1>
            </div>
            <div class="ms-auto text-end">
                <span class="flow-ref">เส้นทางสั่งการและบรรจุวาระ</span>
                <div class="mt-1" id="stBadge"></div>
            </div>
        </div>

        <div class="ws-card mb-3">
            <div class="card-body pb-1" id="stepper"></div>
        </div>

        <div class="document-workspace" id="docWorkspace">
            <div>

                <div class="ws-card mb-3">
                    <div class="card-header"><i class="fa-solid fa-inbox"></i> หน้าห้องประธานฯ ลงรับและคัดกรอง
                    </div>
                    <div class="card-body">
                        <div class="rule-panel mb-3" id="screenRules"></div>
                        <label class="form-label">หมายเหตุจากหน้าห้องประธานฯ</label>
                        <textarea class="form-control" id="frontNote" rows="2"
                            placeholder="สรุปประเด็นสำคัญเพื่อนำเสนอประธานฯ"></textarea>
                    </div>
                </div>

                <div class="ws-card mb-3">
                    <div class="card-header"><i class="fa-solid fa-code-branch"></i> คำสั่งของประธานกรรมการ ป.ป.ท.
                    </div>
                    <div class="card-body">
                        <div id="bypassBanner"></div>
                        <label class="form-label field-req">เลือกคำสั่ง</label>
                        <div class="list-group mb-3" id="orderList">
                            <label class="list-group-item d-flex gap-2 align-items-start">
                                <input class="form-check-input mt-1" type="radio" name="order" value="SCREEN" checked>
                                <span><strong>ส่งคณะอนุกรรมการกลั่นกรองฯ พิจารณาก่อน</strong> (เส้นทางปกติ)
                                    <br><small class="text-muted">→ กบค. กระจายเข้าคณะที่ 1–8 แบบ Round-Robin
                                        (T9)</small></span>
                            </label>
                            <label class="list-group-item d-flex gap-2 align-items-start">
                                <input class="form-check-input mt-1" type="radio" name="order" value="AGENDA">
                                <span><strong>สั่งบรรจุวาระการประชุมทันที</strong> (เร่งด่วน / Bypass)
                                    <br><small class="text-muted">→ ข้ามคณะอนุกลั่นกรองฯ เข้า T11
                                        บรรจุวาระโดยตรง</small></span>
                            </label>
                            <label class="list-group-item d-flex gap-2 align-items-start">
                                <input class="form-check-input mt-1" type="radio" name="order" value="LEGAL">
                                <span><strong>ส่งกองกฎหมายพิจารณาก่อน</strong>
                                    <br><small class="text-muted">→ เชื่อมกิจกรรมที่ 10
                                        แล้วเสนอกลับเข้าวาระอีกครั้ง</small></span>
                            </label>
                            <label class="list-group-item d-flex gap-2 align-items-start">
                                <input class="form-check-input mt-1" type="radio" name="order" value="RETURN">
                                <span><strong>ตีกลับให้แก้ไข</strong>
                                    <br><small class="text-muted">→ ส่งคืนเจ้าของสำนวนพร้อมระบุ Reason
                                        Code</small></span>
                            </label>
                        </div>
                        <label class="form-label">ข้อสั่งการเพิ่มเติม</label>
                        <textarea class="form-control" id="chairNote" rows="2"></textarea>
                    </div>
                </div>

                <div class="ws-card mb-3" id="agendaCard">
                    <div class="card-header"><i class="fa-solid fa-calendar-check"></i>
                        บรรจุระเบียบวาระและหนังสือเชิญประชุม</div>
                    <div class="card-body">
                        <div class="row g-2 mb-3">
                            <div class="col-md-4"><label class="form-label field-req">ครั้งที่ประชุม</label>
                                <input class="form-control" id="meetNo" value="38/2569">
                            </div>
                            <div class="col-md-4"><label class="form-label field-req">วันที่ประชุม</label>
                                <input class="form-control" id="meetDate" value="2569-06-02" type="text">
                            </div>
                            <div class="col-md-4"><label class="form-label field-req">วาระที่</label>
                                <input class="form-control" id="agendaNo" value="5.12">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label field-req">ชั้นความลับของหนังสือเชิญประชุม</label>
                            <select class="form-select" id="secrecy">
                                <option value="SECRET" selected>ลับ — แนบระเบียบวาระเต็ม (พาดพิงสำนวนคดี)</option>
                                <option value="NORMAL">ปกติ — ไม่แนบระเบียบวาระเต็ม</option>
                            </select>
                        </div>

                        <div class="rule-panel" id="meetRules"></div>
                    </div>
                </div>
            </div>

            <aside class="ws-doc-pane" style="top:calc(var(--topbar-h) + 14px)">
                <button type="button" class="ws-doc-pane-rail" id="btnPaneExpand" title="ขยายแผงเอกสาร"><i class="fa-solid fa-angles-left"></i><span>เอกสาร</span></button>
                <div class="ws-doc-toolbar">
                    <div class="ws-doc-tabs" id="docTabs">
                        <button class="ws-doc-tab active" data-doc="agenda">ระเบียบวาระ</button>
                        <button class="ws-doc-tab" data-doc="invite">หนังสือเชิญประชุม</button>
                    </div>
                    <button class="btn btn-sm btn-light" onclick="window.print()"><i class="fa-solid fa-print"></i></button>
                    <button type="button" class="ws-doc-pane-toggle" id="btnPaneCollapse" title="ย่อแผงเอกสาร"><i class="fa-solid fa-angles-right"></i></button>
                </div>
                <div class="ws-paper-stage">
                    <div class="doc-paper a4-paper" id="docPaper"></div>
                </div>
            </aside>
        </div>

        <div id="actionBarSlot"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/ecmis-app.js"></script>
    <script src="assets/ecmis-model.js"></script>
    <script>
        ECMIS.renderShell('06-chairman-agenda.html');

        const params = new URLSearchParams(location.search);
        const kase = ECMIS.getCase(params.get('case') || '1547/2568');
        const role = ECMIS.currentRole();
        let docTab = 'agenda';

        document.getElementById('stBadge').innerHTML = `<span class="chip me-1">เลขสำนวน ${kase.id}</span>` + ECMIS.statusBadge(kase.status) + ' ' + ECMIS.slaBadge(kase);
        document.getElementById('stepper').innerHTML = ECMIS.stepperHtml(kase.status);

        if (kase.urgent) {
            document.getElementById('bypassBanner').innerHTML = `
    <div class="mb-3">
      <strong><i class="fa-solid fa-bolt me-1"></i>สำนวนนี้มีใบด่วนที่ ผอ.กบค. ลงนามรับรองแล้ว</strong><br>
      เหตุผล: ${kase.urgentReason}<br>
      <small>ระบบเปิดสิทธิ์ให้เลือก "สั่งบรรจุวาระทันที (Bypass)" ได้</small>
    </div>`;
            document.querySelector('input[value="AGENDA"]').checked = true;
        }

        document.getElementById('screenRules').innerHTML = [
            { ok: true, t: 'รายงาน 213 ลงนามดิจิทัลโดยเลขาธิการฯ ครบถ้วน' },
            { ok: true, t: 'เอกสารแนบบังคับครบถ้วน (3/3 รายการ)' },
            {
                ok: !kase.dupWarning, t: kase.dupWarning
                    ? 'ตรวจพบสำนวนที่อาจซ้ำซ้อน — ต้องตัดสินใจรวม/แยกก่อนบรรจุวาระ'
                    : 'ไม่พบสำนวนซ้ำซ้อนในระบบ'
            },
            { ok: true, t: 'อยู่ในกรอบเวลา ม.23 (ครบกำหนด ' + ECMIS.thaiDate(kase.deadline2y) + ')' },
            {
                ok: kase.urgent, t: kase.urgent
                    ? 'มีใบด่วนที่ ผอ.กบค. รับรอง — เข้าเงื่อนไข Bypass ได้'
                    : 'ไม่มีใบด่วน — ต้องเข้าคณะอนุกลั่นกรองฯ ตามเส้นทางปกติ'
            }
        ].map(r => `<div class="rule ${r.ok ? 'pass' : 'fail'}">
  <i class="fa-solid ${r.ok ? 'fa-circle-check' : 'fa-circle-xmark'}"></i><span>${r.t}</span></div>`).join('');

        /* ---------- meeting rules ---------- */
        function renderMeetRules() {
            const secrecy = document.getElementById('secrecy').value;
            document.getElementById('meetRules').innerHTML = [
                { ok: true, t: 'แจ้งนัดประชุมเป็นหนังสือล่วงหน้าไม่น้อยกว่า 3 วัน (ม.13 วรรคสอง)' },
                { ok: true, t: 'ระบบแจ้งเตือนกรรมการอ่านระเบียบวาระล่วงหน้า 3 วันก่อนประชุม' },
                {
                    ok: secrecy === 'SECRET', t: secrecy === 'SECRET'
                        ? 'ตั้งชั้นความลับ "ลับ" ถูกต้องตาม ม.19/1 (แนบวาระเต็ม)'
                        : 'เลือก "ปกติ" — ระบบจะไม่แนบระเบียบวาระเต็มไปกับหนังสือเชิญ'
                },
                { ok: true, t: 'ระบบตรวจองค์ประชุมขั้นต่ำ ม.12 (ไม่น้อยกว่ากึ่งหนึ่งของกรรมการเท่าที่มีอยู่) ก่อนเปิดวาระ' }
            ].map(r => `<div class="rule ${r.ok ? 'pass' : ''}">
    <i class="fa-solid ${r.ok ? 'fa-circle-check' : 'fa-circle-info'}"></i><span>${r.t}</span></div>`).join('');
        }

        /* ---------- documents ---------- */
        function renderDoc() {
            const M = ECMIS.mergeField;
            const meetNo = document.getElementById('meetNo').value.trim();
            const meetDate = ECMIS.thaiDate(document.getElementById('meetDate').value.trim());
            const agendaNo = document.getElementById('agendaNo').value.trim();
            const secrecy = document.getElementById('secrecy').value;

            if (docTab === 'agenda') {
                document.getElementById('docPaper').innerHTML = `
      <div class="doc-secret">${secrecy === 'SECRET' ? 'ลับ' : ''}</div>
      <div class="doc-title">ระเบียบวาระการประชุม<br>คณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ</div>
      <div class="doc-sub">ครั้งที่ ${M(meetNo)} วันที่ ${M(meetDate)}</div>

      <div class="doc-h">ระเบียบวาระที่ 5 &nbsp; เรื่องเพื่อพิจารณา</div>
      <div style="margin-top:6px">
        <div class="doc-row"><span class="k">วาระที่ ${M(agendaNo)}</span> ${M(kase.subject)}</div>
        <div style="padding-left:2em">
          <div class="doc-row"><span class="k">เรื่องที่</span> ${M(kase.id)}</div>
          <div class="doc-row"><span class="k">ผู้รับผิดชอบ</span> ${M(kase.owner)}</div>
          <div class="doc-row"><span class="k">สังกัด</span> ${M(kase.ownerOrg)}</div>
          <div class="doc-row"><span class="k">ผู้ชี้แจง</span>
            ${M('ฝ่ายเลขานุการคณะอนุกลั่นกรองฯ (นิติกร กบค.)')}</div>
          <div class="doc-row"><span class="k">เอกสารอ้างอิง</span> ${M(kase.docRef)}</div>
          <div class="doc-row"><span class="k">ชั้นการพิจารณา</span> ไต่สวนเบื้องต้น</div>
        </div>
      </div>

      <div class="doc-h">ผู้ถูกร้อง</div>
      ${kase.accused.map(a => `<div style="padding-left:1em">${a.no}. ${M(a.name)} — ${M(a.pos)}</div>`).join('')}

      <div class="doc-h">ประเด็นเสนอที่ประชุม</div>
      <div class="doc-indent">
        ${M(kase.ownerOrg)} เสนอรายงานการไต่สวนเบื้องต้นที่ผ่านการพิจารณาของ
        เลขาธิการคณะกรรมการ ป.ป.ท. แล้ว เพื่อโปรดพิจารณามีมติ
      </div>`;
            } else {
                document.getElementById('docPaper').innerHTML = `
      <div class="doc-secret">${secrecy === 'SECRET' ? 'ลับ' : ''}</div>
      <div class="doc-title">บันทึกข้อความ</div>
      <div style="margin-top:14px">
        <div class="doc-row"><span class="k">ส่วนราชการ</span> กองบริหารคดี สำนักงาน ป.ป.ท.</div>
        <div class="doc-row"><span class="k">ที่</span> ${M('', 'ปป …………/………')}
          <span class="k" style="margin-left:24px">วันที่</span> ${M('', '……………………')}</div>
        <div class="doc-row"><span class="k">เรื่อง</span> ขอเรียนเชิญประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meetNo)}</div>
      </div>
      <div style="margin-top:12px">เรียน &nbsp; ประธานกรรมการและกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ ทุกท่าน</div>
      <div class="doc-indent" style="margin-top:12px">
        ด้วยสำนักงาน ป.ป.ท. กำหนดจัดประชุมคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ
        ครั้งที่ ${M(meetNo)} ในวันที่ ${M(meetDate)} เวลา ${M('', '……… น.')}
        ณ ห้องประชุมสำนักงาน ป.ป.ท.
      </div>
      <div class="doc-indent" style="margin-top:8px">
        ในการนี้ จึงขอเรียนเชิญท่านเข้าร่วมประชุมตามวัน เวลา และสถานที่ดังกล่าว
        โดยได้แนบระเบียบวาระการประชุมมาพร้อมนี้
        ${secrecy === 'SECRET'
                        ? '<strong>(เอกสารชั้นความลับ — โปรดอย่าเผยแพร่)</strong>'
                        : '<span style="color:#666">(ไม่ได้แนบระเบียบวาระเต็ม)</span>'}
      </div>
      <div class="doc-indent" style="margin-top:8px">จึงเรียนมาเพื่อโปรดทราบและเข้าร่วมประชุม</div>
      <div class="doc-sign">
        <span class="doc-dots"></span><br>(นางสาวณพัสตร์ ศรีสมเกียรติ)<br>
        ผู้อำนวยการกองบริหารคดี ปฏิบัติหน้าที่เลขานุการคณะกรรมการ ป.ป.ท.
      </div>`;
            }
        }

        document.querySelectorAll('#docTabs [data-doc]').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('#docTabs .ws-doc-tab').forEach(x => x.classList.remove('active'));
            b.classList.add('active'); docTab = b.dataset.doc; renderDoc();
        }));

        /* ---------- Document workspace: collapsible pane ---------- */
        const docWorkspace = document.getElementById('docWorkspace');
        const PANE_KEY = 'ecmis-chairman-agenda-docpane-collapsed';
        function setPaneCollapsed(collapsed) {
            docWorkspace.classList.toggle('pane-collapsed', collapsed);
            localStorage.setItem(PANE_KEY, collapsed ? '1' : '0');
        }
        if (localStorage.getItem(PANE_KEY) === '1') setPaneCollapsed(true);
        document.getElementById('btnPaneCollapse').addEventListener('click', () => setPaneCollapsed(true));
        document.getElementById('btnPaneExpand').addEventListener('click', () => setPaneCollapsed(false));
        ['meetNo', 'meetDate', 'agendaNo'].forEach(id =>
            document.getElementById(id).addEventListener('input', renderDoc));
        document.getElementById('secrecy').addEventListener('change', () => { renderDoc(); renderMeetRules(); });

        function buildButtons() {
            if (role.id === 'chair_office') {
                return [{ act: 'toChair', label: 'นำเสนอประธานกรรมการ ป.ป.ท.', icon: 'fa-share', cls: 'btn-navy' }];
            }
            return [
                { act: 'return', label: 'ตีกลับให้แก้ไข', icon: 'fa-rotate-left', cls: 'btn-outline-danger' },
                { act: 'command', label: 'ลงนามสั่งการ', icon: 'fa-signature', cls: 'btn-gold' }
            ];
        }
        document.getElementById('actionBarSlot').innerHTML = ECMIS.actionBar(kase, role.id, buildButtons());
        document.querySelectorAll('.action-bar [data-act]').forEach(b =>
            b.addEventListener('click', () => handle(b.dataset.act)));

        function handle(act) {
            if (act === 'toChair') {
                ECMIS.confirmAction({
                    title: 'นำเสนอประธานกรรมการ ป.ป.ท.',
                    html: `สำนวน <strong>${kase.id}</strong> จะถูกส่งเข้าคิวของประธานฯ เพื่อพิจารณาสั่งการ (G4)`
                })
                    .then(r => {
                        if (r.isConfirmed) {
                            ECMIS.toastOk('นำเสนอประธานฯ เรียบร้อย');
                            setTimeout(() => location.href = ECMIS.homeHref(role.id), 1400);
                        }
                    });
                return;
            }
            if (act === 'return') {
                ECMIS.confirmAction({
                    title: 'ตีกลับให้แก้ไข', danger: true, icon: 'warning',
                    html: `<label class="form-label">เหตุผลการตีกลับ <span style="color:#DB2626">*</span></label>
            <textarea id="swal-note" class="form-control" rows="3"></textarea>`,
                    confirmText: 'ยืนยันตีกลับ'
                })
                    .then(r => {
                        if (r.isConfirmed) {
                            ECMIS.toastOk('ตีกลับเรียบร้อย');
                            setTimeout(() => location.href = ECMIS.homeHref(role.id), 1400);
                        }
                    });
                return;
            }
            if (act === 'command') {
                const order = document.querySelector('input[name="order"]:checked').value;
                if (order === 'AGENDA') {
                    const meetNo = document.getElementById('meetNo').value.trim();
                    const meetDate = document.getElementById('meetDate').value.trim();
                    const agendaNo = document.getElementById('agendaNo').value.trim();
                    if (!meetNo || !meetDate || !agendaNo) {
                        ECMIS.toastWarn('กรุณาระบุ ครั้งที่ประชุม, วันที่ประชุม และ วาระที่');
                        return;
                    }
                }
                const MAP = {
                    SCREEN: {
                        t: 'ส่งคณะอนุกรรมการกลั่นกรองฯ', next: '07-subcommittee-screening.html',
                        d: 'กบค. จะกระจายสำนวนเข้าคณะที่ 1–8 แบบ Round-Robin (T9)'
                    },
                    AGENDA: {
                        t: 'สั่งบรรจุวาระการประชุมทันที', next: '08-board-resolution.html',
                        d: 'ข้ามคณะอนุกลั่นกรองฯ — ฝ่ายเลขานุการบอร์ดจัดระเบียบวาระต่อ (T11–T12)'
                    },
                    LEGAL: {
                        t: 'ส่งกองกฎหมายพิจารณาก่อน', next: ECMIS.homeHref(role.id),
                        d: 'เชื่อมกิจกรรมที่ 10 — กองกฎหมายประมวลเรื่องแล้วเสนอกลับเข้าวาระอีกครั้ง'
                    },
                    RETURN: {
                        t: 'ตีกลับให้แก้ไข', next: ECMIS.homeHref(role.id),
                        d: 'ส่งคืนเจ้าของสำนวนพร้อม Reason Code'
                    }
                };
                const sel = MAP[order];
                ECMIS.signDialog(`คำสั่งประธานกรรมการ ป.ป.ท. — ${sel.t} (เรื่องที่ ${kase.id})`,
                    'นายอำนาจ พวงชมภู — ประธานกรรมการ ป.ป.ท.')
                    .then(res => {
                        if (!res.isConfirmed) return;
                        if (res.value.sig) {
                            const sigEl = document.querySelector('.doc-sign');
                            if (sigEl) sigEl.insertAdjacentHTML('afterbegin', `<img class="doc-sig-img" src="${res.value.sig}" alt="ลายมือชื่อ">`);
                        }
                        ECMIS.Model.SignatureStore.create({
                            caseId: kase.id, docType: `คำสั่งประธานกรรมการ ป.ป.ท. — ${sel.t}`,
                            signerRole: 'chairman', signerName: 'นายอำนาจ พวงชมภู — ประธานกรรมการ ป.ป.ท.',
                            method: res.value.mode, signedAt: new Date().toISOString()
                        });
                        ECMIS.toastOk('ลงนามสั่งการเรียบร้อย');
                        setTimeout(() => Swal.fire({
                            icon: 'success', title: 'ลงนามสั่งการเรียบร้อย',
                            html: `<div class="text-start">คำสั่ง: <strong>${sel.t}</strong><br><br>
                <span style="font-size:.85rem;color:#7C8CA3">${sel.d}</span></div>`,
                            confirmButtonColor: '#0F2A62'
                        }).then(() => location.href = sel.next + '?case=' + encodeURIComponent(kase.id)), 800);
                    });
            }
        }

        renderMeetRules(); renderDoc();
    </script>
</body>

</html>
