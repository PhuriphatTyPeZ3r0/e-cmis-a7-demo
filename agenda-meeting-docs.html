<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดทำเอกสารการประชุม | E-CMIS</title>
  <link rel="icon" type="image/png" href="pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="assets/ecmis-app.css" rel="stylesheet">
  <link href="assets/a4-ecmis-workspace.css" rel="stylesheet">
  <style>
    .meet-confirmed{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .5rem;border-radius:999px;font-size:.68rem;font-weight:600;color:#1e6141;background:#dff0e7}
    .doc-memo-hdr{font-size:16px;margin-bottom:2px}
    .doc-memo-lbl{font-weight:700;display:inline-block;min-width:6.2em}
  </style>
</head>

<body>

  <main class="app-main">
    <div class="page-head">
      <div>
        <a href="#" id="backLink" class="text-decoration-none small d-block mb-1" style="color:var(--ecmis-muted)">
          <i class="fa-solid fa-arrow-left me-1"></i>กลับรายละเอียดวาระ</a>
        <h1><i class="fa-solid fa-file-signature me-2"></i><span id="pageTitle">จัดทำเอกสารการประชุม</span></h1>
      </div>
      <div class="ms-auto text-end">
        <span class="flow-ref" id="itemCountLine"></span>
        <div class="mt-1" id="confirmedBadgeWrap"></div>
      </div>
    </div>

    <div id="notFoundBox" class="d-none alert alert-warning">
      ไม่พบครั้งที่ประชุมนี้ในทะเบียน — <a href="agenda-registry.html">กลับไปเลือกครั้งที่ประชุม</a>
    </div>

    <div class="document-workspace" id="docWorkspace">
      <div>

        <div class="ws-card mb-3">
          <div class="card-header"><i class="fa-solid fa-file-lines"></i> ข้อมูลหนังสือเชิญประชุม</div>
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-md-6"><label class="form-label">เลขที่หนังสือ</label>
                <input class="form-control" id="inviteNo" placeholder="เช่น ปป 0004/1234"></div>
              <div class="col-md-6"><label class="form-label">วันที่ออกหนังสือ</label>
                <input class="form-control" id="inviteDate" type="date"></div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6"><label class="form-label">เวลาประชุม</label>
                <input class="form-control" id="meetTime" placeholder="เช่น 09.30 น."></div>
              <div class="col-md-6"><label class="form-label">สถานที่ประชุม</label>
                <input class="form-control" id="meetPlace" placeholder="เช่น ห้องประชุมสำนักงาน ป.ป.ท."></div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6"><label class="form-label">เบอร์โทรผู้รับผิดชอบ</label>
                <input class="form-control" id="contactTel" placeholder="เช่น 0 2502 6670 ต่อ 4313"></div>
              <div class="col-md-6 d-none" id="deptRecipientCol"><label class="form-label">หน่วยงานที่เชิญชี้แจง (กอง/เขต)</label>
                <input class="form-control" id="deptRecipient" placeholder="เช่น กองปราบปรามการทุจริตในภาครัฐ 1"></div>
            </div>
            <div class="mb-3">
              <label class="form-label field-req">ชั้นความลับของหนังสือเชิญประชุม</label>
              <select class="form-select" id="secrecy">
                <option value="SECRET">ลับ — แนบระเบียบวาระเต็ม (พาดพิงสำนวนคดี)</option>
                <option value="NORMAL">ปกติ — ไม่แนบระเบียบวาระเต็ม</option>
              </select>
            </div>
            <div class="row g-2">
              <div class="col-md-6"><label class="form-label">ชื่อผู้ลงนาม</label>
                <input class="form-control" id="signerName"></div>
              <div class="col-md-6"><label class="form-label">ตำแหน่งผู้ลงนาม</label>
                <input class="form-control" id="signerTitle"></div>
            </div>
          </div>
        </div>

        <div class="ws-card mb-3">
          <div class="card-header"><i class="fa-solid fa-list-ol"></i> วาระที่จะแสดงในระเบียบวาระ (รวม)</div>
          <div class="card-body p-0">
            <table class="table tbl-ecmis mb-0">
              <thead><tr><th style="width:70px">วาระที่</th><th>ลักษณะเรื่อง</th></tr></thead>
              <tbody id="itemsPreviewTb"></tbody>
            </table>
          </div>
        </div>
      </div>

      <aside class="ws-doc-pane" id="docCol" style="top:calc(var(--topbar-h) + 14px)">
        <button type="button" class="ws-doc-pane-rail" id="btnPaneExpand" title="ขยายแผงเอกสาร"><i class="fa-solid fa-angles-left"></i><span>เอกสาร</span></button>
        <div class="ws-doc-toolbar">
          <div class="ws-doc-tabs" id="docTabs">
            <button class="ws-doc-tab active" data-doc="agenda">ระเบียบวาระ (รวม)</button>
            <button class="ws-doc-tab" data-doc="propose">เสนอวาระผ่านเลขาธิการฯ</button>
            <button class="ws-doc-tab" data-doc="invite-board">เชิญประธาน/กรรมการ</button>
            <button class="ws-doc-tab" data-doc="invite-pacc">เชิญเลขาธิการ ป.ป.ช.</button>
            <button class="ws-doc-tab" data-doc="invite-dept">เชิญ ผอ.กอง/สำนัก</button>
            <button class="ws-doc-tab" data-doc="it-meeting">แจ้ง IT e-Meeting</button>
          </div>
          <button class="btn btn-sm btn-light" onclick="window.print()" title="พิมพ์เฉพาะเอกสาร Preview"><i class="fa-solid fa-print"></i></button>
          <button type="button" class="ws-doc-pane-toggle" id="btnPaneCollapse" title="ย่อแผงเอกสาร"><i class="fa-solid fa-angles-right"></i></button>
        </div>
        <div class="ws-paper-stage" id="docPaper"></div>
      </aside>
    </div>

    <div id="actionBarSlot"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/ecmis-app.js"></script>
  <script src="assets/agenda-registry-data.js"></script>
  <script>
    ECMIS.renderShell('agenda-meeting-docs.html');
    const M = ECMIS.mergeField;
    const AR = AgendaRegistry;
    const role = ECMIS.currentRole();
    const mayEdit = ECMIS.can('create.agenda', role.id);

    const params = new URLSearchParams(location.search);
    const meetId = +params.get('meet');
    document.getElementById('backLink').href = `agenda-registry-detail.html?meet=${meetId}`;

    /* AR.MEETINGS/AR.ITEMS ยังว่างอยู่จนกว่า AR.ready (โหลดจาก Supabase) จะ resolve ก่อน —
       ต้องรอก่อนอ่านเสมอ เหมือน agenda-registry.html/agenda-registry-detail.html */
    AR.ready.then(runPage).catch(err => {
      console.error('โหลดทะเบียนวาระการประชุมไม่สำเร็จ:', err);
      ECMIS.toastWarn('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ');
    });

    function runPage() {
    const meeting = AR.MEETINGS.find(m => m.trc_id === meetId);

    if (!meeting) {
      document.getElementById('notFoundBox').classList.remove('d-none');
      document.getElementById('docWorkspace').classList.add('d-none');
      document.getElementById('pageTitle').textContent = 'ไม่พบครั้งที่ประชุม';
    } else {
      document.getElementById('pageTitle').textContent = `จัดทำเอกสารการประชุม — ครั้งที่ ${meeting.trc_name}`;
      const items = AR.itemsOf(meeting.trc_id);
      document.getElementById('itemCountLine').textContent = `วันที่ ${ECMIS.thaiDate(meeting.trc_date)} · รวม ${items.length} วาระ`;
      document.getElementById('confirmedBadgeWrap').innerHTML = meeting.trc_confirmed
        ? '<span class="meet-confirmed"><i class="fa-solid fa-check"></i>จัดวาระแล้ว</span>' : '';

      if (!mayEdit) {
        document.querySelectorAll('#inviteNo,#inviteDate,#meetTime,#meetPlace,#contactTel,#deptRecipient,#secrecy').forEach(el => el.disabled = true);
      }

      document.getElementById('itemsPreviewTb').innerHTML = items.map(it => `
    <tr><td>${it.trci_number}</td><td>${it.trci_topic}</td></tr>`).join('')
        || '<tr><td colspan="2" class="text-muted text-center py-3">— ไม่มีวาระในการประชุมครั้งนี้ —</td></tr>';

      /* ---------- ฟอร์มข้อมูลหนังสือเชิญประชุม — ผูกกับ meeting object และบันทึกผ่าน AR.save() ---------- */
      document.getElementById('inviteNo').value = meeting.trc_invite_no || '';
      document.getElementById('inviteDate').value = meeting.trc_invite_date || '';
      document.getElementById('meetTime').value = meeting.trc_time || '';
      document.getElementById('meetPlace').value = meeting.trc_place || 'ห้องประชุมสำนักงาน ป.ป.ท.';
      document.getElementById('contactTel').value = meeting.trc_contact_tel || '';
      document.getElementById('deptRecipient').value = meeting.trc_dept_recipient || '';
      document.getElementById('secrecy').value = meeting.trc_secrecy || 'SECRET';

      const FIELD_MAP = { inviteNo: 'trc_invite_no', inviteDate: 'trc_invite_date', meetTime: 'trc_time', meetPlace: 'trc_place', contactTel: 'trc_contact_tel', deptRecipient: 'trc_dept_recipient', secrecy: 'trc_secrecy' };
      Object.keys(FIELD_MAP).forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('input', () => { meeting[FIELD_MAP[id]] = el.value; renderDoc(); });
        el.addEventListener('change', () => { meeting[FIELD_MAP[id]] = el.value; renderDoc(); });
      });

      /* ---------- เอกสาร ---------- */
      /* ผู้ลงนามฝ่ายเลขานุการฯ อ้างชื่อจาก role board_sec (สิทธิ์ create.invite) แต่ระบุตำแหน่งลงนามตามที่ปรากฏจริง
         ในแบบฟอร์ม (ผู้อำนวยการกองบริหารคดี ปฏิบัติหน้าที่เลขานุการคณะกรรมการ ป.ป.ท.) ซึ่งต่างจาก title ในทะเบียนบทบาท */
      const SEC = ECMIS.getRole('board_sec');
      const SEC_TITLE = 'ผู้อำนวยการกองบริหารคดี ปฏิบัติหน้าที่เลขานุการคณะกรรมการ ป.ป.ท.';
      /* ตำแหน่งลงนามตั้งต้นต่างกันตามประเภทเอกสาร — ผู้ใช้แก้ไขเองได้ในช่อง #signerTitle
         (ปรับใหม่ทุกครั้งที่สลับแท็บเอกสาร แต่ยังแก้ไขได้อิสระก่อนพิมพ์/บันทึก) */
      const SIGNER_TITLE_MAP = {
        agenda: 'ผู้จัดทำ',
        propose: 'ผู้อำนวยการกลุ่มงานคำวินิจฉัยและมติคณะกรรมการ',
        'invite-board': SEC_TITLE,
        'invite-pacc': 'ผู้อำนวยการกองบริหารคดี ปฏิบัติราชการแทน เลขาธิการคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ',
        'invite-dept': SEC_TITLE,
        'it-meeting': SEC_TITLE
      };
      document.getElementById('signerName').value = meeting.trc_signer_name || SEC.name;
      document.getElementById('signerTitle').value = meeting.trc_signer_title || SIGNER_TITLE_MAP.agenda;
      document.getElementById('signerName').addEventListener('input', () => { meeting.trc_signer_name = document.getElementById('signerName').value; renderDoc(); });
      document.getElementById('signerTitle').addEventListener('input', () => { meeting.trc_signer_title = document.getElementById('signerTitle').value; renderDoc(); });
      const BOARD_ROSTER = [
        { n: ECMIS.getRole('chairman').name, t: 'ประธานกรรมการ ป.ป.ท.' },
        { n: ECMIS.getRole('board').name, t: 'กรรมการ ป.ป.ท.' },
        { n: ECMIS.getRole('board_ex').name, t: 'กรรมการ ป.ป.ท. โดยตำแหน่ง' },
        { n: 'นายวิเชียร จันทรโณทัย', t: 'กรรมการ ป.ป.ท.' },
        { n: 'นายพรเทพ อัมพรกลิ่นแก้ว', t: 'กรรมการ ป.ป.ท.' },
        { n: 'นายกมล สกลเดชา', t: 'กรรมการ ป.ป.ท.' },
        { n: SEC.name, t: 'เลขานุการคณะกรรมการ ป.ป.ท.' },
        { n: ECMIS.getRole('legal').name, t: 'ผู้ช่วยเลขานุการคณะกรรมการ ป.ป.ท.' },
      ];

      let docTab = 'agenda';
      function renderDoc() {
        const secrecy = document.getElementById('secrecy').value;
        const meetDate = ECMIS.thaiDate(meeting.trc_date);
        const meetTime = document.getElementById('meetTime').value.trim();
        const meetPlace = document.getElementById('meetPlace').value.trim();
        const inviteNo = document.getElementById('inviteNo').value.trim();
        const inviteDateThai = document.getElementById('inviteDate').value.trim() ? ECMIS.thaiDate(document.getElementById('inviteDate').value.trim()) : '';
        const contactTel = document.getElementById('contactTel').value.trim();
        const deptRecipient = document.getElementById('deptRecipient').value.trim();
        const signerName = document.getElementById('signerName').value.trim() || SEC.name;
        const signerTitle = document.getElementById('signerTitle').value.trim() || SIGNER_TITLE_MAP[docTab];
        const secretLine = secrecy === 'SECRET' ? '<div class="doc-secret">ลับ</div>' : '';
        const itemCountTh = ECMIS.toThaiDigits(items.length);
        const docPaperEl = document.getElementById('docPaper');

        const memoHead = (org, subject) => `
      ${secretLine}
      <div style="position:relative;min-height:52px">
        <img src="doc_logo.jpg" alt="ตราครุฑ" style="position:absolute;top:0;left:0;height:52px">
        <div class="doc-title" style="font-size:22px;margin-top:0">บันทึกข้อความ</div>
      </div>
      <div class="doc-memo-hdr"><span class="doc-memo-lbl">ส่วนราชการ</span> ${org} โทร. ${M(contactTel, '……………')}</div>
      <div class="doc-memo-hdr"><span class="doc-memo-lbl">ที่</span> ${M(inviteNo, 'ปป ๐๐๐๔/……')}&nbsp;&nbsp;&nbsp;&nbsp;<span class="doc-memo-lbl" style="min-width:auto">วันที่</span> ${M(inviteDateThai, '……………………')}</div>
      <div class="doc-memo-hdr"><span class="doc-memo-lbl">เรื่อง</span> ${subject}</div>`;

        const openLine = `ด้วยคณะกรรมการ ป.ป.ท. ได้มีมติให้มีการประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meeting.trc_name)}
        ในวันที่ ${M(meetDate)} เวลา ${M(meetTime, '……… น.')} เป็นต้นไป โดยเป็นการประชุม
        ณ ${M(meetPlace, 'ห้องประชุมสำนักงาน ป.ป.ท.')}`;

        const runningHeader = subjectLine => pageNo => `
      <div class="doc-run-title">${subjectLine} (ต่อ)</div>
      <div class="doc-run-page">- ${ECMIS.toThaiDigits(pageNo)} -</div>`;

        if (docTab === 'agenda') {
          /* ระเบียบวาระ (รวม) — ตามฟอร์แมตจริง (assets/templates/ระเบียบวาระการประชุม/*.docx)
             ครบทั้ง 6 ระเบียบวาระ (1-4, 6 เป็นหัวข้อมาตรฐานทุกครั้งประชุม, 5 คือรายการวาระจริงจาก AR.ITEMS) */
          const dayName = ECMIS.thaiDayName ? ECMIS.thaiDayName(meeting.trc_date) : '';
          const introBlock = `
      ${secretLine}
      <div class="doc-title" style="margin-bottom:0">ระเบียบวาระ</div>
      <div class="doc-sub" style="margin-bottom:0">การประชุมคณะกรรมการ ป.ป.ท.</div>
      <div class="doc-sub" style="margin-bottom:0">ครั้งที่ ${M(meeting.trc_name)}</div>
      <div class="doc-sub" style="margin-bottom:0">วัน${dayName}ที่ ${M(meetDate)} เวลา ${M(meetTime, '……… น.')} เป็นต้นไป</div>
      <div class="doc-sub" style="margin-bottom:0">ณ ${M(meetPlace, 'ห้องประชุมสำนักงาน ป.ป.ท.')}</div>
      <div class="doc-sub">การประชุมผ่านสื่ออิเล็กทรอนิกส์ (Web Conference)</div>

      <div class="doc-h" style="margin-top:16px">ระเบียบวาระที่ 1&emsp;เรื่องที่ประธานแจ้งให้ที่ประชุมทราบ</div>
      <div class="doc-h">ระเบียบวาระที่ 2&emsp;เรื่องรับรองรายงานการประชุมคณะกรรมการ ป.ป.ท.</div>
      <div class="doc-h">ระเบียบวาระที่ 3&emsp;เรื่องที่เสนอให้ที่ประชุมทราบ</div>
      <div class="doc-indent" style="text-indent:2em">3.1&emsp;รายงานผลการดำเนินการที่อยู่ในความรับผิดชอบของกอง/เขต ......................
        (การชี้แจงผ่านระบบ Web Conference) โดย ผู้อำนวยการกอง/เขต ......................</div>
      <div class="doc-h">ระเบียบวาระที่ 4&emsp;เรื่องสืบเนื่องจากการประชุม</div>
      <div class="doc-h">ระเบียบวาระที่ 5&emsp;เรื่องเสนอให้ที่ประชุมพิจารณา</div>`;
          const flowBlocks = items.length ? items.map(it => `
        <div style="margin-top:6px">
          <div class="doc-row"><span class="k">วาระที่ ${M(it.trci_number)}</span> ${M(it.trci_topic)}</div>
          <div style="padding-left:2em">
            <div class="doc-row"><span class="k">หมวดหมู่</span> ${M(AR.CATEGORY_LABEL[it.category])}</div>
            <div class="doc-row"><span class="k">เลขที่เรื่อง</span> ${M(it.case_ref, '-')}</div>
            <div class="doc-row"><span class="k">สถานะ/หมายเหตุ</span> ${M(it.remark, '-')}</div>
          </div>
        </div>`) : [`<div class="text-muted" style="margin-top:8px">— ไม่มีวาระในการประชุมครั้งนี้ —</div>`];
          const signBlock = `
      <div class="doc-h" style="margin-top:16px">ระเบียบวาระที่ 6&emsp;เรื่องอื่น ๆ</div>
      <div class="doc-indent" style="text-indent:2em">พิจารณากำหนดวัน เวลา ในการประชุมครั้งต่อไป</div>
      <div style="text-align:right;margin-top:28px">(${M(signerName)})<br>${signerTitle}</div>`;
          ECMIS.paginateDoc(docPaperEl, {
            introBlock, flowBlocks, signBlock,
            runningHeaderHtml: runningHeader(`ระเบียบวาระการประชุม ครั้งที่ ${M(meeting.trc_name)}`)
          });

        } else if (docTab === 'propose') {
          /* ปปท. แบบที่ 1 — บันทึกเสนอระเบียบวาระการประชุม (ผ่านเลขาธิการฯ) */

        และที่แก้ไขเพิ่มเติม กองบริหารคดีจึงขอเสนอระเบียบวาระการประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meeting.trc_name)}

      </div>`

        → เรียน เลขาธิการคณะกรรมการ ป.ป.ท. เพื่อโปรดพิจารณาให้ความเห็นชอบระเบียบวาระการประชุมข้างต้น
      </div>`;
          ECMIS.paginateDoc(docPaperEl, { introBlock, flowBlocks, signBlock, runningHeaderHtml: runningHeader(subject) });

        } else if (docTab === 'invite-board') {
          /* ปปท. แบบที่ 2 — บันทึกขอเรียนเชิญประชุม ประธานและกรรมการ */
          const subject = `ขอเรียนเชิญประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meeting.trc_name)}`;
          const introBlock = `
      ${memoHead('กองบริหารคดี กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ', subject)}
      <div class="doc-memo-hdr" style="margin-top:6px"><span class="doc-memo-lbl">เรียน</span></div>`;
          const flowBlocks = [
            ...BOARD_ROSTER.map(r => `<div class="doc-row" style="padding:.15rem 0"><span class="k" style="min-width:9rem">${M(r.n)}</span>${r.t}</div>`),
            `<div class="doc-indent" style="margin-top:10px">${openLine}</div>`,
            `<div class="doc-indent" style="margin-top:8px">
        กองบริหารคดีได้จัดทำระเบียบวาระการประชุมและเอกสารประกอบการประชุมดังกล่าวเสร็จเรียบร้อยแล้ว
        รายละเอียดปรากฏตามเอกสารที่นำเรียนมาพร้อมนี้
        ${secrecy === 'SECRET'
              ? '<strong>(เอกสารชั้นความลับ — โปรดอย่าเผยแพร่)</strong>'
              : '<span style="color:#666">(ไม่ได้แนบระเบียบวาระเต็ม)</span>'}
      </div>`
          ];
          const signBlock = `
      <div class="doc-indent" style="margin-top:8px">จึงเรียนมาเพื่อโปรดพิจารณา และขอเรียนเชิญเข้าร่วมประชุมตามวัน และเวลาดังกล่าว</div>
      <div class="doc-sign">
        <span class="doc-dots"></span><br>(${M(signerName)})<br>${signerTitle}
      </div>`;
          ECMIS.paginateDoc(docPaperEl, { introBlock, flowBlocks, signBlock, runningHeaderHtml: runningHeader(subject) });

        } else if (docTab === 'invite-pacc') {
          /* ปปท. แบบที่ 3 — หนังสือเชิญเลขาธิการคณะกรรมการ ป.ป.ช. (หนังสือภายนอก) */
          const subject = `ขอเรียนเชิญประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meeting.trc_name)}`;
          const introBlock = `
      <div style="text-align:center;margin-bottom:8px"><img src="doc_logo.jpg" alt="ตราครุฑ" style="height:60px"></div>
      <div class="doc-row" style="text-align:right">${M(inviteNo, 'ที่ ปป .../...')} สำนักงาน ป.ป.ท.</div>
      <div class="doc-row" style="text-align:right">อาคารซอฟต์แวร์ปาร์ค ถนนแจ้งวัฒนะ ตำบลคลองเกลือ อำเภอปากเกร็ด</div>
      <div class="doc-row" style="text-align:right;margin-bottom:10px">จังหวัดนนทบุรี ๑๑๑๒๐&nbsp;&nbsp;&nbsp;&nbsp;${M(inviteDateThai, '……………………')}</div>
      <div class="doc-row"><span class="k">เรื่อง</span> ${subject}</div>
      <div class="doc-row"><span class="k">เรียน</span> เลขาธิการคณะกรรมการ ป.ป.ช. ในฐานะกรรมการ ป.ป.ท.</div>
      <div class="doc-row"><span class="k">สิ่งที่ส่งมาด้วย</span> ระเบียบวาระการประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meeting.trc_name)}</div>`;
          const flowBlocks = [
            `<div class="doc-indent" style="margin-top:10px">${openLine}</div>`,
            `<div class="doc-indent" style="margin-top:8px">
        กองบริหารคดี สำนักงาน ป.ป.ท. ได้จัดทำระเบียบวาระการประชุมและเอกสารประกอบการประชุมดังกล่าวเสร็จเรียบร้อยแล้ว
        รายละเอียดปรากฏตามสิ่งที่ส่งมาด้วย
      </div>`
          ];
          const signBlock = `
      <div class="doc-indent" style="margin-top:8px">จึงเรียนมาเพื่อโปรดพิจารณา และขอเรียนเชิญเข้าร่วมประชุมตามวัน และเวลาดังกล่าว</div>
      <div class="doc-sign" style="margin-top:24px">
        ขอแสดงความนับถือ<br><br>
        <span class="doc-dots"></span><br>(${M(signerName)})<br>${signerTitle}
      </div>
      <div class="doc-row" style="margin-top:24px;font-size:.85rem">กองบริหารคดี สำนักงาน ป.ป.ท.</div>
      <div class="doc-row" style="font-size:.85rem">โทร. ${M(contactTel, '0 2502 6670 ต่อ 4313')}</div>`;
          ECMIS.paginateDoc(docPaperEl, { introBlock, flowBlocks, signBlock, runningHeaderHtml: runningHeader(subject) });

        } else if (docTab === 'invite-dept') {
          /* ปปท. แบบที่ 4 — บันทึกขอเรียนเชิญประชุม ผอ.กอง/สำนัก (ผู้ชี้แจงวาระในความรับผิดชอบ) */
          const subject = `ขอเรียนเชิญประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meeting.trc_name)}`;
          const introBlock = `
      ${memoHead('กองบริหารคดี กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ', subject)}
      <div class="doc-memo-hdr" style="margin-top:6px"><span class="doc-memo-lbl">เรียน</span> ผู้อำนวยการกอง/เขต ${M(deptRecipient, '............................')}</div>`;
          const flowBlocks = [
            `<div class="doc-indent" style="margin-top:10px">${openLine}</div>`,
            `<div class="doc-indent" style="margin-top:8px">
        กองบริหารคดีได้จัดทำระเบียบวาระการประชุมดังกล่าวเรียบร้อยแล้ว (รายละเอียดตามเอกสารแนบ) และมีวาระการพิจารณา
        ในความรับผิดชอบของ กอง/สำนัก ของท่าน จึงขอได้โปรดพิจารณามอบหมายผู้รับผิดชอบเข้าร่วมประชุมชี้แจงต่อคณะกรรมการ ป.ป.ท.
        ในวัน เวลา ดังกล่าวด้วย จักขอบคุณยิ่ง
      </div>`
          ];
          const signBlock = `
      <div class="doc-indent" style="margin-top:8px">จึงเรียนมาเพื่อโปรดทราบ และพิจารณาดำเนินการต่อไป</div>
      <div class="doc-sign">
        <span class="doc-dots"></span><br>(${M(signerName)})<br>${signerTitle}
      </div>`;
          ECMIS.paginateDoc(docPaperEl, { introBlock, flowBlocks, signBlock, runningHeaderHtml: runningHeader(subject) });

        } else if (docTab === 'it-meeting') {
          /* ปปท. แบบที่ 5 — บันทึกแจ้งศูนย์เทคโนโลยีสารสนเทศ มอบหมายเจ้าหน้าที่ควบคุมดูแล Web Conference */
          const subject = 'มอบหมายเจ้าหน้าที่ควบคุมดูแลการประชุมผ่านสื่ออิเล็กทรอนิกส์ (Web Conference)';
          const introBlock = `
      ${memoHead('กองบริหารคดี กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ', subject)}
      <div class="doc-memo-hdr" style="margin-top:6px"><span class="doc-memo-lbl">เรียน</span> ผู้อำนวยการศูนย์เทคโนโลยีสารสนเทศและการสื่อสาร</div>`;
          const flowBlocks = [
            `<div class="doc-indent" style="margin-top:10px">
        ${openLine} โดยเป็นการประชุมผ่านสื่ออิเล็กทรอนิกส์และชี้แจงผ่านระบบ (Web Conference) ทั้งนี้ เพื่อเป็นการลด
        ภาระค่าใช้จ่ายในการเดินทาง เพิ่มประสิทธิภาพในการบริหารจัดการคดี เป็นประโยชน์แก่ราชการ และสอดคล้องกับสถานการณ์ในปัจจุบัน
      </div>`,
            `<div class="doc-indent" style="margin-top:8px">
        กองบริหารคดี จึงขอให้พิจารณามอบหมายเจ้าหน้าที่ผู้ควบคุมดูแลระบบ มาประจำการในการประชุมดังกล่าว
        (รายละเอียดปรากฏตามระเบียบวาระการประชุมที่แนบมาพร้อมนี้) จนเสร็จสิ้นภารกิจ และขอให้จัดส่งเอกสารประกอบการเข้าร่วมประชุม
        ให้กองบริหารคดี เพื่อใช้เป็นหลักฐานในการจัดทำรายงานการประชุมโดยเร็วด้วย จะขอบคุณยิ่ง
      </div>`
          ];
          const signBlock = `
      <div class="doc-indent" style="margin-top:8px">จึงเรียนมาเพื่อโปรดพิจารณาดำเนินการต่อไป</div>
      <div class="doc-sign">
        <span class="doc-dots"></span><br>(${M(signerName)})<br>${signerTitle}
      </div>`;
          ECMIS.paginateDoc(docPaperEl, { introBlock, flowBlocks, signBlock, runningHeaderHtml: runningHeader(subject) });
        }
      }

      document.getElementById('deptRecipientCol').classList.toggle('d-none', docTab !== 'invite-dept');
      document.querySelectorAll('#docTabs [data-doc]').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#docTabs .ws-doc-tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); docTab = b.dataset.doc;
        document.getElementById('deptRecipientCol').classList.toggle('d-none', docTab !== 'invite-dept');
        /* สลับตำแหน่งลงนามตามค่าตั้งต้นของเอกสารใหม่ เฉพาะกรณีผู้ใช้ยังไม่ได้แก้ไขเป็นค่าอื่นเอง
           (ถ้าค่าปัจจุบันตรงกับค่าตั้งต้นของแท็บใดแท็บหนึ่งอยู่แล้ว ถือว่ายังไม่ได้ปรับเอง) */
        const titleEl = document.getElementById('signerTitle');
        if (Object.values(SIGNER_TITLE_MAP).includes(titleEl.value)) titleEl.value = SIGNER_TITLE_MAP[docTab];
        renderDoc();
      }));

      /* ---------- Document workspace: collapsible pane ---------- */
      const docWorkspace = document.getElementById('docWorkspace');
      const PANE_KEY = 'ecmis-agenda-meeting-docs-docpane-collapsed';
      function setPaneCollapsed(collapsed) {
        docWorkspace.classList.toggle('pane-collapsed', collapsed);
        localStorage.setItem(PANE_KEY, collapsed ? '1' : '0');
      }
      if (localStorage.getItem(PANE_KEY) === '1') setPaneCollapsed(true);
      document.getElementById('btnPaneCollapse').addEventListener('click', () => setPaneCollapsed(true));
      document.getElementById('btnPaneExpand').addEventListener('click', () => setPaneCollapsed(false));

      /* ---------- action bar ---------- */
      function renderActions() {
        const slot = document.getElementById('actionBarSlot');
        if (!mayEdit) { slot.innerHTML = ''; return; }
        slot.innerHTML = `
    <button type="button" class="btn btn-outline-secondary btn-sm" data-act="save">
      <i class="fa-solid fa-floppy-disk me-1"></i>บันทึกร่างลำดับวาระ</button>
    <button type="button" class="btn btn-navy btn-sm" data-act="confirm" ${items.length ? '' : 'disabled'}>
      <i class="fa-solid fa-check-double me-1"></i>ยืนยันจัดวาระ — พร้อมส่งประธานฯ สั่งการ</button>`;
        document.querySelectorAll('#actionBarSlot [data-act]').forEach(b =>
          b.addEventListener('click', () => handle(b.dataset.act)));
      }

      function handle(act) {
        /* รายละเอียดหนังสือเชิญประชุม (เลขที่หนังสือ/วันที่ออกหนังสือ/เวลา/สถานที่/ผู้ลงนาม ฯลฯ) ยังไม่มี
           คอลัมน์ใน tbl_res_calendar — "บันทึกร่าง" จึงยังเป็นแค่ mutate ตัวแปร meeting ในหน่วยความจำ
           (เหมือนเดิม) ไม่ได้เขียนลง Supabase จนกว่าจะมีคอลัมน์รองรับ */
        if (act === 'save') { ECMIS.toastOk('บันทึกร่างลำดับวาระเรียบร้อย'); return; }
        if (act === 'confirm') {
          if (!items.length) return;
          ECMIS.confirmAction({
            title: 'ยืนยันจัดระเบียบวาระการประชุม',
            html: `<p>การประชุมครั้งที่ <strong>${meeting.trc_name}</strong> รวม <strong>${items.length}</strong> เรื่อง
              จะถูกจัดเรียงเป็นระเบียบวาระฉบับสมบูรณ์</p>`,
            confirmText: 'ยืนยันจัดวาระ'
          }).then(async res => {
            if (!res.isConfirmed) return;
            try {
              await AR.confirmMeeting(meeting.trc_id);
            } catch (err) {
              console.error('บันทึกการจัดวาระไม่สำเร็จ:', err);
              ECMIS.toastWarn('บันทึกลงฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
              return;
            }
            ECMIS.toastOk('จัดระเบียบวาระการประชุมเรียบร้อย');
            document.getElementById('confirmedBadgeWrap').innerHTML =
              '<span class="meet-confirmed"><i class="fa-solid fa-check"></i>จัดวาระแล้ว</span>';
          });
        }
      }

      renderDoc(); renderActions();
    }
    }
  </script>
</body>
