="1132" height="54" fill="#FFFFFF" rx="10" stroke="#E3E9F4"/><text x="304" y="124" font-size="13.5" fill="#0D1B3E" font-weight="700" text-anchor="start">สำนวน ปปท. 108/2569 — ถอนฟ้อง · นางวิภา ชัยชนะ</text><text x="304" y="141" font-size="10.5" fill="#C0392B" font-weight="400" text-anchor="start">ครบกำหนดเสนอความเห็น 20 พ.ค. 2569 (Exception: ความเห็นล่าช้าจนพ้นอายุความ — UC LAW004)</text><rect x="1290" y="116" width="109.7" height="22" fill="#0E7C7B" rx="11" fill-opacity="0.12"/><text x="1344.85" y="131" font-size="11" fill="#0E7C7B" font-weight="600" text-anchor="middle">ร่างความเห็น v3</text><rect x="284" y="170" width="724" height="556" fill="#FFFFFF" rx="10" stroke="#E3E9F4"/><circle cx="300" cy="194" r="4" fill="#C9A84C" /><text x="312" y="199" font-size="13.5" fill="#0D1B3E" font-weight="700" text-anchor="start">บันทึกความเห็นทางกฎหมาย (UC LAW004)</text><line x1="284" y1="214" x2="1008" y2="214" stroke="#ECF1F8" stroke-width="1" /><text x="304" y="234" font-size="11" fill="#6B7A99" font-weight="600" text-anchor="start">รูปแบบความเห็น (Template สำนักงาน ป.ป.ท.)</text><rect x="304" y="240" width="330" height="36" fill="#FFFFFF" rx="8" stroke="#B8C4D8"/><text x="316" y="262.0" font-size="12" fill="#6B7A99" font-weight="400" text-anchor="start">ความเห็นกรณีอัยการถอนฟ้อง ▾</text><text x="654" y="234" font-size="11" fill="#6B7A99" font-weight="600" text-anchor="start">อ้างอิงมติ/ระเบียบ</text><rect x="654" y="240" width="330" height="36" fill="#FFFFFF" rx="8" stroke="#B8C4D8"/><text x="666" y="262.0" font-size="12" fill="#6B7A99" font-weight="400" text-anchor="start">พ.ร.บ. มาตรการฯ มาตรา 45 ▾</text><text x="304" y="306" font-size="11" fill="#6B7A99" font-weight="600" text-anchor="start">เนื้อหาความเห็น</text><rect x="304" y="312" width="684" height="240" fill="#FFFFFF" rx="8" stroke="#B8C4D8"/><rect x="304" y="312" width="684" height="34" fill="#F4F7FC" rx="8" /><text x="320" y="334" font-size="11.5" fill="#6B7A99" font-weight="700" text-anchor="start">B</text><tex