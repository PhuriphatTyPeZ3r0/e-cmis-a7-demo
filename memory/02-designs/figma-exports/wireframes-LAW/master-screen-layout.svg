<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Noto Sans Thai', sans-serif">

  <rect x="0" y="0" width="900" height="500" fill="#FFFFFF"/>

  <!-- Title -->
  <rect x="24" y="14" width="4" height="24" fill="#1A2F6B"/>
  <text x="40" y="32" font-size="15" font-weight="700" fill="#1A2F6B">(Master Screen Layout)</text>

  <!-- A. Header / Top Bar -->
  <rect x="24" y="54" width="852" height="46" rx="8" fill="#1A2F6B"/>
  <text x="44" y="82" font-size="13" font-weight="700" fill="#FFFFFF">A.   (Header / Top Bar) —   64px</text>

  <!-- B. Side Nav -->
  <rect x="24" y="116" width="180" height="304" rx="8" fill="#EEF1F5" stroke="#D7DEE9" stroke-width="1"/>
  <text x="114" y="152" font-size="14" font-weight="700" fill="#1A2F6B" text-anchor="middle">B.</text>
  <text x="114" y="170" font-size="11.5" fill="#5A6B85" text-anchor="middle">(Side Nav)</text>
  <text x="114" y="186" font-size="10" fill="#8494AC" text-anchor="middle">260px (mini 68px)</text>

  <!-- C. Main Content -->
  <rect x="220" y="116" width="460" height="304" rx="8" fill="#FFFFFF" stroke="#D7DEE9" stroke-width="1"/>
  <text x="430" y="152" font-size="14" font-weight="700" fill="#1A2F6B" text-anchor="middle">C.       (Main Content)</text>

  <g fill="#EEF1F5">
    <rect x="238" y="176" width="27" height="196" rx="3"/>
    <rect x="273" y="176" width="27" height="196" rx="3"/>
    <rect x="308" y="176" width="27" height="196" rx="3"/>
    <rect x="343" y="176" width="27" height="196" rx="3"/>
    <rect x="378" y="176" width="27" height="196" rx="3"/>
    <rect x="413" y="176" width="27" height="196" rx="3"/>
    <rect x="448" y="176" width="27" height="196" rx="3"/>
    <rect x="483" y="176" width="27" height="196" rx="3"/>
    <rect x="518" y="176" width="27" height="196" rx="3"/>
    <rect x="553" y="176" width="27" height="196" rx="3"/>
    <rect x="588" y="176" width="27" height="196" rx="3"/>
    <rect x="623" y="176" width="27" height="196" rx="3"/>
  </g>

  <text x="278" y="397" font-size="11" fill="#5A6B85">12    (12-Column Grid)</text>
  <text x="622" y="397" font-size="11" fill="#5A6B85">16–24px</text>

  <!-- D. Context Panel -->
  <rect x="696" y="116" width="180" height="304" rx="8" fill="#EEF1F5" stroke="#D7DEE9" stroke-width="1"/>
  <text x="786" y="152" font-size="14" font-weight="700" fill="#1A2F6B" text-anchor="middle">D.</text>
  <text x="786" y="170" font-size="11.5" fill="#5A6B85" text-anchor="middle">(Context Panel)</text>

  <!-- E. Footer -->
  <rect x="24" y="436" width="852" height="40" rx="8" fill="#E9EEF6" stroke="#D7DEE9" stroke-width="1"/>
  <text x="450" y="461" font-size="12" font-weight="700" fill="#1A2F6B" text-anchor="middle">E.    (Footer) —    เวอร์ชันระบบ / Sync Status / ลิขสิทธิ์ ป.ป.ท.</text>

</svg>
