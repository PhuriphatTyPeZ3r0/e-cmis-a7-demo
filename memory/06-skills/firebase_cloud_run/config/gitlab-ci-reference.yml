# gitlab-ci-reference.yml
# Reference configurations for replacing the echo statements in the deploy stage of E-CMIS.

deploy:dev:
  stage: deploy
  image: google/cloud-sdk:latest
  before_script:
    # Authenticate GCP service account
    - echo "$GCP_SERVICE_KEY_DEV" > key.json
    - gcloud auth activate-service-account --key-file=key.json
    - gcloud config set project "$GCP_PROJECT_ID_DEV"
    # Install Firebase CLI
    - curl -sL https://firebase.tools | bash
  script:
    # 1. Build and Deploy Web app to Firebase Hosting
    - dotnet publish ecmis-web/src/EcmisWeb.csproj -c Release -o release-output
    - firebase deploy --only hosting --token "$FIREBASE_TOKEN_DEV"
    
    # 2. Build and Deploy Backend Agent to Cloud Run
    - gcloud builds submit --tag gcr.io/$GCP_PROJECT_ID_DEV/ecmis-agent-service:latest ./ecmis-agent-service
    - gcloud run deploy ecmis-agent-service
        --image gcr.io/$GCP_PROJECT_ID_DEV/ecmis-agent-service:latest
        --platform managed
        --region asia-southeast1
        --allow-unauthenticated
        --set-env-vars="PORT=8080"
  environment:
    name: development
  only:
    - develop
