name: E-CMIS CI Quality & Security Check

on:
  push:
    branches: [ main, activity-* ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Run Automated Quality & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run E-CMIS Test Suite
        run: node scripts/test-system.js
