<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดวาระการประชุม | E-CMIS</title>
  <link rel="icon" type="image/png" href="pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="assets/ecmis-app.css" rel="stylesheet">
  <link href="assets/a4-ecmis-workspace.css" rel="stylesheet">
</head>

<body>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-calendar-days me-2"></i>จัดวาระการประชุม</h1>
      </div>
      <div class="ms-auto text-end">
        <span class="flow-ref">รวบรวมและจัดลำดับระเบียบวาระทุกเรื่องในการประชุมเดียวกัน</span>
      </div>
    </div>

    <div id="editGate"></div>

    <div class="document-workspace" id="docWorkspace">
      <div>

        <div class="ws-card mb-3">
          <div class="card-header"><i class="fa-solid fa-calendar-check"></i> เลือกการประชุม</div>
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-md-6"><label class="form-label field-req">ครั้งที่ประชุม</label>
                <select class="form-select" id="meetNoSelect"></select>
              </div>
              <div class="col-md-6"><label class="form-label field-req">วันที่ประชุม</label>
                <input class="form-control" id="meetDate" type="date">
              </div>
            </div>
            <div class="mb-1">
              <label class="form-label field-req">ชั้นความลับของหนังสือเชิญประชุม</label>
              <select class="form-select" id="secrecy">
                <option value="SECRET" selected>ลับ — แนบระเบียบวาระเต็ม (พาดพิงสำนวนคดี)</option>
                <option value="NORMAL">ปกติ — ไม่แนบระเบียบวาระเต็ม</option>
              </select>
            </div>
          </div>
        </div>

        <div class="ws-card mb-3">
          <div class="card-header d-flex align-items-center gap-2">
            <i class="fa-solid fa-list-ol"></i> รายการวาระในการประชุมนี้
            <span class="badge bg-primary rounded-pill ms-1" id="itemCount">0</span>
          </div>
          <div class="card-body p-0">
            <table class="table tbl-ecmis mb-0">
              <thead>
                <tr>
                  <th style="width:70px">ลำดับ</th>
                  <th style="width:110px">วาระที่</th>
                  <th>เลขสำนวน / เรื่อง</th>
                  <th style="width:160px">ผู้รับผิดชอบ</th>
                  <th style="width:90px"></th>
                </tr>
              </thead>
              <tbody id="itemsTb"></tbody>
            </table>
            <div class="text-center text-muted p-4 d-none" id="emptyState">
              <i class="fa-regular fa-folder-open fa-2x mb-2 d-block"></i>
              ไม่มีสำนวนที่บรรจุวาระไว้สำหรับการประชุมครั้งนี้
            </div>
          </div>
        </div>

      </div>

      <aside class="ws-doc-pane" id="docCol" style="top:calc(var(--topbar-h) + 14px)">
        <button type="button" class="ws-doc-pane-rail" id="btnPaneExpand" title="ขยายแผงเอกสาร"><i class="fa-solid fa-angles-left"></i><span>เอกสาร</span></button>
        <div class="ws-doc-toolbar">
          <div class="ws-doc-tabs" id="docTabs">
            <button class="ws-doc-tab active" data-doc="agenda">ระเบียบวาระ (รวม)</button>
            <button class="ws-doc-tab" data-doc="invite">หนังสือเชิญประชุม</button>
          </div>
          <button class="btn btn-sm btn-light" onclick="window.print()" title="พิมพ์เฉพาะเอกสาร Preview"><i class="fa-solid fa-print"></i></button>
          <button type="button" class="ws-doc-pane-toggle" id="btnPaneCollapse" title="ย่อแผงเอกสาร"><i class="fa-solid fa-angles-right"></i></button>
        </div>
        <div class="doc-edit-bar" id="docEditBar" aria-label="แถบจัดรูปแบบ">
          <button type="button" data-format="bold" title="ตัวหนา"><b>B</b></button>
          <button type="button" data-format="italic" title="ตัวเอียง"><i>I</i></button>
          <button type="button" data-format="underline" title="ขีดเส้นใต้"><u>U</u></button>
          <span class="doc-edit-bar-sep"></span>
          <button type="button" data-format="undo" title="เลิกทำ"><i class="fa-solid fa-rotate-left"></i></button>
          <button type="button" data-format="redo" title="ทำซ้ำ"><i class="fa-solid fa-rotate-right"></i></button>
          <span class="doc-edit-bar-sep"></span>
          <button type="button" class="btn btn-sm btn-gold" id="btnSaveDocEdit" style="width:auto;padding:0 .6rem">บันทึกการแก้ไข</button>
        </div>
        <div class="ws-paper-stage">
          <div class="doc-paper a4-paper" id="docPaper"></div>
        </div>
        <button type="button" class="doc-edit-fab d-none" id="docEditFab" title="เปิด/ปิดโหมดแก้ไขเอกสาร">
          <span aria-hidden="true">✏️</span><span>แก้ไขเอกสาร</span>
        </button>
      </aside>
    </div>

    <div id="actionBarSlot"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/ecmis-app.js"></script>
  <script>
    ECMIS.renderShell('11-agenda-compile.html');
    const role = ECMIS.currentRole();
    const mayEdit = ECMIS.can('create.agenda', role.id);

    if (!mayEdit) {
      document.getElementById('editGate').innerHTML = `
    <div class="mb-3">
      <strong><i class="fa-solid fa-lock me-1"></i>โหมดอ่านอย่างเดียว — บทบาทนี้จัดวาระการประชุมไม่ได้</strong><br>
      สิทธิ์ <strong>จัดทำระเบียบวาระการประชุม (create.agenda)</strong> จำกัดเฉพาะ
      <strong>${ECMIS.getRole('board_sec').title}</strong>
    </div>`;
    }

    /* ---------- รวบรวมสำนวนที่บรรจุวาระแล้ว (IN_MEETING) ตามครั้งที่ประชุม ---------- */
    const params = new URLSearchParams(location.search);
    const agendaCases = ECMIS.CASES.filter(c => (c.status === 'AGENDA_SET' || c.status === 'IN_MEETING') && c.meetingNo && !ECMIS.isCase72(c));
    const meetingNos = [...new Set(agendaCases.map(c => c.meetingNo))].sort();
    let currentMeetNo = params.get('meet') || meetingNos[0] || '';

    const meetSelect = document.getElementById('meetNoSelect');
    meetSelect.innerHTML = meetingNos.length
      ? meetingNos.map(n => `<option value="${n}" ${n === currentMeetNo ? 'selected' : ''}>ครั้งที่ ${n}</option>`).join('')
      : `<option value="">— ไม่มีสำนวนรอบรรจุวาระ —</option>`;

    function itemsForMeeting(meetNo) {
      return agendaCases
        .filter(c => c.meetingNo === meetNo)
        .sort((a, b) => (parseFloat(a.agendaNo) || 0) - (parseFloat(b.agendaNo) || 0));
    }

    let items = itemsForMeeting(currentMeetNo);
    if (items[0]) document.getElementById('meetDate').value = items[0].meetingDate || '';

    function renumber() {
      const base = Math.floor(parseFloat(items[0]?.agendaNo || '5.1')) || 5;
      items.forEach((c, i) => { c.agendaNo = `${base}.${i + 1}`; });
    }

    function renderItems() {
      const tb = document.getElementById('itemsTb');
      document.getElementById('itemCount').textContent = items.length;
      document.getElementById('emptyState').classList.toggle('d-none', items.length > 0);
      tb.innerHTML = items.map((c, i) => `
    <tr data-i="${i}">
      <td class="text-muted">${i + 1}</td>
      <td><input class="form-control form-control-sm agenda-no" data-i="${i}" value="${c.agendaNo || ''}"></td>
      <td>
        <div class="fw-medium text-truncate" style="max-width:320px" title="${c.subject}">${c.id} — ${c.subject}</div>
      </td>
      <td>${c.owner || '—'}</td>
      <td class="text-end">
        <button type="button" class="btn btn-sm btn-link p-0 me-2 move-up" data-i="${i}" title="เลื่อนขึ้น" ${i === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-up"></i></button>
        <button type="button" class="btn btn-sm btn-link p-0 move-down" data-i="${i}" title="เลื่อนลง" ${i === items.length - 1 ? 'disabled' : ''}><i class="fa-solid fa-arrow-down"></i></button>
      </td>
    </tr>`).join('');

      tb.querySelectorAll('.agenda-no').forEach(el => el.addEventListener('input', e => {
        items[+e.target.dataset.i].agendaNo = e.target.value; renderDoc();
      }));
      tb.querySelectorAll('.move-up').forEach(el => el.addEventListener('click', e => {
        const i = +e.currentTarget.dataset.i;
        [items[i - 1], items[i]] = [items[i], items[i - 1]];
        renumber(); renderItems(); renderDoc();
      }));
      tb.querySelectorAll('.move-down').forEach(el => el.addEventListener('click', e => {
        const i = +e.currentTarget.dataset.i;
        [items[i], items[i + 1]] = [items[i + 1], items[i]];
        renumber(); renderItems(); renderDoc();
      }));
    }

    /* ---------- เอกสาร ---------- */
    let docTab = 'agenda';
    function renderDoc() {
      const M = ECMIS.mergeField;
      const meetNo = currentMeetNo;
      const meetDate = ECMIS.thaiDate(document.getElementById('meetDate').value.trim());
      const secrecy = document.getElementById('secrecy').value;

      if (docTab === 'agenda') {
        document.getElementById('docPaper').innerHTML = `
      <div class="doc-secret">${secrecy === 'SECRET' ? 'ลับ' : ''}</div>
      <div class="doc-title">ระเบียบวาระการประชุม<br>คณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ</div>
      <div class="doc-sub">ครั้งที่ ${M(meetNo)} วันที่ ${M(meetDate)}</div>

      <div class="doc-h">ระเบียบวาระที่ 5 &nbsp; เรื่องเพื่อพิจารณา</div>
      ${items.map(c => `
        <div style="margin-top:6px">
          <div class="doc-row"><span class="k">วาระที่ ${M(c.agendaNo)}</span> ${M(c.subject)}</div>
          <div style="padding-left:2em">
            <div class="doc-row"><span class="k">เรื่องที่</span> ${M(c.id)}</div>
            <div class="doc-row"><span class="k">ผู้รับผิดชอบ</span> ${M(c.owner)}</div>
            <div class="doc-row"><span class="k">สังกัด</span> ${M(c.ownerOrg)}</div>
            <div class="doc-row"><span class="k">ผู้ชี้แจง</span>
              ${M(c.subCommittee ? `ฝ่ายเลขานุการคณะอนุกลั่นกรองฯ (${c.subCommittee})` : 'ฝ่ายเลขานุการคณะกรรมการ ป.ป.ท.')}</div>
            <div class="doc-row"><span class="k">เอกสารอ้างอิง</span> ${M(c.docRef)}</div>
          </div>
        </div>`).join('') || `<div class="text-muted" style="margin-top:8px">— ไม่มีวาระในการประชุมครั้งนี้ —</div>`}
      `;
      } else {
        document.getElementById('docPaper').innerHTML = `
      <div class="doc-secret">${secrecy === 'SECRET' ? 'ลับ' : ''}</div>
      <div class="doc-title">บันทึกข้อความ</div>
      <div style="margin-top:14px">
        <div class="doc-row"><span class="k">ส่วนราชการ</span> กองบริหารคดี สำนักงาน ป.ป.ท.</div>
        <div class="doc-row"><span class="k">ที่</span> ${M('', 'ปป …………/………')}
          <span class="k" style="margin-left:24px">วันที่</span> ${M('', '……………………')}</div>
        <div class="doc-row"><span class="k">เรื่อง</span> ขอเรียนเชิญประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meetNo)}</div>
      </div>
      <div style="margin-top:12px">เรียน &nbsp; ประธานกรรมการและกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ ทุกท่าน</div>
      <div class="doc-indent" style="margin-top:12px">
        ด้วยสำนักงาน ป.ป.ท. กำหนดจัดประชุมคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ
        ครั้งที่ ${M(meetNo)} ในวันที่ ${M(meetDate)} เวลา ${M('', '……… น.')}
        ณ ห้องประชุมสำนักงาน ป.ป.ท. โดยมีระเบียบวาระเพื่อพิจารณารวม <strong>${items.length}</strong> เรื่อง
      </div>
      <div class="doc-indent" style="margin-top:8px">
        ในการนี้ จึงขอเรียนเชิญท่านเข้าร่วมประชุมตามวัน เวลา และสถานที่ดังกล่าว
        โดยได้แนบระเบียบวาระการประชุมมาพร้อมนี้
        ${secrecy === 'SECRET'
              ? '<strong>(เอกสารชั้นความลับ — โปรดอย่าเผยแพร่)</strong>'
              : '<span style="color:#666">(ไม่ได้แนบระเบียบวาระเต็ม)</span>'}
      </div>
      <div class="doc-indent" style="margin-top:8px">จึงเรียนมาเพื่อโปรดทราบและเข้าร่วมประชุม</div>
      <div class="doc-sign">
        <span class="doc-dots"></span><br>(${ECMIS.getRole('board_sec').name})<br>
        ${ECMIS.getRole('board_sec').title}
      </div>`;
      }
    }

    document.querySelectorAll('#docTabs [data-doc]').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#docTabs .ws-doc-tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); docTab = b.dataset.doc; renderDoc();
    }));
    document.getElementById('meetDate').addEventListener('input', renderDoc);
    document.getElementById('secrecy').addEventListener('change', renderDoc);
    meetSelect.addEventListener('change', () => {
      currentMeetNo = meetSelect.value;
      items = itemsForMeeting(currentMeetNo);
      if (items[0]) document.getElementById('meetDate').value = items[0].meetingDate || '';
      renderItems(); renderDoc();
    });

    /* ---------- Document workspace: collapsible pane ---------- */
    const docWorkspace = document.getElementById('docWorkspace');
    const PANE_KEY = 'ecmis-agenda-compile-docpane-collapsed';
    function setPaneCollapsed(collapsed) {
      docWorkspace.classList.toggle('pane-collapsed', collapsed);
      localStorage.setItem(PANE_KEY, collapsed ? '1' : '0');
    }
    if (localStorage.getItem(PANE_KEY) === '1') setPaneCollapsed(true);
    document.getElementById('btnPaneCollapse').addEventListener('click', () => setPaneCollapsed(true));
    document.getElementById('btnPaneExpand').addEventListener('click', () => setPaneCollapsed(false));

    /* ---------- Document workspace: แก้ไขเอกสารแบบ Word (rich-text) ---------- */
    const docEditFab = document.getElementById('docEditFab');
    const docEditBar = document.getElementById('docEditBar');
    const docPaperEl = document.getElementById('docPaper');
    document.body.appendChild(docEditFab);
    if (mayEdit) docEditFab.classList.remove('d-none');

    function setDocEditMode(on) {
      if (on) docPaperEl.setAttribute('contenteditable', 'true');
      else docPaperEl.removeAttribute('contenteditable');
      docEditFab.classList.toggle('active', on);
      docEditBar.classList.toggle('show', on);
    }
    docEditFab.addEventListener('click', () => setDocEditMode(!docEditFab.classList.contains('active')));
    docEditBar.addEventListener('click', e => {
      const btn = e.target.closest('[data-format]');
      if (btn) { document.execCommand(btn.dataset.format); docPaperEl.focus(); }
    });
    document.getElementById('btnSaveDocEdit').addEventListener('click', () => {
      setDocEditMode(false);
      ECMIS.toastOk('บันทึกการแก้ไขเอกสารเรียบร้อย (ยังไม่ยืนยันจัดวาระ)');
    });

    /* ---------- action bar ---------- */
    function renderActions() {
      const slot = document.getElementById('actionBarSlot');
      if (!mayEdit) { slot.innerHTML = ''; return; }
      slot.innerHTML = `
    <button type="button" class="btn btn-outline-secondary btn-sm" data-act="save">
      <i class="fa-solid fa-floppy-disk me-1"></i>บันทึกร่างลำดับวาระ</button>
    <button type="button" class="btn btn-navy btn-sm" data-act="confirm" ${items.length ? '' : 'disabled'}>
      <i class="fa-solid fa-check-double me-1"></i>ยืนยันจัดวาระ — พร้อมส่งประธานฯ สั่งการ</button>`;
      document.querySelectorAll('#actionBarSlot [data-act]').forEach(b =>
        b.addEventListener('click', () => handle(b.dataset.act)));
    }

    function handle(act) {
      if (act === 'save') {
        items.forEach(c => c.agendaCompiled = false);
        ECMIS.saveCases();
        ECMIS.toastOk('บันทึกร่างลำดับวาระเรียบร้อย');
        return;
      }
      if (act === 'confirm') {
        if (!items.length) return;
        ECMIS.confirmAction({
          title: 'ยืนยันจัดระเบียบวาระการประชุม',
          html: `<p>การประชุมครั้งที่ <strong>${currentMeetNo}</strong> รวม <strong>${items.length}</strong> เรื่อง
            จะถูกจัดเรียงเป็นระเบียบวาระฉบับสมบูรณ์</p>`,
          confirmText: 'ยืนยันจัดวาระ'
        }).then(res => {
          if (!res.isConfirmed) return;
          items.forEach(c => { c.agendaCompiled = true; c.agendaSecrecy = document.getElementById('secrecy').value; });
          ECMIS.saveCases();
          ECMIS.toastOk('จัดระเบียบวาระการประชุมเรียบร้อย');
        });
      }
    }

    renderItems(); renderDoc(); renderActions();
  </script>
</body>

</html>
